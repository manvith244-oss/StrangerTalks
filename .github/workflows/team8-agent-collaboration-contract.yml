name: Team 8 Agent Collaboration Contract Gate

on:
  push:
    branches:
      - team8/collaboration-main-admission-proof-2026-09-05
  workflow_dispatch:

concurrency:
  group: team8-agent-collaboration-main-admission-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collaboration-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: 3b359b60fb9419cb60a13ec0ace3c867c5e0507c

    steps:
      - name: Checkout exact Team 8 admission commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove exact identity
        run: |
          echo "TARGET_SHA=$TARGET_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Focused collaboration contract and NO DIRECT EDGES proof
        run: mix test test/strangertalks_new/agent_collaboration_contract_test.exs

      - name: Full precommit
        run: mix precommit

      - name: Prove exact clean tree
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -z "$status"
          echo "T_A08_ADMISSION_TESTED_SHA=$(git rev-parse HEAD)"
