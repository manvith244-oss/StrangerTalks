name: Team 8 Agent Collaboration Contract Gate

on:
  push:
    branches:
      - team8/collaboration-contract-002
  workflow_dispatch:

concurrency:
  group: team8-agent-collaboration-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collaboration-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact Team 8 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM8_COMMIT=${{ github.sha }}"
          echo "ACTUAL_TEAM8_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Team 8 focused collaboration contract proof
        run: mix test test/strangertalks_new/agent_collaboration_contract_test.exs

      - name: Full precommit
        run: mix precommit

      - name: Prove verification left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact tested commit
        run: echo "TEAM8_TESTED_COMMIT=$(git rev-parse HEAD)"
