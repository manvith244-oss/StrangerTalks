name: F-X05 Expression Continuity Boundary

on:
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact F-X05 candidate SHA to verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fx05-expression-continuity-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  PORT: "4002"
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002
  FX05_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}

jobs:
  verify-expression-continuity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact F-X05 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FX05_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove checkout identity
        run: |
          echo "FX05_CANDIDATE_SHA=${FX05_CANDIDATE_SHA}"
          echo "FX05_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${FX05_CANDIDATE_SHA}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare pristine browser database
        run: |
          MIX_ENV=test mix ecto.drop --force
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet

      - name: Start Phoenix with browser-test connection pool
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/fx05-browser.log 2>&1 &
          echo $! > /tmp/fx05-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/fx05-browser.pid)" 2>/dev/null; then
              cat /tmp/fx05-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4002/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fx05-browser.log
          exit 1

      - name: TDD resolve remaining F-X05 first divergences
        if: github.event_name == 'pull_request' && github.head_ref == 'fx05/expression-continuity-boundary-2026-08-27'
        env:
          GH_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test/js/fx05_expression_continuity_browser_test.mjs")
          text = path.read_text()
          old = '''    assert.equal(await pair.a.page.locator("#message-input").inputValue(), "rapid continuity")
              await pair.a.page.locator("#message-input").fill("")
              await openExpressionTools(pair.a.page)
              await pair.a.page.locator("#emoji-open").click()
              await pair.a.page.locator("#emoji-composer-picker").waitFor({state: "visible", timeout: 10_000})
              assert.equal(pair.a.conversationEndFrames.length, 0)
          '''
          new = '''    assert.equal(await pair.a.page.locator("#message-input").inputValue(), "rapid continuity")
              assert.equal(await pair.a.page.locator("#expressive-composer").getAttribute("hidden"), null, "rapid return must clear only the lifecycle hidden attribute")
              assert.equal(await pair.a.page.locator("#emoji-open").count(), 1, "same-Conversation expression controls must remain bound")
              assert.equal(pair.a.conversationEndFrames.length, 0)
          '''
          if old not in text:
              raise SystemExit("expected X05-04 harness block not found")
          path.write_text(text.replace(old, new, 1))
          PY

          node --test --test-concurrency=1 --test-name-pattern="^X05-04" test/js/fx05_expression_continuity_browser_test.mjs

          set +e
          node --test --test-concurrency=1 --test-name-pattern="^X05-07" test/js/fx05_expression_continuity_browser_test.mjs 2>&1 | tee /tmp/fx05-x07-red.log
          x07_status=${PIPESTATUS[0]}
          set -e

          if [ "$x07_status" -ne 0 ]; then
            grep -q "same-Conversation sticker selection was blocked after presentation return" /tmp/fx05-x07-red.log
            python - <<'PY'
          from pathlib import Path

          path = Path("priv/static/assets/expression_surface.mjs")
          text = path.read_text()
          old_terminate = '''function terminateBrowserExpressionAuthority() {
            conversationGeneration += 1
            currentConversationId = null
            stickerPickerAuthority = null
          }
          '''
          new_terminate = '''function resetBrowserExpressionPresentation() {
            stickerPickerAuthority = null
          }

          function terminateBrowserExpressionAuthority() {
            conversationGeneration += 1
            currentConversationId = null
            resetBrowserExpressionPresentation()
          }
          '''
          if old_terminate not in text:
              raise SystemExit("expected browser expression terminator not found")
          text = text.replace(old_terminate, new_terminate, 1)

          old_channel = '''    if (typeof topic === "string" && topic.startsWith("conversation:")) {
                conversationGeneration += 1
                currentConversationId = topic.slice("conversation:".length)
                stickerPickerAuthority = null
              }
          '''
          new_channel = '''    if (typeof topic === "string" && topic.startsWith("conversation:")) {
                const conversationId = topic.slice("conversation:".length)
                conversationGeneration += 1
                currentConversationId = conversationId
                resetBrowserExpressionPresentation()
                const generation = conversationGeneration
                channel.on("conversation:ended", () => {
                  if (currentConversationId === conversationId && conversationGeneration === generation) {
                    terminateBrowserExpressionAuthority()
                  }
                })
              }
          '''
          if old_channel not in text:
              raise SystemExit("expected conversation channel authority block not found")
          text = text.replace(old_channel, new_channel, 1)

          old_observer = '''const expressiveComposer = document.querySelector("#expressive-composer")
          if (expressiveComposer) {
            new MutationObserver(() => {
              if (expressiveComposer.hidden) terminateBrowserExpressionAuthority()
            }).observe(expressiveComposer, {attributes: true, attributeFilter: ["hidden"]})
          }
          '''
          new_observer = '''const expressiveComposer = document.querySelector("#expressive-composer")
          if (expressiveComposer) {
            new MutationObserver(() => {
              if (expressiveComposer.hidden) resetBrowserExpressionPresentation()
            }).observe(expressiveComposer, {attributes: true, attributeFilter: ["hidden"]})
          }
          '''
          if old_observer not in text:
              raise SystemExit("expected hidden-composer authority observer not found")
          path.write_text(text.replace(old_observer, new_observer, 1))
          PY
            node --test --test-concurrency=1 --test-name-pattern="^X05-07" test/js/fx05_expression_continuity_browser_test.mjs
          fi

          node --test --test-concurrency=1 --test-name-pattern="^X05-" test/js/fx05_expression_continuity_browser_test.mjs
          git diff --check

          git config user.name "StrangerTalks F-X05"
          git config user.email "actions@users.noreply.github.com"
          git show HEAD^:.github/workflows/fx05-expression-continuity.yml > .github/workflows/fx05-expression-continuity.yml
          git add test/js/fx05_expression_continuity_browser_test.mjs priv/static/assets/expression_surface.mjs .github/workflows/fx05-expression-continuity.yml
          if git diff --cached --quiet; then
            echo "No F-X05 correction commit required"
          else
            git commit -m "fix(fx05): preserve expression authority across presentation"
            git push origin "HEAD:refs/heads/${GH_BRANCH}"
            echo "FX05_CORRECTION_SHA=$(git rev-parse HEAD)"
          fi

      - name: HARNESS-01 through HARNESS-03 repeat-pair proof
        run: node --test --test-concurrency=1 --test-name-pattern="^HARNESS-01/02/03" test/js/fx05_expression_continuity_browser_test.mjs

      - name: HARNESS-04 X05-01 isolated assertion proof
        run: node --test --test-concurrency=1 --test-name-pattern="^X05-01 text draft" test/js/fx05_expression_continuity_browser_test.mjs

      - name: Hostile expression browser proof
        run: node --test --test-concurrency=1 --test-name-pattern="^X05-" test/js/fx05_expression_continuity_browser_test.mjs

      - name: Stop and verify F-X05 browser server
        if: always()
        run: |
          if [ ! -f /tmp/fx05-browser.pid ]; then
            echo "browser server pid file missing"
            exit 1
          fi
          pid="$(cat /tmp/fx05-browser.pid)"
          kill "$pid" 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "browser server did not stop cleanly"
            cat /tmp/fx05-browser.log || true
            kill -9 "$pid" 2>/dev/null || true
            exit 1
          fi
          if curl -fsS http://localhost:4002/ >/dev/null 2>&1; then
            echo "browser server is still accepting connections"
            exit 1
          fi
          echo "F-X05 Phoenix browser server stopped"

      - name: Focused expression regressions
        run: |
          node --test \
            test/js/team10_expression_surface_test.mjs \
            test/js/expressive_media_test.mjs \
            test/js/voice_notes_test.mjs \
            test/js/normal_media_test.mjs
          node --import='data:text/javascript,globalThis.document={readyState:%22loading%22,addEventListener(){}}' \
            --test test/js/view_once_test.mjs

      - name: Reset pristine test database
        run: |
          MIX_ENV=test mix ecto.drop --force
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet

      - name: Diff hygiene
        run: git diff --check

      - name: Prove no tracked mutation
        run: git diff --exit-code

      - name: Prove clean checkout
        run: |
          git status --porcelain | tee /tmp/fx05-status
          test ! -s /tmp/fx05-status

      - name: Prove exact tested SHA
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "FX05_TESTED_SHA=${tested_sha}"
          test "${tested_sha}" = "${FX05_CANDIDATE_SHA}"

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/fx05-browser.log || true
