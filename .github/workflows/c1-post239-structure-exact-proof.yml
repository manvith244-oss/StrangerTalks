name: C1 Post239 Structure Exact Proof

on:
  push:
    branches:
      - proof/c1-post239-structure-final-2026-09-10

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: 4f5e45c4a845006e8c3a8ba47d5a649e4dd860a7
      TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051
      BASE_SHA: c19cbe2d4c05fc0c5e9f1d2d7286afa7197a9527

    steps:
      - name: Checkout exact post239 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git diff --name-only "$BASE_SHA"...HEAD | wc -l)" -eq 2
          git diff --name-only "$BASE_SHA"...HEAD | grep -Fx 'test/strangertalks_new_web/channels/participant_multitab_authority_test.exs'
          git diff --name-only "$BASE_SHA"...HEAD | grep -Fx 'test/support/participant_multitab_channel_collector.ex'
          test "$(grep -c '^defmodule ' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs)" -eq 1
          test "$(grep -c '^defmodule ' test/support/participant_multitab_channel_collector.ex)" -eq 1
          grep -F 'start_supervised!' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          ! grep -R 'Process.sleep\|Process.alive?' test/support/participant_multitab_channel_collector.ex test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Focused participant multitab authority test
        shell: bash
        run: mix test test/strangertalks_new_web/channels/participant_multitab_authority_test.exs

      - name: ParticipantChannel and existing multitab regressions
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new_web/channels/participant_match_transition_authority_test.exs \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs

      - name: Matching and pairing regressions
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/matchmaking_core_authority_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            test/strangertalks_new/matchmaking_reconciliation_fail_closed_test.exs \
            test/strangertalks_new/participant_pairing_reservation_schema_test.exs \
            test/strangertalks_new/participant_pairing_reservation_acquisition_cases.exs \
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs

      - name: Session reconciliation regressions
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/a02_authority_reconciliation_test.exs \
            test/strangertalks_new/matchmaking_reconciliation_fail_closed_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            test/strangertalks_new/matchmaking_core_authority_test.exs

      - name: Format compile dependency and Hex gates
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix hex.audit

      - name: Full precommit
        shell: bash
        run: mix precommit

      - name: Diff clean tree and exact final identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
