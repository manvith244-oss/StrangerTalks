name: Ring Runtime Rewrite Once

on:
  push:
    branches:
      - security/ring-authority-reconstruction-2026-09-11
    paths:
      - .github/workflows/ring-runtime-rewrite-once.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/ring-authority-reconstruction-2026-09-11
          fetch-depth: 0
      - name: Replace historical Ring energy contract with state-only authority
        shell: python
        run: |
          from pathlib import Path
          import re

          live = Path("priv/static/assets/live_call.mjs")
          source = live.read_text()
          marker = "// --- StrangerTalks Ring Live Presence Component (Defect 3: 1Q-DELIGHT-02) ---"
          if source.count(marker) != 1:
              raise SystemExit("expected exactly one Ring marker")
          prefix = source.split(marker, 1)[0]
          safe_ring = r'''// --- StrangerTalks Ring: state-only presentation authority ---

          export class StrangerTalksRing {
            constructor(element, a11yStatusElement = null) {
              this.element = element
              this.a11yStatus = a11yStatusElement
              this.reactionPulseTimer = null
              this.state = "idle"
            }

            update(callState) {
              if (!this.element || !callState) return

              const {status, selfMuted, peerMuted} = callState
              const isTerminal = status === CALL_STATUS.TERMINAL || status === CALL_STATUS.IDLE
              const isConnecting = status === CALL_STATUS.CONNECTING || status === CALL_STATUS.PENDING_OUTGOING
              const isActive = status === CALL_STATUS.ACTIVE

              if (isTerminal) {
                this.state = "idle"
                this.element.className = "stranger-call-ring ring-state-idle"
                if (this.reactionPulseTimer) {
                  clearTimeout(this.reactionPulseTimer)
                  this.reactionPulseTimer = null
                }
                this.setA11yText("Call ended")
                return
              }

              if (isConnecting) {
                this.state = "calling"
                this.element.className = "stranger-call-ring ring-state-calling"
                this.setA11yText("Connecting live call")
                return
              }

              if (isActive) {
                const ringClasses = ["stranger-call-ring", "ring-state-active"]
                let a11yMessage = "Call Active"

                if (selfMuted) {
                  ringClasses.push("ring-state-muted")
                  a11yMessage += ", Microphone Muted"
                }
                if (peerMuted) ringClasses.push("ring-state-peer-muted")

                this.state = "active"
                this.element.className = ringClasses.join(" ")
                this.setA11yText(a11yMessage)
              }
            }

            pulseReaction() {
              if (!this.element) return
              this.element.classList.add("ring-reaction-pulse")
              if (this.reactionPulseTimer) clearTimeout(this.reactionPulseTimer)
              this.reactionPulseTimer = setTimeout(() => {
                if (this.element) this.element.classList.remove("ring-reaction-pulse")
                this.reactionPulseTimer = null
              }, 800)
            }

            setA11yText(text) {
              if (this.a11yStatus && this.a11yStatus.textContent !== text) {
                this.a11yStatus.textContent = text
              }
            }

            destroy() {
              if (this.reactionPulseTimer) {
                clearTimeout(this.reactionPulseTimer)
                this.reactionPulseTimer = null
              }
              if (this.element) this.element.className = "stranger-call-ring ring-state-idle"
            }
          }
          '''
          live.write_text(prefix + safe_ring)

          tests = Path("test/js/live_call_test.mjs")
          test_source = tests.read_text()
          start = "// ============================================================================\n// 1Q-DELIGHT-02: StrangerTalks Ring (RING-1 through RING-12)\n// ============================================================================"
          end = "// ============================================================================\n// GAP 1: REVEAL TOGETHER (REVEAL-1 THROUGH REVEAL-10)\n// ============================================================================"
          if test_source.count(start) != 1 or test_source.count(end) != 1:
              raise SystemExit("Ring test block markers changed")
          before, remainder = test_source.split(start, 1)
          _, after = remainder.split(end, 1)
          replacement = r'''// ============================================================================
          // StrangerTalks Ring: state-only presentation contract
          // ============================================================================

          function createMockElement() {
            const styles = new Map()
            return {
              className: "",
              classList: {
                add: function(c) { this.classes.push(c) },
                remove: function(c) { this.classes = this.classes.filter(x => x !== c) },
                contains: function(c) { return this.classes.includes(c) },
                classes: []
              },
              style: {
                setProperty: (k, v) => styles.set(k, v),
                getPropertyValue: (k) => styles.get(k)
              }
            }
          }

          test("RING-1: Ring initializes in idle state when call is idle", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.IDLE})
            assert.equal(el.className, "stranger-call-ring ring-state-idle")
          })

          test("RING-2: Ring reflects connecting state", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.CONNECTING, selfMuted: false, peerMuted: false})
            assert.equal(el.className, "stranger-call-ring ring-state-calling")
          })

          test("RING-3: Ring reflects active call state", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.ACTIVE, selfMuted: false, peerMuted: false})
            assert.equal(el.className, "stranger-call-ring ring-state-active")
          })

          test("RING-4: local mute is presented without inferring speech", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.ACTIVE, selfMuted: true, peerMuted: false})
            assert.ok(el.className.includes("ring-state-muted"))
          })

          test("RING-5: peer mute is presented without inferring speech", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.ACTIVE, selfMuted: false, peerMuted: true})
            assert.ok(el.className.includes("ring-state-peer-muted"))
          })

          test("RING-6: untrusted second argument cannot create Ring state", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update(
              {status: CALL_STATUS.ACTIVE, selfMuted: false, peerMuted: false},
              {localEnergy: 1, peerEnergy: 1, reconnecting: true, hasReactionPulse: true}
            )
            assert.equal(el.className, "stranger-call-ring ring-state-active")
            assert.equal(el.style.getPropertyValue("--ring-local-energy"), undefined)
            assert.equal(el.style.getPropertyValue("--ring-peer-energy"), undefined)
          })

          test("RING-7: reaction pulse is an explicit ephemeral presentation action", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.pulseReaction()
            assert.ok(el.classList.contains("ring-reaction-pulse"))
          })

          test("RING-8: terminal state wins", () => {
            const el = createMockElement()
            const ring = new StrangerTalksRing(el)
            ring.update({status: CALL_STATUS.TERMINAL, selfMuted: false, peerMuted: false})
            assert.equal(el.className, "stranger-call-ring ring-state-idle")
          })

          test("RING-9: accessibility status reflects authoritative state", () => {
            const el = createMockElement()
            const a11y = {textContent: ""}
            const ring = new StrangerTalksRing(el, a11y)
            ring.update({status: CALL_STATUS.ACTIVE, selfMuted: false, peerMuted: false})
            assert.equal(a11y.textContent, "Call Active")
            ring.update({status: CALL_STATUS.ACTIVE, selfMuted: true, peerMuted: false})
            assert.equal(a11y.textContent, "Call Active, Microphone Muted")
          })

          test("RING-10: Ring has zero server or DB state", () => {
            const ring = new StrangerTalksRing(createMockElement())
            assert.equal(ring.serverSynchronized, undefined)
            assert.equal(ring.databaseRecord, undefined)
          })

          '''
          tests.write_text(before + replacement + end + after)

          css = Path("priv/static/assets/app.css")
          css_source = css.read_text()
          css_source = re.sub(r'\n\.stranger-call-ring\.ring-state-self-speaking\s*\{[^}]*\}\n', '\n', css_source, flags=re.S)
          css_source = re.sub(r'\n\.stranger-call-ring\.ring-state-peer-speaking\s*\{[^}]*\}\n', '\n', css_source, flags=re.S)
          css.write_text(css_source)
      - name: Fail closed on incomplete rewrite
        run: |
          set -euo pipefail
          ! grep -q 'localEnergy\|peerEnergy\|ring-state-self-speaking\|ring-state-peer-speaking\|--ring-local-energy\|--ring-peer-energy' priv/static/assets/live_call.mjs
          node --test test/js/live_call_test.mjs test/js/ring_security_contract_test.mjs
          git diff --check
      - name: Commit rewrite and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ring-runtime-rewrite-once.yml
          git add priv/static/assets/live_call.mjs priv/static/assets/app.css test/js/live_call_test.mjs
          git commit -m "fix(security): remove Ring speaking-amplitude authority"
          git push origin HEAD:security/ring-authority-reconstruction-2026-09-11
