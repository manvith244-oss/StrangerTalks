name: P02 Language Selector Lock FE97649 Proof 2026-09-10

on:
  push:
    branches:
      - evidence/p02-language-selector-lock-fe97649-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: fe9764926a5cd33c9471bede77c9c675d51381aa
  TARGET_TREE: 2cae86eaca49c969901075f30669da2e31c26e88
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Static and compile gates
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix hex.audit
          node test/js/interface_language_placement_test.mjs
      - name: Prepare isolated database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24))
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/p02-phoenix.log 2>&1 &
          echo $! >/tmp/p02-phoenix.pid
          for _ in $(seq 1 60); do
            curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 && exit 0
            kill -0 "$(cat /tmp/p02-phoenix.pid)" 2>/dev/null || { cat /tmp/p02-phoenix.log; exit 1; }
            sleep 1
          done
          cat /tmp/p02-phoenix.log
          exit 1
      - name: Real Chromium language placement and queue lock
        run: node --test --test-concurrency=1 test/js/doors_visual_structure_browser_test.mjs
      - name: Full precommit
        run: mix precommit
      - name: Cleanup and exact clean identity
        if: always()
        run: |
          if [ -f /tmp/p02-phoenix.pid ]; then kill "$(cat /tmp/p02-phoenix.pid)" 2>/dev/null || true; fi
          cat /tmp/p02-phoenix.log 2>/dev/null || true
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
