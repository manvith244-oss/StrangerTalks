name: WT-02 Team 6 RED Harness Correction

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Correct reconnect proof expectation once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/strangertalks_new/wt02_terminal_transport_ack_test.exs")
          text = path.read_text()

          alias_line = "  alias StrangertalksNew.Conversation\n"
          if alias_line in text:
              text = text.replace(alias_line, "", 1)

          old = ":conversation_terminating"
          if text.count(old) == 1:
              text = text.replace(old, ":conversation_inactive", 1)

          path.write_text(text)
          PY

          git diff --check
          if git diff --quiet -- test/strangertalks_new/wt02_terminal_transport_ack_test.exs; then
            echo "Harness already corrected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/strangertalks_new/wt02_terminal_transport_ack_test.exs
          git commit -m "test: correct WT-02 reconnect proof expectation"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair
