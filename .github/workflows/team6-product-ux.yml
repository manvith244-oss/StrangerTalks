name: Team 6 Product UX & Device Gate

on:
  push:
    branches:
      - newteam/arrival-ux
  pull_request:
    branches:
      - release/prep-2026-08-22

concurrency:
  group: team6-product-ux-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  product-ux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply Team 6 presentation corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("priv/static/index.html")
          text = index.read_text()
          replacements = [
              ('<button id="leave-queue">Go back</button>', '<button id="leave-queue">Leave Queue</button>'),
              ('<option>SPAM</option><option>HARASSMENT</option><option>SEXUAL_MISCONDUCT</option><option>MALICIOUS_LINKS</option><option>THREATS</option>', '<option value="SPAM">Spam</option><option value="HARASSMENT">Harassment</option><option value="SEXUAL_MISCONDUCT">Sexual misconduct</option><option value="MALICIOUS_LINKS">Malicious links</option><option value="THREATS">Threats</option>'),
              ('aria-label="GIFs and stickers"', 'aria-label="Stickers and expressions"'),
              ('>GIFs &amp; stickers</button>', '>Stickers &amp; expressions</button>'),
              ('<h2 id="view-once-preview-title">Preview View-Once photo</h2><div id="view-once-preview-container"', '<h2 id="view-once-preview-title">Preview View-Once photo</h2><p class="ephemeral-choice-help">View Once can be opened one time. View Twice can be opened up to two times.</p><div id="view-once-preview-container"')
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"expected Team 6 source anchor not found: {old}")
          index.write_text(text)

          chat = Path("priv/static/assets/instagram_chat.mjs")
          text = chat.read_text()
          old = 'trayButton(document.querySelector("#expressive-open"), "magic", "GIFs & stickers")'
          new = 'trayButton(document.querySelector("#expressive-open"), "magic", "Stickers & expressions")'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("expected expressive tray label anchor not found")
          chat.write_text(text)
          PY

      - name: Materialize corrected source commit on branch push
        if: github.event_name == 'push'
        run: |
          git config user.name "team6-product-ux"
          git config user.email "team6-product-ux@users.noreply.github.com"
          git add priv/static/index.html priv/static/assets/instagram_chat.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(team6): clarify critical conversation UX states"
          fi
          echo "TEAM6_LOCAL_TEST_SHA=$(git rev-parse HEAD)"

      - name: Assert PR source is already materialized
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused UI and interaction JavaScript regressions
        run: |
          node --test --test-concurrency=1 \
            test/js/instagram_chat_test.mjs \
            test/js/reply_quote_test.mjs \
            test/js/reaction_test.mjs \
            test/js/message_edit_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/pin_test.mjs \
            test/js/expressive_media_test.mjs \
            test/js/voice_notes_test.mjs \
            test/js/view_once_test.mjs \
            test/js/live_call_test.mjs \
            test/js/atmosphere_test.mjs \
            test/js/prompt_cards_test.mjs \
            test/js/companion_test.mjs \
            test/js/presence_test.mjs

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/team6-product-ux-browser.log 2>&1 &
          echo $! > /tmp/team6-product-ux-browser.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/team6-product-ux-browser.pid)" 2>/dev/null; then
              cat /tmp/team6-product-ux-browser.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/team6-product-ux-browser.log
          exit 1

      - name: Team 6 real-browser UX attack
        run: |
          node --test --test-concurrency=1 \
            test/js/arrival_first_minute_browser_test.mjs \
            test/js/arrival_accessibility_browser_test.mjs \
            test/js/instagram_chat_browser_test.mjs \
            test/js/instagram_chat_report_browser_test.mjs \
            test/js/team6_product_ux_browser_test.mjs

      - name: Upload Team 6 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team6-product-ux-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/team6-product-ux-screenshots
            tmp/arrival-first-60-screenshots
            tmp/chat-ui-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/team6-product-ux-browser.pid ]; then
            kill "$(cat /tmp/team6-product-ux-browser.pid)" 2>/dev/null || true
          fi

      - name: Reset browser data
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full repository precommit
        run: mix precommit

      - name: Clean exact tree proof
        run: |
          git diff --check
          git status --porcelain | tee /tmp/team6-status
          test ! -s /tmp/team6-status
          echo "TEAM6_TESTED_SHA=$(git rev-parse HEAD)"

      - name: Push tested materialized commit
        if: github.event_name == 'push'
        run: git push origin HEAD:newteam/arrival-ux

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/team6-product-ux-browser.log || true
