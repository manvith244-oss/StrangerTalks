name: Team 3 Conversation Reliability Replay Gate

on:
  push:
    branches:
      - newteam/reliability
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact Team 3 HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record entry state
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_TEAM3_COMMIT=$expected"
          echo "HEAD=$actual"
          echo "BRANCH=$(git branch --show-current)"
          test "$actual" = "$expected"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove committed Elixir formatting
        shell: bash
        run: |
          set -euo pipefail
          mix format
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "Formatter changed committed files:"
            printf '%s\n' "$status"
            git diff --no-ext-diff -- .
            exit 1
          fi

      - name: Focused Conversation reliability Elixir tests
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/recovery_restart_test.exs \
            test/strangertalks_new/team3_recovery_coordination_test.exs \
            test/strangertalks_new/conversation_delivery_test.exs \
            test/strangertalks_new/replay_delivery_state_test.exs \
            test/strangertalks_new/conversation_isolation_test.exs \
            test/strangertalks_new/conversation_lifecycle_test.exs \
            test/strangertalks_new/conversation_presence_test.exs \
            test/strangertalks_new/volatile_concurrency_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new_web/text_mvp_integration_test.exs \
            test/strangertalks_new_web/channels/conversation_presence_channel_test.exs

      - name: Focused JS reliability tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/js/delivery_progress_test.mjs \
            test/js/presence_test.mjs \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/message_edit_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/reaction_test.mjs \
            test/js/reply_quote_test.mjs \
            test/js/pin_test.mjs

      - name: Prepare isolated browser reliability database
        env:
          MIX_TEST_PARTITION: _team3_browser
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for browser reliability proof
        env:
          MIX_TEST_PARTITION: _team3_browser
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint_config, :server, true)
            )

            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            browser_repo_config =
              repo_config
              |> Keyword.put(:pool, DBConnection.ConnectionPool)
              |> Keyword.put(:pool_size, 16)

            Application.put_env(
              :strangertalks_new,
              StrangertalksNew.Repo,
              browser_repo_config
            )

            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/team3-browser-server.log 2>&1 &
          echo $! > /tmp/team3-browser-server.pid

          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/team3-browser-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/team3-browser-server.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then
              echo "Phoenix Team 3 browser endpoint is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Phoenix did not become ready."
          cat /tmp/team3-browser-server.log
          exit 1

      - name: Protocol browser reliability regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/js/conversation_reliability_browser_test.mjs \
            test/js/team3_channel_reliability_browser_test.mjs

      - name: Production client browser reliability regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            --test-name-pattern='shared delivery E2E-2|D3: Pin state is isolated' \
            test/js/browser_e2e_test.mjs

      - name: Stop Phoenix browser reliability server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/team3-browser-server.pid ]; then
            pid="$(cat /tmp/team3-browser-server.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/team3-browser-server.log || true

      - name: Drop isolated browser reliability database
        if: always()
        env:
          MIX_TEST_PARTITION: _team3_browser
        run: mix ecto.drop --quiet || true

      - name: Full repository precommit
        run: mix precommit

      - name: Diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .

      - name: Prove final checkout clean
        shell: bash
        run: |
          set -euo pipefail
          status=$(git status --porcelain)
          echo "STATUS_PORCELAIN:"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Record exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          echo "TEAM3_TESTED_COMMIT=$tested"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested" = "$expected"
