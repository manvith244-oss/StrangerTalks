name: Team 1 Core Authority & Matchmaking

on:
  push:
    branches:
      - newteam/core-authority
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: team1-core-authority-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      EXPECTED_TEAM1_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TEAM1_COMMIT }}
          fetch-depth: 0

      - name: Prove checkout identity
        run: |
          set -euo pipefail
          echo "EXPECTED_TEAM1_COMMIT=$EXPECTED_TEAM1_COMMIT"
          echo "ACTUAL_TEAM1_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TEAM1_COMMIT"

      - name: Resolve exact canonical candidate base
        id: resolve_base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            candidate_base_sha="$PR_BASE_SHA"
            base_source="github.event.pull_request.base.sha"
            test -n "$candidate_base_sha"
            if ! git cat-file -e "${candidate_base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$candidate_base_sha"
            fi
          else
            candidate_base_sha=$(git rev-parse origin/main)
            base_source="origin/main"
            echo "MAIN_MERGE_BASE_SHA=$(git merge-base HEAD origin/main)"
          fi

          git cat-file -e "${candidate_base_sha}^{commit}"
          candidate_merge_base_sha=$(git merge-base "$candidate_base_sha" HEAD)

          echo "CANDIDATE_BASE_SOURCE=$base_source"
          echo "CANDIDATE_BASE_SHA=$candidate_base_sha"
          echo "CANDIDATE_MERGE_BASE_SHA=$candidate_merge_base_sha"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"

          echo "CANDIDATE_BASE_SHA=$candidate_base_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_MERGE_BASE_SHA=$candidate_merge_base_sha" >> "$GITHUB_ENV"
          echo "candidate_base_sha=$candidate_base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_merge_base_sha=$candidate_merge_base_sha" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex, Rebar, and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Focused hostile concurrency and fail-closed regressions
        run: |
          mix test \
            test/strangertalks_new/matchmaking_core_authority_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            test/strangertalks_new/matchmaking_reconciliation_fail_closed_test.exs \
            --trace

      - name: Core matchmaking authority regressions
        run: |
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/participant_activity_lock_test.exs \
            test/strangertalks_new_web/channels/participant_match_transition_authority_test.exs \
            --trace

      - name: Relevant reconnect safety and channel integration
        run: |
          mix test \
            test/strangertalks_new/relationship_reconnections_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new/security_adversarial_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            --trace

      - name: Reset test database before repository gate
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full repository precommit in detached exact-SHA worktree
        run: EXPECTED_SHA="$EXPECTED_TEAM1_COMMIT" bash ops/run_precommit_isolated.sh

      - name: Candidate-relative diff integrity
        id: diffcheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash ops/check_candidate_diff.sh "$CANDIDATE_BASE_SHA" HEAD
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Prove final checkout clean
        id: clean
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git status --short --branch
          git status --porcelain | tee /tmp/team1-status
          if [ -s /tmp/team1-status ]; then
            code=1
          else
            code=0
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record exact tested candidate and base
        if: always()
        shell: bash
        run: |
          echo "TEAM1_EXPECTED_COMMIT=$EXPECTED_TEAM1_COMMIT"
          echo "TEAM1_CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"
          echo "TEAM1_TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TEAM1_CANDIDATE_BASE_SHA=${CANDIDATE_BASE_SHA:-missing}"
          echo "TEAM1_CANDIDATE_MERGE_BASE_SHA=${CANDIDATE_MERGE_BASE_SHA:-missing}"

      - name: Fail Team 1 gate if required verification failed
        if: always()
        shell: bash
        env:
          BASE_OUTCOME: ${{ steps.resolve_base.outcome }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          DIFF_EXIT: ${{ steps.diffcheck.outputs.exit_code }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          set -euo pipefail
          echo "BASE_OUTCOME=$BASE_OUTCOME"
          echo "DIFF_OUTCOME=$DIFF_OUTCOME"
          echo "DIFF_EXIT=${DIFF_EXIT:-missing}"
          echo "CLEAN_OUTCOME=$CLEAN_OUTCOME"
          echo "CLEAN_EXIT=${CLEAN_EXIT:-missing}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TEAM1_COMMIT"
          test "$BASE_OUTCOME" = "success"
          test "$DIFF_OUTCOME" = "success"
          test "$DIFF_EXIT" = "0"
          test "$CLEAN_OUTCOME" = "success"
          test "$CLEAN_EXIT" = "0"
