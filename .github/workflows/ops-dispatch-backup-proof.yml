name: One-shot Supabase Backup Proof Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-dispatch-backup-proof.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch backup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/postgres-r2-backup.yml/dispatches" \
            -f ref=main
          echo "phase2_dispatch=accepted"
