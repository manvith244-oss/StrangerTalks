name: T07 AI-003 Case Security Stage Smoke

on:
  push:
    branches:
      - team7/ai-003-exact-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      EXPECTED_STAGE_SHA: ede7204afe3049327aff1660c04542c92cda0d05

    steps:
      - name: Checkout exact staged tree
        uses: actions/checkout@v4
        with:
          ref: ede7204afe3049327aff1660c04542c92cda0d05
          fetch-depth: 0

      - name: Prove staged identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_STAGE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Case-variant privacy regression
        run: mix test test/strangertalks_new/t07_ai_003_privacy_boundary_test.exs --trace

      - name: Candidate-owned formatter check
        run: |
          mix format --check-formatted \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            test/strangertalks_new/t07_ai_003_privacy_boundary_test.exs

      - name: Diff hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
