name: C5 V1 Final Composed Proof

on:
  push:
    branches:
      - evidence/c5-v1-final-b40a444-2026-09-10

permissions:
  contents: read

jobs:
  composed-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: _c5final
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"
      TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
      TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

    steps:
      - name: Checkout immutable exact main subject
        uses: actions/checkout@v4
        with:
          ref: b40a44428705ec566949c9bf8eb186cc3f5908c2
          fetch-depth: 0

      - name: Prove immutable subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "C5_SUBJECT_SHA=$(git rev-parse HEAD)"
          echo "C5_SUBJECT_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact-main dependencies and Chromium
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare isolated C5 browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start exact-main Phoenix for real Chromium proof
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint_config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/c5-v1-phoenix.log 2>&1 &
          echo $! > /tmp/c5-v1-phoenix.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/c5-v1-phoenix.pid)" 2>/dev/null; then
              cat /tmp/c5-v1-phoenix.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/c5-v1-phoenix.log
          exit 1

      - name: REAL_BROWSER spine - full authoritative Chromium E2E
        run: node --test test/js/browser_e2e_test.mjs

      - name: REAL_BROWSER focused V1 surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --test test/js/brand_identity_browser_test.mjs
          node --test test/js/doors_visual_structure_browser_test.mjs
          node --test test/js/arrival_accessibility_browser_test.mjs
          node --test test/js/message_failed_retry_browser_test.mjs
          node --test test/js/terminal_truth_browser_test.mjs
          node --test test/js/t03_history_route_browser_test.mjs
          node --test test/js/f06_secondary_flow_browser_test.mjs
          node --test test/js/team11_a01_real_browser_proof_test.mjs
          node --test test/js/normal_media_browser_test.mjs
          node --test test/js/f09_mobile_flow_browser_test.mjs
          node --test test/js/f10_desktop_flow_browser_test.mjs

      - name: Stop browser Phoenix
        if: always()
        run: |
          if [ -f /tmp/c5-v1-phoenix.pid ]; then
            kill "$(cat /tmp/c5-v1-phoenix.pid)" 2>/dev/null || true
          fi

      - name: Phoenix log on browser failure
        if: failure()
        run: cat /tmp/c5-v1-phoenix.log || true

      - name: WEBRTC T05 exact-attempt composition
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/js/live_call_test.mjs \
            test/js/live_call_signal_queue_regression_test.mjs \
            test/js/t05_fatal_termination_ack_retry_test.mjs \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/t05_net_003_credential_timeout_test.mjs \
            test/js/t05_net_003_ice_failure_test.mjs \
            test/js/team4_call_operation_race_test.mjs \
            test/js/team4_initiation_aba_test.mjs \
            test/js/team4_media_authority_test.mjs

      - name: Reset isolated DB before backend composition
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        run: |
          mix ecto.drop --force
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: DATABASE and runtime critical composition
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        run: |
          mix test \
            test/strangertalks_new/c3_match_conversation_integrity_test.exs \
            test/strangertalks_new/c3_relationship_distinctness_test.exs \
            test/strangertalks_new/t02_conversation_start_restart_controls_test.exs \
            test/strangertalks_new/report_media_origin_truth_test.exs \
            test/strangertalks_new/conversation_live_call_test.exs \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/conversation_call_channel_test.exs \
            --trace

      - name: AGENT regression composition - no development
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        run: |
          mix test \
            test/strangertalks_new/agent_security_gate_contract_test.exs \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/agent_systems_remediation_test.exs \
            test/strangertalks_new/intelligence_v1_hostile_test.exs \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/ai_service/boundary_contract_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs \
            --trace
          node --test test/js/companion_test.mjs test/js/prompt_cards_test.mjs

      - name: Migration-chain coherence on fresh local database
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --force
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix ecto.migrations

      - name: Final exact-main diff and clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/team11-a01-proof-screenshots tmp/playwright-report tmp/test-results 2>/dev/null || true
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "C5_FINAL_SHA=$(git rev-parse HEAD)"
          echo "C5_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "C5_WORKTREE=CLEAN"
