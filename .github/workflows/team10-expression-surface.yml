name: Team 10 Scope Hygiene Repair Harness

on:
  pull_request:
    branches:
      - release/prep-2026-08-22

permissions:
  contents: write

jobs:
  build-clean-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Build corrected candidate commit object without moving branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("priv/static/assets/app.js")
          source = path.read_text()
          old = 'await handleDomainError(error, {fallbackMessage: "Could not cancel matching. Please try again.", fallbackScreen: "doors"})'
          new = 'await handleDomainError(error, {fallbackMessage: "Could not cancel matching. Please try again."})'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one unrelated queue fallback hunk, found {count}")
          corrected = source.replace(old, new, 1)
          if 'emoji.textContent = payload?.emoji || "❤️"' not in corrected:
              raise SystemExit("T10-001 safe emoji renderer missing")
          if 'label.textContent = payload?.label || "Reaction"' not in corrected:
              raise SystemExit("T10-001 safe label renderer missing")
          if 'reactionDisplay?.replaceChildren()' not in corrected:
              raise SystemExit("T10-001 cleanup missing")
          path.write_text(corrected)
          PY

          git diff --check -- priv/static/assets/app.js
          git diff --exit-code HEAD^ -- .github/workflows/team10-expression-surface.yml >/dev/null || true

          api="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          jq -Rs '{content: ., encoding: "utf-8"}' priv/static/assets/app.js > /tmp/t10-app-blob.json
          app_blob_sha="$(curl -fsS -X POST \
            -H "${auth_header}" -H "${accept_header}" -H "${version_header}" \
            "${api}/git/blobs" --data-binary @/tmp/t10-app-blob.json | jq -er '.sha')"

          parent_tree_sha="$(git rev-parse HEAD^{tree})"
          maintained_workflow_blob_sha="$(git rev-parse HEAD^:.github/workflows/team10-expression-surface.yml)"

          jq -n \
            --arg base "${parent_tree_sha}" \
            --arg app "${app_blob_sha}" \
            --arg workflow "${maintained_workflow_blob_sha}" \
            '{base_tree: $base, tree: [
              {path: "priv/static/assets/app.js", mode: "100644", type: "blob", sha: $app},
              {path: ".github/workflows/team10-expression-surface.yml", mode: "100644", type: "blob", sha: $workflow}
            ]}' > /tmp/t10-tree.json

          tree_sha="$(curl -fsS -X POST \
            -H "${auth_header}" -H "${accept_header}" -H "${version_header}" \
            "${api}/git/trees" --data-binary @/tmp/t10-tree.json | jq -er '.sha')"

          jq -n \
            --arg message "T10-HYGIENE-001: remove unrelated queue fallback" \
            --arg tree "${tree_sha}" \
            --arg parent "${HEAD_SHA}" \
            '{message: $message, tree: $tree, parents: [$parent]}' > /tmp/t10-commit.json

          candidate_sha="$(curl -fsS -X POST \
            -H "${auth_header}" -H "${accept_header}" -H "${version_header}" \
            "${api}/git/commits" --data-binary @/tmp/t10-commit.json | jq -er '.sha')"

          echo "T10_HYGIENE_CANDIDATE_SHA=${candidate_sha}"
          echo "T10_HYGIENE_CANDIDATE_SHA=${candidate_sha}" >> "${GITHUB_STEP_SUMMARY}"
