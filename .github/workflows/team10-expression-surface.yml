name: Team 10 Expression Surface Verification

on:
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Team 10 candidate SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: team10-expression-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  PORT: "4002"
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002
  TEAM10_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}

jobs:
  verify-expression-surface:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact Team 10 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEAM10_CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove checkout identity
        run: |
          echo "TEAM10_CANDIDATE_SHA=${TEAM10_CANDIDATE_SHA}"
          echo "TEAM10_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${TEAM10_CANDIDATE_SHA}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused expressive JavaScript
        run: |
          node --test \
            test/js/team10_expression_surface_test.mjs \
            test/js/expressive_media_test.mjs

      - name: GIF provider and authority ExUnit
        run: |
          mix test \
            test/strangertalks_new/gif_provider_test.exs \
            test/strangertalks_new/gif_search_authority_test.exs \
            test/strangertalks_new_web/controllers/gif_controller_test.exs

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for Team 10 Chromium proof
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/team10-browser.log 2>&1 &
          echo $! > /tmp/team10-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/team10-browser.pid)" 2>/dev/null; then
              cat /tmp/team10-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4002/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/team10-browser.log
          exit 1

      - name: Real Chromium Team 10 hostile proof
        run: |
          node --test \
            test/js/team10_expression_browser_test.mjs \
            test/js/team10_expression_actions_browser_test.mjs \
            test/js/team10_expression_reliability_browser_test.mjs

      - name: Conversation and replay regressions
        run: |
          node --test \
            test/js/delivery_progress_test.mjs \
            test/js/reply_quote_test.mjs \
            test/js/reaction_test.mjs \
            test/js/pin_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/expressive_media_test.mjs

      - name: Stop Team 10 browser server
        if: always()
        run: |
          if [ -f /tmp/team10-browser.pid ]; then
            pid="$(cat /tmp/team10-browser.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$pid" 2>/dev/null || true
          fi

      - name: Reset database before full suite
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        run: mix precommit

      - name: Diff hygiene
        run: git diff --check

      - name: Prove clean checkout
        run: |
          git status --porcelain | tee /tmp/team10-status
          test ! -s /tmp/team10-status

      - name: Prove exact tested SHA
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "TEAM10_TESTED_SHA=${tested_sha}"
          test "${tested_sha}" = "${TEAM10_CANDIDATE_SHA}"

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/team10-browser.log || true
