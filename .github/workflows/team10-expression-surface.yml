name: Team 10 Closure Candidate Builder

on:
  push:
    branches:
      - team10/expression-safety-reattack-20260826

permissions:
  contents: write

env:
  BASE_SHA: d8dce24bc414bbdd1a560bc8e4aa7b33cfdadf35

# Existing push-triggered repair harness; final candidate is built from BASE_SHA, not this tree.
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair harness head
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Prove audited repair base is available
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Apply exact Team 10 closure corrections
        run: |
          set -euo pipefail
          git checkout "${BASE_SHA}" -- priv/static/assets/app.js test/js/team10_floating_reaction_authority_test.mjs
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("priv/static/assets/app.js")
          app_source = app_path.read_text()
          old_queue = 'await handleDomainError(error, {fallbackMessage: "Could not cancel matching. Please try again.", fallbackScreen: "doors"})'
          new_queue = 'await handleDomainError(error, {fallbackMessage: "Could not cancel matching. Please try again."})'
          if app_source.count(old_queue) != 1:
              raise SystemExit(f"expected one queue hygiene target, found {app_source.count(old_queue)}")
          app_source = app_source.replace(old_queue, new_queue, 1)

          required_renderer = [
              'emoji.textContent = payload?.emoji || "❤️"',
              'label.textContent = payload?.label || "Reaction"',
              'item.append(emoji, document.createTextNode(" "), label)',
              'reactionDisplay?.replaceChildren()'
          ]
          for needle in required_renderer:
              if needle not in app_source:
                  raise SystemExit(f"T10-001 renderer invariant missing: {needle}")
          start = app_source.index("function displayReaction(payload) {")
          end = app_source.index("\n}\n\nfunction initLiveCallCoordinator()", start)
          if "innerHTML" in app_source[start:end]:
              raise SystemExit("T10-001 inert renderer regressed to innerHTML")
          app_path.write_text(app_source)

          test_path = Path("test/js/team10_floating_reaction_authority_test.mjs")
          test_source = test_path.read_text()
          old = '''  coordinator.handleReaction({
            call_attempt_id: "call-b",
            reaction_event_id: "reaction-b-current",
            reaction: "wave",
            sender_id: "participant-peer"
          })

          assert.deepEqual(presented, [{
            reaction: "wave",
            emoji: "👋",
            label: "Wave (Hello)",
            sender_id: "participant-peer"
          }])'''
          new = '''  const currentReactionStartedAt = Date.now()
          coordinator.handleReaction({
            call_attempt_id: "call-b",
            reaction_event_id: "reaction-b-current",
            reaction: "wave",
            sender_id: "participant-peer"
          })
          const currentReactionFinishedAt = Date.now()

          assert.equal(presented.length, 1, "current call reaction must be presented exactly once")
          const current = presented[0]
          assert.equal(current.reaction_event_id, "reaction-b-current")
          assert.equal(current.reaction, "wave")
          assert.equal(current.emoji, "👋")
          assert.equal(current.label, "Wave (Hello)")
          assert.equal(current.sender_id, "participant-peer")
          assert.equal(current.isSelf, false)
          assert.equal(Number.isFinite(current.timestamp), true, "presentation timestamp must be numeric")
          assert.ok(
            current.timestamp >= currentReactionStartedAt && current.timestamp <= currentReactionFinishedAt,
            "generated timestamp must be bounded by the current reaction handling window"
          )'''
          if test_source.count(old) != 1:
              raise SystemExit(f"expected one over-strict authority assertion, found {test_source.count(old)}")
          test_path.write_text(test_source.replace(old, new, 1))
          PY

          git diff --check -- priv/static/assets/app.js test/js/team10_floating_reaction_authority_test.mjs

      - name: Run focused Team 10 JavaScript before candidate creation
        run: |
          node --test \
            test/js/team10_expression_surface_test.mjs \
            test/js/expressive_media_test.mjs \
            test/js/team10_floating_reaction_authority_test.mjs

      - name: Build one final candidate commit from audited parent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"

          make_blob() {
            local file="$1"
            local json="$2"
            jq -Rs '{content: ., encoding: "utf-8"}' "$file" > "$json"
            curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" \
              "${api}/git/blobs" --data-binary "@$json" | jq -er '.sha'
          }

          app_blob="$(make_blob priv/static/assets/app.js /tmp/t10-app.json)"
          test_blob="$(make_blob test/js/team10_floating_reaction_authority_test.mjs /tmp/t10-test.json)"
          base_tree="$(git rev-parse "${BASE_SHA}^{tree}")"

          jq -n \
            --arg base "$base_tree" \
            --arg app "$app_blob" \
            --arg test "$test_blob" \
            '{base_tree: $base, tree: [
              {path: "priv/static/assets/app.js", mode: "100644", type: "blob", sha: $app},
              {path: "test/js/team10_floating_reaction_authority_test.mjs", mode: "100644", type: "blob", sha: $test}
            ]}' > /tmp/t10-tree.json

          tree_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" \
            "${api}/git/trees" --data-binary @/tmp/t10-tree.json | jq -er '.sha')"

          jq -n \
            --arg message "Team 10: close reaction authority test and scope hygiene" \
            --arg tree "$tree_sha" \
            --arg parent "$BASE_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}' > /tmp/t10-commit.json

          candidate_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" \
            "${api}/git/commits" --data-binary @/tmp/t10-commit.json | jq -er '.sha')"

          echo "T10_CANDIDATE_SHA=${candidate_sha}"
          echo "T10_CANDIDATE_SHA=${candidate_sha}" >> "$GITHUB_STEP_SUMMARY"
