name: RPR Production Migration Rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rpr-production-migration-closure.yml
      - .github/workflows/rpr-production-migration-live.yml
      - .github/workflows/postgres-r2-backup.yml
      - priv/repo/migrations/**
      - test/strangertalks_new/team4_db_security_closure_test.exs
      - test/strangertalks_new/rpr_production_migration_workflow_contract_test.exs

permissions:
  contents: read

concurrency:
  group: rpr-production-migration-rehearsal-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  EXPECTED_PRODUCTION_HEAD: "20260821191324"
  EXPECTED_REPOSITORY_HEAD: "20260913031500"
  EXPECTED_MIGRATIONS_TREE: "2e2c41722f9ed1f1ffa11bce086519f57f7a8ab3"

jobs:
  upgrade-rehearsal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      PGPASSWORD: strangertalks_test

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and complete migration tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          migration_tree="$(git rev-parse HEAD:priv/repo/migrations)"
          test "$migration_tree" = "$EXPECTED_MIGRATIONS_TREE"
          repo_latest=$(find priv/repo/migrations -maxdepth 1 -type f -name '*.exs' -printf '%f\n' \
            | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort | tail -1)
          test "$repo_latest" = "$EXPECTED_REPOSITORY_HEAD"
          echo "REHEARSAL_COMMIT=$(git rev-parse HEAD)"
          echo "REPOSITORY_MIGRATIONS_TREE=$migration_tree"
          echo "REPOSITORY_MIGRATION_HEAD=$repo_latest"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex Rebar and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Create Supabase-like roles
        run: |
          psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN CREATE ROLE supabase_admin NOLOGIN; END IF;
          END
          $$;
          GRANT CREATE, USAGE ON SCHEMA public TO supabase_admin;
          SQL

      - name: Reconstruct current production migration head
        run: |
          set -euo pipefail
          mix ecto.migrate --to "$EXPECTED_PRODUCTION_HEAD"
          actual=$(psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -Atc 'SELECT max(version) FROM schema_migrations')
          test "$actual" = "$EXPECTED_PRODUCTION_HEAD"
          echo "REHEARSAL_PRODUCTION_HEAD=$actual"

      - name: Inject current Supabase-like insecure Data API ACL state
        run: |
          psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO PUBLIC, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO PUBLIC, anon, authenticated, service_role;
          SQL

      - name: Prove hostile pre-state is actually exposed
        run: |
          set -euo pipefail
          for role in anon authenticated service_role; do
            psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -Atc "SELECT has_schema_privilege('$role','public','USAGE')" | grep -qx t
            psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -Atc "SELECT has_table_privilege('$role','public.participants','SELECT')" | grep -qx t
          done

      - name: Apply exact pending canonical migration chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:priv/repo/migrations)" = "$EXPECTED_MIGRATIONS_TREE"
          mix ecto.migrate
          actual=$(psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -Atc 'SELECT max(version) FROM schema_migrations')
          test "$actual" = "$EXPECTED_REPOSITORY_HEAD"
          echo "REHEARSAL_FINAL_HEAD=$actual"

      - name: Prove post-upgrade database security contract
        run: |
          mix test test/strangertalks_new/team4_db_security_closure_test.exs
          psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE app_count integer; bad_rls integer; api_grants integer; role_name text;
          BEGIN
            SELECT count(*) INTO app_count FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relname <> 'schema_migrations';
            IF app_count <> 30 THEN RAISE EXCEPTION 'expected 30 application tables after upgrade, got %', app_count; END IF;
            SELECT count(*) INTO bad_rls FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relname <> 'schema_migrations' AND NOT c.relrowsecurity;
            IF bad_rls <> 0 THEN RAISE EXCEPTION 'application tables without RLS after upgrade: %', bad_rls; END IF;
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
              IF has_schema_privilege(role_name, 'public', 'USAGE') OR has_schema_privilege(role_name, 'public', 'CREATE') THEN RAISE EXCEPTION '% retains public schema authority', role_name; END IF;
            END LOOP;
            SELECT count(*) INTO api_grants FROM information_schema.table_privileges WHERE table_schema = 'public' AND grantee IN ('anon','authenticated','service_role');
            IF api_grants <> 0 THEN RAISE EXCEPTION 'Data API table grants remain after upgrade: %', api_grants; END IF;
          END
          $$;
          SQL

      - name: Final exact-head and clean-tree proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:priv/repo/migrations)" = "$EXPECTED_MIGRATIONS_TREE"
          git diff --check
          test -z "$(git status --porcelain)"
          echo "RPR_REHEARSAL_PROVEN_SHA=$(git rev-parse HEAD)"
