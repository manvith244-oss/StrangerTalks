name: Slice B Node Baseline Verification

on:
  push:
    branches:
      - verify/node-baseline-20261004

permissions:
  contents: read

jobs:
  baseline:
    name: baseline-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: old-main
            sha: fb73a1faec28393624af09da50845d84a3e5c128
          - label: branch-head
            sha: 5d924da2f2e3cfada8ee51b9ed0faac07041596e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      EXPECTED_SHA: ${{ matrix.sha }}
    steps:
      - name: Checkout exact test SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Prove exact SHA
        run: |
          echo "LABEL=${{ matrix.label }}"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg, dependencies, and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet || true
          mix ecto.migrate --quiet

      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/browser.log 2>&1 &
          echo $! > /tmp/browser.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then
              echo "PHOENIX_READY=1"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/browser.pid)" 2>/dev/null; then
              cat /tmp/browser.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/browser.log
          exit 1

      - name: Targeted baseline proofs
        shell: bash
        run: |
          set +e
          echo "===== TARGET TEAM6 200% ZOOM / HANGOUTS BANNER ====="
          node --test --test-concurrency=1 --test-name-pattern='200 percent browser zoom keeps Arrival and queue primary controls reachable' test/js/arrival_accessibility_browser_test.mjs 2>&1 | tee /tmp/team6-target.log
          echo "TEAM6_TARGET_EXIT=${PIPESTATUS[0]}"

          echo "===== TARGET F11 BROWSER-06 / BROWSER-07 ====="
          node --test --test-concurrency=1 --test-name-pattern='BROWSER-06|BROWSER-07' test/js/f11_browser_hostile_test.mjs 2>&1 | tee /tmp/f11-target.log
          echo "F11_TARGET_EXIT=${PIPESTATUS[0]}"

          echo "===== TARGET ICEBREAKERS SOURCE-REGEX FILE ====="
          node --test test/js/icebreakers_test.mjs 2>&1 | tee /tmp/icebreakers-target.log
          echo "ICEBREAKERS_TARGET_EXIT=${PIPESTATUS[0]}"
          exit 0

      - name: Full Node suite exact command
        shell: bash
        run: |
          set +e
          echo "===== FULL NODE SUITE ====="
          echo 'COMMAND=node --test test/js/*.mjs'
          node --test test/js/*.mjs 2>&1 | tee /tmp/full-node.log
          code=${PIPESTATUS[0]}
          echo "FULL_NODE_EXIT=$code"
          echo "===== FULL NODE FINAL COUNTS ====="
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/full-node.log | tail -20 || true
          echo "===== FULL NODE FAILING SUBTESTS ====="
          awk '/^# Subtest: /{name=substr($0,12)} /^not ok [0-9]+ - /{print $0}' /tmp/full-node.log || true
          exit 0

      - name: Final exact SHA proof
        if: always()
        run: |
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Browser log if needed
        if: always()
        run: tail -200 /tmp/browser.log || true

      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/browser.pid ]; then kill "$(cat /tmp/browser.pid)" 2>/dev/null || true; fi
