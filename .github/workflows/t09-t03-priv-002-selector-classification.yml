name: T09 T03 PRIV-002 DOM Initialization Classification

on:
  push:
    branches: [team9/t03-priv-002-selector-classification]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  CONTROL_SHA: cff1d080cfbe050164eaea96bfe7de33641a2fa1
  CANDIDATE_SHA: 99787f0b85e0cf9f6c3c001c3f0462f4d6fec89f
  CANDIDATE_TREE: 31d156cfcdae30db2f49740033b4f454e1e7004c
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  classify:
    name: Exact CONTROL vs CANDIDATE DOM/runtime timeline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout T09 diagnostic proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record immutable T09 diagnostic lineage and probe
        run: |
          set -euo pipefail
          echo "T09_DIAGNOSTIC_BRANCH=$GITHUB_REF_NAME"
          echo "T09_DIAGNOSTIC_SHA=$GITHUB_SHA"
          echo "T09_DIAGNOSTIC_TREE=$(git rev-parse HEAD^{tree})"
          echo "T09_RUN_ID=$GITHUB_RUN_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp test/t09_t03_priv_002_dom_matrix.mjs /tmp/t09_t03_priv_002_dom_matrix.mjs
          sha256sum /tmp/t09_t03_priv_002_dom_matrix.mjs

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install one shared browser/test environment
        run: |
          set -euo pipefail
          git checkout --force "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Run exact CONTROL and CANDIDATE through identical instrumentation
        run: |
          set -u
          control_rc=0
          candidate_rc=0

          run_lane() {
            lane="$1"
            sha="$2"
            echo "===== T09_${lane}_BEGIN ====="
            git checkout --force "$sha" || return 91
            rm -f test/t09_t03_priv_002_dom_matrix.mjs
            if [ "$(git rev-parse HEAD)" != "$sha" ]; then return 92; fi
            if [ -n "$(git status --porcelain)" ]; then git status --short; return 93; fi

            echo "T09_${lane}_REQUESTED_SHA=$sha"
            echo "T09_${lane}_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            echo "T09_${lane}_TREE=$(git rev-parse HEAD^{tree})"

            mix ecto.drop --force >/dev/null 2>&1 || true
            mix ecto.create --quiet || return 94
            mix ecto.migrate --quiet || return 95
            cp /tmp/t09_t03_priv_002_dom_matrix.mjs test/t09_t03_priv_002_dom_matrix.mjs
            node --check test/t09_t03_priv_002_dom_matrix.mjs || return 96

            log="/tmp/t09-${lane,,}-server.log"
            pidfile="/tmp/t09-${lane,,}-server.pid"
            mix run --no-start -e '
              repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
              Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
              endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
              Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127,0,0,1}, port: 4000]))
              {:ok, _} = Application.ensure_all_started(:strangertalks_new)
              Process.sleep(:infinity)
            ' >"$log" 2>&1 & echo $! >"$pidfile"

            ready=0
            for i in $(seq 1 45); do
              pid="$(cat "$pidfile")"
              if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; break; fi
              if curl -fsS http://localhost:4000/ >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done

            rc=0
            if [ "$ready" -ne 1 ]; then
              echo "T09_${lane}_SERVER_READY=false"
              rc=97
            else
              echo "T09_${lane}_SERVER_READY=true"
              T09_LANE="$lane" EXPECTED_PRODUCT_SHA="$sha" CHECKED_PRODUCT_SHA="$(git rev-parse HEAD)" \
                node --test --test-concurrency=1 test/t09_t03_priv_002_dom_matrix.mjs || rc=$?
            fi

            if [ -f "$pidfile" ]; then
              pid="$(cat "$pidfile")"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f test/t09_t03_priv_002_dom_matrix.mjs

            echo "T09_${lane}_FINAL_TESTED_SHA=$(git rev-parse HEAD)"
            if [ "$(git rev-parse HEAD)" != "$sha" ]; then rc=98; fi
            if [ -n "$(git status --porcelain)" ]; then
              echo "T09_${lane}_FINAL_CLEAN=false"
              git status --short
              rc=99
            else
              echo "T09_${lane}_FINAL_CLEAN=true"
            fi
            echo "T09_${lane}_RC=$rc"
            echo "===== T09_${lane}_END ====="
            return "$rc"
          }

          run_lane CONTROL "$CONTROL_SHA" || control_rc=$?
          run_lane CANDIDATE "$CANDIDATE_SHA" || candidate_rc=$?

          echo "T09_CONTROL_RC=$control_rc"
          echo "T09_CANDIDATE_RC=$candidate_rc"
          test "$control_rc" -eq 0
          test "$candidate_rc" -eq 0

      - name: Final exact candidate identity child-diff and clean tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git diff --check "$CONTROL_SHA".."$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo "FINAL_TESTED_SHA=$(git rev-parse HEAD)"
          echo "FINAL_TESTED_TREE=$(git rev-parse HEAD^{tree})"
          echo "FINAL_WORKTREE=CLEAN"
