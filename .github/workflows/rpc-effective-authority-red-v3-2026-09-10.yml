name: RPC Effective Authority RED V3 2026-09-10

on:
  push:
    branches:
      - evidence/rpc-effective-authority-red-v3-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: f6294791ae5a788651da2947bb39e7ccfaab2523
  TARGET_TREE: c76b5e3f8ad9cd969164a67066f2a81a6a8571bc
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

jobs:
  red-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Prepare current-main database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Effective-authority regression must fail before closure
        shell: bash
        run: |
          set +e
          mix test test/strangertalks_new/public_rpc_effective_authority_test.exs
          status=$?
          test "$status" -ne 0
      - name: Exact clean identity
        if: always()
        run: |
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
