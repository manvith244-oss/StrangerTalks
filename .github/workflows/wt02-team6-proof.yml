name: WT-02 Team 6 Transport ACK Proof

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair
  workflow_dispatch:

concurrency:
  group: wt02-team6-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact Team 6 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM6_COMMIT=${{ github.sha }}"
          echo "ACTUAL_TEAM6_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Team 6 focused transport and ACK proof
        run: mix test test/strangertalks_new/wt02_terminal_transport_ack_test.exs --trace

      - name: Team 5 explicit-End server-core regression
        run: mix test test/strangertalks_new/wt02_explicit_end_server_core_test.exs --trace

      - name: Existing delivery regression
        run: mix test test/strangertalks_new/conversation_delivery_test.exs --trace

      - name: Terminal persistence and recovery regressions
        run: >-
          mix test
          test/strangertalks_new/terminal_persistence_failure_test.exs
          test/strangertalks_new/recovery_restart_test.exs
          --trace

      - name: Block path focused non-regression
        run: mix test test/strangertalks_new/team4_safety_boundary_test.exs --trace

      - name: Full precommit
        run: mix precommit

      - name: Diff check
        run: git diff --check

      - name: Prove verification left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact commit
        run: echo "WT02_TEAM6_TESTED_COMMIT=$(git rev-parse HEAD)"
