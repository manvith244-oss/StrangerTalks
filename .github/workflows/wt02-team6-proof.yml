name: WT-02 Team 6 Transport ACK Proof

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair
  workflow_dispatch:

concurrency:
  group: wt02-team6-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact Team 6 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM6_COMMIT=${{ github.sha }}"
          echo "ACTUAL_TEAM6_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Correct RED harness expectation
        if: github.event.head_commit.message == 'ci: correct WT-02 RED harness'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/strangertalks_new/wt02_terminal_transport_ack_test.exs")
          text = path.read_text()

          alias_line = "  alias StrangertalksNew.Conversation\n"
          assert text.count(alias_line) == 1
          text = text.replace(alias_line, "", 1)

          old = """    assert {:error, :conversation_terminating} =
                   ConversationServer.register_channel(conversation_id, context.participant_b, self())
          """
          new = """    assert {:error, :conversation_inactive} =
                   ConversationServer.register_channel(conversation_id, context.participant_b, self())
          """
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- test/strangertalks_new/wt02_terminal_transport_ack_test.exs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/strangertalks_new/wt02_terminal_transport_ack_test.exs
          git commit -m "test: correct WT-02 reconnect proof expectation"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair

      - name: Apply bounded runtime repair
        if: github.event.head_commit.message == 'ci: apply WT-02 runtime repair'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()

          ack_old = """  def handle_call({:acknowledge_message, participant_id, message_id}, _from, state) do
            state = prune_completed(state)

            cond do
              not member?(state, participant_id) ->
                {:reply, {:error, :not_conversation_member}, state}

              terminating?(state) ->
                {:reply, {:error, :conversation_terminating}, state}

              true ->
                acknowledge_pending_message(state, participant_id, message_id)
            end
          end
          """
          ack_new = """  def handle_call({:acknowledge_message, participant_id, message_id}, _from, state) do
            state = prune_completed(state)

            if member?(state, participant_id) do
              acknowledge_pending_message(state, participant_id, message_id)
            else
              {:reply, {:error, :not_conversation_member}, state}
            end
          end
          """

          text_retry_old = """        if connected?(state, message.recipient_id) do
                  deliver_to_participant(state, message.recipient_id, message)
                  {:noreply, schedule_retry(state, message_id)}
                else
                  {:noreply, state}
                end
          """
          text_retry_new = """        cond do
                  terminating?(state) ->
                    {:noreply, state}

                  connected?(state, message.recipient_id) ->
                    deliver_to_participant(state, message.recipient_id, message)
                    {:noreply, schedule_retry(state, message_id)}

                  true ->
                    {:noreply, state}
                end
          """

          voice_retry_old = """        if connected?(state, note.recipient_id) do
                  deliver_voice_note_to_participant(state, note.recipient_id, note)
                  {:noreply, schedule_voice_retry(state, voice_note_id)}
                else
                  {:noreply, state}
                end
          """
          voice_retry_new = """        cond do
                  terminating?(state) ->
                    {:noreply, state}

                  connected?(state, note.recipient_id) ->
                    deliver_voice_note_to_participant(state, note.recipient_id, note)
                    {:noreply, schedule_voice_retry(state, voice_note_id)}

                  true ->
                    {:noreply, state}
                end
          """

          replacements = [
              (ack_old, ack_new, "text ACK authority"),
              (text_retry_old, text_retry_new, "text/expressive retry authority"),
              (voice_retry_old, voice_retry_new, "voice retry authority"),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              assert count == 1, f"{label}: expected one exact source cut, found {count}"
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          mix format lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: freeze conversation transmission while terminating"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Team 6 focused transport and ACK proof
        run: mix test test/strangertalks_new/wt02_terminal_transport_ack_test.exs --trace

      - name: Team 5 explicit-End server-core regression
        run: mix test test/strangertalks_new/wt02_explicit_end_server_core_test.exs --trace

      - name: Existing delivery regression
        run: mix test test/strangertalks_new/conversation_delivery_test.exs --trace

      - name: Terminal persistence and recovery regressions
        run: >-
          mix test
          test/strangertalks_new/terminal_persistence_failure_test.exs
          test/strangertalks_new/recovery_restart_test.exs
          --trace

      - name: Block path focused non-regression
        run: mix test test/strangertalks_new/team4_safety_boundary_test.exs --trace

      - name: Full precommit
        run: mix precommit

      - name: Diff check
        run: git diff --check

      - name: Prove verification left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact commit
        run: echo "WT02_TEAM6_TESTED_COMMIT=$(git rev-parse HEAD)"
