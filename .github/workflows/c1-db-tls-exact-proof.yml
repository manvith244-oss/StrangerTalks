name: C1 DB TLS Exact Proof

on:
  push:
    branches:
      - evidence/c1-db-tls-1efffd7-2026-09-10

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: 1efffd7c7436483e0188cc06a29fd7a15c7aea45
    steps:
      - name: Checkout exact TLS candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Prove exact identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Format and compile warnings-as-errors
        run: |
          set -euo pipefail
          mix format --check-formatted
          mix compile --warnings-as-errors

      - name: Focused production database TLS config tests
        run: mix test test/strangertalks_new/production_database_tls_config_test.exs

      - name: Dependency hygiene and Hex audit
        run: |
          set -euo pipefail
          mix deps.unlock --check-unused
          mix hex.audit

      - name: Full precommit
        run: mix precommit

      - name: Exact-runtime production release assembly
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          rm -rf _build/prod
          mix deps.get --only prod
          mix deps.compile
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release --overwrite
          test -x _build/prod/rel/strangertalks_new/bin/migrate
          test -x _build/prod/rel/strangertalks_new/bin/strangertalks_new

      - name: Docker production image build
        run: |
          set -euo pipefail
          grep -q '^ARG ELIXIR_VERSION=1.18.4$' Dockerfile
          grep -q '^ARG OTP_VERSION=27.3.4.16$' Dockerfile
          docker build --pull -t "strangertalks-c1-db-tls:${TARGET_SHA}" .
          docker inspect "strangertalks-c1-db-tls:${TARGET_SHA}" >/dev/null

      - name: Diff check clean tree and exact final identity
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
