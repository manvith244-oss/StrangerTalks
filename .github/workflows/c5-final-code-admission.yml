name: C5 Final Code Admission

on:
  push:
    branches:
      - evidence/c5-final-code-admission-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c5-final-code-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr229-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: b6e153920c0c2c01f65c0984ea4a9301a6313606
      TARGET_TREE: da5adf7cc90a8f27884be28755cf7d26efe2c543
      BASE_SHA: 71dbc9546ddf7bca46b62953a6fc4ba1f20d5af1
    steps:
      - name: Checkout C5 proof carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: proof
      - name: Checkout exact PR229 candidate
        uses: actions/checkout@v4
        with:
          ref: b6e153920c0c2c01f65c0984ea4a9301a6313606
          fetch-depth: 0
          path: candidate
      - name: Exact identity and scope
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        working-directory: candidate
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Prepare database
        working-directory: candidate
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: C5 independent hostile Conversation Start proof
        run: |
          cp proof/c5_proof/c5_pr229_hostile_test.exs candidate/test/strangertalks_new/c5_pr229_hostile_test.exs
          cd candidate
          mix test test/strangertalks_new/c5_pr229_hostile_test.exs
          rm test/strangertalks_new/c5_pr229_hostile_test.exs
      - name: Exact candidate focused and affected regressions
        working-directory: candidate
        run: |
          mix test \
            test/strangertalks_new/t02_conversation_start_restart_controls_test.exs \
            test/strangertalks_new/t_a01_002_conversation_start_restart_proof_test.exs \
            test/strangertalks_new/conversation_test.exs \
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/c3_legacy_completed_status_test.exs \
            test/strangertalks_new/team3_recovery_coordination_test.exs
      - name: Common repository proof
        working-directory: candidate
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix precommit
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

  pr231-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: 2c1223167167c986bf568fe2d13a3a8f79dc393c
      TARGET_TREE: 5f7ecef8269eb48024614ccb4ea99cddaff430e8
      BASE_SHA: 71dbc9546ddf7bca46b62953a6fc4ba1f20d5af1
    steps:
      - name: Checkout C5 proof carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: proof
      - name: Checkout exact PR231 candidate
        uses: actions/checkout@v4
        with:
          ref: 2c1223167167c986bf568fe2d13a3a8f79dc393c
          fetch-depth: 0
          path: candidate
      - name: Exact identity and production scope
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git diff --name-status "$BASE_SHA" "$TARGET_SHA"
          test "$(git diff --numstat "$BASE_SHA" "$TARGET_SHA" -- priv/static/assets/live_call.mjs | awk '{print $1":"$2}')" = "38:5"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        working-directory: candidate
        run: |
          npm ci
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: C5 independent fatal acknowledgement attack
        run: |
          cp proof/c5_proof/c5_pr231_hostile_test.mjs candidate/test/js/c5_pr231_hostile_test.mjs
          cd candidate
          node --test --test-concurrency=1 test/js/c5_pr231_hostile_test.mjs
          rm test/js/c5_pr231_hostile_test.mjs
      - name: Maintained T05 WebRTC regression matrix
        working-directory: candidate
        run: |
          node --test --test-concurrency=1 \
            test/js/t05_fatal_termination_ack_retry_test.mjs \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/t05_net_003_credential_timeout_test.mjs \
            test/js/t05_net_003_ice_failure_test.mjs \
            test/js/live_call_test.mjs \
            test/js/team4_call_operation_race_test.mjs \
            test/js/team4_media_authority_test.mjs \
            test/js/team6_media_gate_test.mjs
      - name: Prepare database
        working-directory: candidate
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Affected Elixir media regressions
        working-directory: candidate
        run: |
          mix test \
            test/strangertalks_new/conversation_live_call_test.exs \
            test/strangertalks_new_web/channels/conversation_call_channel_test.exs \
            test/strangertalks_new/t05_view_epoch_restart_test.exs \
            test/strangertalks_new/t05_view_presentation_atomicity_test.exs \
            test/strangertalks_new/team6_media_authority_test.exs \
            test/strangertalks_new/team6_turn_provider_test.exs \
            test/strangertalks_new/view_once_media_store_test.exs
      - name: Common repository proof
        working-directory: candidate
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix precommit
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

  c4-route-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      TARGET_SHA: 0b2743e68e0b584b8a8e5eae26829fe8a70f4350
      TARGET_TREE: a8a14ede71616ab8d623a63d53af549660927199
      BASE_SHA: 71dbc9546ddf7bca46b62953a6fc4ba1f20d5af1
    steps:
      - name: Checkout C5 proof carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: proof
      - name: Checkout exact C4 candidate
        uses: actions/checkout@v4
        with:
          ref: 0b2743e68e0b584b8a8e5eae26829fe8a70f4350
          fetch-depth: 0
          path: candidate
      - name: Exact identity and bounded production delta
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git diff --name-status "$BASE_SHA" "$TARGET_SHA"
          test "$(git diff --numstat "$BASE_SHA" "$TARGET_SHA" -- priv/static/assets/app.js | awk '{print $1":"$2}')" = "1:1"
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies
        working-directory: candidate
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Navigation contract regression
        working-directory: candidate
        run: node --test --test-concurrency=1 test/js/navigation_history_test.mjs
      - name: Prepare isolated browser database
        working-directory: candidate
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start isolated Phoenix browser server
        working-directory: candidate
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/c5-c4-browser.log 2>&1 &
          echo $! > /tmp/c5-c4-browser.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/c5-c4-browser.pid)" 2>/dev/null; then cat /tmp/c5-c4-browser.log; exit 1; fi
            sleep 1
          done
          cat /tmp/c5-c4-browser.log
          exit 1
      - name: Candidate mobile desktop route proof
        working-directory: candidate
        run: node --test --test-concurrency=1 test/js/c4_kept_conversation_route_browser_test.mjs
      - name: C5 independent stale-history ABA Chromium attack
        run: |
          cp proof/c5_proof/c5_c4_route_aba_browser_test.mjs candidate/test/js/c5_c4_route_aba_browser_test.mjs
          cd candidate
          node --test --test-concurrency=1 test/js/c5_c4_route_aba_browser_test.mjs
          rm test/js/c5_c4_route_aba_browser_test.mjs
      - name: Stop isolated Phoenix browser server
        if: always()
        working-directory: candidate
        run: |
          if [ -f /tmp/c5-c4-browser.pid ]; then
            pid="$(cat /tmp/c5-c4-browser.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
          fi
      - name: Browser log on failure
        if: failure()
        run: cat /tmp/c5-c4-browser.log || true
      - name: Reset database before full gate
        working-directory: candidate
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Common repository proof
        working-directory: candidate
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix precommit
          git diff --check "$BASE_SHA" "$TARGET_SHA"
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
