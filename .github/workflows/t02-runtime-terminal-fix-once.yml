name: T02 Runtime Terminal Fix Once

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation
    paths:
      - .github/workflows/t02-runtime-terminal-fix-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-terminal-runtime-fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    env:
      MIX_ENV: test
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify branch lineage and exact pre-fix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "388bc36dc1bbf49f6084c6b95acb80b664080327"
          grep -F '@release_terminal_statuses [:ENDED, :ABANDONED, :FAILED, :COMPLETED]' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          grep -F 'when status in [:ENDED, :ABANDONED, :FAILED, :COMPLETED] ->' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          grep -F 'release-terminal classifier recognizes exactly ENDED ABANDONED FAILED COMPLETED' \
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Apply exact two-site runtime correction and proof alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server = Path('lib/strangertalks_new/conversation_lifecycle/conversation_server.ex')
          text = server.read_text()
          replacements = {
              '@release_terminal_statuses [:ENDED, :ABANDONED, :FAILED, :COMPLETED]':
                  '@release_terminal_statuses [:ENDED, :ABANDONED, :FAILED]',
              'when status in [:ENDED, :ABANDONED, :FAILED, :COMPLETED] ->':
                  'when status in [:ENDED, :ABANDONED, :FAILED] ->',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one server occurrence for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          server.write_text(text)

          pairing = Path('test/strangertalks_new/participant_pairing_reservation_release_cases.exs')
          text = pairing.read_text()
          old = '''  test "release-terminal classifier recognizes exactly ENDED ABANDONED FAILED COMPLETED" do
            for status <- [:ENDED, :ABANDONED, :FAILED, :COMPLETED] do
              assert ConversationServer.release_terminal_status?(status)
            end

            for status <- [:PENDING, :ACTIVE, :PAUSED] do
              refute ConversationServer.release_terminal_status?(status)
            end

            IO.puts(
              "REL-05 PASS classifier release=ENDED,ABANDONED,FAILED,COMPLETED keep=PENDING,ACTIVE,PAUSED"
            )
          end'''
          new = '''  test "release-terminal classifier recognizes exactly ENDED ABANDONED FAILED" do
            for status <- [:ENDED, :ABANDONED, :FAILED] do
              assert ConversationServer.release_terminal_status?(status)
            end

            for status <- [:PENDING, :ACTIVE, :PAUSED, :COMPLETED] do
              refute ConversationServer.release_terminal_status?(status)
            end

            IO.puts(
              "REL-05 PASS classifier release=ENDED,ABANDONED,FAILED keep=PENDING,ACTIVE,PAUSED reject=COMPLETED"
            )
          end'''
          if text.count(old) != 1:
              raise SystemExit('pairing classifier block did not match exactly once')
          pairing.write_text(text.replace(old, new, 1))

          gate = Path('.github/workflows/t02-runtime-restart-reconciliation.yml')
          text = gate.read_text()
          old_format = '''          mix format --check-formatted \\
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \\
            test/strangertalks_new/runtime_terminal_contract_test.exs \\
            lib/strangertalks_new/matchmaking/queue_engine/participant_connection_tracker.ex \\
            lib/strangertalks_new_web/participant_channel.ex'''
          new_format = '''          mix format --check-formatted \\
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \\
            test/strangertalks_new/runtime_terminal_contract_test.exs \\
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs \\
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \\
            lib/strangertalks_new/matchmaking/queue_engine/participant_connection_tracker.ex \\
            lib/strangertalks_new_web/participant_channel.ex'''
          if text.count(old_format) != 1:
              raise SystemExit('gate format block did not match exactly once')
          text = text.replace(old_format, new_format, 1)

          old_tests = '''            test/strangertalks_new/runtime_terminal_contract_test.exs \\
            test/strangertalks_new/recovery_restart_test.exs'''
          new_tests = '''            test/strangertalks_new/runtime_terminal_contract_test.exs \\
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs \\
            test/strangertalks_new/recovery_restart_test.exs'''
          if text.count(old_tests) != 1:
              raise SystemExit('gate focused test block did not match exactly once')
          text = text.replace(old_tests, new_tests, 1)

          old_drift = '''          expected="$(printf '%s\\n' \\
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \\
            lib/strangertalks_new/reflections.ex | sort)"

          test "$paths" = "$expected"

          git diff --check
          git checkout -- \\
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \\
            lib/strangertalks_new/reflections.ex'''
          new_drift = '''          expected="lib/strangertalks_new/reflections.ex"

          test "$paths" = "$expected"

          git diff --check
          git checkout -- lib/strangertalks_new/reflections.ex'''
          if text.count(old_drift) != 1:
              raise SystemExit('gate drift block did not match exactly once')
          gate.write_text(text.replace(old_drift, new_drift, 1))
          PY

          mix format \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            test/strangertalks_new/runtime_terminal_contract_test.exs \
            test/strangertalks_new/participant_pairing_reservation_release_cases.exs \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            lib/strangertalks_new/matchmaking/queue_engine/participant_connection_tracker.ex \
            lib/strangertalks_new_web/participant_channel.ex

          rm .github/workflows/t02-runtime-terminal-fix-once.yml
          git diff --check

      - name: Commit exact correction to T02 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(t02): align runtime terminal authority with T01 law"
          git push origin HEAD:team2/runtime-restart-reconciliation
