name: RPR Live Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY_STRANGERTALKS_PRODUCTION_MIGRATIONS
        required: true
        type: string
      expected_main_sha:
        description: Exact canonical main SHA approved for production migration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rpr-live-production-migration
  cancel-in-progress: false

env:
  EXPECTED_PRODUCTION_HEAD: "20260821191324"
  EXPECTED_REPOSITORY_HEAD: "20260913031500"
  EXPECTED_MIGRATIONS_TREE: "2e2c41722f9ed1f1ffa11bce086519f57f7a8ab3"

jobs:
  backup-before-live-migration:
    if: ${{ github.actor == 'manvith244-oss' && github.triggering_actor == 'manvith244-oss' && github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_STRANGERTALKS_PRODUCTION_MIGRATIONS' }}
    uses: ./.github/workflows/postgres-r2-backup.yml
    secrets: inherit

  migrate-production:
    if: ${{ github.actor == 'manvith244-oss' && github.triggering_actor == 'manvith244-oss' && github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY_STRANGERTALKS_PRODUCTION_MIGRATIONS' }}
    needs: backup-before-live-migration
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || vars.SUPABASE_DATABASE_URL }}
      SECRET_KEY_BASE: rpr-migration-only-not-used-for-serving
      PHX_HOST: strangertalks-phoenix.onrender.com

    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail closed unless dispatch authority and repository identity are exact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "manvith244-oss"
          test "$GITHUB_TRIGGERING_ACTOR" = "manvith244-oss"
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "APPLY_STRANGERTALKS_PRODUCTION_MIGRATIONS"
          test "${{ inputs.expected_main_sha }}" = "$GITHUB_SHA"
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          migration_tree="$(git rev-parse HEAD:priv/repo/migrations)"
          test "$migration_tree" = "$EXPECTED_MIGRATIONS_TREE"
          repo_latest=$(find priv/repo/migrations -maxdepth 1 -type f -name '*.exs' -printf '%f\n' | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort | tail -1)
          test "$repo_latest" = "$EXPECTED_REPOSITORY_HEAD"
          test -n "$DATABASE_URL"
          echo "APPROVED_MAIN_SHA=$GITHUB_SHA"
          echo "APPROVED_MIGRATIONS_TREE=$migration_tree"
          echo "APPROVED_MIGRATION_HEAD=$repo_latest"

      - name: Reject database URL TLS overrides before any database connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlsplit

          database_url = os.environ.get("DATABASE_URL", "")
          if not database_url:
              raise SystemExit("DATABASE_URL is required")
          keys = {key.lower() for key, _ in parse_qsl(urlsplit(database_url).query, keep_blank_values=True)}
          forbidden = keys & {"ssl", "sslmode", "sslrootcert", "sslcert", "sslkey", "sslcrl", "sslcrldir"}
          if forbidden:
              raise SystemExit("DATABASE_URL contains forbidden TLS override parameters: " + ", ".join(sorted(forbidden)))
          PY
          echo "production_database_url_tls_overrides=absent"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install PostgreSQL client and BEAM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Configure verified Supabase TLS
        shell: bash
        run: |
          set -euo pipefail
          ca="$GITHUB_WORKSPACE/priv/certs/supabase-prod-ca-2021.crt"
          test -s "$ca"
          actual=$(openssl x509 -in "$ca" -outform der | sha256sum | awk '{print toupper($1)}')
          expected="807025AD50D4ED219D2C9C7D299C004F824EB00CF7F65AFEF607D07B72E6CAFA"
          test "$actual" = "$expected"
          echo "DB_CA_CERT_FILE=$ca" >> "$GITHUB_ENV"
          echo "PGSSLMODE=verify-full" >> "$GITHUB_ENV"
          echo "PGSSLROOTCERT=$ca" >> "$GITHUB_ENV"

      - name: Production preflight — exact head and integrity only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:priv/repo/migrations)" = "$EXPECTED_MIGRATIONS_TREE"
          actual=$(psql "$DATABASE_URL" -Atc 'SELECT max(version) FROM public.schema_migrations')
          test "$actual" = "$EXPECTED_PRODUCTION_HEAD"
          violations=$(psql "$DATABASE_URL" -Atc "SELECT (SELECT count(*) FROM public.matches WHERE participant_a_id = participant_b_id) + (SELECT count(*) FROM public.conversations WHERE participant_a_id = participant_b_id) + (SELECT count(*) FROM public.relationships WHERE participant_a_id = participant_b_id) + (SELECT count(*) FROM public.conversations c JOIN public.matches m ON m.match_id = c.match_id WHERE c.participant_a_id IS DISTINCT FROM m.participant_a_id OR c.participant_b_id IS DISTINCT FROM m.participant_b_id)")
          test "$violations" = "0"
          echo "PRODUCTION_PREFLIGHT_HEAD=$actual"
          echo "PRODUCTION_PREFLIGHT_INTEGRITY_VIOLATIONS=$violations"

      - name: Apply all pending canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:priv/repo/migrations)" = "$EXPECTED_MIGRATIONS_TREE"
          mix ecto.migrate

      - name: Production postflight — exact migration and security state
        shell: bash
        run: |
          set -euo pipefail
          actual=$(psql "$DATABASE_URL" -Atc 'SELECT max(version) FROM public.schema_migrations')
          test "$actual" = "$EXPECTED_REPOSITORY_HEAD"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE app_count integer; bad_rls integer; api_grants integer; role_name text;
          BEGIN
            SELECT count(*) INTO app_count FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relname <> 'schema_migrations';
            IF app_count <> 30 THEN RAISE EXCEPTION 'expected 30 application tables after production migration, got %', app_count; END IF;
            SELECT count(*) INTO bad_rls FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r','p') AND c.relname <> 'schema_migrations' AND NOT c.relrowsecurity;
            IF bad_rls <> 0 THEN RAISE EXCEPTION 'application tables without RLS after production migration: %', bad_rls; END IF;
            FOREACH role_name IN ARRAY ARRAY['anon','authenticated','service_role'] LOOP
              IF has_schema_privilege(role_name, 'public', 'USAGE') OR has_schema_privilege(role_name, 'public', 'CREATE') THEN RAISE EXCEPTION '% retains public schema authority', role_name; END IF;
            END LOOP;
            SELECT count(*) INTO api_grants FROM information_schema.table_privileges WHERE table_schema = 'public' AND grantee IN ('anon','authenticated','service_role');
            IF api_grants <> 0 THEN RAISE EXCEPTION 'Data API table grants remain after production migration: %', api_grants; END IF;
          END
          $$;
          SQL
          echo "PRODUCTION_MIGRATION_HEAD=$actual"
          echo "RPR_PRODUCTION_DATABASE_CLOSURE=PASS"

      - name: Final repository identity proof
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:priv/repo/migrations)" = "$EXPECTED_MIGRATIONS_TREE"
          git diff --check
          test -z "$(git status --porcelain)"
          echo "RPR_PRODUCTION_RUNNER_SHA=$(git rev-parse HEAD)"
