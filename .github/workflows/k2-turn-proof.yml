name: K2 TURN Transport Proof

on:
  push:
    branches:
      - diagnostics/turn-proof-2026-08-29
    paths:
      - .github/workflows/k2-turn-proof.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 2c53f29dbde5d7848b42bfe3d3c44054d01f153f

jobs:
  turn-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact source proof
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install app and browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove baseline TURN listener is absent
        shell: bash
        run: |
          set -euo pipefail
          if ss -lntu | grep -Eq '[:.]3478[[:space:]]'; then
            echo "Unexpected pre-existing listener on TURN port 3478"
            ss -lntu
            exit 1
          fi
          echo "TURN_BASELINE_LISTENER=absent"
      - name: Start real local coturn matching test credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          cat > /tmp/turnserver.conf <<'EOF'
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          fingerprint
          use-auth-secret
          static-auth-secret=team6-test-only-coturn-secret
          realm=strangertalks.test
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          EOF
          sudo turnserver -c /tmp/turnserver.conf > /tmp/k2-coturn.log 2>&1 &
          echo $! > /tmp/k2-coturn.pid
          for attempt in $(seq 1 30); do
            if ss -lun | grep -Eq '[:.]3478[[:space:]]'; then
              echo "TURN_LISTENER=present"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/k2-coturn.log
          exit 1
      - name: Add logging-only ACTIVE and video-state instrumentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("priv/static/assets/app.js")
          app = app_path.read_text()
          needle = "function renderLiveCallState(state) {\n"
          assert app.count(needle) == 1, app.count(needle)
          replacement = '''function renderLiveCallState(state) {
            console.log(`[K2_CALL_STATE] ${JSON.stringify({
              attempt: state?.callAttemptId || null,
              status: state?.status || null,
              selfVideo: Boolean(state?.selfVideo),
              peerVideo: Boolean(state?.peerVideo),
              mediaGeneration: Number.isInteger(state?.mediaGeneration) ? state.mediaGeneration : null
            })}`)
          '''
          app_path.write_text(app.replace(needle, replacement, 1))

          test_path = Path("test/js/browser_e2e_test.mjs")
          text = test_path.read_text()
          old = '''  page.on("console", message => {
    if (message.type() === "error") consoleErrors.push(message.text())
  })
'''
          new = '''  page.on("console", message => {
    const text = message.text()
    if (text.startsWith("[K2_CALL_STATE]")) console.log(text)
    if (message.type() === "error") consoleErrors.push(text)
  })
'''
          assert text.count(old) == 1, text.count(old)
          test_path.write_text(text.replace(old, new, 1))
          PY
      - name: Prepare isolated browser database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start isolated Phoenix runtime
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-turn-phoenix.log 2>&1 &
          echo $! > /tmp/k2-turn-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/k2-turn-phoenix.pid)" 2>/dev/null; then
              cat /tmp/k2-turn-phoenix.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/k2-turn-phoenix.log
          exit 1
      - name: Run unmodified 85 86 87 browser assertions with real TURN
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='Feature 1Q E2E-(RTV|REACTION|RING)' test/js/browser_e2e_test.mjs 2>&1 | tee /tmp/k2-turn-proof.tap
      - name: Build proof report
        if: always()
        shell: bash
        run: |
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "--- ACTIVE/VIDEO STATES ---"
            grep -F '[K2_CALL_STATE]' /tmp/k2-turn-proof.tap || true
            echo "--- ACTIVE COUNT ---"
            grep -F '[K2_CALL_STATE]' /tmp/k2-turn-proof.tap | grep -c '"status":"ACTIVE"' || true
            echo "--- VIDEO COUNT ---"
            grep -F '[K2_CALL_STATE]' /tmp/k2-turn-proof.tap | grep -Ec '"selfVideo":true|"peerVideo":true' || true
            echo "--- TOTALS ---"
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/k2-turn-proof.tap || true
            echo "--- FAILURES ---"
            grep -A40 '^not ok ' /tmp/k2-turn-proof.tap || true
          } | tee /tmp/k2-turn-proof-report.txt
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-turn-browser-proof
          path: |
            /tmp/k2-turn-proof.tap
            /tmp/k2-turn-proof-report.txt
            /tmp/k2-coturn.log
            /tmp/k2-turn-phoenix.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop runtimes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/k2-turn-phoenix.pid ]; then kill "$(cat /tmp/k2-turn-phoenix.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/k2-coturn.pid ]; then sudo kill "$(cat /tmp/k2-coturn.pid)" 2>/dev/null || true; fi
