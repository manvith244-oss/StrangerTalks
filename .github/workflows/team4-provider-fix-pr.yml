name: Team 4 Provider Determinism Executor

on:
  pull_request:
    branches:
      - release/prep-2026-08-22

permissions:
  contents: write

jobs:
  provider-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/media
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Patch provider client loading and prove regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/strangertalks_new/c11_policy.ex')
          s = p.read_text()
          old = '''          if function_exported?(client, :generate_ice_servers, 2),
            do: client.generate_ice_servers(config, ttl),
            else: {:error, :provider_credential_unavailable}
'''
          new = '''          if Code.ensure_loaded?(client) and function_exported?(client, :generate_ice_servers, 2),
            do: client.generate_ice_servers(config, ttl),
            else: {:error, :provider_credential_unavailable}
'''
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('provider dispatch shape changed unexpectedly')
          PY
          mix deps.get
          mix test test/strangertalks_new/c11_policy_test.exs test/strangertalks_new/team6_turn_provider_test.exs test/strangertalks_new/conversation_live_call_test.exs
          mix format --check-formatted lib/strangertalks_new/c11_policy.ex
          git diff --check
          if ! git diff --quiet -- lib/strangertalks_new/c11_policy.ex; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/strangertalks_new/c11_policy.ex
            git commit -m "Team 4: make TURN provider client loading deterministic [team4-provider]"
            git push origin HEAD:newteam/media
          fi
