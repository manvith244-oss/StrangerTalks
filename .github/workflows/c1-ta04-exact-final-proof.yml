name: C1 T-A04 Exact Final Proof

on:
  push:
    branches:
      - evidence/c1-ta04-final-a607858-2026-09-09

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"
      TARGET_SHA: a607858d79f00d7cc3e7d661c848f99482ef272f
    steps:
      - name: Checkout exact final T-A04 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prove exact identity
        run: |
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check durable T-A04 formatting
        run: |
          mix format --check-formatted \
            lib/strangertalks_new/application.ex \
            lib/strangertalks_new/agent_systems/provider_probe.ex \
            test/proofs/provider_probe_boot_isolation.exs

      - name: Real boot isolation failure matrix
        run: mix run --no-start test/proofs/provider_probe_boot_isolation.exs

      - name: Focused provider regressions
        run: |
          mix test \
            test/strangertalks_new/agent_systems_provider_probe_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs

      - name: Deterministic core smoke
        run: |
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/recovery_restart_test.exs

      - name: Full precommit
        run: mix precommit

      - name: Prove exact clean final candidate
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --check
          test -z "$(git status --porcelain)"
          echo "C1_T_A04_FINAL_SHA_PROOF=PASS"
