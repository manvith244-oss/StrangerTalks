name: C5 Post-239 Exact-Head Attack

on:
  push:
    branches:
      - evidence/c5-post239-4f5e45c-2026-09-10

permissions:
  contents: read

jobs:
  post239:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      BASE_SHA: c19cbe2d4c05fc0c5e9f1d2d7286afa7197a9527
      TARGET_SHA: 4f5e45c4a845006e8c3a8ba47d5a649e4dd860a7
      TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

    steps:
      - name: Checkout exact successor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove exact identity and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "test/strangertalks_new_web/channels/participant_multitab_authority_test.exs"
          test "${changed[1]}" = "test/support/participant_multitab_channel_collector.ex"
          test "$(grep -c '^defmodule ' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs)" -eq 1
          test "$(grep -c '^defmodule ' test/support/participant_multitab_channel_collector.ex)" -eq 1
          ! grep -q 'defmodule ChannelCollector' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          grep -q 'start_supervised!' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          grep -q 'for _pass <- 1..2' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          grep -q ':sys.get_state(socket.channel_pid)' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          grep -q ':sys.get_state(collector)' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          ! grep -q 'Process.sleep' test/strangertalks_new_web/channels/participant_multitab_authority_test.exs

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Static repository gates
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix hex.audit

      - name: Focused successor proof
        run: mix test test/strangertalks_new_web/channels/participant_multitab_authority_test.exs --trace

      - name: Deterministic multitab stress seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 11 23 37 51 67 79 97 113; do
            echo "C5 multitab seed=$seed"
            mix test test/strangertalks_new_web/channels/participant_multitab_authority_test.exs --seed "$seed"
          done

      - name: Affected channel and matchmaking proof
        run: |
          mix test \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new_web/channels/participant_match_transition_authority_test.exs \
            test/strangertalks_new/matchmaking_core_authority_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            --trace

      - name: Reset DB before full repository gate
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        run: mix precommit

      - name: Diff clean-tree and exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "C5_POST239_EXACT_HEAD=$TARGET_SHA"
          echo "C5_POST239_EXACT_TREE=$TARGET_TREE"
