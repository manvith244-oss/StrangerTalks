name: Brand Inline Header Fix

on:
  push:
    branches:
      - brand/strangertalks-master-logo-001

permissions:
  contents: write

jobs:
  inline-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brand branch
        uses: actions/checkout@v4
        with:
          ref: brand/strangertalks-master-logo-001
          fetch-depth: 0

      - name: Replace image lockup with inline canonical mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("priv/static/index.html")
          mark_path = Path("priv/static/images/strangertalks-mark-reversed.svg")

          source = index_path.read_text(encoding="utf-8")
          old = '<header class="site-header"><span class="brand"><img src="/images/strangertalks-lockup-reversed.svg" alt="StrangerTalks" width="110" height="28"></span></header>'

          if old not in source:
              print("Legacy image lockup already absent; no index patch needed.")
          else:
              svg = mark_path.read_text(encoding="utf-8")
              inner = svg[svg.index(">") + 1:svg.rindex("</svg>")]
              inner = re.sub(r"\s*<title[^>]*>.*?</title>\s*", "", inner, flags=re.S)
              inner = re.sub(r"\s*<desc[^>]*>.*?</desc>\s*", "", inner, flags=re.S)
              inner = inner.replace('id="st-color"', 'id="st-header-color"')
              inner = inner.replace('url(#st-color)', 'url(#st-header-color)')
              inner = inner.replace('id="st-teal-glow"', 'id="st-header-teal-glow"')
              inner = inner.replace('url(#st-teal-glow)', 'url(#st-header-teal-glow)')

              mark = (
                  '<svg data-brand-mark="strangertalks" viewBox="0 0 96 96" '
                  'width="28" height="28" aria-hidden="true" focusable="false">'
                  + inner.strip()
                  + '</svg><strong>StrangerTalks</strong>'
              )
              replacement = f'<header class="site-header"><span class="brand">{mark}</span></header>'
              source = source.replace(old, replacement, 1)
              index_path.write_text(source, encoding="utf-8")
              print("Replaced exactly one legacy image lockup with the inline canonical mark.")
          PY

      - name: Commit one-shot patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/brand-inline-header-fix.yml
          git add priv/static/index.html
          git diff --cached --check
          git commit -m "fix(brand): inline identity in app shell"
          git push origin HEAD:brand/strangertalks-master-logo-001
