name: Phase 1 Supabase TLS Chain Probe

on:
  push:
    branches:
      - ops/phase1-supabase-ca-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect live Supabase pooler chain with OS trust
        shell: bash
        env:
          SUPABASE_POOLER_HOST: aws-0-ap-southeast-1.pooler.supabase.com
          SUPABASE_POOLER_PORT: '5432'
        run: |
          set -euo pipefail
          echo "phase1_chain_target=${SUPABASE_POOLER_HOST}:${SUPABASE_POOLER_PORT}"
          set +e
          timeout 20 openssl s_client \
            -starttls postgres \
            -connect "${SUPABASE_POOLER_HOST}:${SUPABASE_POOLER_PORT}" \
            -servername "$SUPABASE_POOLER_HOST" \
            -showcerts \
            -verify_return_error \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            </dev/null > /tmp/sclient.txt 2>&1
          rc=$?
          set -e
          echo "phase1_openssl_verify_exit=$rc"
          grep -E '^(depth=|verify return:|verify error:|subject=|issuer=|Verify return code:|New, TLS|Protocol  :|Cipher    :)' /tmp/sclient.txt || true
          awk '/-----BEGIN CERTIFICATE-----/{n++;f=sprintf("/tmp/cert-%02d.pem",n)} n{print > f}' /tmp/sclient.txt
          for cert in /tmp/cert-*.pem; do
            [ -f "$cert" ] || continue
            echo "CERT=$(basename "$cert")"
            openssl x509 -in "$cert" -noout -subject -issuer -serial -fingerprint -sha256 -dates
          done
          if [ "$rc" -eq 0 ] && grep -q 'Verify return code: 0 (ok)' /tmp/sclient.txt; then
            echo "PHASE1_OS_CA_CHAIN_VERIFY=PASS"
          else
            echo "PHASE1_OS_CA_CHAIN_VERIFY=FAIL"
            cat /tmp/sclient.txt
            exit 1
          fi
