name: T08 Future 001 Circle Formation Gate

on:
  workflow_dispatch:
  push:
    branches:
      - t08/future-001-circle-formation-kernel
    paths:
      - "lib/strangertalks_new/future_social/**"
      - "test/strangertalks_new/future_social/**"
      - ".github/workflows/t08-future-001-circle-formation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/strangertalks_new/future_social/**"
      - "test/strangertalks_new/future_social/**"
      - ".github/workflows/t08-future-001-circle-formation.yml"

permissions:
  contents: read
  statuses: write

jobs:
  closure:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact T08 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Prove checkout identity
        id: identity
        shell: bash
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$checked_out_sha"
          test "$checked_out_sha" = "$EXPECTED_SHA"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check T08 formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mix format --check-formatted \
            lib/strangertalks_new/future_social/circle_formation.ex \
            test/strangertalks_new/future_social/circle_formation_test.exs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Focused T08 Circle formation contract
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test test/strangertalks_new/future_social/circle_formation_test.exs \
            2>&1 | tee /tmp/t08-future-001-focused.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t08-future-001-focused.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Existing one-to-one matching smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test test/strangertalks_new/matchmaking_engine_test.exs \
            2>&1 | tee /tmp/t08-future-001-smoke.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t08-future-001-smoke.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Full Elixir precommit
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix precommit 2>&1 | tee /tmp/t08-future-001-precommit.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t08-future-001-precommit.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Git diff check
        id: diffcheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git diff --check
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Prove precommit left T08 packet paths unchanged
        id: clean
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git diff --exit-code -- \
            lib/strangertalks_new/future_social \
            test/strangertalks_new/future_social \
            .github/workflows/t08-future-001-circle-formation.yml
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Report unrelated formatter drift
        if: always()
        shell: bash
        run: |
          git status --porcelain
          echo "The focused formatting and clean-path gates above own T08 packet formatting."
          echo "Any other formatter-only drift is existing repository debt and is not rewritten by this packet."

      - name: Fail gate if any required execution failed
        if: always()
        shell: bash
        env:
          CHECKED_OUT_SHA: ${{ steps.identity.outputs.checked_out_sha }}
          FORMAT_EXIT: ${{ steps.format.outputs.exit_code }}
          FOCUSED_EXIT: ${{ steps.focused.outputs.exit_code }}
          SMOKE_EXIT: ${{ steps.smoke.outputs.exit_code }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          DIFF_EXIT: ${{ steps.diffcheck.outputs.exit_code }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
          test "$FORMAT_EXIT" = "0"
          test "$FOCUSED_EXIT" = "0"
          test "$SMOKE_EXIT" = "0"
          test "$FULL_EXIT" = "0"
          test "$DIFF_EXIT" = "0"
          test "$CLEAN_EXIT" = "0"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$CHECKED_OUT_SHA"
          echo "TESTED_SHA=$CHECKED_OUT_SHA"
