name: K2 Coturn Browser Sanity

on:
  push:
    branches:
      - fix/k2-coturn-signal-integration-2026-08-29
    paths:
      - .github/workflows/k2-coturn-browser-sanity.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 1616f6467a5d1444751354fe9842ff5a07445897

jobs:
  browser-sanity:
    name: TURN-present ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [f04-cleanup, f04-hostile, f11-hostile, f11-corrupt-identity, conversation-reliability]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Start configured coturn
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(ss -lntu | awk '$5 ~ /:3478$/ {print}')"
          sudo apt-get install -y coturn
          sudo systemctl stop coturn 2>/dev/null || true
          sudo pkill -x turnserver 2>/dev/null || true
          cat > /tmp/k2-turnserver.conf <<'EOF'
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          fingerprint
          use-auth-secret
          static-auth-secret=team6-test-only-coturn-secret
          realm=strangertalks.test
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          EOF
          sudo turnserver -c /tmp/k2-turnserver.conf > /tmp/k2-coturn.log 2>&1 &
          echo $! > /tmp/k2-coturn.pid
          for attempt in $(seq 1 30); do
            if sudo ss -lunp | grep ':3478' | grep -Fq turnserver; then
              echo "TURN_SANITY_LISTENER=ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/k2-coturn.log
          exit 1
      - name: Prepare database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix and record readiness
        shell: bash
        run: |
          set -euo pipefail
          start_ms="$(date +%s%3N)"
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-sanity-${{ matrix.group }}.log 2>&1 &
          echo $! > /tmp/k2-sanity-${{ matrix.group }}.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then
              ready_ms="$(date +%s%3N)"
              echo "PHOENIX_READY_MS=$((ready_ms - start_ms))"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/k2-sanity-${{ matrix.group }}.pid)" 2>/dev/null; then
              cat /tmp/k2-sanity-${{ matrix.group }}.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/k2-sanity-${{ matrix.group }}.log
          exit 1
      - name: Run browser authority
        shell: bash
        run: |
          set -o pipefail
          case "${{ matrix.group }}" in
            f04-cleanup) node --test --test-concurrency=1 test/js/f04_conversation_runtime_cleanup_browser_test.mjs ;;
            f04-hostile) node --test --test-concurrency=1 test/js/f04_conversation_runtime_hostile_browser_test.mjs ;;
            f11-hostile) node --test --test-concurrency=1 test/js/f11_browser_hostile_test.mjs ;;
            f11-corrupt-identity) node --test --test-concurrency=1 test/js/f11_browser_corrupt_identity_test.mjs ;;
            conversation-reliability) node --test --test-concurrency=1 test/js/conversation_reliability_browser_test.mjs ;;
            *) exit 1 ;;
          esac
      - name: Stop runtimes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/k2-sanity-${{ matrix.group }}.pid ]; then kill "$(cat /tmp/k2-sanity-${{ matrix.group }}.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/k2-coturn.pid ]; then sudo kill "$(cat /tmp/k2-coturn.pid)" 2>/dev/null || true; fi
          sudo pkill -x turnserver 2>/dev/null || true
