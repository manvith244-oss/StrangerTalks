name: Team 3 A03 Canonical Review Proof

on:
  push:
    branches:
      - team3/a03-canonical-review-fix-002
  workflow_dispatch:

concurrency:
  group: team3-a03-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a03:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact Team 3 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM3_COMMIT=${{ github.sha }}"
          echo "ACTUAL_TEAM3_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Focused A03 canonical review input proof
        run: mix test test/strangertalks_new/a03_canonical_review_input_test.exs

      - name: Existing SafetyReview transition regressions
        run: mix test test/strangertalks_new/relationship_consent_safety_review_test.exs

      - name: Safety media capacity and oversize regressions
        run: mix test test/strangertalks_new/view_once_safety_report_test.exs

      - name: Deterministic Safety hostile regressions
        run: mix test test/strangertalks_new/team4_safety_boundary_test.exs

      - name: Safety media participant-access privacy regression
        run: mix test test/strangertalks_new_web/safety_media_access_privacy_test.exs

      - name: Shared Agent provider regressions
        run: |
          mix test \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs

      - name: Branch formatting and diff hygiene
        run: |
          mix format --check-formatted
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Full precommit
        run: mix precommit

      - name: Prove clean checkout after validation
        if: ${{ always() }}
        run: |
          git diff --check
          git status --short --branch
          git status --porcelain

      - name: Record exact Team 3 commit
        if: ${{ always() }}
        run: echo "TEAM3_A03_TESTED_COMMIT=$(git rev-parse HEAD)"
