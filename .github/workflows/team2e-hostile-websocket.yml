name: Team 2E Authenticated WebSocket Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/team2e-hostile-websocket.yml"
      - "test/js/hangouts_hostile_wss_test.mjs"
      - "test/js/hangouts_stale_wss_test.mjs"
      - "test/strangertalks_new_web/abuse_source_team2e_test.exs"
      - "lib/strangertalks_new_web/hangout_channel.ex"
      - "lib/strangertalks_new_web/hangout_lobby_channel.ex"
      - "lib/strangertalks_new/hangouts/beta_gate.ex"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team2e-hostile-websocket-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  disabled-real-wss:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://127.0.0.1:4002
      PGPASSWORD: strangertalks_test
      STRANGERTALKS_TEAM2E_FIXTURE_PATH: /tmp/team2e-wss-fixtures.json
      STRANGERTALKS_TEAM2E_STALE_FIXTURE_PATH: /tmp/team2e-stale-fixture.json
      STRANGERTALKS_TEAM2E_DISABLE_TRIGGER: /tmp/team2e-disable.trigger
      STRANGERTALKS_TEAM2E_DISABLE_ACK: /tmp/team2e-disable.ack

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact checkout
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "TEAM2E_EXPECTED_SHA=$expected"
          echo "TEAM2E_ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and prepare disposable DB
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Isolated forwarded identity trust-boundary tests
        run: mix test test/strangertalks_new_web/abuse_source_team2e_test.exs

      - name: Check hostile protocol test syntax
        run: node --check test/js/hangouts_hostile_wss_test.mjs

      - name: Test authenticated WebSocket with disabled gate variants
        shell: bash
        run: |
          set -euo pipefail
          # Local ephemeral CI Postgres only; no provider services accessed.
          get_hangout_count() {
            psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -At -c "SELECT (SELECT count(*) FROM hangout_rooms) + (SELECT count(*) FROM hangout_messages) + (SELECT count(*) FROM hangout_reports)"
          }
          for gate in unset empty false malformed other; do
            echo "TEAM2E_GATE_CASE=$gate"
            count_before="$(get_hangout_count)"
            STRANGERTALKS_TEAM2E_GATE="$gate" mix run --no-start -e '
              repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
              Application.put_env(:strangertalks_new, StrangertalksNew.Repo,
                repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
              endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
              Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint,
                Keyword.put(endpoint, :server, true))
              gate_value =
                case System.fetch_env!("STRANGERTALKS_TEAM2E_GATE") do
                  "unset" -> :unset
                  "empty" -> ""
                  "false" -> false
                  "malformed" -> "true "
                  "other" -> "TRUE"
                end
              if gate_value == :unset do
                Application.delete_env(:strangertalks_new, :hangouts_public_beta_enabled)
              else
                Application.put_env(:strangertalks_new, :hangouts_public_beta_enabled, gate_value)
              end
              {:ok, _apps} = Application.ensure_all_started(:strangertalks_new)
              Process.sleep(:infinity)
            ' > "/tmp/team2e-$gate.log" 2>&1 &
            server_pid="$!"
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            ready=0
            for attempt in $(seq 1 45); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "Server exited early for gate=$gate"
                tail -n 80 "/tmp/team2e-$gate.log"
                exit 1
              fi
              if curl -fsS http://127.0.0.1:4002/ >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Local server startup failed for gate=$gate"
              tail -n 80 "/tmp/team2e-$gate.log"
              exit 1
            fi
            STRANGERTALKS_TEAM2E_GATE="$gate" node test/js/hangouts_hostile_wss_test.mjs
            count_after="$(get_hangout_count)"
            echo "TEAM2E_DURABLE_HANGOUT_ROW_COUNT_BEFORE=$count_before AFTER=$count_after"
            test "$count_after" = "$count_before"
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            trap - EXIT
            sleep 1
          done

      - name: Compile-check stale WebSocket protocol test
        run: node --check test/js/hangouts_stale_wss_test.mjs

      - name: Hostile stale-client WebSocket safety proof in disposable room
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$STRANGERTALKS_TEAM2E_STALE_FIXTURE_PATH" "$STRANGERTALKS_TEAM2E_DISABLE_TRIGGER" "$STRANGERTALKS_TEAM2E_DISABLE_ACK"
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo,
              repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint, :server, true))
            Application.put_env(:strangertalks_new, :hangouts_public_beta_enabled, true)
            {:ok, _apps} = Application.ensure_all_started(:strangertalks_new)
            members =
              Enum.map(1..4, fn _ ->
                {:ok, participant} = StrangertalksNew.Participants.create_participant(%{})
                %{participant_id: participant.participant_id,
                  token: StrangertalksNewWeb.ParticipantToken.sign(participant.participant_id)}
              end)
            ids = members |> Enum.take(3) |> Enum.map(& &1.participant_id)
            {:ok, %{room: room}} =
              StrangertalksNew.Hangouts.create_formed_room(ids, %{
                language_tag: "en", experiment_arm: :GROUP_WITH_CONTENT,
                minimum_size: 3, target_size: 4, max_size: 6
              })
            {:ok, _room_server} = StrangertalksNew.Hangouts.RoomServer.ensure_started(room.room_id)
            File.write!(System.fetch_env!("STRANGERTALKS_TEAM2E_STALE_FIXTURE_PATH"),
              Jason.encode!(%{room_id: room.room_id, members: members}))
            watch = fn watch ->
              if File.exists?(System.fetch_env!("STRANGERTALKS_TEAM2E_DISABLE_TRIGGER")) do
                Application.put_env(:strangertalks_new, :hangouts_public_beta_enabled, false)
                File.write!(System.fetch_env!("STRANGERTALKS_TEAM2E_DISABLE_ACK"), "off")
              else
                Process.sleep(40)
                watch.(watch)
              end
            end
            spawn(fn -> watch.(watch) end)
            Process.sleep(:infinity)
          ' > /tmp/team2e-stale-server.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Stale-client fixture server exited early"
              tail -n 80 /tmp/team2e-stale-server.log
              exit 1
            fi
            if [ -s "$STRANGERTALKS_TEAM2E_STALE_FIXTURE_PATH" ] && curl -fsS http://127.0.0.1:4002/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { tail -n 80 /tmp/team2e-stale-server.log; exit 1; }
          node test/js/hangouts_stale_wss_test.mjs
          # Exactly one synthetic pre-disable ordinary message and one authorized report must remain.
          messages=$(psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -At -c "SELECT count(*) FROM hangout_messages")
          reports=$(psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -At -c "SELECT count(*) FROM hangout_reports")
          echo "TEAM2E_STALE_HISTORICAL_MESSAGES=$messages AUTHORIZED_REPORTS=$reports"
          test "$messages" = "1"
          test "$reports" = "1"
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Preserve server failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team2e-server-logs
          path: /tmp/team2e-*.log
          retention-days: 3

      - name: Confirm checkout unchanged
        if: success()
        run: |
          git diff --exit-code -- .
          echo "TEAM2E_VALIDATED_SHA=$(git rev-parse HEAD)"
