name: T02 RST Focused Regression A-B

on:
  push:
    branches:
      - team2/runtime-restart-focused-regression-ab
  workflow_dispatch:

concurrency:
  group: t02-rst-focused-regression-ab-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-ab:
    name: ${{ matrix.mode }}-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [control, experiment]
        case:
          - runtime_restart_reconciliation
          - runtime_terminal_contract
          - fx07_canonical_terminal_truth
          - team3_recovery_coordination
          - team4_safety_boundary
          - combined

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      T02_SOURCE_CANDIDATE: e3e86c736ca6ef911bd0023c4877ac68642a48b9
      T02_MODE: ${{ matrix.mode }}
      T02_CASE: ${{ matrix.case }}

    steps:
      - name: Checkout exact frozen source candidate
        uses: actions/checkout@v4
        with:
          ref: e3e86c736ca6ef911bd0023c4877ac68642a48b9
          fetch-depth: 0

      - name: Prove exact control source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "SOURCE_CANDIDATE=$T02_SOURCE_CANDIDATE"
          echo "CHECKED_OUT=$actual"
          test "$actual" = "$T02_SOURCE_CANDIDATE"
          test -z "$(git status --porcelain)"

      - name: Apply V2 single-authority fix ephemerally
        if: matrix.mode == 'experiment'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()
          old = "{__MODULE__, %{conversation_id: conversation_id}}\n             ) do"
          new = "Supervisor.child_spec(\n                 {__MODULE__, %{conversation_id: conversation_id}},\n                 restart: :temporary\n               )\n             ) do"
          if old not in text:
              raise SystemExit("ensure_started child-spec anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Prove control remains unmodified
        if: matrix.mode == 'control'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --exit-code -- .

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile runtime
        run: mix compile --warnings-as-errors

      - name: Run isolated focused contract
        shell: bash
        run: |
          set -euo pipefail
          case "$T02_CASE" in
            runtime_restart_reconciliation)
              tests=(test/strangertalks_new/runtime_restart_reconciliation_test.exs)
              ;;
            runtime_terminal_contract)
              tests=(test/strangertalks_new/runtime_terminal_contract_test.exs)
              ;;
            fx07_canonical_terminal_truth)
              tests=(test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs)
              ;;
            team3_recovery_coordination)
              tests=(test/strangertalks_new/team3_recovery_coordination_test.exs)
              ;;
            team4_safety_boundary)
              tests=(test/strangertalks_new/team4_safety_boundary_test.exs)
              ;;
            combined)
              tests=(
                test/strangertalks_new/runtime_restart_reconciliation_test.exs
                test/strangertalks_new/runtime_terminal_contract_test.exs
                test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs
                test/strangertalks_new/team3_recovery_coordination_test.exs
                test/strangertalks_new/team4_safety_boundary_test.exs
              )
              ;;
            *)
              echo "unknown T02_CASE=$T02_CASE" >&2
              exit 2
              ;;
          esac

          echo "T02_AB_MODE=$T02_MODE"
          echo "T02_AB_CASE=$T02_CASE"
          printf 'T02_AB_TEST=%s\n' "${tests[@]}"
          echo "T02_AB_SEED=0"

          set +e
          mix test "${tests[@]}" --seed 0 > /tmp/t02-focused-result.log 2>&1
          status=$?
          set -e

          echo "T02_AB_EXIT=$status"
          echo "----- T02 FOCUSED RESULT TAIL -----"
          tail -n 180 /tmp/t02-focused-result.log
          echo "----- END T02 FOCUSED RESULT TAIL -----"
          exit "$status"
