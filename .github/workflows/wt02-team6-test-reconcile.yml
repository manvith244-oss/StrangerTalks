name: WT-02 Team 6 Test Reconcile

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Reconcile superseded lifecycle-gate assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("test/strangertalks_new/conversation_delivery_test.exs")
          text = path.read_text()
          pattern = r"(assert \{:error, ):conversation_terminating(\} =\n\s+ConversationServer\.acknowledge_message\()"
          text, count = re.subn(pattern, r"\1:unknown_message\2", text, count=1)
          assert count == 1, f"expected one stale terminal ACK assertion, found {count}"
          path.write_text(text)
          PY
          git diff --check
          git diff -- test/strangertalks_new/conversation_delivery_test.exs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/strangertalks_new/conversation_delivery_test.exs
          git commit -m "test: reconcile terminal ACK regression with evidence law"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair
