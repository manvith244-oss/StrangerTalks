name: Agent Systems Remediation Gate

on:
  push:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

jobs:
  remediation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Focused deterministic-authority regressions
        run: >-
          mix test
          test/strangertalks_new/agent_systems_remediation_test.exs
          test/strangertalks_new/matchmaking_engine_test.exs
          test/strangertalks_new/recovery_restart_test.exs
          test/strangertalks_new/conversation_icebreaker_test.exs

      - name: Focused Conversation Start and authorship browser logic
        run: node --test test/js/icebreakers_test.mjs test/js/prompt_cards_test.mjs

      - name: Full Elixir precommit
        run: mix precommit

      - name: Prove precommit left checkout unchanged
        run: |
          git status --short
          git diff --exit-code

      - name: Record tested commit
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current)"
