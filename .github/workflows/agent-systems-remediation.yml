name: T04 AIREVIEW 001 Hostile Proof

on:
  push:
    branches:
      - team4/aireview-001-hostile-proof

permissions:
  contents: read

jobs:
  hostile-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      T07_REVIEWED_SHA: 492fae85c54d91f9c88d0574900aef3479e0a2fe

    steps:
      - name: Checkout diagnostic child of exact T07 candidate
        uses: actions/checkout@v4

      - name: Prove diagnostic parent is exact frozen T07 candidate
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD~2)
          test "$parent" = "$T07_REVIEWED_SHA"
          echo "T07_REVIEWED_SHA=$parent"
          git diff --name-only "$T07_REVIEWED_SHA"..HEAD

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run single hostile privacy proof
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/t04_aireview_001_hostile_proof_test.exs --trace
