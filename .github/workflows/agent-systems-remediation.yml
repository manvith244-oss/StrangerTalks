name: Agent Systems Remediation Gate

on:
  push:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  remediation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Focused deterministic-authority regressions
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/agent_systems_remediation_test.exs \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            test/strangertalks_new/conversation_icebreaker_test.exs \
            2>&1 | tee /tmp/focused.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/focused.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Focused Conversation Start and authorship browser logic
        id: js
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          node --test test/js/icebreakers_test.mjs test/js/prompt_cards_test.mjs 2>&1 | tee /tmp/js.log
          code=${PIPESTATUS[0]}
          tests=$(awk '/^# tests / {print $3}' /tmp/js.log | tail -1)
          pass=$(awk '/^# pass / {print $3}' /tmp/js.log | tail -1)
          fail=$(awk '/^# fail / {print $3}' /tmp/js.log | tail -1)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=tests ${tests:-?}, pass ${pass:-?}, fail ${fail:-?}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Full Elixir precommit
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix precommit 2>&1 | tee /tmp/precommit.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/precommit.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Prove precommit left checkout unchanged
        id: clean
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=$(git status --porcelain)
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            echo "--- precommit diff begin ---"
            git diff --no-ext-diff -- .
            echo "--- precommit diff end ---"
            code=1
          else
            code=0
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish exact-SHA remediation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_EXIT: ${{ steps.focused.outputs.exit_code }}
          FOCUSED_SUMMARY: ${{ steps.focused.outputs.summary }}
          JS_EXIT: ${{ steps.js.outputs.exit_code }}
          JS_SUMMARY: ${{ steps.js.outputs.summary }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          FULL_SUMMARY: ${{ steps.full.outputs.summary }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          state=success
          for value in "$FOCUSED_EXIT" "$JS_EXIT" "$FULL_EXIT" "$CLEAN_EXIT"; do
            if [ "$value" != "0" ]; then state=failure; fi
          done

          description="focused ${FOCUSED_SUMMARY:-missing}; js ${JS_SUMMARY:-missing}; full ${FULL_SUMMARY:-missing}; clean ${CLEAN_EXIT:-missing}"
          description=$(printf '%s' "$description" | cut -c1-140)

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="agent-systems-remediation" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail gate if any required execution failed
        if: always()
        shell: bash
        env:
          FOCUSED_EXIT: ${{ steps.focused.outputs.exit_code }}
          JS_EXIT: ${{ steps.js.outputs.exit_code }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          test "$FOCUSED_EXIT" = "0"
          test "$JS_EXIT" = "0"
          test "$FULL_EXIT" = "0"
          test "$CLEAN_EXIT" = "0"
          echo "TESTED_COMMIT=$GITHUB_SHA"
