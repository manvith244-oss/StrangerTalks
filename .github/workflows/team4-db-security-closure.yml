name: T04 Supabase Public Schema Security Closure

on:
  push:
    branches:
      - team4/dbsec-003-schema-metadata-privilege-closure
  workflow_dispatch:

concurrency:
  group: t04-db-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  t04-db-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      PGPASSWORD: strangertalks_test
      T04_DBSEC_PARENT: 2a8f6cc18ce77d5aa41bbd074ef3cf25fe861fac

    steps:
      - name: Checkout exact T04 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact identity and forward lineage
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_T04_DBSEC_COMMIT=$expected"
          echo "ACTUAL_T04_DBSEC_COMMIT=$actual"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$T04_DBSEC_PARENT" HEAD
          test "$(git rev-parse "$T04_DBSEC_PARENT^{tree}")" = "bcb76c49dc0afc43701169f6bdf0d0469d27caf7"
          git diff --name-only "$T04_DBSEC_PARENT"..HEAD

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies and compile before migration lock window
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Simulate existing Supabase Data API roles and permissive defaults
        run: |
          set -euo pipefail
          psql -h localhost -U strangertalks_local -d strangertalks_new_test <<'SQL'
          DO $$ BEGIN
            CREATE ROLE anon NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          DO $$ BEGIN
            CREATE ROLE authenticated NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          DO $$ BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;

          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          SQL
          psql -h localhost -U strangertalks_local -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE strangertalks_new_test SET lock_timeout = '5s'"

      - name: Prepare fresh database through exact repository migrations
        run: |
          set -euo pipefail
          timeout --signal=TERM 90s mix ecto.migrate --quiet
          mix ecto.migrate --quiet

      - name: Direct hostile Data API role proofs
        run: |
          set -euo pipefail
          deny_sql() {
            local role="$1"
            local sql="$2"
            if psql -h localhost -U strangertalks_local -d strangertalks_new_test \
              -v ON_ERROR_STOP=1 -c "SET ROLE ${role}; ${sql}" >/tmp/t04-role.out 2>&1; then
              cat /tmp/t04-role.out
              echo "unexpected database authority for role=${role}: ${sql}"
              exit 1
            fi
          }

          for role in anon authenticated; do
            deny_sql "$role" "SELECT * FROM public.schema_migrations LIMIT 1"
            deny_sql "$role" "DELETE FROM public.schema_migrations WHERE false"
            deny_sql "$role" "ALTER TABLE public.schema_migrations ADD COLUMN t04_forbidden_probe integer"

            for table in participants matches conversations reports boundary_blocks; do
              deny_sql "$role" "SELECT * FROM public.${table} LIMIT 1"
              deny_sql "$role" "DELETE FROM public.${table} WHERE false"
            done
          done

      - name: T04 public-schema and metadata security proofs
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/team4_db_security_closure_test.exs

      - name: Representative Phoenix database regressions
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/matching_test.exs \
            test/strangertalks_new/conversation_test.exs \
            test/strangertalks_new/report_test.exs

      - name: Existing Report Block and safety authority regressions
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/security_adversarial_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new/matching_rules_test.exs \
            test/strangertalks_new/relationship_consent_safety_review_test.exs

      - name: T04-owned format and diff hygiene
        run: |
          set -euo pipefail
          mix format --check-formatted \
            test/strangertalks_new/team4_db_security_closure_test.exs \
            priv/repo/migrations/20260903144000_secure_supabase_public_schema.exs
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Full precommit with inherited format drift isolated
        run: |
          set -euo pipefail
          mix precommit
          git diff --check
          git restore -- \
            lib/strangertalks_new/reflections.ex \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          test -z "$(git status --porcelain)"

      - name: Prove final checkout clean
        if: ${{ always() }}
        run: |
          git status --short --branch
          git status --porcelain | tee /tmp/t04-dbsec-status
          test ! -s /tmp/t04-dbsec-status

      - name: Record exact tested commit
        if: ${{ always() }}
        run: echo "T04_DBSEC_TESTED_COMMIT=$(git rev-parse HEAD)"
