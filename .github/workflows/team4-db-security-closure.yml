name: T04 Supabase Public Schema Security Closure

on:
  push:
    branches:
      - team4/supabase-rls-security-closure
  workflow_dispatch:

concurrency:
  group: t04-db-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  t04-db-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      PGPASSWORD: strangertalks_test

    steps:
      - name: Checkout exact T04 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_T04_DBSEC_COMMIT=$expected"
          echo "ACTUAL_T04_DBSEC_COMMIT=$actual"
          test "$actual" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Simulate existing Supabase Data API roles and permissive defaults
        run: |
          set -euo pipefail
          psql -h localhost -U strangertalks_local -d strangertalks_new_test <<'SQL'
          DO $$ BEGIN
            CREATE ROLE anon NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          DO $$ BEGIN
            CREATE ROLE authenticated NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          DO $$ BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;

          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE strangertalks_local IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO anon, authenticated, service_role;
          SQL

      - name: Prepare database through exact repository migrations
        run: |
          set -euo pipefail
          mix ecto.migrate --quiet

      - name: T04 public-schema security proofs
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/team4_db_security_closure_test.exs

      - name: Existing safety and persistence regressions
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/security_adversarial_test.exs \
            test/strangertalks_new/reports_test.exs \
            test/strangertalks_new/matching_rules_test.exs \
            test/strangertalks_new/relationship_consent_safety_review_test.exs

      - name: T04-owned format and diff hygiene
        run: |
          set -euo pipefail
          mix format --check-formatted \
            test/strangertalks_new/team4_db_security_closure_test.exs \
            priv/repo/migrations/20260903144000_secure_supabase_public_schema.exs
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Full precommit with inherited format drift isolated
        run: |
          set -euo pipefail
          mix precommit
          git diff --check
          git restore -- \
            lib/strangertalks_new/reflections.ex \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          test -z "$(git status --porcelain)"

      - name: Prove final checkout clean
        if: ${{ always() }}
        run: |
          git status --short --branch
          git status --porcelain | tee /tmp/t04-dbsec-status
          test ! -s /tmp/t04-dbsec-status

      - name: Record exact tested commit
        if: ${{ always() }}
        run: echo "T04_DBSEC_TESTED_COMMIT=$(git rev-parse HEAD)"
