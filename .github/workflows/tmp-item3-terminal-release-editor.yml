name: Temporary Item 3 Source Editor

on:
  push:
    branches:
      - tmp/item3-terminal-release-editor

permissions:
  contents: write

jobs:
  edit-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: feat/participant-pairing-reservation-2026-08-30
          fetch-depth: 0

      - name: Verify target SHA and apply narrow source edit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7cc0e437f2688950e34da9a4e7630c01ee9c9352"
          echo '' | base64 --decode > "$RUNNER_TEMP/item3_patch.py"
          python3 "$RUNNER_TEMP/item3_patch.py"
          git diff --check
          test -z "$(git diff --name-only -- lib/strangertalks_new/conversation_lifecycle/transitions.ex)"

      - name: Commit and push production change only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          test "$(git diff --cached --name-only)" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
          git commit -m "feat: release pairing reservations at terminal commit"
          git push origin HEAD:feat/participant-pairing-reservation-2026-08-30
