name: K2 End Menu Stacking Fix Proof

on:
  push:
    branches:
      - fix/end-menu-stacking-2026-08-29
    paths:
      - .github/workflows/k2-end-menu-stacking-fix-proof.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 03b50ea8a53ef31e4de505d75be19681f1a19ee9

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y coturn
      - name: Start configured coturn
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop coturn 2>/dev/null || true
          sudo pkill -x turnserver 2>/dev/null || true
          cat > /tmp/turnserver.conf <<'EOF'
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          fingerprint
          use-auth-secret
          static-auth-secret=team6-test-only-coturn-secret
          realm=strangertalks.test
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          EOF
          sudo turnserver -c /tmp/turnserver.conf >/tmp/k2-coturn.log 2>&1 &
          echo $! >/tmp/k2-coturn.pid
          for attempt in $(seq 1 30); do
            if sudo ss -lunp | grep ':3478' | grep -Fq turnserver; then exit 0; fi
            sleep 1
          done
          cat /tmp/k2-coturn.log
          exit 1
      - name: Add hit-target assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/js/browser_e2e_test.mjs')
          text = p.read_text()
          old = '  if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()\n  await page.locator("#end-conversation").click()\n'
          new = '''  if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()
            const endHitTarget = await page.locator("#end-conversation").evaluate((button) => {
              const rect = button.getBoundingClientRect()
              const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2)
              return {hitId: hit?.id || null, headerZ: getComputedStyle(button.closest(".conversation-head")).zIndex}
            })
            assert.equal(endHitTarget.hitId, "end-conversation")
            assert.equal(Number(endHitTarget.headerZ) > 80, true)
            await page.locator("#end-conversation").click()
'''
          if text.count(old) != 1:
            raise SystemExit(f'expected one end click path, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Prepare database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/k2-end-menu-proof-phoenix.log 2>&1 &
          echo $! >/tmp/k2-end-menu-proof-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/k2-end-menu-proof-phoenix.pid)" 2>/dev/null; then cat /tmp/k2-end-menu-proof-phoenix.log; exit 1; fi
            sleep 1
          done
          cat /tmp/k2-end-menu-proof-phoenix.log
          exit 1
      - name: Run #83 authority
        shell: bash
        run: node --test --test-concurrency=1 --test-name-pattern='Feature 1Q E2E-3: Conversation ended causes immediate call teardown' test/js/browser_e2e_test.mjs
      - name: Stop runtimes
        if: always()
        run: |
          if [ -f /tmp/k2-end-menu-proof-phoenix.pid ]; then kill "$(cat /tmp/k2-end-menu-proof-phoenix.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/k2-coturn.pid ]; then sudo kill "$(cat /tmp/k2-coturn.pid)" 2>/dev/null || true; fi
          sudo pkill -x turnserver 2>/dev/null || true
