name: Team 4 Dependency Refresh Probe

on:
  pull_request:
    branches:
      - release/prep-2026-08-22

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Refresh patched dependencies
        run: mix deps.update bandit postgrex
      - name: Fetch complete refreshed dependency set
        run: mix deps.get
      - name: Audit refreshed dependencies
        run: mix hex.audit
      - name: Commit exact refreshed lockfile
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- mix.lock; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.lock
          git commit -m "Patch vulnerable Bandit and Postgrex"
          git push origin HEAD:"${HEAD_REF}"
