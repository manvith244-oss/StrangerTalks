name: C1 COMPLETED Startup Authority Patch

on:
  push:
    branches:
      - convergence/c1-completed-startup-authority-2026-09-10
    paths:
      - ".github/workflows/c1-completed-startup-authority-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@v4
        with:
          ref: convergence/c1-completed-startup-authority-2026-09-10
          fetch-depth: 0

      - name: Replace only the escaped startup authority
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          source = path.read_text()
          old = "when status in [:ENDED, :ABANDONED, :FAILED, :COMPLETED] ->"
          new = "when status in @release_terminal_statuses ->"

          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy startup authority, found {count}")

          path.write_text(source.replace(old, new, 1))

      - name: Prove bounded patch
        run: |
          test "$(git diff --name-only)" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Commit bounded production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: unify ConversationServer startup terminal authority"
          git push origin HEAD:convergence/c1-completed-startup-authority-2026-09-10
