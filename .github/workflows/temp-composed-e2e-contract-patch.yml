name: TEMP composed E2E contract patch

on:
  push:
    branches:
      - fix/composed-e2e-ui-contract-2026-08-29

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply narrow composed-E2E contract migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("test/js/browser_e2e_test.mjs")
          text = path.read_text()

          def replace_exact(old, new, expected=1, label="replacement"):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {count}")
              text = text.replace(old, new)

          # PR #5 browser contract helpers: More message options -> open tray;
          # Conversation info summary -> open info menu.
          marker = '''function exactMessage(page, text) {
            return page.locator("#messages li span").filter({hasText: text})
          }

          async function sendMessage(page, text) {'''
          helpers = '''function exactMessage(page, text) {
            return page.locator("#messages li span").filter({hasText: text})
          }

          async function openMessageTools(page) {
            const form = page.locator('section[data-screen="conversation"].active #message-form')
            if (!(await form.evaluate(node => node.classList.contains("ig-tray-open")))) {
              await page.locator(".ig-compose-plus").click()
            }
            await page.waitForFunction(() => document.querySelector("#message-form")?.classList.contains("ig-tray-open"))
            await page.locator("#ig-message-tools").waitFor({state: "visible"})
          }

          async function openConversationInfo(page) {
            const info = page.locator(".conversation-head-actions .overflow")
            if ((await info.getAttribute("open")) === null) await info.locator("summary").click()
            await page.waitForFunction(() => document.querySelector(".conversation-head-actions .overflow")?.open === true)
            await info.locator(".overflow-menu").waitFor({state: "visible"})
          }

          async function sendMessage(page, text) {'''
          replace_exact(marker, helpers, label="insert PR5 interaction helpers")

          # Cluster 1 + latent direct ordinary Sends: use the already-proven selector
          # from bd562c55253f99c2ff2c95e22058e2cdc86831e1 everywhere in this file.
          old_send = 'locator("#message-form button.primary").click()'
          new_send = 'locator(\'section[data-screen="conversation"].active #message-form\').getByRole("button", {name: "Send message"}).click()'
          replace_exact(old_send, new_send, expected=4, label="accessible-name Send selector")

          # Expressive media now lives behind PR #5's message-tools tray.
          old = '    await pair.a.page.locator("#expressive-open").click()'
          new = '    await openMessageTools(pair.a.page)\n    await pair.a.page.locator("#expressive-open").click()'
          replace_exact(old, new, expected=4, label="expressive tray clicks")
          old = '    await pair.a.page.locator("#expressive-open").focus()'
          new = '    await openMessageTools(pair.a.page)\n    await pair.a.page.locator("#expressive-open").focus()'
          replace_exact(old, new, expected=1, label="expressive keyboard tray entry")

          # Prompt tests that have an empty composer can enter through the real tray.
          # Deliberately do NOT force-open the hidden tray in the non-empty-draft test.
          old = '    await pair.a.page.locator("#prompt-control").click()'
          new = '    await openMessageTools(pair.a.page)\n    await pair.a.page.locator("#prompt-control").click()'
          replace_exact(old, new, expected=2, label="prompt tray clicks")
          old = '    const control = tabA2.page.locator("#prompt-control")\n    await control.focus()'
          new = '    await openMessageTools(tabA2.page)\n    const control = tabA2.page.locator("#prompt-control")\n    await control.focus()'
          replace_exact(old, new, expected=1, label="prompt keyboard tray entry")

          # Quiet/Atmosphere/Ambient were moved to Conversation info. Any click there
          # closes the info menu, so each independent click must re-open it first.
          info_click_pattern = re.compile(
              r'^(\s*)await ((?:pair\.[ab]|tabA2)\.page)\.locator\("#(atmosphere-control|ambient-audio-control|quiet-mode-control)"\)\.click\(\)$',
              re.M,
          )
          def info_click_repl(match):
              indent, page_expr, control = match.groups()
              return f'{indent}await openConversationInfo({page_expr})\n{indent}await {page_expr}.locator("#{control}").click()'
          text, count = info_click_pattern.subn(info_click_repl, text)
          if count != 14:
              raise SystemExit(f"info-control direct clicks: expected 14, found {count}")

          old = '    await quietBtnA.click()'
          new = '    await openConversationInfo(pair.a.page)\n    await quietBtnA.click()'
          replace_exact(old, new, expected=4, label="Quiet Mode variable clicks")

          old = '    const control = pair.a.page.locator("#atmosphere-control")\n    await control.focus()'
          new = '    await openConversationInfo(pair.a.page)\n    const control = pair.a.page.locator("#atmosphere-control")\n    await control.focus()'
          replace_exact(old, new, expected=1, label="atmosphere keyboard info entry")
          replace_exact(
              '    assert.equal(await control.isVisible(), true)',
              '    assert.equal(await control.isVisible(), false)',
              expected=1,
              label="atmosphere control visibility after info closes",
          )

          # Pinned Messages was also moved into Conversation info by PR #5. These
          # paths were masked by the shared Send failure, so migrate them now rather
          # than merely revealing the next stale locator.
          pin_click_pattern = re.compile(
              r'^(\s*)await ((?:pair\.[ab]|a|b)\.page)\.locator\("#pinned-messages-control"\)\.click\(\)$',
              re.M,
          )
          def pin_click_repl(match):
              indent, page_expr = match.groups()
              return f'{indent}await openConversationInfo({page_expr})\n{indent}await {page_expr}.locator("#pinned-messages-control").click()'
          text, count = pin_click_pattern.subn(pin_click_repl, text)
          if count != 3:
              raise SystemExit(f"pinned direct clicks: expected 3, found {count}")

          old = '    const pinControlA = pair.a.page.locator("#pinned-messages-control")'
          new = '    await openConversationInfo(pair.a.page)\n    const pinControlA = pair.a.page.locator("#pinned-messages-control")'
          replace_exact(old, new, expected=1, label="pinned A visible paths")
          old = '    const pinControlA2 = aTab2.locator("#pinned-messages-control")'
          new = '    await openConversationInfo(aTab2)\n    const pinControlA2 = aTab2.locator("#pinned-messages-control")'
          replace_exact(old, new, expected=1, label="pinned sibling visible path")
          old = '    await pair.b.page.locator("#pinned-messages-control").waitFor({state: "visible"})'
          new = '    await openConversationInfo(pair.b.page)\n    await pair.b.page.locator("#pinned-messages-control").waitFor({state: "visible"})'
          replace_exact(old, new, expected=2, label="pinned B visible paths")

          # Video picker moved into the message-tools tray. Reuse the PR #5 entry
          # path before waiting for the real filechooser event.
          old = '''  const fileChooserPromise = user.page.waitForEvent("filechooser")
            await user.page.locator("#view-once-video-picker-btn").click()'''
          new = '''  await openMessageTools(user.page)
            const fileChooserPromise = user.page.waitForEvent("filechooser")
            await user.page.locator("#view-once-video-picker-btn").click()'''
          replace_exact(old, new, expected=2, label="view-once video tray entry")

          # PR #5 intentionally renamed only the live Conversation cue.
          replace_exact(
              '    assert.equal(await cue.locator("strong").textContent(), "Temporary Conversation")',
              '    assert.equal(await cue.locator("strong").textContent(), "Temporary chat")',
              expected=1,
              label="Temporary chat cue copy",
          )

          path.write_text(text)
          PY

          git diff --check
          git diff -- test/js/browser_e2e_test.mjs

      - name: Commit patched test contract to temporary branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/js/browser_e2e_test.mjs
          git commit -m "test: migrate composed E2E to conversation UI contract"
          git push origin HEAD:${GITHUB_REF_NAME}
