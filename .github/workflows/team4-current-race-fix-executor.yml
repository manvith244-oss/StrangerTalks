name: Team 4 Current Race Fix Executor

on:
  push:
    branches:
      - team4/media-authority-2026-08-26

permissions:
  contents: write

concurrency:
  group: team4-current-race-fix-executor
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team4/media-authority-2026-08-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify operation-scoped call authority
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin team4/media-authority-2026-08-26
          printf '%s' '' | base64 -d > /tmp/team4_fix.py
          python3 /tmp/team4_fix.py
          node --test --test-concurrency=1 test/js/team4_media_authority_test.mjs test/js/team4_call_operation_race_test.mjs test/js/team11_media_expression_break_test.mjs test/js/live_call_test.mjs
          git diff --check
          git checkout 585637924ff45933c7b35b0bc27719934907c70e -- .github/workflows/team4-operation-race-hardening.yml
          rm -f .github/workflows/team4-current-race-fix-executor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priv/static/assets/live_call.mjs test/js/team4_call_operation_race_test.mjs .github/workflows/team4-operation-race-hardening.yml .github/workflows/team4-current-race-fix-executor.yml
          git commit -m 'fix(team4): scope async call authority by operation generation [team4-race-fixed]'
          git push origin HEAD:team4/media-authority-2026-08-26
