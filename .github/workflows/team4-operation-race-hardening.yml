name: T09 Independent Exact-SHA Gate

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  BASE_SHA: 423442915e37fd6aadd25bd1c6a300eed2b464f0
  CANDIDATE_SHA: a20df2c23ebf251b209ba52bfa0370a47a5d1867
  T09_PROOF_SHA: 27268a84dbf49933e6930d3c7129e8cae4de3b4d
  PRE_CONSTRAINT_VERSION: '20260830044500'
  STRANGERTALKS_BROWSER_BASE_URL: http://127.0.0.1:4000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: T09-BASE identity and clean-worktree proof
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_REQUESTED_SHA=$BASE_SHA"
          echo "BASE_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install baseline dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Baseline clean migration
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Baseline realtime terminal security proof
        run: |
          node --test \
            test/js/terminal_truth_client_test.mjs \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/security_adversarial_test.mjs

      - name: Baseline full precommit
        run: mix precommit

      - name: Start baseline Phoenix for actual-browser proof
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint_config |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127,0,0,1}, port: 4000]))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t09-phoenix.log 2>&1 &
          echo $! >/tmp/t09-phoenix.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/t09-phoenix.pid)" 2>/dev/null; then cat /tmp/t09-phoenix.log; exit 1; fi
            sleep 1
          done
          cat /tmp/t09-phoenix.log
          exit 1

      - name: Baseline maintained browser E2E
        run: node --test --test-concurrency=1 test/js/browser_e2e_test.mjs

      - name: Stop baseline Phoenix
        if: always()
        run: |
          if [ -f /tmp/t09-phoenix.pid ]; then kill "$(cat /tmp/t09-phoenix.pid)" 2>/dev/null || true; fi

      - name: Baseline negative control and tested-SHA proof
        shell: bash
        run: |
          set -euo pipefail
          if bash -c 'exit 23'; then exit 1; fi
          echo T09_NEGATIVE_CONTROL=nonzero_detected
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "BASE_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

      - name: Checkout exact T01 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          clean: true

      - name: T01 exact-SHA intake and diff-scope proof
        shell: bash
        run: |
          set -euo pipefail
          echo "T01_REQUESTED_SHA=$CANDIDATE_SHA"
          echo "T01_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          expected=$(printf '%s\n' lib/strangertalks_new/relationship.ex priv/repo/migrations/20260902183000_enforce_distinct_relationship_participants.exs test/strangertalks_new/relationship_test.exs | sort)
          actual=$(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA"...HEAD

      - name: T01 clean migration M1
        run: |
          mix deps.get
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject immutable T09 hostile test
        shell: bash
        run: git show "$T09_PROOF_SHA:test/t09/t01_self_relationship_verification_test.exs" > test/t09_self_relationship_verification_runtime_test.exs

      - name: T01 V1 V2 V3 V4 V5 V7 hostile proof
        run: mix test test/t09_self_relationship_verification_runtime_test.exs --trace

      - name: Remove injected hostile test
        run: rm -f test/t09_self_relationship_verification_runtime_test.exs

      - name: T01 V6 V8 regressions
        run: |
          mix test \
            test/strangertalks_new/relationship_test.exs \
            test/strangertalks_new/relationship_reconnections_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new/matchmaking_engine_test.exs \
            --trace

      - name: Extract immutable migration seed helper
        shell: bash
        run: git show "$T09_PROOF_SHA:test/t09/support/seed_valid_relationship.exs" > /tmp/t09_seed.exs

      - name: T01 M2 existing valid Relationship survives migration
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          mix ecto.migrate --quiet
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          echo T09_M2=pass

      - name: T01 M3 pre-existing self Relationship fails closed
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          mix run -e 'StrangertalksNew.Repo.query!("UPDATE relationships SET participant_b_id = participant_a_id")'
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM relationships WHERE participant_a_id = participant_b_id"); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          set +e
          output=$(mix ecto.migrate 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'Cannot add relationships_distinct_participants_check: self relationships exist'
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM relationships WHERE participant_a_id = participant_b_id"); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 0
          echo T09_M3=pass

      - name: T01 M4 rollback preserves valid Relationship
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          mix ecto.migrate --quiet
          mix ecto.rollback --quiet --step 1
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 0
          echo T09_M4=pass

      - name: T01 independent full precommit
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix precommit

      - name: T01 final exact-SHA clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "T01_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo T09_T01_GATE=VERIFIED
