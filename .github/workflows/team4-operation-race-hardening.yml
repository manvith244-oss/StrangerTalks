name: Validation - PR B exact GREEN canonical media harness

on:
  push:
    branches:
      - validation/pr-b-green-2026-08-30

permissions:
  contents: read

jobs:
  pr-b-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact PR B head
        uses: actions/checkout@v4
        with:
          ref: 592c22b0486649be242c78441d8a784c2e0de0b2

      - name: Prove exact tested SHA
        run: |
          echo "EXPECTED_PR_B_SHA=592c22b0486649be242c78441d8a784c2e0de0b2"
          echo "ACTUAL_PR_B_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "592c22b0486649be242c78441d8a784c2e0de0b2"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install canonical Team 9 dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Exact targeted Node GREEN
        run: |
          node --test --test-concurrency=1 \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/team11_media_expression_break_test.mjs \
            test/js/view_once_test.mjs

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start canonical Team 9 Phoenix real stack
        run: |
          mix run --no-start -e '
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNew.Repo,
              repo_config
              |> Keyword.put(:pool, DBConnection.ConnectionPool)
              |> Keyword.put(:pool_size, 20)
            )
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              endpoint_config
              |> Keyword.put(:server, true)
              |> Keyword.put(:http, [ip: {127, 0, 0, 1}, port: 4000])
            )
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/pr-b-team9-phoenix.log 2>&1 &
          echo $! > /tmp/pr-b-team9-phoenix.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/pr-b-team9-phoenix.pid)" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/pr-b-team9-phoenix.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/ >/dev/null; then
              echo "Canonical Team 9 browser endpoint is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Phoenix did not become ready."
          cat /tmp/pr-b-team9-phoenix.log
          exit 1

      - name: Exact normal-media browser GREEN
        run: node --test test/js/normal_media_browser_test.mjs

      - name: Stop Phoenix real stack
        if: always()
        run: |
          if [ -f /tmp/pr-b-team9-phoenix.pid ]; then
            pid="$(cat /tmp/pr-b-team9-phoenix.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Reset database before full precommit
        if: always()
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        if: always()
        run: mix precommit

      - name: Diff integrity, clean tree, exact SHA
        if: always()
        run: |
          git diff --check
          git status --short --branch
          git status --porcelain | tee /tmp/pr-b-status
          test ! -s /tmp/pr-b-status
          test "$(git rev-parse HEAD)" = "592c22b0486649be242c78441d8a784c2e0de0b2"

      - name: Phoenix log on failure
        if: failure()
        run: cat /tmp/pr-b-team9-phoenix.log || true
