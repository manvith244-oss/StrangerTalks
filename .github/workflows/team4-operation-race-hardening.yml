name: Validation - post-PR-A maintained JS exact SHA

on:
  push:
    branches:
      - validation/arrival-after-pr-a-2026-08-30

permissions:
  contents: read

jobs:
  maintained-js-exact-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged integration SHA
        uses: actions/checkout@v4
        with:
          ref: 7d5058ee0c0022f9682262b1bb5ca240fcf3a01a

      - name: Prove exact tested SHA
        run: |
          echo "EXPECTED_POST_PR_A_SHA=7d5058ee0c0022f9682262b1bb5ca240fcf3a01a"
          echo "ACTUAL_POST_PR_A_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "7d5058ee0c0022f9682262b1bb5ca240fcf3a01a"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Full maintained JS recount
        id: maintained
        continue-on-error: true
        run: |
          browser_tests=(
            test/js/arrival_accessibility_browser_test.mjs
            test/js/arrival_first_minute_browser_test.mjs
            test/js/browser_e2e_test.mjs
            test/js/conversation_reliability_browser_test.mjs
            test/js/f01_app_shell_browser_test.mjs
            test/js/f04_conversation_runtime_cleanup_browser_test.mjs
            test/js/f04_conversation_runtime_hostile_browser_test.mjs
            test/js/f06_secondary_flow_browser_test.mjs
            test/js/f07_loading_transitions_browser_test.mjs
            test/js/f09_mobile_flow_browser_test.mjs
            test/js/f10_desktop_flow_browser_test.mjs
            test/js/f11_browser_corrupt_identity_test.mjs
            test/js/f11_browser_hostile_test.mjs
            test/js/fx05_expression_continuity_browser_test.mjs
            test/js/instagram_chat_browser_test.mjs
            test/js/instagram_chat_report_browser_test.mjs
            test/js/navigation_history_browser_test.mjs
            test/js/normal_media_browser_test.mjs
            test/js/team10_expression_actions_browser_test.mjs
            test/js/team10_expression_authority_browser_test.mjs
            test/js/team10_expression_browser_test.mjs
            test/js/team10_expression_reliability_browser_test.mjs
            test/js/team3_channel_reliability_browser_test.mjs
            test/js/team3_conversation_experience_gate_test.mjs
            test/js/team3_conversation_hostile_test.mjs
            test/js/team3_replay_overlap_browser_test.mjs
            test/js/team4_media_browser_test.mjs
            test/js/team5_continuity_browser_attack_test.mjs
            test/js/team6_product_ux_browser_test.mjs
            test/js/team6_real_ux_browser_test.mjs
            test/js/team7_continuity_browser_test.mjs
            test/js/terminal_truth_browser_test.mjs
          )

          declare -A browser_test_set=()
          for test_file in "${browser_tests[@]}"; do
            browser_test_set["$test_file"]=1
          done

          maintained_tests=()
          while IFS= read -r -d '' test_file; do
            if [[ -z "${browser_test_set[$test_file]+x}" ]]; then
              maintained_tests+=("$test_file")
            fi
          done < <(find test/js -maxdepth 1 -name '*_test.mjs' -print0 | sort -z)

          set +e
          node --test --test-concurrency=1 "${maintained_tests[@]}" 2>&1 | tee /tmp/post-pr-a-maintained.tap
          status=${PIPESTATUS[0]}
          set -e
          echo "MAINTAINED_NODE_EXIT=$status"
          exit "$status"

      - name: Report exact failure summary
        if: always()
        run: |
          echo "MAINTAINED_OUTCOME=${{ steps.maintained.outcome }}"
          if [ -f /tmp/post-pr-a-maintained.tap ]; then
            grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/post-pr-a-maintained.tap || true
            echo '--- NOT OK ---'
            grep -E '^not ok ' /tmp/post-pr-a-maintained.tap || true
          fi
          echo "POST_PR_A_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "7d5058ee0c0022f9682262b1bb5ca240fcf3a01a"

      - name: Preserve RED result
        if: always()
        run: test "${{ steps.maintained.outcome }}" = success
