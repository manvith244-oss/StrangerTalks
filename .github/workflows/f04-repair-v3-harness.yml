name: F-04 Repair V3 Harness

on:
  push:
    branches:
      - f04/conversation-continuity-2026-08-26
    paths:
      - ".github/workflows/f04-repair-v3-harness.yml"

permissions:
  contents: write

jobs:
  repair_v3_harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace fragile hostile-probe construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/f04-apply-runtime-fix-v3.yml")
          text = path.read_text()
          start_marker = "      - name: Correct hostile probe semantics only\n"
          end_marker = "      - name: Set up BEAM\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          step_lines = [
            "      - name: Correct hostile probe semantics only",
            "        shell: bash",
            "        run: |",
            "          set -euo pipefail",
            "          python3 - <<'PY'",
            "          import re",
            "          from pathlib import Path",
            "",
            "          path = Path(\"test/js/f04_conversation_runtime_hostile_browser_test.mjs\")",
            "          text = path.read_text()",
            "",
            "          on_marker = '    const originalOn = channel.on.bind(channel)\\n'",
            "          predicate = '    const isApplicationListenerEvent = (event) => {\\n      const name = String(event)\\n      return !name.startsWith(\"phx_\") && !name.startsWith(\"chan_reply_\")\\n    }\\n\\n'",
            "          if text.count(on_marker) != 1:",
            "              raise SystemExit(f\"listener-on structural marker mismatch: {text.count(on_marker)}\")",
            "          text = text.replace(on_marker, predicate + on_marker, 1)",
            "",
            "          text, on_count = re.subn(",
            "              r'(    channel\\.on = function\\(event, callback\\) \\{\\n      const ref = originalOn\\(event, callback\\)\\n)',",
            "              r'\\1      if (!isApplicationListenerEvent(event)) return ref\\n',",
            "              text,",
            "              count=1",
            "          )",
            "          if on_count != 1:",
            "              raise SystemExit(f\"listener-on callback structural mismatch: {on_count}\")",
            "",
            "          text, off_count = re.subn(",
            "              r'(    channel\\.off = function\\(event, ref\\) \\{\\n)',",
            "              r'\\1      if (!isApplicationListenerEvent(event)) return originalOff(event, ref)\\n',",
            "              text,",
            "              count=1",
            "          )",
            "          if off_count != 1:",
            "              raise SystemExit(f\"listener-off structural mismatch: {off_count}\")",
            "",
            "          voice_pattern = re.compile(",
            "              r'  voiceRecord\\(conversationId, voiceNoteId\\) \\{\\n    return getRecord\\(\"voice:\" \\+ conversationId \\+ \":\" \\+ voiceNoteId\\)\\n  \\}'",
            "          )",
            "          text, voice_count = voice_pattern.subn(",
            "              '  async voiceRecord(conversationId, voiceNoteId) {\\n    return (await getRecord(\"voice:\" + conversationId + \":\" + voiceNoteId)) ?? null\\n  }',",
            "              text,",
            "              count=1",
            "          )",
            "          if voice_count != 1:",
            "              raise SystemExit(f\"voice probe structural mismatch: {voice_count}\")",
            "",
            "          path.write_text(text)",
            "          PY",
            "",
            "          node --check test/js/f04_conversation_runtime_hostile_browser_test.mjs",
            "          git diff --check",
            "          test \"$(git diff --name-only)\" = \"test/js/f04_conversation_runtime_hostile_browser_test.mjs\"",
            "",
          ]
          replacement = "\n".join(step_lines)
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          rm .github/workflows/f04-repair-v3-harness.yml
          git diff --check
          grep -q 'listener-on structural marker mismatch' .github/workflows/f04-apply-runtime-fix-v3.yml
          test ! -e .github/workflows/f04-repair-v3-harness.yml

      - name: Commit repaired carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(f04): harden V3 hostile harness"
          git push origin HEAD:f04/conversation-continuity-2026-08-26
