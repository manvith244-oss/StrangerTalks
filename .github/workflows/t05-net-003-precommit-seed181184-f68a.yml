name: T05 NET 003 Full-Suite Seed Classification

on:
  push:
    branches:
      - team5/net-003-precommit-seed181184-f68a

permissions:
  contents: read

jobs:
  classify-full-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f68a039af2f1267e4222036e787e0954cf8f5266
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies once
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Reproduce exact precommit test context on RED parent and successor
        run: |
          set -euo pipefail

          reproduce_full_suite() {
            sha="$1"
            label="$2"

            git checkout --force "$sha"
            git clean -fd
            test "$(git rev-parse HEAD)" = "$sha"
            test -z "$(git status --porcelain)"

            # Mirror the precommit tasks that precede the test alias.
            mix compile --warnings-as-errors
            mix deps.unlock --unused
            mix format

            git diff --name-only | sort > "/tmp/${label}-pretest-dirty-paths"
            git diff > "/tmp/${label}-pretest.patch"

            # Give each side a fresh database, then use the exact failing seed/max_cases.
            mix ecto.drop --quiet || true
            mix ecto.create --quiet
            mix ecto.migrate --quiet

            set +e
            mix test --seed 181184 --max-cases 8 > "/tmp/${label}-full-suite.log" 2>&1
            rc=$?
            set -e

            tail -n 120 "/tmp/${label}-full-suite.log"
            test "$rc" -ne 0
            grep -F 'normal-media upload loses authority after durable End (StrangertalksNewWeb.Team2NormalMediaTerminalTest)' "/tmp/${label}-full-suite.log"
            grep -F 'assert {:error, :terminal_conversation} = ConversationServer.ensure_started(conversation.conversation_id)' "/tmp/${label}-full-suite.log"
            grep -F 'right: {:ok, #PID<' "/tmp/${label}-full-suite.log"
            grep -F '862 tests, 1 failure' "/tmp/${label}-full-suite.log"
            echo "${label}_SEED_181184_FAILURE=REPRODUCED"
          }

          reproduce_full_suite 77475e8fc42b4054db5f123bf96a97c9caa6392b RED_PARENT
          reproduce_full_suite f68a039af2f1267e4222036e787e0954cf8f5266 SUCCESSOR

          echo 'RED_PARENT_PRETEST_DIRTY_PATHS:'
          cat /tmp/RED_PARENT-pretest-dirty-paths
          echo 'SUCCESSOR_PRETEST_DIRTY_PATHS:'
          cat /tmp/SUCCESSOR-pretest-dirty-paths

          cmp /tmp/RED_PARENT-pretest-dirty-paths /tmp/SUCCESSOR-pretest-dirty-paths
          cmp /tmp/RED_PARENT-pretest.patch /tmp/SUCCESSOR-pretest.patch

          if grep -Fxq 'priv/static/assets/live_call.mjs' /tmp/SUCCESSOR-pretest-dirty-paths; then
            echo 'T05_CANDIDATE_FORMAT_DRIFT=YES'
            exit 1
          fi

          echo 'TEAM2_FULL_SUITE_FAILURE_CLASSIFICATION=PREEXISTING_ON_RED_PARENT_AT_IDENTICAL_SEED'
          echo 'FORMATTER_SIDE_EFFECT_CLASSIFICATION=IDENTICAL_PARENT_AND_SUCCESSOR'
      - name: Restore and prove successor candidate hygiene
        run: |
          set -euo pipefail
          git reset --hard f68a039af2f1267e4222036e787e0954cf8f5266
          git clean -fd
          test "$(git rev-parse HEAD)" = "f68a039af2f1267e4222036e787e0954cf8f5266"
          git diff --check 77475e8fc42b4054db5f123bf96a97c9caa6392b...HEAD
          test -z "$(git status --porcelain)"
          echo 'T05_NET_003_CANDIDATE_HYGIENE=CLEAN'
