name: Team 10 Apply Expression Surface Patch

on:
  push:
    branches: [newteam/expression-surface]
    paths:
      - "team10-patches/apply_team10.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/expression-surface
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact Team 10 patch
        run: python team10-patches/apply_team10.py
      - name: Static and behavioral proof before commit
        run: |
          node --check priv/static/assets/app.js
          node --test test/js/team10_expression_surface_test.mjs test/js/expressive_media_test.mjs
          git diff --check
      - name: Commit proven application
        run: |
          git config user.name "team10-expression-bot"
          git config user.email "team10-expression-bot@users.noreply.github.com"
          git add priv/static/assets/app.js priv/static/index.html
          git commit -m "feat(team10): expose emoji stickers and truthful GIF surface [skip ci]"
          git push origin HEAD:newteam/expression-surface
