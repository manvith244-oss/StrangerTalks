name: Live Supabase CA probe

on:
  push:
    branches:
      - probe/live-supabase-ca-2026-08-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live PostgreSQL TLS chain
        shell: bash
        run: |
          set -euo pipefail
          HOST=aws-0-ap-southeast-1.pooler.supabase.com
          PORT=5432
          CA_URL=https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt

          echo "=== target ==="
          echo "${HOST}:${PORT}"
          getent ahostsv4 "$HOST" | head -n 5 || true

          timeout 20 openssl s_client \
            -starttls postgres \
            -connect "${HOST}:${PORT}" \
            -servername "$HOST" \
            -showcerts \
            </dev/null > /tmp/probe.txt 2>&1

          awk '
            /-----BEGIN CERTIFICATE-----/ {
              n++
              file=sprintf("/tmp/cert-%02d.pem", n)
              in_cert=1
            }
            in_cert {print > file}
            /-----END CERTIFICATE-----/ {
              close(file)
              in_cert=0
            }
          ' /tmp/probe.txt

          shopt -s nullglob
          certs=(/tmp/cert-*.pem)
          test "${#certs[@]}" -eq 3

          for cert in "${certs[@]}"; do
            echo "=== $(basename "$cert") ==="
            openssl x509 -in "$cert" -noout -subject -issuer -serial -startdate -enddate -fingerprint -sha256
          done

          openssl verify -CAfile /tmp/cert-03.pem -untrusted /tmp/cert-02.pem /tmp/cert-01.pem

          curl --fail --silent --show-error --location "$CA_URL" -o /tmp/official-prod-ca-2021.crt
          live_root_fp=$(openssl x509 -in /tmp/cert-03.pem -noout -fingerprint -sha256 | cut -d= -f2)
          official_fp=$(openssl x509 -in /tmp/official-prod-ca-2021.crt -noout -fingerprint -sha256 | cut -d= -f2)
          echo "LIVE_ROOT_SHA256=$live_root_fp"
          echo "OFFICIAL_DOWNLOAD_SHA256=$official_fp"
          test "$live_root_fp" = "$official_fp"
          echo "LIVE_ROOT_MATCHES_OFFICIAL_DOWNLOAD=true"
          echo "LIVE_ROOT_PEM_BASE64=$(base64 -w0 /tmp/cert-03.pem)"
