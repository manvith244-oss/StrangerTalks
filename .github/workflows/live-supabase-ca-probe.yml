name: Live Supabase CA probe

on:
  push:
    branches:
      - probe/live-supabase-ca-2026-08-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live PostgreSQL TLS chain
        shell: bash
        run: |
          set -euo pipefail
          HOST=aws-0-ap-southeast-1.pooler.supabase.com
          PORT=5432
          CA_URL=https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt

          echo "=== target ==="
          echo "${HOST}:${PORT}"
          echo "=== dns ==="
          getent ahostsv4 "$HOST" | head -n 5 || true
          echo "=== openssl ==="
          openssl version -a | head -n 2

          set +e
          timeout 20 openssl s_client \
            -starttls postgres \
            -connect "${HOST}:${PORT}" \
            -servername "$HOST" \
            -showcerts \
            </dev/null > /tmp/probe.txt 2>&1
          rc=$?
          set -e

          echo "=== s_client exit ==="
          echo "$rc"
          echo "=== s_client summary ==="
          grep -E '^(depth=|verify error:|Verification error:|Verify return code:|subject=|issuer=|Server certificate|CONNECTED)' /tmp/probe.txt || true

          awk '
            /-----BEGIN CERTIFICATE-----/ {
              n++
              file=sprintf("/tmp/cert-%02d.pem", n)
              in_cert=1
            }
            in_cert {print > file}
            /-----END CERTIFICATE-----/ {
              close(file)
              in_cert=0
            }
          ' /tmp/probe.txt

          shopt -s nullglob
          certs=(/tmp/cert-*.pem)
          echo "=== certificates extracted ==="
          echo "${#certs[@]}"
          if [ "${#certs[@]}" -eq 0 ]; then
            echo "No certificates extracted from live probe" >&2
            cat /tmp/probe.txt >&2
            exit 1
          fi

          for cert in "${certs[@]}"; do
            echo "=== $(basename "$cert") ==="
            openssl x509 -in "$cert" -noout \
              -subject -issuer -serial -startdate -enddate -fingerprint -sha256
            subj=$(openssl x509 -in "$cert" -noout -subject | sed 's/^subject=//')
            issuer=$(openssl x509 -in "$cert" -noout -issuer | sed 's/^issuer=//')
            if [ "$subj" = "$issuer" ]; then
              echo "self_signed_subject_issuer=true"
            else
              echo "self_signed_subject_issuer=false"
            fi
          done

          test "${#certs[@]}" -eq 3
          echo "=== verify extracted live chain against extracted live root ==="
          openssl verify -CAfile /tmp/cert-03.pem -untrusted /tmp/cert-02.pem /tmp/cert-01.pem

          echo "=== official download comparison only ==="
          curl --fail --silent --show-error --location "$CA_URL" -o /tmp/official-prod-ca-2021.crt
          openssl x509 -in /tmp/official-prod-ca-2021.crt -noout \
            -subject -issuer -serial -startdate -enddate -fingerprint -sha256

          live_root_fp=$(openssl x509 -in /tmp/cert-03.pem -noout -fingerprint -sha256 | cut -d= -f2)
          official_fp=$(openssl x509 -in /tmp/official-prod-ca-2021.crt -noout -fingerprint -sha256 | cut -d= -f2)
          echo "LIVE_ROOT_SHA256=$live_root_fp"
          echo "OFFICIAL_DOWNLOAD_SHA256=$official_fp"
          if [ "$live_root_fp" = "$official_fp" ]; then
            echo "LIVE_ROOT_MATCHES_OFFICIAL_DOWNLOAD=true"
          else
            echo "LIVE_ROOT_MATCHES_OFFICIAL_DOWNLOAD=false"
          fi

          echo "=== live probe complete ==="
