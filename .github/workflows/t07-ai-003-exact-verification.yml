name: T07 AI-003 Formatter Successor Staging

on:
  push:
    branches:
      - team7/ai-003-exact-verification
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-successor:
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: f04aa0ffd746aab4c56f07873d2766a9117510f6
      STAGING_BRANCH: team7/ai-003-format-successor-stage
    steps:
      - name: Checkout exact parent
        uses: actions/checkout@v4
        with:
          ref: f04aa0ffd746aab4c56f07873d2766a9117510f6
          fetch-depth: 0

      - name: Prove parent and clean input
        run: |
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Format only T07-owned AI-003 files
        run: |
          mix format \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs

      - name: Prove exact formatter-only scope
        run: |
          printf '%s\n' \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs \
            > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          echo '=== EXPECTED ==='
          cat /tmp/expected
          echo '=== ACTUAL ==='
          cat /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          echo '=== FORMATTER PATCH ==='
          git diff --no-ext-diff --unified=20

      - name: Create one formatter successor commit on staging ref
        run: |
          git config user.name 'Manvith'
          git config user.email 'manvithh24@gmail.com'
          git switch -c "$STAGING_BRANCH"
          git add \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs
          git commit -m 'style(t07): format AI-003 owned files'
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          echo "STAGED_SUCCESSOR=$(git rev-parse HEAD)"
          git push origin "$STAGING_BRANCH"
