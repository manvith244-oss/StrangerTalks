name: T07 AI-003 Exact Verification

on:
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      EXPECTED_SHA: 57198192ba970174c439a6f852aa37d51ab5a1ea
      CANONICAL_BASE: 423442915e37fd6aadd25bd1c6a300eed2b464f0

    steps:
      - name: Checkout exact T07 AI-003 candidate
        uses: actions/checkout@v4
        with:
          ref: 57198192ba970174c439a6f852aa37d51ab5a1ea
          fetch-depth: 0

      - name: Prove exact checkout identity
        run: |
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Hostile recursive privacy regressions
        run: |
          mix test \
            test/strangertalks_new/t07_ai_003_privacy_boundary_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs

      - name: Provider failure matrix and A01-A04 regression surface
        run: |
          mix test \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs

      - name: Browser companion regression
        run: node --test test/js/companion_test.mjs test/js/prompt_cards_test.mjs

      - name: Full precommit
        run: mix precommit

      - name: Canonical base to candidate diff check
        run: git diff --check "$CANONICAL_BASE...$EXPECTED_SHA"

      - name: Candidate worktree diff check
        run: git diff --check

      - name: Prove clean working tree
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Record exact candidate
        run: echo "T07_AI_003_TESTED_SHA=$(git rev-parse HEAD)"
