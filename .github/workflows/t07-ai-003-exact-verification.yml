name: T07 AI-003 Format Ownership Audit

on:
  push:
    branches:
      - team7/ai-003-exact-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-audit:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: f04aa0ffd746aab4c56f07873d2766a9117510f6
      CANONICAL_BASE: 423442915e37fd6aadd25bd1c6a300eed2b464f0
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: f04aa0ffd746aab4c56f07873d2766a9117510f6
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prove ownership inputs
        run: |
          paths=(
            lib/strangertalks_new/agent_systems/learning_advisor.ex
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
            lib/strangertalks_new/reflections.ex
            test/strangertalks_new/agent_systems_break_test.exs
            test/strangertalks_new/companion_open_ai_provider_test.exs
            test/strangertalks_new/t07_provider_failure_matrix_test.exs
          )
          echo "CANDIDATE=$EXPECTED_SHA"
          echo "CANONICAL_BASE=$CANONICAL_BASE"
          for p in "${paths[@]}"; do
            echo "=== OWNERSHIP $p ==="
            echo "BASE_BLOB=$(git rev-parse "$CANONICAL_BASE:$p" 2>/dev/null || echo ABSENT)"
            echo "CANDIDATE_BLOB=$(git rev-parse "$EXPECTED_SHA:$p" 2>/dev/null || echo ABSENT)"
            if git diff --quiet "$CANONICAL_BASE...$EXPECTED_SHA" -- "$p"; then
              echo "AI003_MODIFIED=no"
            else
              echo "AI003_MODIFIED=yes"
            fi
          done

      - name: Candidate formatter audit
        run: |
          mix format
          echo "=== CANDIDATE FORMAT STATUS ==="
          git status --short
          echo "=== CANDIDATE FORMAT PATCH BEGIN ==="
          git diff --no-ext-diff --unified=20 -- \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs
          echo "=== CANDIDATE FORMAT PATCH END ==="
          for p in \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            lib/strangertalks_new/agent_systems/trend_bridge_research.ex \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/t07_provider_failure_matrix_test.exs; do
            echo "FORMATTED_BLOB $p $(git hash-object "$p")"
          done

      - name: Canonical baseline formatter audit
        run: |
          git reset --hard "$CANONICAL_BASE"
          mix format
          echo "=== BASE FORMAT STATUS ==="
          git status --short
          echo "=== BASE FORMAT PATCH BEGIN ==="
          git diff --no-ext-diff --unified=20 -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex
          echo "=== BASE FORMAT PATCH END ==="
          for p in \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex; do
            echo "BASE_FORMATTED_BLOB $p $(git hash-object "$p")"
          done
