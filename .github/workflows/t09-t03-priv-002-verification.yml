name: T09 T03 PRIV-002 Independent Privacy Copy Verification

on:
  push:
    branches: [team9/t03-priv-002-verification]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  EXPECTED_SHA: 99787f0b85e0cf9f6c3c001c3f0462f4d6fec89f
  EXPECTED_TREE: 31d156cfcdae30db2f49740033b4f454e1e7004c
  EXPECTED_PARENT: cff1d080cfbe050164eaea96bfe7de33641a2fa1
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  verify:
    name: T09-T03-PRIV-002 exact child-delta proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Record proof lineage
        run: |
          echo "T09_PROOF_BRANCH=$GITHUB_REF_NAME"
          echo "T09_PROOF_SHA=$GITHUB_SHA"
          echo "T09_RUN_ID=$GITHUB_RUN_ID"

      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prove exact identity diff scope and whitespace
        run: |
          set -euo pipefail
          echo "REQUESTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "CHECKED_OUT_TREE=$(git rev-parse HEAD^{tree})"
          echo "DIRECT_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          git diff --check "$EXPECTED_PARENT"..HEAD
          git diff --name-only "$EXPECTED_PARENT"..HEAD | tee /tmp/actual
          cat > /tmp/expected <<'EOF'
          priv/static/assets/app.js
          priv/static/index.html
          test/js/ephemeral_conversation_ux_test.mjs
          test/js/message_unsend_test.mjs
          test/js/t03_privacy_retention_copy_test.mjs
          EOF
          diff -u /tmp/expected /tmp/actual
          git diff --numstat "$EXPECTED_PARENT"..HEAD
          git diff --unified=0 "$EXPECTED_PARENT"..HEAD -- priv/static/assets/app.js priv/static/index.html | tee /tmp/product.patch
          test "$(grep -c '^@@' /tmp/product.patch)" -eq 3
          ! grep -E '^[+-].*(connectSocket|WebSocket|indexedDB|putRecord|deleteRecord|navigation\.|history\.|location\.|message-form|message-input|ConversationServer|reportForm\.addEventListener|fetch\(|/api/reports)' /tmp/product.patch
          grep -F 'Limited safety evidence is minimized or deleted on its own safety-retention schedule.' /tmp/product.patch
          grep -F 'Unsend or Fade can remove participant-visible or local content, but they do not erase safety evidence already authorized for safety handling.' /tmp/product.patch
          grep -F 'If you report a View-Once photo while StrangerTalks still has its server-owned safety copy' /tmp/product.patch

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test stack and Chromium
        run: |
          set -euo pipefail
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Frontend privacy regressions
        run: |
          node --test --test-concurrency=1 \
            test/js/t03_privacy_retention_copy_test.mjs \
            test/js/ephemeral_conversation_ux_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/view_once_test.mjs \
            test/js/f11_retained_cleanup_guard_test.mjs

      - name: T04 retention safety regressions consumed by copy
        run: |
          set -euo pipefail
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix test \
            test/strangertalks_new/team4_retention_privacy_closure_test.exs \
            test/strangertalks_new/retention_policy_test.exs \
            test/strangertalks_new/retention_cleanup_test.exs \
            test/strangertalks_new/retention_cleanup_db_test.exs \
            test/strangertalks_new/retention_safety_media_closure_test.exs \
            test/strangertalks_new/retention_closure_db_test.exs \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/conversation_unsend_report_safety_test.exs \
            test/strangertalks_new/conversation_message_unsend_test.exs \
            test/strangertalks_new/telemetry_privacy_test.exs \
            test/strangertalks_new_web/channel_crash_diagnostic_privacy_test.exs

      - name: Prepare pristine Chromium database
        run: |
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject independent PRIV-002 browser oracle
        run: |
          cat > test/t09_t03_priv_002_browser_test.mjs <<'JAVASCRIPT'
          import assert from "node:assert/strict"
          import {readFileSync} from "node:fs"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const WAIT = 20_000
          const ORDINARY = "This is a temporary Conversation, not a permanent chat-history thread."
          const LOCAL_FADE = "If a participant chooses to keep a local Conversation copy on their own device, that copy has a separate local lifetime; Fade removes that participant-local transcript and summary."
          const SCHEDULE = "Limited safety evidence is minimized or deleted on its own safety-retention schedule."
          const SURVIVES = "Unsend or Fade can remove participant-visible or local content, but they do not erase safety evidence already authorized for safety handling."
          const VIEW_ONCE = "If you report a View-Once photo while StrangerTalks still has its server-owned safety copy, the photo may be stored separately as limited safety evidence. That sensitive evidence is minimized or deleted on its own safety-retention schedule."
          const STALE = /no automatic expiry|no automatic cleanup/i
          const LEGAL = /fully compliant|legal compliance|DPDP compliant|we never retain anything|deletion is immediate everywhere/i
          const active = (page, name) => page.locator(`section[data-screen="${name}"].active`)

          async function boot(browser) {
            const context = await browser.newContext({viewport: {width: 390, height: 844}})
            const page = await context.newPage()
            const issuance = page.waitForResponse(r => {
              try { return new URL(r.url()).pathname === "/api/participants" } catch { return false }
            })
            const response = await page.goto(BASE, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok())
            assert.ok((await issuance).ok())
            await active(page, "doors").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#conversation-language").selectOption("en")
            return {context, page}
          }

          async function pair(browser) {
            const a = await boot(browser)
            const b = await boot(browser)
            await a.page.getByRole("button", {name: /Advice/}).click()
            await active(a.page, "queue").waitFor({state: "visible", timeout: WAIT})
            await b.page.getByRole("button", {name: /Advice/}).click()
            await Promise.all([
              active(a.page, "conversation").waitFor({state: "visible", timeout: WAIT}),
              active(b.page, "conversation").waitFor({state: "visible", timeout: WAIT})
            ])
            assert.equal(new URL(a.page.url()).pathname, "/conversation")
            assert.equal(new URL(b.page.url()).pathname, "/conversation")
            return {a, b}
          }

          test("T09 real Chromium privacy-copy authority", {timeout: 180_000}, async () => {
            const html = readFileSync("priv/static/index.html", "utf8")
            const app = readFileSync("priv/static/assets/app.js", "utf8")
            const dynamicSource = app.match(/reportForm\.insertAdjacentHTML\("afterbegin",[\s\S]*?\)\n/)?.[0] || ""
            for (const source of [html, dynamicSource]) {
              assert.doesNotMatch(source, STALE)
              assert.doesNotMatch(source, LEGAL)
            }
            assert.ok(html.includes(ORDINARY))
            assert.ok(html.includes(LOCAL_FADE))
            assert.ok(html.includes(VIEW_ONCE))

            const browser = await chromium.launch({headless: true})
            let matched
            try {
              matched = await pair(browser)
              const {a, b} = matched
              const composer = a.page.getByRole("textbox", {name: "Message"})
              const send = a.page.locator('section[data-screen="conversation"].active #message-form').getByRole("button", {name: "Send message", exact: true})
              assert.equal(await composer.count(), 1)
              assert.equal(await send.count(), 1)
              assert.equal(await composer.isEnabled(), true)

              const route = new URL(a.page.url()).pathname
              const trigger = a.page.locator('.temporary-conversation-cue [data-lifetime-details]')
              await trigger.focus()
              await trigger.click()
              const lifetime = a.page.locator("#lifetime-details-dialog")
              await lifetime.waitFor({state: "visible", timeout: WAIT})
              const lifetimeText = await lifetime.innerText()
              console.log(`T09_LIFETIME=${JSON.stringify(lifetimeText)}`)
              assert.ok(lifetimeText.includes(ORDINARY))
              assert.ok(lifetimeText.includes(LOCAL_FADE))
              assert.match(lifetimeText, /View-Once photo[\s\S]*stored separately as safety evidence/i)
              assert.ok(lifetimeText.includes(SCHEDULE))
              assert.ok(lifetimeText.includes(SURVIVES))
              assert.doesNotMatch(lifetimeText, STALE)
              assert.doesNotMatch(lifetimeText, LEGAL)
              await a.page.locator("#lifetime-details-close").click()
              await lifetime.waitFor({state: "hidden", timeout: WAIT})
              assert.equal(await trigger.evaluate(node => node === document.activeElement), true)
              assert.equal(new URL(a.page.url()).pathname, route)

              const reportPosts = []
              a.page.on("request", request => {
                if (request.method() === "POST" && /\/api\/reports(?:$|\?)/.test(request.url())) reportPosts.push(request.url())
              })
              const menu = a.page.locator("details.overflow")
              if ((await menu.getAttribute("open")) === null) await menu.locator("summary").click()
              await a.page.locator("#report-open").click()
              const report = a.page.locator("#report-form")
              await report.waitFor({state: "visible", timeout: WAIT})
              const dynamic = await report.locator(".report-disclosure").innerText()
              const media = await report.locator(".report-safety-media-disclosure").innerText()
              console.log(`T09_REPORT_DYNAMIC=${JSON.stringify(dynamic)}`)
              console.log(`T09_REPORT_STATIC=${JSON.stringify(media)}`)
              assert.match(dynamic, /Reports are stored separately for safety/i)
              assert.match(dynamic, /does not automatically save the ordinary Conversation transcript/i)
              assert.ok(dynamic.includes(SCHEDULE))
              assert.ok(dynamic.includes(SURVIVES))
              assert.equal(media, VIEW_ONCE)
              assert.doesNotMatch(`${dynamic}\n${media}`, STALE)
              assert.doesNotMatch(`${dynamic}\n${media}`, LEGAL)
              assert.equal(await report.locator("#report-category").count(), 1)
              assert.equal(await report.locator("#report-evidence").count(), 1)
              assert.equal(await report.getByRole("button", {name: "Submit Report"}).count(), 1)
              assert.deepEqual(reportPosts, [])
              await a.page.locator("#report-cancel").click()
              await report.waitFor({state: "hidden", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, route)
              assert.equal(await active(a.page, "conversation").count(), 1)

              await composer.fill("t09 privacy-copy socket continuity")
              await send.click()
              await b.page.locator("#messages li", {hasText: "t09 privacy-copy socket continuity"}).waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/conversation")
              assert.equal(await composer.isEnabled(), true)
            } finally {
              await matched?.a.context.close().catch(() => {})
              await matched?.b.context.close().catch(() => {})
              await browser.close().catch(() => {})
            }
          })
          JAVASCRIPT
          node --check test/t09_t03_priv_002_browser_test.mjs

      - name: Start exact-SHA Phoenix
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127,0,0,1}, port: 4000]))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/t09-server.log 2>&1 & echo $! >/tmp/t09-server.pid
          for i in $(seq 1 45); do
            kill -0 "$(cat /tmp/t09-server.pid)" 2>/dev/null || { cat /tmp/t09-server.log; exit 1; }
            curl -fsS http://localhost:4000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/t09-server.log; exit 1

      - name: Real Chromium lifetime report and historical-delete proof
        run: |
          set -euo pipefail
          echo "CHROMIUM_TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test --test-concurrency=1 \
            test/t09_t03_priv_002_browser_test.mjs \
            test/js/t03_history_route_browser_test.mjs

      - name: Cleanup T09 oracle and server
        if: always()
        run: |
          rm -f test/t09_t03_priv_002_browser_test.mjs
          if [ -f /tmp/t09-server.pid ]; then kill "$(cat /tmp/t09-server.pid)" 2>/dev/null || true; fi

      - name: Final exact identity diff-check and clean worktree
        run: |
          set -euo pipefail
          git diff --check "$EXPECTED_PARENT"..HEAD
          node --check priv/static/assets/app.js
          echo "FINAL_TESTED_SHA=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          printf 'FINAL_STATUS=%q\n' "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "T09_T03_PRIV_002_OWNED_GATES=GREEN"
