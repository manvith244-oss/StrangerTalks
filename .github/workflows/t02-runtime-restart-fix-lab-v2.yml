name: T02 Runtime Restart Fix Lab V2

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
  workflow_dispatch:

concurrency:
  group: t02-runtime-restart-fix-lab-v2-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix-lab-v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact lab commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact source lineage and no persisted production change
        shell: bash
        run: |
          set -euo pipefail
          source_candidate="e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          git merge-base --is-ancestor "$source_candidate" HEAD
          git diff --exit-code "$source_candidate"..HEAD -- lib/
          echo "SOURCE_CANDIDATE=$source_candidate"
          echo "LAB_HEAD=$(git rev-parse HEAD)"

      - name: Apply single-authority fix ephemerally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()
          old = "{__MODULE__, %{conversation_id: conversation_id}}\n                     ) do"
          new = "Supervisor.child_spec(\n                         {__MODULE__, %{conversation_id: conversation_id}},\n                         restart: :temporary\n                       )\n                     ) do"
          if old not in text:
              raise SystemExit("ensure_started child-spec anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile patched runtime
        run: mix compile --warnings-as-errors

      - name: Hostile convergence regression
        run: mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs --seed 0 --trace

      - name: Existing RecoveryRestart stress
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 1 20); do
            echo "RECOVERY_RESTART_SEED=$seed"
            mix test test/strangertalks_new/recovery_restart_test.exs --seed "$seed"
          done

      - name: Preserve direct transient child contract
        run: mix test test/strangertalks_new/agent_systems_remediation_test.exs --seed 0

      - name: Focused restart and canonical terminal regressions
        run: >-
          mix test
          test/strangertalks_new/runtime_restart_reconciliation_test.exs
          test/strangertalks_new/runtime_terminal_contract_test.exs
          test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs
          --seed 0
