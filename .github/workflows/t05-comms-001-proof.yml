name: T05 COMMS 001 Proof

on:
  push:
    branches:
      - team5/media-call-lifecycle-closure

permissions:
  contents: read

jobs:
  call-aba-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run T05 call-attempt closure proof
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/team4_initiation_aba_test.mjs \
            test/js/team4_call_operation_race_test.mjs \
            test/js/live_call_signal_queue_regression_test.mjs \
            test/js/live_call_test.mjs \
            test/js/team4_media_authority_test.mjs
          git diff --check
