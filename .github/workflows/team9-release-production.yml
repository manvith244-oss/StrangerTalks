name: Team 9 Release Production Gate

on:
  push:
    branches:
      - team9/release-performance-production-2026-08-24
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TEST_DATABASE_URL: postgresql://strangertalks_local:strangertalks_test@127.0.0.1:5432/strangertalks_new_test
      RESTORE_DATABASE_URL: postgresql://strangertalks_local:strangertalks_test@127.0.0.1:5432/team9_restore_test

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove checkout identity
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "TESTED_COMMIT=$GITHUB_SHA"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci

      - name: Git whitespace proof
        id: whitespace
        continue-on-error: true
        run: git diff --check

      - name: Full Elixir precommit
        id: precommit
        continue-on-error: true
        run: mix precommit

      - name: Full maintained JavaScript regressions
        id: javascript
        continue-on-error: true
        run: node --test test/js/*.mjs

      - name: Hex advisory audit
        id: hex_audit
        continue-on-error: true
        run: mix hex.audit

      - name: npm production dependency audit
        id: npm_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Clean production build and release package
        id: production_build
        continue-on-error: true
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          rm -rf _build/prod
          mix deps.get --only prod
          mix deps.compile
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release --overwrite
          test -x _build/prod/rel/strangertalks_new/bin/migrate
          test -x _build/prod/rel/strangertalks_new/bin/strangertalks_new

      - name: Production release migration and health smoke
        id: release_smoke
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://strangertalks_local:strangertalks_test@127.0.0.1:5432/strangertalks_new_test
          SECRET_KEY_BASE: 6f8d8948de21f7683641d97ea2b6178e7c9e5af554ee4f2db5f6063aa8d1f165
          PHX_HOST: localhost
          PHX_SERVER: "true"
          PORT: "4000"
          POOL_SIZE: "5"
        run: |
          set -euo pipefail
          release=_build/prod/rel/strangertalks_new/bin/strangertalks_new
          migrate=_build/prod/rel/strangertalks_new/bin/migrate
          test -x "$release"
          test -x "$migrate"

          "$migrate"
          "$migrate"

          "$release" start > /tmp/team9-release.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4000/health/ready > /tmp/team9-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            cat /tmp/team9-release.log
            exit 1
          fi

          curl --silent --fail http://127.0.0.1:4000/health/live
          cat /tmp/team9-ready.json

      - name: Backup and isolated restore drill
        id: backup_restore
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://strangertalks_local:strangertalks_test@127.0.0.1:5432/strangertalks_new_test
          PGPASSWORD: strangertalks_test
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS team9_restore_probe;
          CREATE TABLE team9_restore_probe (id integer PRIMARY KEY, marker text NOT NULL);
          INSERT INTO team9_restore_probe (id, marker) VALUES (1, 'restore-proven');
          SQL

          bash ops/postgres_backup.sh /tmp/strangertalks-team9.dump
          test -s /tmp/strangertalks-team9.dump

          dropdb --if-exists -h 127.0.0.1 -U strangertalks_local team9_restore_test
          createdb -h 127.0.0.1 -U strangertalks_local team9_restore_test

          CONFIRM_RESTORE=RESTORE_STRANGERTALKS \
          RESTORE_DATABASE_URL="$RESTORE_DATABASE_URL" \
            bash ops/postgres_restore.sh /tmp/strangertalks-team9.dump

          marker=$(psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT marker FROM team9_restore_probe WHERE id = 1")
          test "$marker" = "restore-proven"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP TABLE team9_restore_probe"
          echo "BACKUP_RESTORE_PROVEN"

      - name: Existing local load harness
        id: load_harness
        continue-on-error: true
        env:
          MIX_ENV: test
        run: MIX_ENV=test mix run test/load/phase_6f.exs

      - name: Final clean-tree proof
        id: clean
        continue-on-error: true
        run: |
          set -euo pipefail
          git diff --check
          status=$(git status --porcelain)
          printf '%s\n' "$status"
          test -z "$status"

      - name: Publish gate summary
        if: always()
        run: |
          cat <<EOF
          TESTED_COMMIT=$GITHUB_SHA
          whitespace=${{ steps.whitespace.outcome }}
          precommit=${{ steps.precommit.outcome }}
          javascript=${{ steps.javascript.outcome }}
          hex_audit=${{ steps.hex_audit.outcome }}
          npm_audit=${{ steps.npm_audit.outcome }}
          production_build=${{ steps.production_build.outcome }}
          release_smoke=${{ steps.release_smoke.outcome }}
          backup_restore=${{ steps.backup_restore.outcome }}
          load_harness=${{ steps.load_harness.outcome }}
          clean=${{ steps.clean.outcome }}
          EOF

      - name: Fail closed if any Team 9 gate is red
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.whitespace.outcome }}" = "success"
          test "${{ steps.precommit.outcome }}" = "success"
          test "${{ steps.javascript.outcome }}" = "success"
          test "${{ steps.hex_audit.outcome }}" = "success"
          test "${{ steps.npm_audit.outcome }}" = "success"
          test "${{ steps.production_build.outcome }}" = "success"
          test "${{ steps.release_smoke.outcome }}" = "success"
          test "${{ steps.backup_restore.outcome }}" = "success"
          test "${{ steps.load_harness.outcome }}" = "success"
          test "${{ steps.clean.outcome }}" = "success"
          echo "TEAM9_TESTED_COMMIT=$GITHUB_SHA"
