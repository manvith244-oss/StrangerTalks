name: K2 Presence Visibility Trace

on:
  push:
    branches:
      - diagnostics/presence-visibility-2026-08-29
    paths:
      - .github/workflows/k2-presence-visibility-trace.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 2c53f29dbde5d7848b42bfe3d3c44054d01f153f

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Add style trace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/js/browser_e2e_test.mjs')
          text = p.read_text()
          old = '    await recoverablePair.a.disconnectSocket()\n    await recoverablePair.a.page.locator("#presence", {hasText: "Reconnecting…"}).waitFor({state: "visible"})\n'
          new = r'''    await recoverablePair.a.disconnectSocket()
              await recoverablePair.a.page.waitForFunction(() => document.querySelector("#presence")?.textContent?.includes("Reconnecting"))
              const presenceStyleTrace = await recoverablePair.a.page.locator("#presence").evaluate((node) => {
                const chain = []
                let current = node
                while (current && chain.length < 12) {
                  const style = getComputedStyle(current)
                  const rect = current.getBoundingClientRect()
                  chain.push({
                    tag: current.tagName,
                    id: current.id || null,
                    className: typeof current.className === "string" ? current.className : null,
                    hidden: Boolean(current.hidden),
                    display: style.display,
                    visibility: style.visibility,
                    opacity: style.opacity,
                    position: style.position,
                    zIndex: style.zIndex,
                    overflow: style.overflow,
                    width: rect.width,
                    height: rect.height,
                    clientRects: current.getClientRects().length
                  })
                  current = current.parentElement
                }
                const rect = node.getBoundingClientRect()
                const x = rect.left + rect.width / 2
                const y = rect.top + rect.height / 2
                const hit = rect.width > 0 && rect.height > 0 ? document.elementFromPoint(x, y) : null
                return {
                  text: node.textContent,
                  hidden: node.hidden,
                  checkVisibility: typeof node.checkVisibility === "function" ? node.checkVisibility({checkOpacity: true, checkVisibilityCSS: true}) : null,
                  point: {x, y},
                  hit: hit ? {tag: hit.tagName, id: hit.id || null, className: typeof hit.className === "string" ? hit.className : null} : null,
                  chain
                }
              })
              console.log(`[PRESENCE_STYLE_TRACE] ${JSON.stringify(presenceStyleTrace)}`)
              await recoverablePair.a.page.locator("#presence", {hasText: "Reconnecting…"}).waitFor({state: "visible"})
          '''
          # Normalize the diagnostic block's indentation back to the test's 4-space body indent.
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
            raise SystemExit(f'expected one reconnect wait, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Prepare database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-presence-phoenix.log 2>&1 &
          echo $! > /tmp/k2-presence-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/k2-presence-phoenix.pid)" 2>/dev/null; then cat /tmp/k2-presence-phoenix.log; exit 1; fi
            sleep 1
          done
          cat /tmp/k2-presence-phoenix.log
          exit 1
      - name: Run reconnect presence scenario
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='Feature 1L E2E-2' test/js/browser_e2e_test.mjs 2>&1 | tee /tmp/k2-presence.tap
      - name: Build trace report
        if: always()
        shell: bash
        run: |
          {
            grep -F '[PRESENCE_STYLE_TRACE]' /tmp/k2-presence.tap || true
            grep -E '^# (tests|pass|fail|duration_ms) |^not ok ' /tmp/k2-presence.tap || true
          } | tee /tmp/k2-presence-report.txt
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-presence-visibility-trace
          path: /tmp/k2-presence-report.txt
          retention-days: 7
      - name: Stop Phoenix
        if: always()
        run: if [ -f /tmp/k2-presence-phoenix.pid ]; then kill "$(cat /tmp/k2-presence-phoenix.pid)" 2>/dev/null || true; fi
