name: Team 4 Race Hardening Executor

on:
  push:
    branches:
      - newteam/media-race-hardening-executor

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden canonical async call authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          live = Path('priv/static/assets/live_call.mjs')
          s = live.read_text()

          def once(old, new, label):
              global s
              if new in s:
                  return
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 old block, found {n}')
              s = s.replace(old, new, 1)

          once(
          '''    this.transportAudioTransceiver = null
    this.transportVideoTransceiver = null
    this.activeMediaAcquisitionGeneration = 0
''',
          '''    this.transportAudioTransceiver = null
    this.transportVideoTransceiver = null
    this.activeMediaAcquisitionGeneration = 0
    this.callOperationGeneration = 0
''',
          'operation generation state')

          once(
          '''  setConversationId(id) {
    this.conversationId = id
  }
''',
          '''  setConversationId(id) {
    if (this.conversationId !== id) this.callOperationGeneration++
    this.conversationId = id
  }
''',
          'conversation invalidation')

          old_i = '''    const initiationConversationId = this.conversationId
    return new Promise((resolve, reject) => {
      if (!this.channel) return reject(new Error("Channel unavailable"))
      this.channel.push("call:initiate", { call_type: callType })
        .receive("ok", (res) => {
          const stillCurrent =
            this.status === CALL_STATUS.PENDING_OUTGOING &&
            this.role === "caller" &&
            this.callAttemptId === null &&
            this.conversationId === initiationConversationId
          if (!stillCurrent) { resolve({ ...res, stale: true }); return }
          this.callAttemptId = res.call_attempt_id
          this.notifyStateChange()
          resolve(res)
        })
        .receive("error", (err) => {
          if (this.status === CALL_STATUS.PENDING_OUTGOING && this.role === "caller" && this.callAttemptId === null && this.conversationId === initiationConversationId) {
            this.teardown("initiate_failed")
          }
          reject(err)
        })
    })
'''
          new_i = '''    const operationGeneration = ++this.callOperationGeneration
    const initiationConversationId = this.conversationId
    const stillCurrent = () =>
      this.callOperationGeneration === operationGeneration &&
      this.status === CALL_STATUS.PENDING_OUTGOING &&
      this.role === "caller" &&
      this.callAttemptId === null &&
      this.conversationId === initiationConversationId

    return new Promise((resolve, reject) => {
      if (!this.channel) return reject(new Error("Channel unavailable"))
      this.channel.push("call:initiate", { call_type: callType })
        .receive("ok", (res) => {
          if (!stillCurrent()) { resolve({ ...res, stale: true }); return }
          this.callAttemptId = res.call_attempt_id
          this.notifyStateChange()
          resolve(res)
        })
        .receive("error", (err) => {
          if (!stillCurrent()) { resolve({ stale: true, error: err }); return }
          this.teardown("initiate_failed")
          reject(err)
        })
        .receive("timeout", () => {
          if (!stillCurrent()) { resolve({ stale: true, timeout: true }); return }
          this.teardown("initiate_timeout")
          reject(new Error("Call initiation timed out"))
        })
    })
'''
          once(old_i, new_i, 'initiate operation authority')

          old_a = '''    const acceptedAttemptId = this.callAttemptId
    const acceptedConversationId = this.conversationId
    return new Promise((resolve, reject) => {
      if (!this.channel) return reject(new Error("Channel unavailable"))
      this.channel.push("call:accept", { call_attempt_id: acceptedAttemptId })
        .receive("ok", (res) => {
          const stillCurrent = this.status === CALL_STATUS.PENDING_INCOMING && this.callAttemptId === acceptedAttemptId && this.conversationId === acceptedConversationId
          if (!stillCurrent) { resolve({ ...res, stale: true }); return }
          this.status = CALL_STATUS.CONNECTING
          this.applyOutgoingAudioGate()
          this.notifyStateChange()
          resolve(res)
        })
        .receive("error", (err) => {
          if (this.status === CALL_STATUS.PENDING_INCOMING && this.callAttemptId === acceptedAttemptId && this.conversationId === acceptedConversationId) {
            this.teardown("accept_failed")
          }
          reject(err)
        })
    })
'''
          new_a = '''    const operationGeneration = ++this.callOperationGeneration
    const acceptedAttemptId = this.callAttemptId
    const acceptedConversationId = this.conversationId
    const stillCurrent = () =>
      this.callOperationGeneration === operationGeneration &&
      this.status === CALL_STATUS.PENDING_INCOMING &&
      this.callAttemptId === acceptedAttemptId &&
      this.conversationId === acceptedConversationId

    return new Promise((resolve, reject) => {
      if (!this.channel) return reject(new Error("Channel unavailable"))
      this.channel.push("call:accept", { call_attempt_id: acceptedAttemptId })
        .receive("ok", (res) => {
          if (!stillCurrent()) { resolve({ ...res, stale: true }); return }
          this.status = CALL_STATUS.CONNECTING
          this.applyOutgoingAudioGate()
          this.notifyStateChange()
          resolve(res)
        })
        .receive("error", (err) => {
          if (!stillCurrent()) { resolve({ stale: true, error: err }); return }
          this.teardown("accept_failed")
          reject(err)
        })
        .receive("timeout", () => {
          if (!stillCurrent()) { resolve({ stale: true, timeout: true }); return }
          this.teardown("accept_timeout")
          reject(new Error("Call acceptance timed out"))
        })
    })
'''
          once(old_a, new_a, 'accept operation authority')

          once(
          '''  teardown(reason = "normal") {
    if (this.connectingTimer) {
''',
          '''  teardown(reason = "normal") {
    this.callOperationGeneration++
    if (this.connectingTimer) {
''',
          'teardown operation invalidation')
          live.write_text(s)

          tests = Path('test/js/team4_media_authority_test.mjs')
          t = tests.read_text()
          if 'T4-011: Conversation A async completion cannot mutate Conversation B' not in t:
              t += r'''

test("T4-008: late Initiate error cannot teardown a newer authoritative call", async () => {
  const pushes = []
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push() { const push = controllablePush(); pushes.push(push); return push }}})
  const oldPending = coord.initiate("voice")
  coord.teardown("blocked")
  coord.status = CALL_STATUS.IDLE
  const newPending = coord.initiate("voice")
  pushes[0].fire("error", {reason: "late_old_error"})
  const oldResult = await oldPending
  assert.equal(oldResult.stale, true)
  assert.equal(coord.status, CALL_STATUS.PENDING_OUTGOING)
  assert.equal(coord.callAttemptId, null)
  pushes[1].fire("ok", {call_attempt_id: "new-authoritative"})
  await newPending
  assert.equal(coord.callAttemptId, "new-authoritative")
})

test("T4-009: late Accept error cannot teardown a newer incoming call", async () => {
  const pushes = []
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push() { const push = controllablePush(); pushes.push(push); return push }}})
  coord.callAttemptId = "old"; coord.role = "callee"; coord.status = CALL_STATUS.PENDING_INCOMING
  const oldPending = coord.accept()
  coord.teardown("ended")
  coord.status = CALL_STATUS.IDLE
  coord.handleIncomingCall({call_attempt_id: "new", caller_id: "p2", call_type: "voice"})
  pushes[0].fire("error", {reason: "late_old_error"})
  const oldResult = await oldPending
  assert.equal(oldResult.stale, true)
  assert.equal(coord.callAttemptId, "new")
  assert.equal(coord.status, CALL_STATUS.PENDING_INCOMING)
})

test("T4-010: Accept reapplies outgoing-audio privacy gate before CONNECTING", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push() { return push }}})
  const audio = {kind: "audio", enabled: true, stop() {}}
  coord.rawAudioTrack = audio
  coord.callAttemptId = "a1"; coord.role = "callee"; coord.status = CALL_STATUS.PENDING_INCOMING
  const pending = coord.accept()
  push.fire("ok", {call_attempt_id: "a1"})
  await pending
  assert.equal(coord.status, CALL_STATUS.CONNECTING)
  assert.equal(audio.enabled, false)
})

test("T4-011: Conversation A async completion cannot mutate Conversation B", async () => {
  const pushes = []
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "conversation-a", channel: {push() { const push = controllablePush(); pushes.push(push); return push }}})
  const pendingA = coord.initiate("voice")
  coord.teardown("ended")
  coord.status = CALL_STATUS.IDLE
  coord.setConversationId("conversation-b")
  const pendingB = coord.initiate("voice")
  pushes[0].fire("ok", {call_attempt_id: "attempt-a"})
  const resultA = await pendingA
  assert.equal(resultA.stale, true)
  assert.equal(coord.conversationId, "conversation-b")
  assert.equal(coord.callAttemptId, null)
  assert.equal(coord.status, CALL_STATUS.PENDING_OUTGOING)
  pushes[1].fire("ok", {call_attempt_id: "attempt-b"})
  await pendingB
  assert.equal(coord.callAttemptId, "attempt-b")
})

test("T4-006E: late Accept success after ordinary End is inert", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push() { return push }}})
  coord.callAttemptId = "a1"; coord.role = "callee"; coord.status = CALL_STATUS.PENDING_INCOMING
  const pending = coord.accept()
  coord.teardown("ended")
  push.fire("ok", {call_attempt_id: "a1"})
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
})

test("T4-007B: late Initiate success after Block is inert", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push() { return push }}})
  const pending = coord.initiate("voice")
  coord.teardown("blocked")
  push.fire("ok", {call_attempt_id: "dead-attempt"})
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
  assert.notEqual(coord.status, CALL_STATUS.ACTIVE)
})
'''
              tests.write_text(t)
          PY
          node --test --test-concurrency=1 test/js/team4_media_authority_test.mjs test/js/live_call_test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priv/static/assets/live_call.mjs test/js/team4_media_authority_test.mjs
          git commit -m 'Team 4: scope live-call async authority by operation generation'
          git pull --rebase origin newteam/media
          git push origin HEAD:newteam/media
