name: K2 TURN Port Probe

on:
  push:
    branches:
      - diagnostics/turn-port-2026-08-29
    paths:
      - .github/workflows/k2-turn-port-probe.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 2c53f29dbde5d7848b42bfe3d3c44054d01f153f

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Prove exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install app dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove baseline TURN listener is absent
        shell: bash
        run: |
          set -euo pipefail
          if ss -lntu | grep -Eq ':3478[[:space:]]'; then
            echo 'TURN_BASELINE_LISTENER=present'
            exit 1
          fi
          echo 'TURN_BASELINE_LISTENER=absent'
      - name: Start configured coturn matching test credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          sudo systemctl stop coturn 2>/dev/null || true
          sudo pkill -x turnserver 2>/dev/null || true
          for attempt in $(seq 1 10); do
            if ! ss -lntu | grep -Eq ':3478[[:space:]]'; then break; fi
            sleep 1
          done
          if ss -lntu | grep -Eq ':3478[[:space:]]'; then
            echo 'TURN_PORT_NOT_RELEASED_AFTER_PACKAGE_SERVICE_STOP'
            sudo ss -lntup | grep ':3478' || true
            exit 1
          fi
          cat > /tmp/turnserver.conf <<'EOF'
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          fingerprint
          use-auth-secret
          static-auth-secret=team6-test-only-coturn-secret
          realm=strangertalks.test
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          EOF
          sudo turnserver -c /tmp/turnserver.conf > /tmp/k2-coturn.log 2>&1 &
          pid=$!
          echo "$pid" > /tmp/k2-coturn.pid
          for attempt in $(seq 1 30); do
            if ! sudo kill -0 "$pid" 2>/dev/null; then
              echo 'CONFIGURED_TURN_PROCESS_EXITED'
              cat /tmp/k2-coturn.log
              exit 1
            fi
            if sudo ss -lunp | grep ':3478' | grep -Fq 'turnserver'; then
              echo "TURN_CONFIGURED_PID=$pid"
              sudo ss -lunp | grep ':3478'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/k2-coturn.log
          exit 1
      - name: Add ACTIVE proof gates to targeted scenarios
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/js/browser_e2e_test.mjs')
          text = path.read_text()
          active = '''    await pair.a.page.locator("#live-call-status").filter({hasText: "Call Active"}).waitFor({state: "visible"})
          await pair.b.page.locator("#live-call-status").filter({hasText: "Call Active"}).waitFor({state: "visible"})

          '''
          for marker in [
              '    // Video active: Return to Voice button is visible\n',
              '    // A sends Heart reaction\n',
              '    // In active call, Ring has active class\n',
          ]:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected unique marker {marker!r}, found {text.count(marker)}')
              text = text.replace(marker, active + marker, 1)
          path.write_text(text)
          PY
      - name: Prepare isolated browser database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-turn-phoenix.log 2>&1 &
          echo $! > /tmp/k2-turn-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/k2-turn-phoenix.pid)" 2>/dev/null; then
              cat /tmp/k2-turn-phoenix.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/k2-turn-phoenix.log
          exit 1
      - name: Run 85 86 87 with real TURN and ACTIVE proof
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='Feature 1Q E2E-(RTV|REACTION|RING)' test/js/browser_e2e_test.mjs 2>&1 | tee /tmp/k2-turn-proof.tap
      - name: Report targeted TAP
        if: always()
        shell: bash
        run: |
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) |^not ok |^ok ' /tmp/k2-turn-proof.tap || true
          echo '--- CONFIGURED COTURN LOG TAIL ---'
          tail -100 /tmp/k2-coturn.log || true
      - name: Stop runtimes
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/k2-turn-phoenix.pid ]; then kill "$(cat /tmp/k2-turn-phoenix.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/k2-coturn.pid ]; then sudo kill "$(cat /tmp/k2-coturn.pid)" 2>/dev/null || true; fi
