name: T05 NET 003 Final Hygiene Classification

on:
  push:
    branches:
      - team5/net-003-hygiene-final-f68a

permissions:
  contents: read

jobs:
  candidate-hygiene:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f68a039af2f1267e4222036e787e0954cf8f5266
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Prove exact candidate identity and narrow production diff
        run: |
          set -euo pipefail
          RED=77475e8fc42b4054db5f123bf96a97c9caa6392b
          CANDIDATE=f68a039af2f1267e4222036e787e0954cf8f5266
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^)" = "$RED"
          test -z "$(git status --porcelain)"
          mapfile -t changed < <(git diff --name-only "$RED"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "priv/static/assets/live_call.mjs"
          git diff --check "$RED"...HEAD
          echo 'T05_NET_003_PRODUCTION_DIFF=NARROW_ONE_FILE'
      - name: Prove Team2 server failure surface is byte-identical to RED parent
        run: |
          set -euo pipefail
          RED=77475e8fc42b4054db5f123bf96a97c9caa6392b
          CANDIDATE=f68a039af2f1267e4222036e787e0954cf8f5266

          test "$(git rev-parse "$RED":lib/strangertalks_new/conversation_lifecycle/conversation_server.ex)" = \
               "$(git rev-parse "$CANDIDATE":lib/strangertalks_new/conversation_lifecycle/conversation_server.ex)"
          test "$(git rev-parse "$RED":test/strangertalks_new_web/controllers/team2_normal_media_terminal_test.exs)" = \
               "$(git rev-parse "$CANDIDATE":test/strangertalks_new_web/controllers/team2_normal_media_terminal_test.exs)"

          if git diff --name-only "$RED"..."$CANDIDATE" | grep -E '(^|/).*\.(ex|exs)$|^priv/repo/migrations/'; then
            echo 'UNEXPECTED_SERVER_OR_TEST_DIFF=YES'
            exit 1
          fi
          echo 'TEAM2_SERVER_AND_TEST_SURFACE=BYTE_IDENTICAL_TO_RED_PARENT'
          echo 'PRECOMMIT_TEAM2_FAILURE=OUTSIDE_T05_BROWSER_SOURCE_DELTA'
      - name: Candidate compile hygiene
        run: |
          set -euo pipefail
          mix compile --warnings-as-errors
          echo 'T05_NET_003_COMPILE_WARNINGS_AS_ERRORS=GREEN'
      - name: Compare formatter side effects RED parent vs successor
        run: |
          set -euo pipefail
          RED=77475e8fc42b4054db5f123bf96a97c9caa6392b
          CANDIDATE=f68a039af2f1267e4222036e787e0954cf8f5266

          git checkout --force "$RED"
          git clean -fd
          mix format
          git diff --name-only | sort > /tmp/red-format-paths
          git diff > /tmp/red-format.patch

          git reset --hard "$RED"
          git clean -fd
          git checkout --force "$CANDIDATE"
          mix format
          git diff --name-only | sort > /tmp/successor-format-paths
          git diff > /tmp/successor-format.patch

          echo 'FORMAT_PATHS_BEGIN'
          cat /tmp/successor-format-paths
          echo 'FORMAT_PATHS_END'
          cmp /tmp/red-format-paths /tmp/successor-format-paths
          cmp /tmp/red-format.patch /tmp/successor-format.patch
          if grep -Fxq 'priv/static/assets/live_call.mjs' /tmp/successor-format-paths; then
            echo 'T05_CANDIDATE_FORMAT_DRIFT=YES'
            exit 1
          fi
          echo 'FORMAT_SIDE_EFFECTS=IDENTICAL_PARENT_SUCCESSOR'
      - name: Restore exact successor and prove clean tree
        run: |
          set -euo pipefail
          RED=77475e8fc42b4054db5f123bf96a97c9caa6392b
          CANDIDATE=f68a039af2f1267e4222036e787e0954cf8f5266
          git reset --hard "$CANDIDATE"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git diff --check "$RED"...HEAD
          test -z "$(git status --porcelain)"
          echo 'T05_NET_003_CANDIDATE_HYGIENE=CLEAN'
          echo 'REPOSITORY_PRECOMMIT_CLASSIFICATION=NONDETERMINISTIC_TEAM2_SERVER_LIFECYCLE_FAILURE_OUTSIDE_T05_BROWSER_DIFF'
