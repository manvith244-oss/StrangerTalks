name: K2 Final Integrated Release Matrix

on:
  push:
    branches:
      - release/integration-2026-08-28
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source SHA to test; defaults to the workflow ref SHA
        required: false
        type: string
      browser_group:
        description: Browser authority scope for manual diagnostics
        required: true
        default: all
        type: choice
        options:
          - all
          - composed-e2e

concurrency:
  group: k2-final-integration-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.sha }}
  FROZEN_BASE_SHA: 585637924ff45933c7b35b0bc27719934907c70e
  PRIOR_K_HEAD_SHA: a9e181e3c3d109aad0d7b7b888e4162fd060ff84
  F01_PROVEN_SHA: 048f0be02fc210decb1f6cc5db46504b587f217d
  FX07_PROVEN_SHA: 01d20a8261fed0a490e3c6c1ac723f37f2f19b72
  F04_PROVEN_SHA: 2b0424745414e4eff7c3e56750287c4fafecaad5
  FX05_PROVEN_SHA: 20dee5c0fbebb3117f93e525369659151d537e69
  F09_SOURCE_SHA: 9fdcf4db49185c55331944cd74381dd4c603e7c2
  F10_PROVEN_SHA: ce486b617cbf81b198d6c872ce312dc82ea50ada
  EXCLUDED_PR84_HEAD_SHA: c58da669a82bd89ecfa1d4e154e2415651425387

jobs:
  contracts-and-precommit:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[composed-diagnostic]') || github.event_name == 'workflow_dispatch' && inputs.browser_group == 'all' }}
    name: Contracts + backend + precommit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Exact SHA, merged authorities, excluded lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          for sha in "$FROZEN_BASE_SHA" "$PRIOR_K_HEAD_SHA" "$F01_PROVEN_SHA" "$FX07_PROVEN_SHA" "$F04_PROVEN_SHA" "$FX05_PROVEN_SHA" "$F10_PROVEN_SHA"; do
            echo "ASSERT_ANCESTOR=$sha"
            git merge-base --is-ancestor "$sha" HEAD
          done
          if git merge-base --is-ancestor "$EXCLUDED_PR84_HEAD_SHA" HEAD; then
            echo "Excluded PR #84 head is unexpectedly in candidate ancestry"
            exit 1
          fi
          echo "PR84_EXCLUDED=yes"
      - name: Prove semantically composed F-09 runtime survived
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$F09_SOURCE_SHA" HEAD -- priv/static/assets/mobile_flow.mjs
          echo "F09_RUNTIME_PRESERVED=$F09_SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
      - name: F-02 F-03 F-06 F-07 F-09 F-11 focused contracts
        run: |
          node --test \
            test/js/route_contract_test.mjs \
            test/js/navigation_history_test.mjs \
            test/js/f06_secondary_flow_test.mjs \
            test/js/reflections_test.mjs \
            test/js/f07_loading_transitions_test.mjs \
            test/js/f09_mobile_flow_test.mjs \
            test/js/instagram_chat_test.mjs \
            test/js/f11_persistence_contract_test.mjs \
            test/js/f11_local_data_integration_test.mjs \
            test/js/f11_retained_cleanup_guard_test.mjs
      - name: Expression media terminal stale-callback contracts
        run: |
          node --test \
            test/js/team10_expression_surface_test.mjs \
            test/js/expressive_media_test.mjs \
            test/js/normal_media_test.mjs \
            test/js/voice_notes_test.mjs \
            test/js/terminal_truth_client_test.mjs \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/live_call_test.mjs \
            test/js/reply_quote_test.mjs \
            test/js/reaction_test.mjs \
            test/js/message_edit_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/pin_test.mjs
          node --import ./test/js/browser_module_harness.mjs --test test/js/view_once_test.mjs
      - name: Conversation reconnect delivery messaging JS matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test/js -maxdepth 1 -type f \
            \( -name '*delivery*test.mjs' -o -name '*reconnect*test.mjs' -o -name '*presence*test.mjs' \
               -o -name '*message*test.mjs' -o -name '*atomic_restore*test.mjs' -o -name '*ephemeral_conversation*test.mjs' \) \
            -print | sort)
          test "${#tests[@]}" -gt 0
          printf '%s\n' "${tests[@]}"
          node --test "${tests[@]}"
      - name: Prepare pristine test database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Conversation Matchmaking recovery terminal backend matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test/strangertalks_new test/strangertalks_new_web -type f \
            \( -name '*match*test.exs' -o -name '*queue*test.exs' -o -name '*conversation*test.exs' \
               -o -name '*recovery*test.exs' -o -name '*presence*test.exs' -o -name '*participant_channel_test.exs' \
               -o -name '*session_reconciliation*test.exs' \) -print | sort)
          test "${#tests[@]}" -gt 0
          printf '%s\n' "${tests[@]}"
          mix test "${tests[@]}"
      - name: Full repository precommit
        run: mix precommit
      - name: Contract diff clean exact-SHA proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

  browser-authorities:
    name: Browser ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event_name == 'push' && contains(github.event.head_commit.message, '[composed-diagnostic]') || github.event_name == 'workflow_dispatch' && inputs.browser_group == 'composed-e2e') && '["composed-e2e"]' || '["f01-shell","f03-history","f06-settings","f07-loading","f09-mobile","f10-desktop","f04-cleanup","f04-hostile","fx05-expression","f11-hostile","f11-corrupt-identity","fx07-terminal","conversation-reliability","composed-e2e"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PORT: "4000"
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve exact browser target
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[composed-diagnostic]') || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          target="$TARGET_SHA"
          if [ "${{ github.event_name }}" = "push" ]; then
            target="$GITHUB_SHA"
            while git log -1 --format=%B "$target" | grep -Fq '[composed-diagnostic]'; do
              target="$(git rev-parse "$target^")"
            done
          fi
          git checkout --detach "$target"
          echo "TARGET_SHA=$target" >> "$GITHUB_ENV"
          echo "RESOLVED_BROWSER_TARGET_SHA=$target"
      - name: Exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare isolated browser database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start isolated Phoenix runtime
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-${{ matrix.group }}.log 2>&1 &
          echo $! > /tmp/k2-${{ matrix.group }}.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/k2-${{ matrix.group }}.pid)" 2>/dev/null; then cat /tmp/k2-${{ matrix.group }}.log; exit 1; fi
            sleep 1
          done
          cat /tmp/k2-${{ matrix.group }}.log
          exit 1
      - name: Run isolated same-SHA browser authority
        shell: bash
        run: |
          set -euo pipefail
          tap="/tmp/k2-${{ matrix.group }}.tap"
          case "${{ matrix.group }}" in
            f01-shell) node --test --test-concurrency=1 test/js/f01_app_shell_browser_test.mjs 2>&1 | tee "$tap" ;;
            f03-history) node --test --test-concurrency=1 test/js/navigation_history_browser_test.mjs 2>&1 | tee "$tap" ;;
            f06-settings) node --test --test-concurrency=1 test/js/f06_secondary_flow_browser_test.mjs 2>&1 | tee "$tap" ;;
            f07-loading) node --test --test-concurrency=1 test/js/f07_loading_transitions_browser_test.mjs 2>&1 | tee "$tap" ;;
            f09-mobile) node --test --test-concurrency=1 test/js/f09_mobile_flow_browser_test.mjs 2>&1 | tee "$tap" ;;
            f10-desktop) node --test --test-concurrency=1 test/js/f10_desktop_flow_browser_test.mjs 2>&1 | tee "$tap" ;;
            f04-cleanup) node --test --test-concurrency=1 test/js/f04_conversation_runtime_cleanup_browser_test.mjs 2>&1 | tee "$tap" ;;
            f04-hostile) node --test --test-concurrency=1 test/js/f04_conversation_runtime_hostile_browser_test.mjs 2>&1 | tee "$tap" ;;
            fx05-expression) node --test --test-concurrency=1 test/js/fx05_expression_continuity_browser_test.mjs 2>&1 | tee "$tap" ;;
            f11-hostile) node --test --test-concurrency=1 test/js/f11_browser_hostile_test.mjs 2>&1 | tee "$tap" ;;
            f11-corrupt-identity) node --test --test-concurrency=1 test/js/f11_browser_corrupt_identity_test.mjs 2>&1 | tee "$tap" ;;
            fx07-terminal) node --test --test-concurrency=1 test/js/terminal_truth_browser_test.mjs 2>&1 | tee "$tap" ;;
            conversation-reliability) node --test --test-concurrency=1 test/js/conversation_reliability_browser_test.mjs 2>&1 | tee "$tap" ;;
            composed-e2e) node --test --test-concurrency=1 test/js/browser_e2e_test.mjs 2>&1 | tee "$tap" ;;
            *) echo "Unknown group ${{ matrix.group }}"; exit 1 ;;
          esac
      - name: Publish browser TAP summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tap="/tmp/k2-${{ matrix.group }}.tap"
          summary="/tmp/k2-${{ matrix.group }}-tap-summary.md"
          {
            echo "## Browser TAP summary — ${{ matrix.group }}"
            echo
            echo "- Tested SHA: \`$TARGET_SHA\`"
            if [ ! -s "$tap" ]; then
              echo "- TAP output unavailable: browser authority did not produce a TAP file."
            else
              echo
              echo "### Totals"
              echo '```text'
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' "$tap" || true
              echo '```'
              echo
              echo "### Failing TAP blocks"
              echo '```text'
              awk '
                /^not ok / {
                  if (capture) print ""
                  capture=1
                  print
                  next
                }
                capture && (/^# Subtest:/ || /^ok / || /^1\.\.[0-9]+$/) { capture=0 }
                capture {
                  print
                  if ($0 ~ /^  \.\.\.$/) {
                    capture=0
                    print ""
                  }
                }
              ' "$tap"
              echo '```'
            fi
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser TAP summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-${{ matrix.group }}-tap-summary
          path: /tmp/k2-${{ matrix.group }}-tap-summary.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f /tmp/k2-${{ matrix.group }}.pid ]; then kill "$(cat /tmp/k2-${{ matrix.group }}.pid)" 2>/dev/null || true; fi
      - name: Browser log on failure
        if: failure()
        run: cat /tmp/k2-${{ matrix.group }}.log || true
      - name: Browser clean exact-SHA proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

  final-same-sha-proof:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[composed-diagnostic]') || github.event_name == 'workflow_dispatch' && inputs.browser_group == 'all' }}
    name: Final same-SHA diff clean live-head proof
    needs: [contracts-and-precommit, browser-authorities]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Exact final checkout and authority proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          for sha in "$FROZEN_BASE_SHA" "$PRIOR_K_HEAD_SHA" "$F01_PROVEN_SHA" "$FX07_PROVEN_SHA" "$F04_PROVEN_SHA" "$FX05_PROVEN_SHA" "$F10_PROVEN_SHA"; do
            git merge-base --is-ancestor "$sha" HEAD
          done
          if git merge-base --is-ancestor "$EXCLUDED_PR84_HEAD_SHA" HEAD; then exit 1; fi
          git diff --exit-code "$F09_SOURCE_SHA" HEAD -- priv/static/assets/mobile_flow.mjs
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install final proof dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
      - name: Reset DB and rerun full precommit on final SHA
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix precommit
      - name: Diff hygiene no mutation clean tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$FROZEN_BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "K2_WORKING_TREE=clean"
      - name: Tested SHA equals live integration head
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          live="$(git ls-remote --heads origin refs/heads/release/integration-2026-08-28 | awk '{print $1}')"
          echo "K2_TESTED_SHA=$tested"
          echo "K2_LIVE_INTEGRATION_SHA=$live"
          test -n "$live"
          test "$tested" = "$live"
          echo "INTEGRATED CANDIDATE READY FOR RELEASE ATTACK"
