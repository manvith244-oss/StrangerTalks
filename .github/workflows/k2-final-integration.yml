name: Diagnostic stale-callback contracts

on:
  push:
    branches:
      - diag/stale-callback-isolation-2026-08-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: contract-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: team10-expression
            command: node --test test/js/team10_expression_surface_test.mjs
          - name: expressive-media
            command: node --test test/js/expressive_media_test.mjs
          - name: normal-media
            command: node --test test/js/normal_media_test.mjs
          - name: voice-notes
            command: node --test test/js/voice_notes_test.mjs
          - name: terminal-truth-client
            command: node --test test/js/terminal_truth_client_test.mjs
          - name: session-reconciliation
            command: node --test test/js/session_reconciliation_guard_test.mjs
          - name: live-call
            command: node --test test/js/live_call_test.mjs
          - name: reply-quote
            command: node --test test/js/reply_quote_test.mjs
          - name: reaction
            command: node --test test/js/reaction_test.mjs
          - name: message-edit
            command: node --test test/js/message_edit_test.mjs
          - name: message-unsend
            command: node --test test/js/message_unsend_test.mjs
          - name: pin
            command: node --test test/js/pin_test.mjs
          - name: view-once
            command: node --import ./test/js/browser_module_harness.mjs --test test/js/view_once_test.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run unchanged contract
        run: ${{ matrix.command }}
