name: F-04 Verified Runtime Closure V3

on:
  push:
    branches:
      - f04/conversation-continuity-2026-08-26
    paths:
      - ".github/workflows/f04-apply-runtime-fix-v3.yml"

permissions:
  contents: write

jobs:
  close_runtime_domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: _f04_closure_v3
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Correct hostile probe semantics only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/js/f04_conversation_runtime_hostile_browser_test.mjs")
          text = path.read_text()

          old_on = '''    const originalOn = channel.on.bind(channel)
          channel.on = function(event, callback) {
            const ref = originalOn(event, callback)
            const key = String(event) + ":" + String(ref)
            if (!metrics.listenerRefs[topic][key]) {
              metrics.listenerRefs[topic][key] = true
              metrics.listenerOn += 1
              metrics.activeListeners += 1
              metrics.maxActiveListeners = Math.max(metrics.maxActiveListeners, metrics.activeListeners)
            }
            return ref
          }
          '''
          new_on = '''    const isApplicationListenerEvent = (event) => {
            const name = String(event)
            return !name.startsWith("phx_") && !name.startsWith("chan_reply_")
          }

          const originalOn = channel.on.bind(channel)
          channel.on = function(event, callback) {
            const ref = originalOn(event, callback)
            if (!isApplicationListenerEvent(event)) return ref
            const key = String(event) + ":" + String(ref)
            if (!metrics.listenerRefs[topic][key]) {
              metrics.listenerRefs[topic][key] = true
              metrics.listenerOn += 1
              metrics.activeListeners += 1
              metrics.maxActiveListeners = Math.max(metrics.maxActiveListeners, metrics.activeListeners)
            }
            return ref
          }
          '''
          if text.count(old_on) != 1:
              raise SystemExit(f"listener-on probe anchor mismatch: {text.count(old_on)}")
          text = text.replace(old_on, new_on, 1)

          old_off = '''    const originalOff = channel.off.bind(channel)
          channel.off = function(event, ref) {
            const key = String(event) + ":" + String(ref)
            if (metrics.listenerRefs[topic][key]) {
              delete metrics.listenerRefs[topic][key]
              metrics.listenerOff += 1
              metrics.activeListeners -= 1
            }
            return originalOff(event, ref)
          }
          '''
          new_off = '''    const originalOff = channel.off.bind(channel)
          channel.off = function(event, ref) {
            if (isApplicationListenerEvent(event)) {
              const key = String(event) + ":" + String(ref)
              if (metrics.listenerRefs[topic][key]) {
                delete metrics.listenerRefs[topic][key]
                metrics.listenerOff += 1
                metrics.activeListeners -= 1
              }
            }
            return originalOff(event, ref)
          }
          '''
          if text.count(old_off) != 1:
              raise SystemExit(f"listener-off probe anchor mismatch: {text.count(old_off)}")
          text = text.replace(old_off, new_off, 1)

          old_voice = '''  voiceRecord(conversationId, voiceNoteId) {
            return getRecord("voice:" + conversationId + ":" + voiceNoteId)
          }
          '''
          new_voice = '''  async voiceRecord(conversationId, voiceNoteId) {
            return (await getRecord("voice:" + conversationId + ":" + voiceNoteId)) ?? null
          }
          '''
          if text.count(old_voice) != 1:
              raise SystemExit(f"voice probe anchor mismatch: {text.count(old_voice)}")
          text = text.replace(old_voice, new_voice, 1)

          path.write_text(text)
          PY

          node --check test/js/f04_conversation_runtime_hostile_browser_test.mjs
          git diff --check
          test "$(git diff --name-only)" = "test/js/f04_conversation_runtime_hostile_browser_test.mjs"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare RED database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for RED proof
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint_config, :server, true))
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 16))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f04-v3-red-server.log 2>&1 &
          echo $! > /tmp/f04-v3-red-server.pid
          for attempt in $(seq 1 45); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f04-v3-red-server.pid)" 2>/dev/null; then cat /tmp/f04-v3-red-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/f04-v3-red-server.log
          exit 1

      - name: Refined hostile contract is RED before product fix
        id: refined_red
        continue-on-error: true
        run: >-
          node --test
          --test-name-pattern="canonical AVAILABLE evicts stale Conversation runtime authority"
          test/js/f04_conversation_runtime_hostile_browser_test.mjs

      - name: Require genuine RED
        shell: bash
        run: |
          set -euo pipefail
          echo "refined_red_outcome=${{ steps.refined_red.outcome }}"
          test '${{ steps.refined_red.outcome }}' = failure

      - name: Stop RED Phoenix
        run: |
          if [ -f /tmp/f04-v3-red-server.pid ]; then
            kill "$(cat /tmp/f04-v3-red-server.pid)" 2>/dev/null || true
          fi

      - name: Apply minimal F-04 runtime authority correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("priv/static/assets/app.js")
          text = path.read_text()

          if "const releasedConversationChannels = new WeakSet()" in text:
              raise SystemExit("runtime correction already present unexpectedly")

          start = text.index("function releaseConversationRuntime() {")
          end = text.index("\nfunction isQuietModeActive()", start)
          replacement = '''const releasedConversationChannels = new WeakSet()

          function releaseConversationChannel(channel) {
            if (!channel || releasedConversationChannels.has(channel)) return
            releasedConversationChannels.add(channel)
            try { channel.__f04ReleaseRuntimeBindings?.() } catch (_) {}
            try { channel.leave() } catch (_) {}
          }

          function releaseConversationRuntime({conversationId = app.conversationId, channel = app.conversation} = {}) {
            const targetsCurrent = Boolean(conversationId || channel) && app.conversation === channel && app.conversationId === conversationId
            if (targetsCurrent) {
              clearConversationTypingRuntime()
              app.conversation = null
              app.conversationId = null
              app.currentEpochId = null
              app.matchedTransition.release(conversationId)
            }
            releaseConversationChannel(channel)
            return targetsCurrent
          }
          '''
          text = text[:start] + replacement + text[end:]

          start = text.index("async function reconcileWithServer(")
          end = text.index("async function invalidateStaleActiveConversations", start)
          reconcile = text[start:end]
          queued = '  } else if (snapshot.canonical_state === "QUEUED" && snapshot.queue) {\n'
          if reconcile.count(queued) != 1:
              raise SystemExit("queued branch anchor mismatch")
          reconcile = reconcile.replace(queued, queued + '    if (app.conversation || app.conversationId) releaseConversationRuntime()\n', 1)
          available = '  } else {\n    bindQueueAttempt(null)\n'
          if reconcile.count(available) != 1:
              raise SystemExit("available branch anchor mismatch")
          reconcile = reconcile.replace(available, '  } else {\n    if (app.conversation || app.conversationId) releaseConversationRuntime()\n    bindQueueAttempt(null)\n', 1)
          text = text[:start] + reconcile + text[end:]

          start = text.index("async function joinConversation(id) {")
          end = text.index("async function handleMatchedConversation", start)
          join = text[start:end]

          header_start = join.index('  app.conversation = app.socket.channel(`conversation:${id}`, {')
          header_end = join.index('\n\n  app.conversation.on("conversation:presence"', header_start)
          header = '''  const channel = app.socket.channel(`conversation:${id}`, {
            epoch_id: clientEpochId,
            last_applied_sequence: lastAppliedSequence
          })
            app.conversation = channel
            const runtimeBindings = []
            const runtimeIsCurrent = () => app.conversation === channel && app.conversationId === id
            const onCurrent = (event, handler) => {
              const ref = channel.on(event, (...args) => {
                if (!runtimeIsCurrent()) return
                return handler(...args)
              })
              runtimeBindings.push([event, ref])
              return ref
            }
            channel.__f04ReleaseRuntimeBindings = () => {
              for (const [event, ref] of runtimeBindings.splice(0)) {
                try { channel.off(event, ref) } catch (_) {}
              }
            }'''
          join = join[:header_start] + header + join[header_end:]

          binding_count = join.count('app.conversation.on(')
          if binding_count < 10:
              raise SystemExit(f"Conversation listener anchor mismatch: {binding_count}")
          join = join.replace('app.conversation.on(', 'onCurrent(')
          if join.count('  coord.setChannel(app.conversation)\n') != 1 or join.count('  app.conversation.join()\n') != 1:
              raise SystemExit("captured channel anchors mismatch")
          join = join.replace('  coord.setChannel(app.conversation)\n', '  coord.setChannel(channel)\n', 1)
          join = join.replace('  app.conversation.join()\n', '  channel.join()\n', 1)

          voice_line = '    await receiveVoiceNote(note)\n'
          if join.count(voice_line) != 1:
              raise SystemExit("voice callback anchor mismatch")
          join = join.replace(voice_line, '    await receiveVoiceNote(note, {conversationId: id, channel, isCurrent: runtimeIsCurrent})\n    if (!runtimeIsCurrent()) return\n', 1)

          ok_line = '    .receive("ok", async (syncPayload) => {\n'
          if join.count(ok_line) != 1:
              raise SystemExit("join ok anchor mismatch")
          join = join.replace(ok_line, ok_line + '      if (!runtimeIsCurrent()) { releaseConversationChannel(channel); return }\n', 1)
          join = join.replace('      await ensureTemporaryConversation(id)\n', '      await ensureTemporaryConversation(id)\n      if (!runtimeIsCurrent()) return\n', 1)
          join = join.replace('      await renderCachedConversation(id)\n', '      await renderCachedConversation(id)\n      if (!runtimeIsCurrent()) return\n', 1)
          join = join.replace('        await applySyncPayload(id, syncPayload)\n', '        await applySyncPayload(id, syncPayload)\n        if (!runtimeIsCurrent()) return\n', 1)

          error_line = '    .receive("error", async (error) => {\n'
          if join.count(error_line) != 1:
              raise SystemExit("join error anchor mismatch")
          join = join.replace(error_line, error_line + '      if (!runtimeIsCurrent()) { releaseConversationChannel(channel); return }\n      releaseConversationRuntime({conversationId: id, channel})\n', 1)
          text = text[:start] + join + text[end:]

          start = text.index("async function handleMatchedConversation(payload, relationshipId = null) {")
          end = text.index("async function ensureTemporaryConversation", start)
          matched = text[start:end]
          anchor = '  if (!conversationId) return\n'
          if matched.count(anchor) != 1:
              raise SystemExit("matched transition anchor mismatch")
          matched = matched.replace(anchor, anchor + '  if (app.conversation || app.conversationId) releaseConversationRuntime()\n', 1)
          text = text[:start] + matched + text[end:]

          start = text.index("async function receiveVoiceNote(note) {")
          end = text.index("\nfunction updateVoiceNoteStatus", start)
          voice = text[start:end]
          original_ack = 'push(app.conversation, "voice_note:ack"'
          if voice.count(original_ack) != 2:
              raise SystemExit(f"expected two voice-note acknowledgement paths, found {voice.count(original_ack)}")
          voice = voice.replace('async function receiveVoiceNote(note) {\n', '''async function receiveVoiceNote(note, runtime = null) {
            const conversationId = runtime?.conversationId || app.conversationId
            const channel = runtime?.channel || app.conversation
            const runtimeIsCurrent = runtime?.isCurrent || (() => app.conversationId === conversationId && app.conversation === channel)
            if (!runtimeIsCurrent()) return
          ''', 1)
          voice = voice.replace('  const id = `voice:${app.conversationId}:${note.voice_note_id}`\n', '  const id = `voice:${conversationId}:${note.voice_note_id}`\n', 1)
          voice = voice.replace('  const existing = await getRecord(id)\n', '  const existing = await getRecord(id)\n  if (!runtimeIsCurrent()) return\n', 1)
          voice = voice.replace(original_ack, 'push(channel, "voice_note:ack"')
          voice = voice.replace('/api/conversations/${app.conversationId}/voice-notes/', '/api/conversations/${conversationId}/voice-notes/')
          voice = voice.replace('    if (!response.ok) throw new Error("download_failed")\n', '    if (!runtimeIsCurrent()) return\n    if (!response.ok) throw new Error("download_failed")\n', 1)
          voice = voice.replace('    const blob = await response.blob()\n', '    const blob = await response.blob()\n    if (!runtimeIsCurrent()) return\n', 1)
          voice = voice.replace('conversation_id: app.conversationId', 'conversation_id: conversationId')
          voice = voice.replace('    try { await putRecord(record) } catch { announce("Voice note received, but it may not survive refresh because local storage is unavailable.") }\n', '    try { await putRecord(record) } catch { if (runtimeIsCurrent()) announce("Voice note received, but it may not survive refresh because local storage is unavailable.") }\n    if (!runtimeIsCurrent()) return\n', 1)
          voice = voice.replace('    requestAnimationFrame(() => { if (shouldFollow) scrollTimelineToNewest({smooth: true}); else $("#new-messages").hidden = false })\n', '    requestAnimationFrame(() => { if (!runtimeIsCurrent()) return; if (shouldFollow) scrollTimelineToNewest({smooth: true}); else $("#new-messages").hidden = false })\n', 1)
          voice = voice.replace('  } catch { announce("A voice note could not be downloaded before it expired.") }\n', '  } catch { if (runtimeIsCurrent()) announce("A voice note could not be downloaded before it expired.") }\n', 1)
          text = text[:start] + voice + text[end:]

          path.write_text(text)
          PY

          node --check priv/static/assets/app.js
          node --check test/js/f04_conversation_runtime_hostile_browser_test.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = $'priv/static/assets/app.js\ntest/js/f04_conversation_runtime_hostile_browser_test.mjs'

      - name: Reset database for GREEN proof
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Relevant Conversation regressions
        run: |
          mix test \
            test/strangertalks_new/conversation_lifecycle_test.exs \
            test/strangertalks_new/conversation_isolation_test.exs \
            test/strangertalks_new_web/channels/conversation_terminal_channel_test.exs \
            test/strangertalks_new_web/channels/conversation_presence_channel_test.exs

      - name: Full mix precommit
        run: mix precommit

      - name: Start Phoenix for GREEN proof
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint_config, :server, true))
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 16))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f04-v3-green-server.log 2>&1 &
          echo $! > /tmp/f04-v3-green-server.pid
          for attempt in $(seq 1 45); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f04-v3-green-server.pid)" 2>/dev/null; then cat /tmp/f04-v3-green-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/f04-v3-green-server.log
          exit 1

      - name: F-04 P0 runtime cleanup GREEN
        run: node --test test/js/f04_conversation_runtime_cleanup_browser_test.mjs

      - name: F-04 hostile runtime matrix GREEN
        run: node --test test/js/f04_conversation_runtime_hostile_browser_test.mjs

      - name: Finalize read-only F-04 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 04dbd9443a2829d20a4e852135ae7cd174c3dac6:.github/workflows/f04-conversation-continuity.yml > .github/workflows/f04-conversation-continuity.yml
          rm -f .github/workflows/f04-apply-runtime-fix-v2.yml
          rm -f .github/workflows/f04-apply-runtime-fix-v3.yml
          node --check priv/static/assets/app.js
          node --check test/js/f04_conversation_runtime_cleanup_browser_test.mjs
          node --check test/js/f04_conversation_runtime_hostile_browser_test.mjs
          git diff --check
          test ! -e .github/workflows/f04-apply-runtime-fix-v2.yml
          test ! -e .github/workflows/f04-apply-runtime-fix-v3.yml
          grep -q '^  contents: read$' .github/workflows/f04-conversation-continuity.yml
          ! grep -q 'contents: write' .github/workflows/f04-conversation-continuity.yml

      - name: Commit verified final F-04 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(f04): isolate Conversation runtime generations"
          git push origin HEAD:f04/conversation-continuity-2026-08-26

      - name: Stop GREEN Phoenix
        if: always()
        run: |
          if [ -f /tmp/f04-v3-green-server.pid ]; then
            kill "$(cat /tmp/f04-v3-green-server.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/f04-v3-red-server.pid ]; then
            kill "$(cat /tmp/f04-v3-red-server.pid)" 2>/dev/null || true
          fi
