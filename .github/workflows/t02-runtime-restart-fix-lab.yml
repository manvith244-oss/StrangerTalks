name: T02 Runtime Restart Fix Lab

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
  workflow_dispatch:

concurrency:
  group: t02-runtime-restart-fix-lab-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fix-lab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact lab commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Prove lab starts from exact T02 semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "LAB_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_CANDIDATE=e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          test "$(git rev-parse HEAD^^)" = "e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          git diff --exit-code e3e86c736ca6ef911bd0023c4877ac68642a48b9..HEAD -- lib/

      - name: Apply candidate fix ephemerally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()

          constants_old = "  @mailbox_soft_limit 100\n  @mailbox_hard_limit 500\n  @release_terminal_statuses"
          constants_new = "  @mailbox_soft_limit 100\n  @mailbox_hard_limit 500\n  @recovery_settle_attempts 1_000\n  @release_terminal_statuses"
          if constants_old not in text:
              raise SystemExit("mailbox constants anchor not found")
          text = text.replace(constants_old, constants_new, 1)

          old = '''  def ensure_started(conversation_id) when is_binary(conversation_id) do
            case lookup(conversation_id) do
              {:ok, pid} ->
                {:ok, pid}

              {:error, :not_started} ->
                case DynamicSupervisor.start_child(
                       StrangertalksNew.ConversationDynamicSupervisor,
                       {__MODULE__, %{conversation_id: conversation_id}}
                     ) do
                  {:ok, pid} -> {:ok, pid}
                  {:error, {:already_started, pid}} -> {:ok, pid}
                  {:error, :already_present} -> lookup(conversation_id)
                  {:error, reason} -> {:error, reason}
                end
            end
          end
          '''

          new = '''  def ensure_started(conversation_id) when is_binary(conversation_id) do
            case lookup(conversation_id) do
              {:ok, pid} ->
                {:ok, pid}

              {:error, :not_started} ->
                ensure_started_after_supervisor_settles(conversation_id, @recovery_settle_attempts)
            end
          end

          defp ensure_started_after_supervisor_settles(conversation_id, attempts) do
            case lookup(conversation_id) do
              {:ok, pid} ->
                {:ok, pid}

              {:error, :not_started} when attempts > 0 ->
                if conversation_supervisor_recovery_in_flight?() do
                  Process.sleep(1)
                  ensure_started_after_supervisor_settles(conversation_id, attempts - 1)
                else
                  start_conversation_child(conversation_id)
                end

              {:error, :not_started} ->
                {:error, :conversation_unavailable}
            end
          end

          defp start_conversation_child(conversation_id) do
            case DynamicSupervisor.start_child(
                   StrangertalksNew.ConversationDynamicSupervisor,
                   {__MODULE__, %{conversation_id: conversation_id}}
                 ) do
              {:ok, pid} -> {:ok, pid}
              {:error, {:already_started, pid}} -> {:ok, pid}
              {:error, :already_present} -> ensure_started(conversation_id)
              {:error, reason} -> {:error, reason}
            end
          end

          defp conversation_supervisor_recovery_in_flight? do
            StrangertalksNew.ConversationDynamicSupervisor
            |> DynamicSupervisor.which_children()
            |> Enum.any?(fn
              {_id, :restarting, _type, _modules} -> true
              {_id, pid, _type, _modules} when is_pid(pid) -> not Process.alive?(pid)
              _child -> false
            end)
          end
          '''

          if old not in text:
              raise SystemExit("ensure_started block anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile patched runtime
        shell: bash
        run: |
          set -euo pipefail
          mix compile --warnings-as-errors

      - name: Hostile convergence regression
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs --seed 0 --trace

      - name: Existing RecoveryRestart stress
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 1 20); do
            echo "RECOVERY_RESTART_SEED=$seed"
            mix test test/strangertalks_new/recovery_restart_test.exs --seed "$seed"
          done

      - name: Preserve automatic recovery contract
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/agent_systems_remediation_test.exs --seed 0

      - name: Focused restart and terminal regressions
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            test/strangertalks_new/runtime_terminal_contract_test.exs \
            test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs \
            --seed 0
