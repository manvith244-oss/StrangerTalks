name: F-10 Desktop Flow Gate

on:
  push:
    branches:
      - f10/desktop-flow-2026-08-27
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: f10-desktop-flow-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      F10_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact checkout identity
        run: |
          checked_out="$(git rev-parse HEAD)"
          echo "F10_EXPECTED_SHA=$F10_EXPECTED_SHA"
          echo "F10_CHECKED_OUT_SHA=$checked_out"
          test "$checked_out" = "$F10_EXPECTED_SHA"
          git status --porcelain | tee /tmp/f10-initial-status
          test ! -s /tmp/f10-initial-status

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f10-desktop-browser.log 2>&1 &
          echo $! > /tmp/f10-desktop-browser.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f10-desktop-browser.pid)" 2>/dev/null; then
              cat /tmp/f10-desktop-browser.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/f10-desktop-browser.log
          exit 1

      - name: F-10 real desktop viewport, resize and keyboard proof
        run: node --test --test-concurrency=1 test/js/f10_desktop_flow_browser_test.mjs

      - name: Upload F-10 desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f10-desktop-flow-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/f10-desktop-flow-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/f10-desktop-browser.pid ]; then
            pid="$(cat /tmp/f10-desktop-browser.pid)"
            kill "$pid" 2>/dev/null || true
          fi

      - name: Full repository precommit
        run: mix precommit

      - name: Final clean tree and exact SHA proof
        run: |
          tested_sha="$(git rev-parse HEAD)"
          git diff --check
          git status --porcelain | tee /tmp/f10-final-status
          test ! -s /tmp/f10-final-status
          test "$tested_sha" = "$F10_EXPECTED_SHA"
          echo "F10_EXPECTED_SHA=$F10_EXPECTED_SHA"
          echo "F10_CHECKED_OUT_SHA=$tested_sha"
          echo "F10_TESTED_SHA=$tested_sha"
          echo "F10_FINAL_SHA=$tested_sha"

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/f10-desktop-browser.log || true
