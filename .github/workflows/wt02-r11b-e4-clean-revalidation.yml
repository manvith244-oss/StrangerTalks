name: WT02 R11B E4 Clean Recorder Revalidation

on:
  push:
    branches:
      - wind-tunnel/wt02-r11b-e4-clean-revalidation

permissions:
  contents: read

jobs:
  clean-recorder-revalidation:
    if: >-
      ${{ github.ref == 'refs/heads/wind-tunnel/wt02-r11b-e4-clean-revalidation' &&
          github.event.before == 'c994a1f87b9928a85ae4663a262b8d6895a5b48e' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      WT02_CONTEXT_RECORDER: "1"
      WT02_TEAM6_SHA: ac867b346426c782b90031b3d770a0d294761065
      WT02_SEED: "972822"
      WT02_POSTGRES_VERSION: "16"
      WT02_ARTIFACT: tmp/wt02-r11-clean.json
      EXPECTED_R4_SHA: c994a1f87b9928a85ae4663a262b8d6895a5b48e

    steps:
      - name: Prove one-shot event identity
        shell: bash
        run: |
          set -euo pipefail
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "WRAPPER_SHA=${GITHUB_SHA}"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
          echo "EVENT_BEFORE=${{ github.event.before }}"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/wind-tunnel/wt02-r11b-e4-clean-revalidation"
          test "${{ github.event.before }}" = "c994a1f87b9928a85ae4663a262b8d6895a5b48e"
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout exact admitted R4 recorder generation
        uses: actions/checkout@v4
        with:
          ref: c994a1f87b9928a85ae4663a262b8d6895a5b48e
          fetch-depth: 1

      - name: Assert exact source-under-test identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_R4_SHA=$EXPECTED_R4_SHA"
          echo "OBSERVED_CHECKOUT_SHA=$actual"
          test "$actual" = "$EXPECTED_R4_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare disposable test database
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Apply exact E4 diagnostic overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exactly_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"overlay anchor mismatch: {path}: expected 1, observed {count}")
              p.write_text(s.replace(old, new, 1))

          helper = "test/test_helper.exs"
          replace_exactly_once(
              helper,
              "ExUnit.start()\n",
              '''ExUnit.start()\n\nif System.get_env("WT02_CONTEXT_RECORDER") == "1" do\n  ExUnit.configure(formatters: [ExUnit.CLIFormatter, StrangertalksNew.WT02ContextRecorder])\nend\n'''
          )

          target = "test/strangertalks_new/relationship_reconnections_test.exs"
          replace_exactly_once(
              target,
              '''  setup do\n    Agent.update(QueueState, fn _ -> %{} end)\n    fixture = relationship_fixture()\n    %{fixture: fixture}\n  end\n''',
              '''  setup context do\n    target? =\n      System.get_env("WT02_CONTEXT_RECORDER") == "1" and\n        String.contains?(\n          to_string(context.test),\n          "concurrent second-intent attempts still create one Match and one Conversation"\n        )\n\n    if target?, do: StrangertalksNew.WT02ContextRecorder.pre_reset()\n    Agent.update(QueueState, fn _ -> %{} end)\n    fixture = relationship_fixture()\n    if target?, do: StrangertalksNew.WT02ContextRecorder.after_setup()\n    %{fixture: fixture}\n  end\n'''
          )

          replace_exactly_once(
              target,
              '''      |> Enum.map(fn {:ok, result} -> result end)\n\n    assert Enum.all?(results, &match?({:ok, %{status: "matched"}}, &1))\n    assert Repo.aggregate(Matching, :count, :match_id) == baseline_matches + 1\n    assert Repo.aggregate(Conversation, :count, :conversation_id) == baseline_conversations + 1\n''',
              '''      |> Enum.map(fn {:ok, result} -> result end)\n\n    diagnostic_result = StrangertalksNew.WT02ContextRecorder.post_race(f, results)\n\n    StrangertalksNew.WT02ContextRecorderTargetGate.after_product_assertions!(\n      diagnostic_result,\n      fn ->\n        assert Enum.all?(results, &match?({:ok, %{status: "matched"}}, &1))\n        assert Repo.aggregate(Matching, :count, :match_id) == baseline_matches + 1\n        assert Repo.aggregate(Conversation, :count, :conversation_id) == baseline_conversations + 1\n      end\n    )\n'''
          )
          PY

      - name: Audit overlay and prove exact target selector
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "--- E4 OVERLAY DIFF ---"
          git diff -- test/test_helper.exs test/strangertalks_new/relationship_reconnections_test.exs
          echo "--- END E4 OVERLAY DIFF ---"

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'test/test_helper.exs'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'test/strangertalks_new/relationship_reconnections_test.exs'

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("test/strangertalks_new/relationship_reconnections_test.exs")
          lines = path.read_text().splitlines()
          wanted = "concurrent second-intent attempts still create one Match and one Conversation"
          starts = []
          for i, line in enumerate(lines, 1):
              m = re.search(r'^\s*test\s+"([^"]+)"', line)
              if m:
                  starts.append((i, m.group(1)))
          matches = [(i, name) for i, name in starts if name == wanted]
          if len(matches) != 1:
              raise SystemExit(f"target title count must be 1, observed {len(matches)}")
          start = matches[0][0]
          next_starts = [i for i, _ in starts if i > start]
          end = (min(next_starts) - 1) if next_starts else len(lines)
          selector_line = 170
          if not (start <= selector_line <= end):
              raise SystemExit(f"selector line {selector_line} is outside target span {start}-{end}")
          print(f"TARGET_SELECTOR_COUNT=1")
          print(f"TARGET_SPAN={start}-{end}")
          print(f"TARGET_SELECTOR=test/strangertalks_new/relationship_reconnections_test.exs:{selector_line}")
          PY

          # Guard the product-authoritative race/assertion law against accidental overlay drift.
          grep -Fq 'diagnostic_result = StrangertalksNew.WT02ContextRecorder.post_race(f, results)' test/strangertalks_new/relationship_reconnections_test.exs
          grep -Fq 'StrangertalksNew.WT02ContextRecorderTargetGate.after_product_assertions!(' test/strangertalks_new/relationship_reconnections_test.exs
          grep -Fq 'Task.async_stream(' test/strangertalks_new/relationship_reconnections_test.exs
          grep -Fq 'timeout: :infinity' test/strangertalks_new/relationship_reconnections_test.exs
          test "$(grep -Fc 'assert Enum.all?(results, &match?({:ok, %{status: "matched"}}, &1))' test/strangertalks_new/relationship_reconnections_test.exs)" -eq 1
          test "$(grep -Fc 'assert Repo.aggregate(Matching, :count, :match_id) == baseline_matches + 1' test/strangertalks_new/relationship_reconnections_test.exs)" -eq 1
          test "$(grep -Fc 'assert Repo.aggregate(Conversation, :count, :conversation_id) == baseline_conversations + 1' test/strangertalks_new/relationship_reconnections_test.exs)" -eq 1

      - name: Compile diagnostic code
        shell: bash
        run: |
          set -euo pipefail
          mix compile
          elixir -e 'Code.string_to_quoted!(File.read!("test/test_helper.exs")); Code.string_to_quoted!(File.read!("test/strangertalks_new/relationship_reconnections_test.exs"))'

      - name: Run clean recorder target exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          echo "TARGET_STARTED=1"
          mix test test/strangertalks_new/relationship_reconnections_test.exs:170 --seed 972822

      - name: Show bounded recorder artifact if present
        if: always()
        shell: bash
        run: |
          if [ -f "$WT02_ARTIFACT" ]; then
            echo "RECORDER_ARTIFACT_PRESENT=1"
            cat "$WT02_ARTIFACT"
          else
            echo "RECORDER_ARTIFACT_PRESENT=0"
          fi

      - name: Upload clean recorder artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wt02-r11b-e4-clean-recorder
          path: tmp/wt02-r11-clean.json
          if-no-files-found: ignore
          retention-days: 7
