name: Team 4 Bootstrap PR Executor

on:
  pull_request:
    branches:
      - release/prep-2026-08-22

permissions:
  contents: write

jobs:
  execute-bootstrap:
    if: ${{ !contains(github.event.pull_request.head.sha, 'never-match') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute checked-in Team 4 bootstrap body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/team4-bootstrap-media-authority.yml').read_text().splitlines()
          marker = '        run: |'
          start = src.index(marker) + 1
          body = []
          for line in src[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/team4-bootstrap.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/team4-bootstrap.sh
