name: Brand Identity Proof

on:
  push:
    branches:
      - brand/strangertalks-master-logo-001
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/brand-identity.yml"
      - "docs/brand/**"
      - "priv/static/index.html"
      - "priv/static/images/**"
      - "test/js/brand_identity_test.mjs"
      - "test/js/brand_identity_browser_test.mjs"
  workflow_dispatch:

concurrency:
  group: brand-identity-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact brand candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove checkout identity
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_BRAND_COMMIT=$expected"
          echo "ACTUAL_BRAND_COMMIT=$actual"
          test "$actual" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Static brand regression
        run: node --test test/js/brand_identity_test.mjs

      - name: Prepare pristine browser database
        run: |
          MIX_ENV=test mix ecto.drop --force
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet

      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-brand-browser.log 2>&1 &
          echo $! > /tmp/strangertalks-brand-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/strangertalks-brand-browser.pid)" 2>/dev/null; then
              cat /tmp/strangertalks-brand-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strangertalks-brand-browser.log
          exit 1

      - name: Desktop and mobile Chromium brand proof
        run: node --test --test-concurrency=1 test/js/brand_identity_browser_test.mjs

      - name: Stop and verify Phoenix browser server
        if: always()
        run: |
          if [ ! -f /tmp/strangertalks-brand-browser.pid ]; then
            echo "browser server pid file missing"
            exit 1
          fi
          pid="$(cat /tmp/strangertalks-brand-browser.pid)"
          kill "$pid" 2>/dev/null || true
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "browser server did not stop cleanly"
            cat /tmp/strangertalks-brand-browser.log || true
            kill -9 "$pid" 2>/dev/null || true
            exit 1
          fi
          if curl -fsS http://localhost:4000/ >/dev/null 2>&1; then
            echo "browser server is still accepting connections"
            exit 1
          fi
          echo "Phoenix browser server stopped"

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/strangertalks-brand-browser.log || true

      - name: Upload brand screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-identity-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/brand-identity-proof
          if-no-files-found: warn

      - name: Reset pristine test database before precommit
        run: |
          MIX_ENV=test mix ecto.drop --force
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet

      - name: Full precommit
        run: mix precommit

      - name: Diff hygiene
        run: git diff --check

      - name: Prove no tracked mutation
        run: git diff --exit-code

      - name: Prove clean tree
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
          echo "working tree clean"

      - name: Prove tested commit remains branch head
        if: github.event_name == 'push'
        run: |
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote --heads origin refs/heads/brand/strangertalks-master-logo-001 | awk '{print $1}')"
          echo "TESTED_BRAND_COMMIT=$actual"
          echo "LIVE_BRAND_BRANCH_HEAD=$remote"
          test -n "$remote"
          test "$actual" = "$remote"
