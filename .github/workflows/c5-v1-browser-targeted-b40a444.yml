name: C5 V1 Fresh Media Cleanup Browser Proof

on:
  push:
    branches:
      - evidence/c5-v1-browser-targeted-b40a444-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
  TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051
  MIX_ENV: test
  PORT: "4000"
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  media-cleanup-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout immutable exact main
        uses: actions/checkout@v4
        with:
          ref: b40a44428705ec566949c9bf8eb186cc3f5908c2
          fetch-depth: 0
      - name: Prove immutable subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          npm ci --silent
          npx playwright install --with-deps chromium >/tmp/c5-playwright-install.log 2>&1
      - name: Start fresh isolated database and Phoenix
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          STRANGERTALKS_PERSISTENT_TEST_SERVER=1 mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/c5-media-cleanup-phoenix.log 2>&1 &
          echo $! >/tmp/c5-media-cleanup-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/c5-media-cleanup-phoenix.pid)" 2>/dev/null; then
              cat /tmp/c5-media-cleanup-phoenix.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/c5-media-cleanup-phoenix.log
          exit 1
      - name: Same terminal media-cleanup assertion on uncontaminated runner
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s node --test --test-concurrency=1 \
            --test-name-pattern='Team 3: terminal state clears staged reply and open expressive surface' \
            test/js/team3_conversation_experience_gate_test.mjs
          echo C5_MEDIA_CLEANUP_FRESH=PASS
      - name: Server log on failure
        if: failure()
        run: tail -n 250 /tmp/c5-media-cleanup-phoenix.log || true
      - name: Deterministic cleanup
        if: always()
        run: |
          set +e
          if [ -f /tmp/c5-media-cleanup-phoenix.pid ]; then
            pid="$(cat /tmp/c5-media-cleanup-phoenix.pid)"
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
          fi
          rm -rf tmp/team3-conversation-experience tmp/playwright-report tmp/test-results
      - name: Exact clean subject
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo C5_MEDIA_CLEANUP_CLEAN_SUBJECT=PASS
