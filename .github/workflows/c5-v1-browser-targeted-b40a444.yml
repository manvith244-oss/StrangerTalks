name: C5 V1 Targeted Chromium Matrix

on:
  push:
    branches:
      - evidence/c5-v1-browser-targeted-b40a444-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
  TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

jobs:
  browser-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b40a44428705ec566949c9bf8eb186cc3f5908c2
          fetch-depth: 0
      - name: Exact subject
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          npm ci --silent
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
      - name: Start exact-main local server
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          STRANGERTALKS_PERSISTENT_TEST_SERVER=1 mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/c5-targeted-phoenix.log 2>&1 &
          echo $! >/tmp/c5-targeted-phoenix.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:4000/ >/dev/null && exit 0
            kill -0 "$(cat /tmp/c5-targeted-phoenix.pid)" 2>/dev/null || { cat /tmp/c5-targeted-phoenix.log; exit 1; }
            sleep 1
          done
          cat /tmp/c5-targeted-phoenix.log
          exit 1
      - name: Targeted real Chromium journeys
        shell: bash
        run: |
          set +e
          failures=0
          run_case() {
            label="$1"; file="$2"; log="/tmp/c5-${label}.log"
            echo "===== ${label}: ${file} ====="
            timeout --signal=TERM --kill-after=10s 120s node --test --test-concurrency=1 "$file" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "C5_CHROMIUM_PASS ${label}"
              tail -n 20 "$log"
            else
              echo "C5_CHROMIUM_FAIL ${label} rc=${rc}"
              tail -n 100 "$log"
              failures=$((failures+1))
            fi
          }
          run_case arrival_brand test/js/brand_identity_browser_test.mjs
          run_case doors test/js/doors_visual_structure_browser_test.mjs
          run_case accessibility test/js/arrival_accessibility_browser_test.mjs
          run_case failed_send_retry test/js/message_failed_retry_browser_test.mjs
          run_case terminal test/js/terminal_truth_browser_test.mjs
          run_case chats_history test/js/t03_history_route_browser_test.mjs
          run_case settings test/js/f06_secondary_flow_browser_test.mjs
          run_case human_authorship test/js/team11_a01_real_browser_proof_test.mjs
          run_case media test/js/normal_media_browser_test.mjs
          run_case mobile test/js/f09_mobile_flow_browser_test.mjs
          run_case desktop test/js/f10_desktop_flow_browser_test.mjs
          echo "C5_CHROMIUM_FAILURE_COUNT=${failures}"
          test "$failures" -eq 0
      - name: Server log on failure
        if: failure()
        run: tail -n 200 /tmp/c5-targeted-phoenix.log || true
      - name: Stop local server
        if: always()
        run: |
          [ -f /tmp/c5-targeted-phoenix.pid ] && kill "$(cat /tmp/c5-targeted-phoenix.pid)" 2>/dev/null || true
      - name: Exact clean subject
        if: always()
        shell: bash
        run: |
          rm -rf tmp/team11-a01-proof-screenshots tmp/playwright-report tmp/test-results 2>/dev/null || true
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
