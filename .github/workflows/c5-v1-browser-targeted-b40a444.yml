name: C5 V1 Browser Evidence Groups A-F

on:
  push:
    branches:
      - evidence/c5-v1-browser-targeted-b40a444-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
  TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

jobs:
  browser-group:
    name: browser-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [A, B, C, D, E, F]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - name: Checkout immutable exact main
        uses: actions/checkout@v4
        with:
          ref: b40a44428705ec566949c9bf8eb186cc3f5908c2
          fetch-depth: 0

      - name: Prove immutable subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact-main dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          npm ci --silent
          npx playwright install --with-deps chromium >/tmp/c5-playwright-install.log 2>&1

      - name: Prepare isolated database and Phoenix
        shell: bash
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          STRANGERTALKS_PERSISTENT_TEST_SERVER=1 mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >"/tmp/c5-browser-${{ matrix.group }}-phoenix.log" 2>&1 &
          echo $! >"/tmp/c5-browser-${{ matrix.group }}-phoenix.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/c5-browser-${{ matrix.group }}-phoenix.pid)" 2>/dev/null; then
              cat "/tmp/c5-browser-${{ matrix.group }}-phoenix.log"
              exit 1
            fi
            sleep 1
          done
          cat "/tmp/c5-browser-${{ matrix.group }}-phoenix.log"
          exit 1

      - name: Execute bounded real-Chromium group
        shell: bash
        run: |
          set -euo pipefail
          echo "C5_BROWSER_GROUP=${{ matrix.group }}"
          case "${{ matrix.group }}" in
            A)
              timeout --signal=TERM --kill-after=10s 180s node --test --test-concurrency=1 \
                test/js/arrival_first_minute_browser_test.mjs \
                test/js/doors_visual_structure_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 90s node --test --test-concurrency=1 \
                --test-name-pattern='Control A: canonical desktop Matching -> Conversation journey' \
                test/js/team11_a01_real_browser_proof_test.mjs
              timeout --signal=TERM --kill-after=10s 100s node --test --test-concurrency=1 \
                --test-name-pattern='hostile delayed ACK retry plus sibling tab still converges before terminal stale events' \
                test/js/conversation_reliability_browser_test.mjs
              ;;
            B)
              timeout --signal=TERM --kill-after=10s 90s node --test --test-concurrency=1 \
                --test-name-pattern='two isolated browsers converge across disconnect, replay, reconnect and terminal end' \
                test/js/conversation_reliability_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 150s node --test --test-concurrency=1 \
                test/js/message_failed_retry_browser_test.mjs
              mkdir -p tmp
              cat > tmp/c5_blank_start_browser.mjs <<'EOF'
          import assert from "node:assert/strict"
          import fs from "node:fs"
          import {chromium} from "playwright"
          const BASE = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          async function bootstrap(page) {
            await page.goto(`${BASE}/health/live`, {waitUntil: "domcontentloaded"})
            return page.evaluate(async () => {
              const {Socket} = await import("/vendor/phoenix.mjs")
              const identity = await fetch("/api/participants", {method: "POST", headers: {"content-type": "application/json"}, body: "{}"}).then(async r => {
                if (!r.ok) throw new Error(`participant bootstrap ${r.status}`)
                return r.json()
              })
              const socket = new Socket("/socket", {authToken: () => identity.token, timeout: 5000, reconnectAfterMs: () => 100, rejoinAfterMs: () => 100})
              const matches = []
              socket.connect()
              const participant = socket.channel(`participant:${identity.participant_id}`, {})
              participant.on("match_found", payload => matches.push(payload))
              const joined = await new Promise(resolve => participant.join(5000).receive("ok", v => resolve({kind:"ok",value:v})).receive("error", v => resolve({kind:"error",value:v})).receive("timeout", () => resolve({kind:"timeout"})))
              if (joined.kind !== "ok") throw new Error(`participant join ${JSON.stringify(joined)}`)
              window.__c5blank = {identity, socket, participant, matches, conversation: null}
              return identity.participant_id
            })
          }
          async function pushParticipant(page, event, payload) {
            return page.evaluate(({event,payload}) => new Promise(resolve => window.__c5blank.participant.push(event,payload,5000).receive("ok",v=>resolve({kind:"ok",value:v})).receive("error",v=>resolve({kind:"error",value:v})).receive("timeout",()=>resolve({kind:"timeout"}))), {event,payload})
          }
          async function waitMatch(page) {
            await page.waitForFunction(() => window.__c5blank.matches.length > 0, null, {timeout: 10000})
            return page.evaluate(() => window.__c5blank.matches.at(-1))
          }
          async function joinConversation(page, id) {
            return page.evaluate(async id => {
              const channel = window.__c5blank.socket.channel(`conversation:${id}`, {})
              window.__c5blank.conversation = channel
              return new Promise(resolve => channel.join(5000).receive("ok",v=>resolve({kind:"ok",value:v})).receive("error",v=>resolve({kind:"error",value:v})).receive("timeout",()=>resolve({kind:"timeout"})))
            }, id)
          }
          async function pushConversation(page, event, payload) {
            return page.evaluate(({event,payload}) => new Promise(resolve => window.__c5blank.conversation.push(event,payload,5000).receive("ok",v=>resolve({kind:"ok",value:v})).receive("error",v=>resolve({kind:"error",value:v})).receive("timeout",()=>resolve({kind:"timeout"}))), {event,payload})
          }
          const browser = await chromium.launch({headless:true})
          const ca = await browser.newContext(); const cb = await browser.newContext()
          const a = await ca.newPage(); const b = await cb.newPage()
          try {
            const [aid,bid] = await Promise.all([bootstrap(a), bootstrap(b)])
            assert.notEqual(aid,bid)
            const payload = {door_type:"JUST_TALK", conversation_language:"en"}
            await pushParticipant(a,"queue:join",payload); await pushParticipant(b,"queue:join",payload)
            const [ma,mb] = await Promise.all([waitMatch(a),waitMatch(b)])
            assert.equal(ma.conversation_id,mb.conversation_id)
            const id = ma.conversation_id
            const [ja,jb] = await Promise.all([joinConversation(a,id),joinConversation(b,id)])
            assert.equal(ja.kind,"ok"); assert.equal(jb.kind,"ok")
            const result = await pushConversation(a,"message:send",{client_message_id:crypto.randomUUID(),content:"   \n\t "})
            assert.ok(result.kind !== "ok" || result.value?.status !== "sent", `blank content unexpectedly sent: ${JSON.stringify(result)}`)
            fs.writeFileSync("/tmp/c5-blank-conversation-id", id)
            console.log(`C5_BLANK_BROWSER_REJECTED=${JSON.stringify(result)}`)
          } finally {
            await ca.close().catch(()=>{}); await cb.close().catch(()=>{}); await browser.close().catch(()=>{})
          }
          EOF
              timeout --signal=TERM --kill-after=10s 60s node tmp/c5_blank_start_browser.mjs
              conv_id="$(cat /tmp/c5-blank-conversation-id)"
              started="$(PGPASSWORD=strangertalks_test psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -Atc "SELECT m.conversation_started FROM matches m JOIN conversations c ON c.match_id=m.match_id WHERE c.conversation_id='${conv_id}'::uuid")"
              echo "C5_BLANK_DURABLE_CONVERSATION_STARTED=${started}"
              test "$started" = "f"
              rm -f tmp/c5_blank_start_browser.mjs
              ;;
            C)
              timeout --signal=TERM --kill-after=10s 150s node --test --test-concurrency=1 \
                test/js/terminal_truth_browser_test.mjs \
                test/js/t03_history_route_browser_test.mjs
              mkdir -p tmp
              cat > tmp/c5_deleted_history_browser.mjs <<'EOF'
          import assert from "node:assert/strict"
          import {chromium} from "playwright"
          const BASE = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const ID = "123e4567-e89b-42d3-a456-4266141740c5"
          const AT = "2026-09-10T09:00:00.000Z"
          const browser = await chromium.launch({headless:true})
          const context = await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true})
          const page = await context.newPage(); const errors=[]
          page.on("pageerror",e=>errors.push(e.message)); page.on("console",m=>{if(m.type()==="error") errors.push(m.text())})
          try {
            const response = await page.goto(BASE,{waitUntil:"domcontentloaded"}); assert.ok(response?.ok())
            await page.locator("button.door").first().waitFor({state:"visible",timeout:15000})
            await page.evaluate(async ({id,at}) => {
              const localData = await import("/assets/local_data.mjs")
              const conversation = localData.temporaryConversation({conversation_id:id,door_type:"EXPLORE",display_door:"Advice",started_at:at})
              await localData.putRecord({...conversation,value:{...conversation.value,status:"kept",connection_state:"ended",ended_at:at}})
              await localData.putRecord(localData.localMessage({conversation_id:id,client_message_id:"c5-history",message_id:"c5-history",type:"text",content:"kept",mine:true,delivery_status:"delivered",sent_at:at,sequence:1}))
            }, {id:ID,at:AT})
            await page.locator('#bottom-nav [data-go="chats"]').click()
            await page.locator('[data-screen="chats"].active').waitFor({state:"visible"})
            await page.getByRole("button",{name:"Open local copy: Advice"}).click()
            await page.waitForURL(`**/chats/${ID}`)
            page.once("dialog",d=>d.accept())
            await page.locator("#history-delete").click()
            await page.locator('[data-screen="chats"].active').waitFor({state:"visible"})
            const deletedPath=`/chats/${ID}`
            assert.equal(new URL(page.url()).pathname,"/chats")
            await page.goBack({waitUntil:"domcontentloaded"}).catch(()=>null); await page.waitForTimeout(250)
            assert.notEqual(new URL(page.url()).pathname,deletedPath,"Back resurrected deleted history route")
            assert.equal(await page.locator('[data-screen="history"].active').count(),0)
            await page.goForward({waitUntil:"domcontentloaded"}).catch(()=>null); await page.waitForTimeout(250)
            assert.notEqual(new URL(page.url()).pathname,deletedPath,"Forward resurrected deleted history route")
            assert.equal(await page.locator('[data-screen="history"].active').count(),0)
            await page.reload({waitUntil:"domcontentloaded"}); await page.locator("button.door").first().waitFor({state:"attached",timeout:15000})
            assert.notEqual(new URL(page.url()).pathname,deletedPath,"Reload resurrected deleted history route")
            assert.equal(await page.locator('[data-screen="history"].active').count(),0)
            assert.deepEqual(errors,[])
            console.log("C5_DELETED_HISTORY_BACK_FORWARD_RELOAD=PASS")
          } finally { await context.close().catch(()=>{}); await browser.close().catch(()=>{}) }
          EOF
              timeout --signal=TERM --kill-after=10s 60s node tmp/c5_deleted_history_browser.mjs
              rm -f tmp/c5_deleted_history_browser.mjs
              ;;
            D)
              timeout --signal=TERM --kill-after=10s 150s node --test --test-concurrency=1 \
                test/js/f06_secondary_flow_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 240s node --test --test-concurrency=1 \
                --test-name-pattern='T-A11-002 real Chromium proves A01 human authorship and degradation boundaries' \
                test/js/team11_a01_real_browser_proof_test.mjs
              ;;
            E)
              timeout --signal=TERM --kill-after=10s 120s node --test --test-concurrency=1 \
                --test-name-pattern='photo choose → preview → send → peer receive → open → close → reopen → reconnect' \
                test/js/normal_media_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 180s node --test --test-concurrency=1 \
                --test-name-pattern='Feature 1O E2E-1: standard view-once cycle|Feature 1O\.1 E2E-1: standard view-twice cycle' \
                test/js/browser_e2e_test.mjs
              timeout --signal=TERM --kill-after=10s 150s node --test --test-concurrency=1 \
                test/js/team3_conversation_experience_gate_test.mjs
              ;;
            F)
              timeout --signal=TERM --kill-after=10s 150s node --test --test-concurrency=1 \
                test/js/arrival_accessibility_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 180s node --test --test-concurrency=1 \
                test/js/f09_mobile_flow_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 180s node --test --test-concurrency=1 \
                test/js/f10_desktop_flow_browser_test.mjs
              timeout --signal=TERM --kill-after=10s 120s node --test --test-concurrency=1 \
                --test-name-pattern='Feature 1D E2E-3: keyboard, focus, touch safety, and reduced motion' \
                test/js/browser_e2e_test.mjs
              ;;
          esac
          echo "C5_BROWSER_GROUP_${{ matrix.group }}=PASS"

      - name: Phoenix log on failure
        if: failure()
        shell: bash
        run: tail -n 250 "/tmp/c5-browser-${{ matrix.group }}-phoenix.log" || true

      - name: Deterministic cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "/tmp/c5-browser-${{ matrix.group }}-phoenix.pid" ]; then
            pid="$(cat /tmp/c5-browser-${{ matrix.group }}-phoenix.pid)"
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
          fi
          rm -rf \
            tmp/team6-real-ux-screenshots \
            tmp/team11-a01-proof-screenshots \
            tmp/arrival-first-60-screenshots \
            tmp/chat-ui-screenshots \
            tmp/team6-product-ux-screenshots \
            tmp/playwright-report tmp/test-results \
            tmp/c5_blank_start_browser.mjs tmp/c5_deleted_history_browser.mjs

      - name: Exact clean subject after browser proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          echo "C5_BROWSER_GROUP_${{ matrix.group }}_CLEAN_SUBJECT=PASS"
