name: C5 V1 Final Local Identity

on:
  push:
    branches:
      - evidence/c5-v1-browser-targeted-b40a444-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
  TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

jobs:
  final-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout immutable main subject
        uses: actions/checkout@v4
        with:
          ref: b40a44428705ec566949c9bf8eb186cc3f5908c2
          fetch-depth: 0

      - name: Fresh origin/main and exact local identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head_sha="$(git rev-parse HEAD)"
          origin_sha="$(git rev-parse origin/main)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          printf 'HEAD=%s\nORIGIN_MAIN=%s\nTREE=%s\n' "$head_sha" "$origin_sha" "$tree_sha"
          test "$head_sha" = "$TARGET_SHA"
          test "$origin_sha" = "$TARGET_SHA"
          test "$head_sha" = "$origin_sha"
          test "$tree_sha" = "$TARGET_TREE"
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
          echo C5_HEAD_EQUALS_ORIGIN_MAIN=PASS
          echo C5_GIT_DIFF_CHECK=PASS
          echo C5_GIT_STATUS_PORCELAIN_EMPTY=PASS
          echo C5_FINAL_LOCAL_IDENTITY=PASS
