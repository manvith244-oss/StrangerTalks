name: T09 T05 Candidate Verification

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  BASE_SHA: 423442915e37fd6aadd25bd1c6a300eed2b464f0
  CANDIDATE_SHA: 3f433a8e83ace4415664ce48cc025588bb5d838d
  T09_PROOF_SHA: beb49bc2bc6705270dab8143ff4f543962fdcf50

jobs:
  verify:
    name: T09-T05-001 final-SHA hostile media proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: V1 exact identity, clean worktree, one-file final diff
        shell: bash
        run: |
          set -euo pipefail
          echo "REQUESTED_SHA=$CANDIDATE_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          actual=$(git diff --name-only "$BASE_SHA"...HEAD)
          test "$actual" = "test/js/t05_call_end_aba_closure_test.mjs"
          git diff --check "$BASE_SHA"...HEAD
          test "$(git diff --numstat "$BASE_SHA"...HEAD -- test/js/t05_call_end_aba_closure_test.mjs)" = $'33\t0\ttest/js/t05_call_end_aba_closure_test.mjs'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install dependencies
        run: |
          npm ci
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare DB
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject immutable T09 current/stale terminal and signal attacks
        run: git show "$T09_PROOF_SHA:test/t09/t05_call_end_hostile_verification_test.mjs" > test/js/t09_t05_call_end_hostile_runtime_test.mjs

      - name: V2-V8 ABA, current-end negative control, repeated stale end, stale SDP/ICE
        run: |
          node --test --test-concurrency=1 \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/t09_t05_call_end_hostile_runtime_test.mjs \
            test/js/live_call_signal_queue_regression_test.mjs \
            test/js/team4_call_operation_race_test.mjs

      - name: V9-V15 wider media lifecycle regressions
        run: |
          node --test --test-concurrency=1 \
            test/js/live_call_test.mjs \
            test/js/team4_media_authority_test.mjs \
            test/js/team6_media_gate_test.mjs \
            test/js/team4_initiation_aba_test.mjs \
            test/js/normal_media_test.mjs \
            test/js/view_once_test.mjs \
            test/js/team11_media_expression_break_test.mjs

      - name: V11-V13 durable Conversation/Block and limited-view authority regressions
        run: |
          mix test \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new/view_once_conversation_test.exs \
            --trace

      - name: Remove injected T09 proof
        if: always()
        run: rm -f test/js/t09_t05_call_end_hostile_runtime_test.mjs

      - name: Negative control and exact tested-SHA clean-tree proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/js/t09_t05_call_end_hostile_runtime_test.mjs
          if bash -c 'exit 31'; then exit 1; fi
          echo T09_NEGATIVE_CONTROL=nonzero_detected
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo T09_T05_GATE=VERIFIED
