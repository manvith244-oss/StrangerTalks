name: T09 T02 Candidate Verification

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  BASE_SHA: 423442915e37fd6aadd25bd1c6a300eed2b464f0
  CANDIDATE_SHA: b972a91e253989376b23abd6d603efca259fe3fc
  T09_PROOF_SHA: 0fc6555255f4ec0a1eedc2ab3742f3ccc2e17279
  PORT: '4003'
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4003

jobs:
  verify:
    name: T09-T02-001 exact-SHA hostile proof
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: V1 V2 exact identity, clean worktree, and candidate-only diff
        shell: bash
        run: |
          set -euo pipefail
          echo "REQUESTED_SHA=$CANDIDATE_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          expected=$(printf '%s\n' \
            .github/workflows/t02-multitab-authority.yml \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs | sort)
          actual=$(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf 'T02_PACKET_FILES:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA"...HEAD
          mix_format_target=test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          test -f "$mix_format_target"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and browser
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Candidate-owned formatting and pre-test clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          git diff --check "$BASE_SHA"...HEAD
          test -z "$(git status --porcelain)"

      - name: Prepare exact-SHA test database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject immutable T09 V4 V5 V6 hostile probes
        shell: bash
        run: |
          set -euo pipefail
          git show "$T09_PROOF_SHA:test/t09/t02_multitab_hostile_verification_test.exs" > test/t09_t02_multitab_hostile_runtime_test.exs

      - name: Independently execute V3 V4 V5 V6 V7 V8
        run: |
          mix test \
            test/t09_t02_multitab_hostile_runtime_test.exs \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            --trace

      - name: Remove injected hostile probe
        if: always()
        run: rm -f test/t09_t02_multitab_hostile_runtime_test.exs

      - name: Matchmaking and concurrency regression surface
        run: |
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            test/strangertalks_new/security_adversarial_test.exs \
            --trace

      - name: Prepare isolated browser terminal database
        env:
          MIX_TEST_PARTITION: _t09_t02_browser
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for independent V9 sibling terminal proof
        env:
          MIX_TEST_PARTITION: _t09_t02_browser
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint_config, :server, true))
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 16))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t09-t02-server.log 2>&1 &
          echo $! > /tmp/t09-t02-server.pid
          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t09-t02-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/t09-t02-server.log; exit 1; fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t09-t02-server.log
          exit 1

      - name: V9 existing sibling reconnect and terminal truth in real browser
        run: node --test test/js/conversation_reliability_browser_test.mjs

      - name: Stop browser proof server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/t09-t02-server.pid ]; then
            pid="$(cat /tmp/t09-t02-server.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -9 "$pid" 2>/dev/null || true
          fi

      - name: Drop isolated browser database
        if: always()
        env:
          MIX_TEST_PARTITION: _t09_t02_browser
        run: mix ecto.drop --quiet || true

      - name: Independent full precommit
        run: mix precommit

      - name: V11 inherited formatter accommodation cannot hide candidate mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex | sort)"
          printf 'POST_PRECOMMIT_CHANGED_FILES:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git checkout -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex

      - name: Negative control and final exact-SHA clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          if bash -c 'exit 29'; then exit 1; fi
          echo T09_NEGATIVE_CONTROL=nonzero_detected
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo T09_T02_GATE=VERIFIED
