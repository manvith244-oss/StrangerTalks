name: T09 T07 Candidate Verification

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  BASE_SHA: 423442915e37fd6aadd25bd1c6a300eed2b464f0
  CANDIDATE_SHA: afc8e4ec49e584a2654954702a0030cefffd86c3
  T09_PROOF_SHA: eeaee696b484cde4a07abbaa289a129d47a48617

jobs:
  verify:
    name: T09-T07-001 recursive privacy hostile proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: V1 V2 exact identity, clean worktree, exact packet scope
        shell: bash
        run: |
          set -euo pipefail
          echo "REQUESTED_SHA=$CANDIDATE_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          expected=$(printf '%s\n' \
            lib/strangertalks_new/agent_systems/learning_advisor.ex \
            test/strangertalks_new/agent_systems_functional_test.exs | sort)
          actual=$(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf 'T07_PACKET_FILES:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA"...HEAD

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare test database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject immutable T09 recursive privacy attacks
        shell: bash
        run: |
          set -euo pipefail
          git show "$T09_PROOF_SHA:test/t09/t07_learning_advisor_hostile_verification_test.exs" > test/t09_t07_learning_advisor_hostile_runtime_test.exs

      - name: V3-V8 recursive privacy, provider non-invocation, malformed structures
        run: mix test test/t09_t07_learning_advisor_hostile_runtime_test.exs --trace --seed 0

      - name: Remove injected hostile test
        if: always()
        run: rm -f test/t09_t07_learning_advisor_hostile_runtime_test.exs

      - name: A01 A03 A04 and provider failure/adversarial regression surface
        if: always()
        run: |
          mix test \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs \
            --trace

      - name: Final exact candidate integrity proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/t09_t07_learning_advisor_hostile_runtime_test.exs
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
