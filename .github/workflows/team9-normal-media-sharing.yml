name: T09 T01 Candidate Verification

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  BASE_SHA: 423442915e37fd6aadd25bd1c6a300eed2b464f0
  CANDIDATE_SHA: a20df2c23ebf251b209ba52bfa0370a47a5d1867
  T09_PROOF_SHA: 27268a84dbf49933e6930d3c7129e8cae4de3b4d
  PRE_CONSTRAINT_VERSION: '20260830044500'

jobs:
  verify:
    name: T09-T01-001 exact-SHA hostile proof
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: V1 exact candidate identity, worktree, and diff scope
        shell: bash
        run: |
          set -euo pipefail
          echo "REQUESTED_SHA=$CANDIDATE_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          expected=$(printf '%s\n' \
            lib/strangertalks_new/relationship.ex \
            priv/repo/migrations/20260902183000_enforce_distinct_relationship_participants.exs \
            test/strangertalks_new/relationship_test.exs | sort)
          actual=$(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA"...HEAD

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: M1 clean database migration
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject immutable T09 hostile test
        shell: bash
        run: |
          set -euo pipefail
          git show "$T09_PROOF_SHA:test/t09/t01_self_relationship_verification_test.exs" > test/t09_self_relationship_verification_runtime_test.exs

      - name: V1 V2 V3 V4 V5 V7 hostile self-Relationship proof
        run: mix test test/t09_self_relationship_verification_runtime_test.exs --trace

      - name: Remove injected hostile test
        if: always()
        run: rm -f test/t09_self_relationship_verification_runtime_test.exs

      - name: V6 mutual-consent Bond path and safety boundary
        run: |
          mix test \
            test/strangertalks_new/relationship_consent_safety_review_test.exs \
            test/strangertalks_new/team7_relationship_continuity_test.exs \
            --trace

      - name: Core Relationship, safety, participant Channel, and matchmaking regressions
        run: |
          mix test \
            test/strangertalks_new/relationship_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new/matchmaking_engine_test.exs \
            --trace

      - name: V8 reconnect regression with inherited-race discrimination
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(mix test test/strangertalks_new/relationship_reconnections_test.exs --trace 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo T09_V8=pass
          else
            printf '%s\n' "$output" | grep -F 'anonymous A+C racing reconnect A+B creates at most one current Conversation'
            printf '%s\n' "$output" | grep -E '[0-9]+ tests, 1 failure'
            echo T09_V8=known_baseline_race_only
          fi

      - name: Extract immutable migration seed helper
        shell: bash
        run: git show "$T09_PROOF_SHA:test/t09/support/seed_valid_relationship.exs" > /tmp/t09_seed.exs

      - name: M2 existing valid Relationship survives migration
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          mix ecto.migrate --quiet
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          echo T09_M2=pass

      - name: M3 pre-existing self Relationship fails closed
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          mix run -e 'StrangertalksNew.Repo.query!("UPDATE relationships SET participant_b_id = participant_a_id")'
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM relationships WHERE participant_a_id = participant_b_id"); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          set +e
          output=$(mix ecto.migrate 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'Cannot add relationships_distinct_participants_check: self relationships exist'
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM relationships WHERE participant_a_id = participant_b_id"); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 0
          echo T09_M3=pass

      - name: M4 rollback removes constraint and preserves valid Relationship
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet --to "$PRE_CONSTRAINT_VERSION"
          mix run /tmp/t09_seed.exs
          mix ecto.migrate --quiet
          mix ecto.rollback --quiet --step 1
          test "$(mix run -e 'IO.puts(StrangertalksNew.Repo.aggregate(StrangertalksNew.Relationship, :count, :relationship_id))' | tail -n1)" = 1
          test "$(mix run -e 'r=StrangertalksNew.Repo.query!("SELECT count(*) FROM pg_constraint WHERE conname = $1", ["relationships_distinct_participants_check"]); IO.puts(r.rows |> hd() |> hd())' | tail -n1)" = 0
          echo T09_M4=pass

      - name: Independent full precommit evidence
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          set +e
          output=$(mix precommit 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo T09_PRECOMMIT=pass
          else
            printf '%s\n' "$output" | grep -F 'anonymous A+C racing reconnect A+B creates at most one current Conversation'
            printf '%s\n' "$output" | grep -E '[0-9]+ tests, 1 failure'
            echo T09_PRECOMMIT=known_baseline_race_only
          fi

      - name: Negative control, formatter-drift discrimination, and final exact-SHA proof
        shell: bash
        run: |
          set -euo pipefail
          if bash -c 'exit 23'; then exit 1; fi
          echo T09_NEGATIVE_CONTROL=nonzero_detected
          git diff --check "$BASE_SHA"...HEAD
          git diff --check
          changed=$(git status --porcelain | awk '{print $2}' | sort)
          allowed=$(printf '%s\n' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex | sort)
          if [ -n "$changed" ]; then
            printf 'POST_PRECOMMIT_CHANGED_FILES:\n%s\n' "$changed"
            unexpected=$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))
            test -z "$unexpected"
          fi
          git checkout -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex
          test -z "$(git status --porcelain)"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo T09_T01_GATE=VERIFIED
