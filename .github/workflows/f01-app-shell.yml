name: F-01 App Shell Diagnostic

on:
  push:
    branches:
      - f01/app-shell-release-unblock-2026-08-28

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare browser database
        run: |
          MIX_ENV=test mix ecto.drop --force
          MIX_ENV=test mix ecto.create --quiet
          MIX_ENV=test mix ecto.migrate --quiet
      - name: Instrument F-01 visibility assertion locally
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("test/js/f01_app_shell_browser_test.mjs")
          source = path.read_text()
          old = '  await nav.waitFor({state: "visible"})\n'
          new = '''  const diagnostic = await nav.evaluate(node => {\n    const style = getComputedStyle(node)\n    const rect = node.getBoundingClientRect()\n    return {\n      hiddenProperty: node.hidden,\n      hiddenAttribute: node.hasAttribute("hidden"),\n      display: style.display,\n      visibility: style.visibility,\n      opacity: style.opacity,\n      position: style.position,\n      width: rect.width,\n      height: rect.height,\n      bodyClass: document.body.className,\n      activeScreen: document.querySelector("section.screen.active")?.dataset?.screen || null,\n      bodyDisplay: getComputedStyle(document.body).display,\n      stylesheets: [...document.styleSheets].map(sheet => sheet.href || "inline")\n    }\n  })\n  console.error("F01_NAV_DIAGNOSTIC", JSON.stringify(diagnostic))\n  await nav.waitFor({state: "visible"})\n'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one nav visibility assertion, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Start Phoenix
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-f01-diag.log 2>&1 &
          echo $! > /tmp/strangertalks-f01-diag.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/strangertalks-f01-diag.log
          exit 1
      - name: Run F-01 browser diagnostic
        run: node --test --test-concurrency=1 test/js/f01_app_shell_browser_test.mjs
      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f /tmp/strangertalks-f01-diag.pid ]; then kill "$(cat /tmp/strangertalks-f01-diag.pid)" 2>/dev/null || true; fi
