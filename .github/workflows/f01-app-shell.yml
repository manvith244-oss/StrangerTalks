name: F-01 App Shell Repair Carrier

on:
  push:
    branches:
      - f01/app-shell-release-unblock-2026-08-28

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing F-01 lineage
        uses: actions/checkout@v4
        with:
          ref: f01/app-shell-release-unblock-2026-08-28
          fetch-depth: 0

      - name: Apply the accepted F-01 presentation correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("priv/static/assets/app.js")
          source = path.read_text()
          old = '$("#bottom-nav").hidden = !["doors", "chats", "relationships", "settings"].includes(name)'
          new = '$("#bottom-nav").hidden = !["doors", "chats", "relationships", "settings", "conversation"].includes(name)'

          if old in source:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one F-01 visibility boundary, found {source.count(old)}")
              path.write_text(source.replace(old, new, 1))
              print("applied F-01 Conversation primary-nav visibility correction")
          elif new in source:
              print("F-01 correction already present; no source mutation needed")
          else:
              raise SystemExit("accepted F-01 visibility boundary was not found")
          PY

      - name: Commit correction on the same PR branch
        run: |
          if git diff --quiet -- priv/static/assets/app.js; then
            echo "no correction commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add priv/static/assets/app.js
          git diff --cached --check
          git commit -m "fix(f01): keep primary nav available in conversation"
          git push origin HEAD:f01/app-shell-release-unblock-2026-08-28
