name: F-01 App Shell Stylesheet Carrier

on:
  push:
    branches:
      - f01/app-shell-release-unblock-2026-08-28

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing F-01 lineage
        uses: actions/checkout@v4
        with:
          ref: f01/app-shell-release-unblock-2026-08-28
          fetch-depth: 0

      - name: Wire the existing F-01 shell stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("priv/static/index.html")
          source = path.read_text()
          anchor = '    <link rel="stylesheet" href="/assets/app.css?v=20260807_v2">\n'
          addition = '    <link rel="stylesheet" href="/assets/f01_app_shell.css?v=20260828_j2">\n'

          if addition in source:
              print("F-01 stylesheet already wired; no source mutation needed")
          else:
              if source.count(anchor) != 1:
                  raise SystemExit(f"expected exactly one app.css link anchor, found {source.count(anchor)}")
              path.write_text(source.replace(anchor, anchor + addition, 1))
              print("wired existing F-01 App Shell stylesheet")
          PY

      - name: Commit correction on the same PR branch
        run: |
          if git diff --quiet -- priv/static/index.html; then
            echo "no correction commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add priv/static/index.html
          git diff --cached --check
          git commit -m "fix(f01): load responsive app shell styles"
          git push origin HEAD:f01/app-shell-release-unblock-2026-08-28
