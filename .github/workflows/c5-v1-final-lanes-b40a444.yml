name: C5 V1 Final Split Proof Lanes

on:
  push:
    branches:
      - evidence/c5-v1-final-lanes-b40a444-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: b40a44428705ec566949c9bf8eb186cc3f5908c2
  TARGET_TREE: ccfd797914a2c22e9aebe2ca94ddf3a887382051

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with: {ref: b40a44428705ec566949c9bf8eb186cc3f5908c2, fetch-depth: 0}
      - name: Exact subject
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "1.18.4", otp-version: "27.3.4"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Dependencies
        run: |
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          npm ci --silent
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
      - name: Prepare database and Phoenix
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          STRANGERTALKS_PERSISTENT_TEST_SERVER=1 mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/c5-browser-phoenix.log 2>&1 &
          echo $! >/tmp/c5-browser-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/c5-browser-phoenix.pid)" 2>/dev/null; then cat /tmp/c5-browser-phoenix.log; exit 1; fi
            sleep 1
          done
          cat /tmp/c5-browser-phoenix.log
          exit 1
      - name: Representative Chromium matrix and full spine
        shell: bash
        run: |
          set +e
          failures=0
          run_case() {
            label="$1"; shift
            log="/tmp/${label}.log"
            echo "===== C5_BROWSER_CASE ${label} ====="
            "$@" >"$log" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "C5_BROWSER_PASS ${label}"
              tail -n 25 "$log"
            else
              echo "C5_BROWSER_FAIL ${label} rc=${rc}"
              tail -n 120 "$log"
              failures=$((failures+1))
            fi
          }
          run_case brand node --test test/js/brand_identity_browser_test.mjs
          run_case doors node --test test/js/doors_visual_structure_browser_test.mjs
          run_case accessibility node --test test/js/arrival_accessibility_browser_test.mjs
          run_case retry node --test test/js/message_failed_retry_browser_test.mjs
          run_case terminal node --test test/js/terminal_truth_browser_test.mjs
          run_case history node --test test/js/t03_history_route_browser_test.mjs
          run_case settings node --test test/js/f06_secondary_flow_browser_test.mjs
          run_case authorship node --test test/js/team11_a01_real_browser_proof_test.mjs
          run_case media node --test test/js/normal_media_browser_test.mjs
          run_case mobile node --test test/js/f09_mobile_flow_browser_test.mjs
          run_case desktop node --test test/js/f10_desktop_flow_browser_test.mjs
          run_case full_spine node --test --test-concurrency=1 test/js/browser_e2e_test.mjs
          echo "C5_BROWSER_FAILURE_COUNT=${failures}"
          test "$failures" -eq 0
      - name: Phoenix log on failure
        if: failure()
        run: tail -n 180 /tmp/c5-browser-phoenix.log || true
      - name: Stop Phoenix
        if: always()
        run: |
          [ -f /tmp/c5-browser-phoenix.pid ] && kill "$(cat /tmp/c5-browser-phoenix.pid)" 2>/dev/null || true
      - name: Exact clean subject
        if: always()
        shell: bash
        run: |
          rm -rf tmp/team11-a01-proof-screenshots tmp/playwright-report tmp/test-results 2>/dev/null || true
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

  webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: b40a44428705ec566949c9bf8eb186cc3f5908c2, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Exact subject and dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          npm ci --silent
      - name: T05/WebRTC composed regression
        run: |
          node --test --test-concurrency=1 \
            test/js/live_call_test.mjs \
            test/js/live_call_signal_queue_regression_test.mjs \
            test/js/t05_fatal_termination_ack_retry_test.mjs \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/t05_net_003_credential_timeout_test.mjs \
            test/js/t05_net_003_ice_failure_test.mjs \
            test/js/team4_call_operation_race_test.mjs \
            test/js/team4_initiation_aba_test.mjs \
            test/js/team4_media_authority_test.mjs
      - name: Exact clean subject
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
    steps:
      - uses: actions/checkout@v4
        with: {ref: b40a44428705ec566949c9bf8eb186cc3f5908c2, fetch-depth: 0}
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "1.18.4", otp-version: "27.3.4"}
      - name: Exact subject, dependencies, fresh migration chain
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix ecto.migrations
      - name: Backend/database composed laws
        run: |
          mix test \
            test/strangertalks_new/c3_match_conversation_integrity_test.exs \
            test/strangertalks_new/c3_relationship_distinctness_test.exs \
            test/strangertalks_new/t02_conversation_start_restart_controls_test.exs \
            test/strangertalks_new/report_media_origin_truth_test.exs \
            test/strangertalks_new/security_adversarial_test.exs \
            test/strangertalks_new/conversation_live_call_test.exs \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/conversation_call_channel_test.exs \
            --trace
      - name: Exact clean subject
        run: |
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"

  agent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: {ref: b40a44428705ec566949c9bf8eb186cc3f5908c2, fetch-depth: 0}
      - uses: erlef/setup-beam@v1
        with: {elixir-version: "1.18.4", otp-version: "27.3.4"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - name: Exact subject and dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mix local.hex --force >/dev/null
          mix local.rebar --force >/dev/null
          mix deps.get >/dev/null
          npm ci --silent
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Agent composition regression only
        run: |
          mix test \
            test/strangertalks_new/agent_security_gate_contract_test.exs \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/agent_systems_remediation_test.exs \
            test/strangertalks_new/intelligence_v1_hostile_test.exs \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/ai_service/boundary_contract_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs \
            --trace
          node --test test/js/companion_test.mjs test/js/prompt_cards_test.mjs
      - name: Exact clean subject
        run: |
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
