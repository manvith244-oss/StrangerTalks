name: T03 PRIV-002A Send Authority Browser Proof

on:
  push:
    branches: [validation/t03-priv-002a-send-authority-390]
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  EXPECTED_SHA: 99787f0b85e0cf9f6c3c001c3f0462f4d6fec89f
  EXPECTED_TREE: 31d156cfcdae30db2f49740033b4f454e1e7004c
  EXPECTED_PARENT: cff1d080cfbe050164eaea96bfe7de33641a2fa1
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Record validation lineage
        run: |
          echo "T03_002A_VALIDATION_BRANCH=$GITHUB_REF_NAME"
          echo "T03_002A_VALIDATION_SHA=$GITHUB_SHA"
          echo "T03_002A_RUN_ID=$GITHUB_RUN_ID"

      - name: Checkout exact frozen product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prove exact candidate identity and narrow product diff
        run: |
          set -euo pipefail
          echo "T03_002A_PRODUCT_SHA=$(git rev-parse HEAD)"
          echo "T03_002A_PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "T03_002A_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          git diff --check "$EXPECTED_PARENT"..HEAD
          git diff --name-only "$EXPECTED_PARENT"..HEAD | tee /tmp/actual
          cat > /tmp/expected <<'EOF'
          priv/static/assets/app.js
          priv/static/index.html
          test/js/ephemeral_conversation_ux_test.mjs
          test/js/message_unsend_test.mjs
          test/js/t03_privacy_retention_copy_test.mjs
          EOF
          diff -u /tmp/expected /tmp/actual
          echo "T03_002A_PRODUCT_SCOPE=PASS"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Run required T03 frontend regressions
        run: |
          node --test --test-concurrency=1 \
            test/js/t03_privacy_retention_copy_test.mjs \
            test/js/ephemeral_conversation_ux_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/view_once_test.mjs \
            test/js/f11_retained_cleanup_guard_test.mjs
          echo "T03_002A_T03_MATRIX=PASS"

      - name: Run required T04 consumed contracts
        run: |
          set -euo pipefail
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix test \
            test/strangertalks_new/team4_retention_privacy_closure_test.exs \
            test/strangertalks_new/retention_policy_test.exs \
            test/strangertalks_new/retention_cleanup_test.exs \
            test/strangertalks_new/retention_cleanup_db_test.exs \
            test/strangertalks_new/retention_safety_media_closure_test.exs \
            test/strangertalks_new/retention_closure_db_test.exs \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/conversation_unsend_report_safety_test.exs \
            test/strangertalks_new/conversation_message_unsend_test.exs \
            test/strangertalks_new/telemetry_privacy_test.exs \
            test/strangertalks_new_web/channel_crash_diagnostic_privacy_test.exs
          echo "T03_002A_T04_MATRIX=PASS"

      - name: Prepare fresh browser database
        run: |
          set -euo pipefail
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject validation-only 390x844 authority and privacy probe
        run: |
          cat > test/t03_priv_002a_browser_test.mjs <<'JAVASCRIPT'
          import assert from "node:assert/strict"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const WAIT = 20_000
          const ORDINARY = "This is a temporary Conversation, not a permanent chat-history thread."
          const LOCAL_FADE = "If a participant chooses to keep a local Conversation copy on their own device, that copy has a separate local lifetime; Fade removes that participant-local transcript and summary."
          const SCHEDULE = "Limited safety evidence is minimized or deleted on its own safety-retention schedule."
          const SURVIVES = "Unsend or Fade can remove participant-visible or local content, but they do not erase safety evidence already authorized for safety handling."
          const VIEW_ONCE = "If you report a View-Once photo while StrangerTalks still has its server-owned safety copy, the photo may be stored separately as limited safety evidence. That sensitive evidence is minimized or deleted on its own safety-retention schedule."
          const STALE = /no automatic expiry|no automatic cleanup/i
          const LEGAL = /fully compliant|legal compliance|DPDP compliant|we never retain anything|deletion is immediate everywhere/i
          const active = (page, name) => page.locator(`section[data-screen="${name}"].active`)

          async function boot(browser, label) {
            const context = await browser.newContext({viewport: {width: 390, height: 844}})
            const page = await context.newPage()
            const issuance = page.waitForResponse(r => {
              try { return new URL(r.url()).pathname === "/api/participants" } catch { return false }
            })
            const response = await page.goto(BASE, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${label}: root loads`)
            assert.ok((await issuance).ok(), `${label}: participant issued`)
            await active(page, "doors").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#conversation-language").selectOption("en")
            return {context, page}
          }

          async function pair(browser, label) {
            const a = await boot(browser, `${label}-A`)
            const b = await boot(browser, `${label}-B`)
            await a.page.getByRole("button", {name: /Advice/}).click()
            await active(a.page, "queue").waitFor({state: "visible", timeout: WAIT})
            await b.page.getByRole("button", {name: /Advice/}).click()
            await Promise.all([
              active(a.page, "conversation").waitFor({state: "visible", timeout: WAIT}),
              active(b.page, "conversation").waitFor({state: "visible", timeout: WAIT})
            ])
            await a.page.locator("#message-input").waitFor({state: "visible", timeout: WAIT})
            await b.page.locator("#message-input").waitFor({state: "visible", timeout: WAIT})
            assert.equal(new URL(a.page.url()).pathname, "/conversation")
            assert.equal(new URL(b.page.url()).pathname, "/conversation")
            return {a, b}
          }

          async function closePair(pair) {
            await pair?.a.context.close().catch(() => {})
            await pair?.b.context.close().catch(() => {})
          }

          async function inspect(locator) {
            return locator.evaluate(el => {
              const chain = []
              for (let node = el; node && chain.length < 10; node = node.parentElement) {
                const id = node.id ? `#${node.id}` : ""
                const classes = typeof node.className === "string" && node.className.trim()
                  ? `.${node.className.trim().split(/\s+/).join(".")}` : ""
                chain.push(`${node.tagName.toLowerCase()}${id}${classes}`)
              }
              const rect = el.getBoundingClientRect()
              const style = getComputedStyle(el)
              const text = (el.innerText || el.textContent || "").trim()
              return {
                outerHTML: el.outerHTML,
                id: el.id || "",
                classes: typeof el.className === "string" ? el.className : "",
                rawType: el.getAttribute("type"),
                effectiveType: "type" in el ? el.type : null,
                visible: style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0,
                enabled: !("disabled" in el) || !el.disabled,
                ariaLabel: el.getAttribute("aria-label"),
                text,
                accessibleName: el.getAttribute("aria-label") || text || el.getAttribute("title") || "",
                formId: "form" in el ? el.form?.id || null : null,
                ancestorChain: chain
              }
            })
          }

          async function logInventory(page) {
            const form = page.locator("#message-form")
            const compose = page.locator("#message-form .compose")
            const input = page.locator("#message-input")
            console.log(`T03_002A_FORM=${JSON.stringify(await inspect(form))}`)
            console.log(`T03_002A_COMPOSE=${JSON.stringify(await inspect(compose))}`)
            console.log(`T03_002A_INPUT=${JSON.stringify(await inspect(input))}`)

            const buttons = form.locator("button")
            console.log(`T03_002A_ALL_BUTTON_COUNT=${await buttons.count()}`)
            for (let i = 0; i < await buttons.count(); i++) {
              console.log(`T03_002A_BUTTON_${i + 1}=${JSON.stringify(await inspect(buttons.nth(i)))}`)
            }

            const primary = form.locator("button.primary")
            console.log(`T03_002A_PRIMARY_COUNT=${await primary.count()}`)
            for (let i = 0; i < await primary.count(); i++) {
              console.log(`T03_002A_PRIMARY_${i + 1}=${JSON.stringify(await inspect(primary.nth(i)))}`)
            }
          }

          async function safeSubmitProbe(locator) {
            return locator.evaluate(el => {
              const form = document.querySelector("#message-form")
              let submits = 0
              let submitter = null
              const onSubmit = event => {
                submits += 1
                submitter = event.submitter?.outerHTML || null
                event.preventDefault()
                event.stopImmediatePropagation()
              }
              const suppressOwnClickHandlers = event => event.stopImmediatePropagation()
              form.addEventListener("submit", onSubmit, true)
              el.addEventListener("click", suppressOwnClickHandlers, true)
              el.click()
              el.removeEventListener("click", suppressOwnClickHandlers, true)
              form.removeEventListener("submit", onSubmit, true)
              return {submits, submitter, effectiveType: el.type}
            })
          }

          function watchPage(page, label, errors, failed) {
            page.on("pageerror", error => errors.push(`${label}:pageerror:${error.message}`))
            page.on("console", message => { if (message.type() === "error") errors.push(`${label}:console:${message.text()}`) })
            page.on("requestfailed", request => failed.push(`${label}:${request.method()} ${request.url()} ${request.failure()?.errorText || "failed"}`))
          }

          test("T03 PRIV-002A exact 390x844 semantic authority privacy continuity", {timeout: 180_000}, async () => {
            const browser = await chromium.launch({headless: true})
            let inventoryPair
            let journeyPair
            try {
              inventoryPair = await pair(browser, "inventory")
              const page = inventoryPair.a.page
              const form = page.locator('section[data-screen="conversation"].active #message-form')
              const input = form.locator("#message-input")
              assert.equal(await page.locator("#message-form").count(), 1)
              assert.equal(await form.locator(".compose").count(), 1)
              assert.equal(await input.count(), 1)
              await logInventory(page)

              const primary = form.locator("button.primary")
              assert.equal(await primary.count(), 2, "reproduce broad T09 selector")

              const submitAuthorities = await form.locator("button").evaluateAll(buttons =>
                buttons.filter(button => button.type === "submit").map(button => ({
                  id: button.id || "",
                  text: (button.textContent || "").trim(),
                  ariaLabel: button.getAttribute("aria-label"),
                  outerHTML: button.outerHTML
                }))
              )
              console.log(`T03_002A_SUBMIT_AUTHORITIES=${JSON.stringify(submitAuthorities)}`)
              assert.equal(submitAuthorities.length, 1)
              assert.equal(submitAuthorities[0].text, "Send")
              assert.equal(submitAuthorities[0].ariaLabel, "Send message")

              await input.fill("probe-only-not-sent")
              const structuralSend = form.locator(".compose > button.primary")
              const companion = form.locator("#companion-generate")
              assert.equal(await structuralSend.count(), 1)
              assert.equal(await companion.count(), 1)
              const sendNow = await inspect(structuralSend)
              const companionNow = await inspect(companion)
              console.log(`T03_002A_SEND_AFTER_DRAFT=${JSON.stringify(sendNow)}`)
              console.log(`T03_002A_COMPANION_AFTER_DRAFT=${JSON.stringify(companionNow)}`)
              assert.equal(sendNow.visible, true)
              assert.equal(sendNow.enabled, true)
              assert.equal(sendNow.effectiveType, "submit")
              assert.equal(sendNow.formId, "message-form")
              assert.equal(sendNow.accessibleName, "Send message")
              assert.equal(companionNow.effectiveType, "button")

              const sendProbe = await safeSubmitProbe(structuralSend)
              const companionProbe = await safeSubmitProbe(companion)
              console.log(`T03_002A_SEND_CLICK_PROBE=${JSON.stringify(sendProbe)}`)
              console.log(`T03_002A_COMPANION_CLICK_PROBE=${JSON.stringify(companionProbe)}`)
              assert.equal(sendProbe.submits, 1)
              assert.equal(companionProbe.submits, 0)

              let enterSubmits = 0
              await page.evaluate(() => {
                window.__t03EnterSubmits = 0
                window.__t03EnterProbe = event => {
                  window.__t03EnterSubmits += 1
                  event.preventDefault()
                  event.stopImmediatePropagation()
                }
                document.querySelector("#message-form").addEventListener("submit", window.__t03EnterProbe, true)
              })
              await input.fill("enter-probe-only-not-sent")
              await input.press("Enter")
              enterSubmits = await page.evaluate(() => window.__t03EnterSubmits)
              await page.evaluate(() => {
                document.querySelector("#message-form").removeEventListener("submit", window.__t03EnterProbe, true)
                delete window.__t03EnterProbe
                delete window.__t03EnterSubmits
              })
              console.log(`T03_002A_ENTER_SUBMITS=${enterSubmits}`)
              assert.equal(enterSubmits, 1)

              const semanticSend = form.getByRole("button", {name: "Send message", exact: true})
              assert.equal(await semanticSend.count(), 1)
              assert.equal(await semanticSend.isVisible(), true)
              assert.equal(await semanticSend.isEnabled(), true)
              console.log("T03_002A_AUTHORITY_CLASSIFICATION=HARNESS_ORACLE_DEFECT")

              await closePair(inventoryPair)
              inventoryPair = null

              journeyPair = await pair(browser, "journey")
              const {a, b} = journeyPair
              const errors = []
              const failed = []
              watchPage(a.page, "A", errors, failed)
              watchPage(b.page, "B", errors, failed)

              const composer = a.page.getByRole("textbox", {name: "Message"})
              const activeForm = a.page.locator('section[data-screen="conversation"].active #message-form')
              assert.equal(await composer.count(), 1)
              assert.equal(await composer.isVisible(), true)
              assert.equal(await composer.isEnabled(), true)
              assert.equal(new URL(a.page.url()).pathname, "/conversation")

              const trigger = a.page.locator('.temporary-conversation-cue [data-lifetime-details]')
              await trigger.focus()
              await trigger.click()
              const lifetime = a.page.locator("#lifetime-details-dialog")
              await lifetime.waitFor({state: "visible", timeout: WAIT})
              const lifetimeText = await lifetime.innerText()
              assert.ok(lifetimeText.includes(ORDINARY))
              assert.ok(lifetimeText.includes(LOCAL_FADE))
              assert.ok(lifetimeText.includes(SCHEDULE))
              assert.ok(lifetimeText.includes(SURVIVES))
              assert.doesNotMatch(lifetimeText, STALE)
              assert.doesNotMatch(lifetimeText, LEGAL)
              await a.page.locator("#lifetime-details-close").click()
              await lifetime.waitFor({state: "hidden", timeout: WAIT})
              assert.equal(await trigger.evaluate(node => node === document.activeElement), true)
              assert.equal(new URL(a.page.url()).pathname, "/conversation")
              assert.equal(await active(a.page, "conversation").count(), 1)
              console.log("T03_002A_LIFETIME=PASS")

              const reportPosts = []
              a.page.on("request", request => {
                try {
                  if (request.method() === "POST" && new URL(request.url()).pathname === "/api/reports") reportPosts.push(request.url())
                } catch {}
              })
              const menu = a.page.locator("details.overflow")
              if ((await menu.getAttribute("open")) === null) await menu.locator("summary").click()
              await a.page.locator("#report-open").click()
              const report = a.page.locator("#report-form")
              await report.waitFor({state: "visible", timeout: WAIT})
              assert.equal(await report.count(), 1)
              assert.equal(await report.locator("#report-category").count(), 1)
              assert.equal(await report.locator("#report-evidence").count(), 1)
              const reportSubmit = report.getByRole("button", {name: "Submit report", exact: true})
              assert.equal(await reportSubmit.count(), 1)
              const reportSubmitInfo = await inspect(reportSubmit)
              console.log(`T03_002A_REPORT_SUBMIT=${JSON.stringify(reportSubmitInfo)}`)
              assert.equal(reportSubmitInfo.effectiveType, "submit")
              assert.equal(reportSubmitInfo.formId, "report-form")
              const dynamic = await report.locator(".report-disclosure").innerText()
              const media = await report.locator(".report-safety-media-disclosure").innerText()
              assert.ok(dynamic.includes(SCHEDULE))
              assert.ok(dynamic.includes(SURVIVES))
              assert.equal(media, VIEW_ONCE)
              assert.doesNotMatch(`${dynamic}\n${media}`, STALE)
              assert.doesNotMatch(`${dynamic}\n${media}`, LEGAL)
              assert.deepEqual(reportPosts, [])
              await a.page.locator("#report-cancel").click()
              await report.waitFor({state: "hidden", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/conversation")
              assert.equal(await active(a.page, "conversation").count(), 1)
              console.log("T03_002A_REPORT=PASS")

              const clickText = `t03-002a-click-${Date.now()}`
              await composer.fill(clickText)
              const clickSend = activeForm.getByRole("button", {name: "Send message", exact: true})
              assert.equal(await clickSend.count(), 1)
              assert.equal(await clickSend.isVisible(), true)
              await clickSend.click()
              await b.page.locator("#messages li", {hasText: clickText}).waitFor({state: "visible", timeout: WAIT})
              assert.equal(await b.page.locator("#messages li", {hasText: clickText}).count(), 1)
              assert.equal(await a.page.locator("#messages li", {hasText: clickText}).count(), 1)

              const enterText = `t03-002a-enter-${Date.now()}`
              await composer.fill(enterText)
              await composer.press("Enter")
              await b.page.locator("#messages li", {hasText: enterText}).waitFor({state: "visible", timeout: WAIT})
              assert.equal(await b.page.locator("#messages li", {hasText: enterText}).count(), 1)
              assert.equal(await a.page.locator("#messages li", {hasText: enterText}).count(), 1)
              assert.equal(await composer.isVisible(), true)
              assert.equal(await composer.isEnabled(), true)
              assert.equal(new URL(a.page.url()).pathname, "/conversation")
              assert.equal(await active(a.page, "conversation").count(), 1)
              await a.page.waitForTimeout(250)
              console.log(`T03_002A_PAGE_ERRORS=${JSON.stringify(errors)}`)
              console.log(`T03_002A_FAILED_REQUESTS=${JSON.stringify(failed)}`)
              assert.deepEqual(errors, [])
              assert.deepEqual(failed, [])
              console.log("T03_002A_MESSAGE_CONTINUITY=PASS")
            } finally {
              await closePair(inventoryPair)
              await closePair(journeyPair)
              await browser.close().catch(() => {})
            }
          })
          JAVASCRIPT
          node --check test/t03_priv_002a_browser_test.mjs

      - name: Start exact-SHA Phoenix
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127,0,0,1}, port: 4000]))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' >/tmp/t03-002a-server.log 2>&1 & echo $! >/tmp/t03-002a-server.pid
          for i in $(seq 1 45); do
            kill -0 "$(cat /tmp/t03-002a-server.pid)" 2>/dev/null || { cat /tmp/t03-002a-server.log; exit 1; }
            curl -fsS http://localhost:4000/ >/dev/null && { echo "T03_002A_SERVER=READY"; exit 0; }
            sleep 1
          done
          cat /tmp/t03-002a-server.log
          exit 1

      - name: Execute exact 390x844 privacy continuity and historical-delete proof
        run: |
          set -euo pipefail
          echo "T03_002A_CHROMIUM_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test --test-concurrency=1 \
            test/t03_priv_002a_browser_test.mjs \
            test/js/t03_history_route_browser_test.mjs
          echo "T03_002A_BROWSER_JOURNEY=PASS"
          echo "T03_002A_HISTORICAL_DELETE=PASS"

      - name: Cleanup proof harness and prove clean product tree
        if: always()
        run: |
          rm -f test/t03_priv_002a_browser_test.mjs
          if [ -f /tmp/t03-002a-server.pid ]; then kill "$(cat /tmp/t03-002a-server.pid)" 2>/dev/null || true; fi
          echo "T03_002A_FINAL_SHA=$(git rev-parse HEAD)"
          echo "T03_002A_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git diff --check "$EXPECTED_PARENT"..HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "T03_002A_CLEAN_TREE=PASS"
