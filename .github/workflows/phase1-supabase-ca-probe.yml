name: Phase 1 Supabase Postgrex CA Probe

on:
  push:
    branches:
      - ops/phase1-supabase-ca-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || vars.SUPABASE_DATABASE_URL }}
      SUPABASE_CA_URL: https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
    steps:
      - name: Guard isolated Supabase URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "phase1_supabase_url_present=false"
            echo "PHASE1_POSTGREX_CA_PROOF=BLOCKED_MISSING_SUPABASE_DATABASE_URL"
            exit 2
          fi
          echo "phase1_supabase_url_present=true"
          echo "phase1_production_database_url_used=false"

      - name: Download verified Supabase root CA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$SUPABASE_CA_URL" -o /tmp/prod-ca-2021.crt
          openssl x509 -in /tmp/prod-ca-2021.crt -noout -subject -issuer -fingerprint -sha256

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '28.0.2'

      - name: Prove real Postgrex TLS connection to Supabase
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.exs <<'EXS'
          Mix.install([{:postgrex, "0.22.4"}])

          uri = URI.parse(System.fetch_env!("SUPABASE_DATABASE_URL"))
          [raw_user, raw_pass] = String.split(uri.userinfo || "", ":", parts: 2)

          opts = [
            hostname: uri.host,
            port: uri.port || 5432,
            username: URI.decode(raw_user),
            password: URI.decode(raw_pass),
            database: String.trim_leading(uri.path || "/postgres", "/"),
            ssl: [cacertfile: "/tmp/prod-ca-2021.crt"],
            timeout: 15_000,
            connect_timeout: 15_000,
            handshake_timeout: 15_000,
            show_sensitive_data_on_connection_error: false
          ]

          IO.puts("phase1_target_host=#{uri.host}")
          IO.puts("phase1_target_port=#{uri.port || 5432}")
          IO.puts("phase1_ssl_option=cacertfile:/tmp/prod-ca-2021.crt")

          {:ok, pid} = Postgrex.start_link(opts)
          result = Postgrex.query!(pid, "SELECT current_database(), current_user, ssl, version, cipher, bits FROM pg_stat_ssl WHERE pid = pg_backend_pid()", [])
          IO.inspect(result.rows, label: "phase1_pg_stat_ssl_rows")
          GenServer.stop(pid)
          IO.puts("PHASE1_POSTGREX_CA_PROOF=PASS")
          EXS
          elixir /tmp/probe.exs
