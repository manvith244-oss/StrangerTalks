name: T02 Runtime Generation Causal Trace

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
    paths:
      - .github/workflows/t02-runtime-generation-causal-trace.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  PRODUCT_SHA: e3e86c736ca6ef911bd0023c4877ac68642a48b9
  OLD_FIX_LAB_SHA: 06724eb3068df69efdbfd065940f2de011b4a57a
  OLD_DIAGNOSTIC_BLOB: cc717de18b6341d86ff834e86ae790ca910a7dfa
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

jobs:
  proof:
    name: ${{ matrix.lane }} causal proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - control
          - temporary

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout proof authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve proof probe then checkout exact product
        shell: bash
        run: |
          set -euo pipefail
          cp .github/proof/t02_generation_timeline_probe_test.exs /tmp/t02_generation_timeline_probe_test.exs
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git fetch --no-tags origin "$OLD_FIX_LAB_SHA"
          git show "$OLD_FIX_LAB_SHA:test/strangertalks_new/t02_recovery_convergence_hostile_test.exs" > test/strangertalks_new/t02_recovery_convergence_hostile_test.exs
          cp /tmp/t02_generation_timeline_probe_test.exs test/strangertalks_new/t02_generation_timeline_probe_test.exs
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "DIAGNOSTIC_BLOB=$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)"
          for f in runtime_restart_reconciliation_test.exs runtime_terminal_contract_test.exs f_x07_canonical_terminal_truth_test.exs team3_recovery_coordination_test.exs team4_safety_boundary_test.exs; do
            test -f "test/strangertalks_new/$f"
          done

      - name: Apply exact V2 temporary experiment
        if: matrix.lane == 'temporary'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/strangertalks_new/conversation_lifecycle/conversation_server.ex')
          s=p.read_text()
          old='''        case DynamicSupervisor.start_child(
                 StrangertalksNew.ConversationDynamicSupervisor,
                 {__MODULE__, %{conversation_id: conversation_id}}
               ) do'''
          new='''        child_spec =
          Supervisor.child_spec(
            {__MODULE__, %{conversation_id: conversation_id}},
            restart: :temporary
          )

        case DynamicSupervisor.start_child(
               StrangertalksNew.ConversationDynamicSupervisor,
               child_spec
             ) do'''
          if s.count(old) != 1:
              raise SystemExit('V2 patch anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check

      - name: Prove exact semantic lane delta
        shell: bash
        run: |
          set -euo pipefail
          delta="$(git diff --name-only -- lib config mix.exs mix.lock | sort)"
          echo "T02_CAUSAL_DELTA lane=${{ matrix.lane }} delta=$delta"
          if [ "${{ matrix.lane }}" = "control" ]; then
            test -z "$delta"
          else
            test "$delta" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
            grep -Fq 'restart: :temporary' lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          fi

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Database and compile preflight
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix ecto.create --quiet
          mix ecto.migrate
          mix compile --warnings-as-errors
          echo "T02_CAUSAL_PREFLIGHT lane=${{ matrix.lane }} result=PASS"

      - name: Run proof-only generation timeline
        id: timeline
        env:
          TRACE_LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -o pipefail
          mix test test/strangertalks_new/t02_generation_timeline_probe_test.exs --seed 0 --trace

      - name: Run exact accepted hostile diagnostic
        id: hostile
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs --seed 0 --trace
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_CAUSAL_RESULT lane=${{ matrix.lane }} proof=hostile seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: runtime_restart_reconciliation
        id: f1
        continue-on-error: true
        run: mix test test/strangertalks_new/runtime_restart_reconciliation_test.exs --seed 0

      - name: runtime_terminal_contract
        id: f2
        continue-on-error: true
        run: mix test test/strangertalks_new/runtime_terminal_contract_test.exs --seed 0

      - name: f_x07_canonical_terminal_truth
        id: f3
        continue-on-error: true
        run: mix test test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs --seed 0

      - name: team3_recovery_coordination
        id: f4
        continue-on-error: true
        run: mix test test/strangertalks_new/team3_recovery_coordination_test.exs --seed 0

      - name: team4_safety_boundary
        id: f5
        continue-on-error: true
        run: mix test test/strangertalks_new/team4_safety_boundary_test.exs --seed 0

      - name: Eligible five-file bundle
        id: bundle
        if: steps.f1.outcome == 'success' && steps.f2.outcome == 'success' && steps.f3.outcome == 'success' && steps.f4.outcome == 'success' && steps.f5.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mix test \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            test/strangertalks_new/runtime_terminal_contract_test.exs \
            test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs \
            test/strangertalks_new/team3_recovery_coordination_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            --seed 0

      - name: Final proof record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "T02_CAUSAL_OUTCOMES lane=${{ matrix.lane }} timeline=${{ steps.timeline.outcome }} hostile=${{ steps.hostile.outcome }} f1=${{ steps.f1.outcome }} f2=${{ steps.f2.outcome }} f3=${{ steps.f3.outcome }} f4=${{ steps.f4.outcome }} f5=${{ steps.f5.outcome }} bundle=${{ steps.bundle.outcome }}"
          echo "FINAL_PRODUCT_DELTA_BEGIN"
          git diff --name-only -- lib config mix.exs mix.lock | sort
          echo "FINAL_PRODUCT_DELTA_END"
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
