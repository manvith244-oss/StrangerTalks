name: T02 Runtime Generation Causal Trace

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
    paths:
      - .github/workflows/t02-runtime-generation-causal-trace.yml
      - .github/proof/t02_generation_causal_runner.sh
      - .github/proof/t02_generation_timeline_probe_test.exs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout proof authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Execute CONTROL and TEMPORARY causal proof
        shell: bash
        run: bash .github/proof/t02_generation_causal_runner.sh

      - name: Upload causal proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-generation-causal-proof
          path: /tmp/t02-causal
          if-no-files-found: warn
