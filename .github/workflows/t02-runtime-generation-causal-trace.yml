name: T02 Runtime Generation Causal Trace

on:
  workflow_dispatch:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
    paths:
      - .github/workflows/t02-runtime-generation-causal-trace.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  PRODUCT_SHA: e3e86c736ca6ef911bd0023c4877ac68642a48b9
  OLD_FIX_LAB_SHA: 06724eb3068df69efdbfd065940f2de011b4a57a
  OLD_DIAGNOSTIC_BLOB: cc717de18b6341d86ff834e86ae790ca910a7dfa
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

jobs:
  trace:
    name: trace-${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [CONTROL, TEMPORARY]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact frozen product and restore accepted hostile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SHA"
          git fetch origin "$OLD_FIX_LAB_SHA" --no-tags
          git cat-file blob "$OLD_DIAGNOSTIC_BLOB" > test/strangertalks_new/t02_recovery_convergence_hostile_test.exs
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "DIAGNOSTIC_BLOB=$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)"

      - name: Verify requested regression files exist
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            test/strangertalks_new/runtime_terminal_contract_test.exs \
            test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs \
            test/strangertalks_new/team3_recovery_coordination_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs
          do
            test -f "$f"
            echo "PRESENT $f"
          done

      - name: Apply exact V2 restart experiment only in TEMPORARY lane
        if: matrix.lane == 'TEMPORARY'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/strangertalks_new/conversation_lifecycle/conversation_server.ex')
          s = p.read_text()
          old = '''        case DynamicSupervisor.start_child(
                 StrangertalksNew.ConversationDynamicSupervisor,
                 {__MODULE__, %{conversation_id: conversation_id}}
               ) do'''
          new = '''        child_spec =
          Supervisor.child_spec(
            {__MODULE__, %{conversation_id: conversation_id}},
            restart: :temporary
          )

        case DynamicSupervisor.start_child(
               StrangertalksNew.ConversationDynamicSupervisor,
               child_spec
             ) do'''
          if s.count(old) != 1:
              raise SystemExit(f'V2 patch anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Prove semantic lane delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- lib config mix.exs mix.lock | sort)"
          echo "SEMANTIC_DELTA_BEGIN"
          printf '%s\n' "$changed"
          echo "SEMANTIC_DELTA_END"
          if [ "${{ matrix.lane }}" = "CONTROL" ]; then
            test -z "$changed"
          else
            test "$changed" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
            grep -F 'restart: :temporary' lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          fi

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - name: Restore dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix deps.get

      - name: Database create and migrate
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.create
          mix ecto.migrate

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          mix compile --warnings-as-errors

      - name: Write proof-only generation tracer
        shell: bash
        run: |
          cat > test/strangertalks_new/t02_generation_causal_trace_probe_test.exs <<'ELIXIR'
          defmodule StrangertalksNew.T02GenerationCausalTraceProbeTest do
            use StrangertalksNew.DataCase, async: false

            alias StrangertalksNew.ConversationLifecycle.ConversationServer
            alias StrangertalksNew.Conversations.Conversation
            alias StrangertalksNew.Repo

            @ds StrangertalksNew.ConversationDynamicSupervisor
            @registry StrangertalksNew.ConversationRegistry
            @rounds 8
            @parallelism 32

            test "proof-only generation provenance and supervisor churn timeline" do
              IO.puts("TRACE_PROBE lane=#{System.get_env("TRACE_LANE") || "unknown"} rounds=#{@rounds} parallelism=#{@parallelism}")

              for round <- 1..@rounds do
                conversation = conversation_fixture(%{status: "PENDING"})
                cid = conversation.id
                tracer = start_trace(cid)

                IO.puts("ROUND_BEGIN round=#{round} cid=#{cid} ts=#{now()}")
                snapshot("before_initial_ensure", round, cid, nil)

                {:ok, old_pid} = ConversationServer.ensure_started(cid)
                send(tracer, {:watch, old_pid, "round#{round}_g1"})
                old_ref = Process.monitor(old_pid)
                ds_before = Process.whereis(@ds)
                ds_ref = Process.monitor(ds_before)
                Process.sleep(5)
                snapshot("after_initial_ensure", round, cid, old_pid)
                IO.puts("GENERATION round=#{round} seq=1 pid=#{inspect(old_pid)} initiator=explicit_initial_ensure ds=#{inspect(ds_before)} ts=#{now()}")

                parent = self()
                tasks =
                  for idx <- 1..@parallelism do
                    Task.async(fn ->
                      send(parent, {:ready, self(), idx})
                      receive do
                        {:release, ^cid} -> :ok
                      end
                      result = ConversationServer.ensure_started(cid)
                      {idx, self(), result}
                    end)
                  end

                for _ <- 1..@parallelism do
                  assert_receive {:ready, _pid, _idx}, 5_000
                end

                IO.puts("CALLERS_BLOCKED round=#{round} count=#{@parallelism} old_alive=#{Process.alive?(old_pid)} ds=#{inspect(Process.whereis(@ds))} ts=#{now()}")
                snapshot("before_kill", round, cid, old_pid)

                IO.puts("KILL_SENT round=#{round} pid=#{inspect(old_pid)} reason=:kill ts=#{now()}")
                Process.exit(old_pid, :kill)

                receive do
                  {:DOWN, ^old_ref, :process, ^old_pid, reason} ->
                    IO.puts("SERVER_DOWN round=#{round} seq=1 pid=#{inspect(old_pid)} reason=#{inspect(reason)} ts=#{now()}")
                after
                  5_000 -> flunk("old ConversationServer did not terminate")
                end

                snapshot("immediate_after_g1_down_callers_still_blocked", round, cid, old_pid)
                Process.sleep(20)
                {ds_pre_release, registry_pre_release, children_pre_release} =
                  snapshot("20ms_after_g1_down_callers_still_blocked", round, cid, old_pid)

                pre_release_pid = single_live_pid(registry_pre_release, children_pre_release)
                if is_pid(pre_release_pid) do
                  send(tracer, {:watch, pre_release_pid, "round#{round}_pre_release_replacement"})
                  IO.puts("GENERATION round=#{round} seq=2 pid=#{inspect(pre_release_pid)} initiator=before_explicit_callers_released ds=#{inspect(ds_pre_release)} prior_alive=#{Process.alive?(old_pid)} ts=#{now()}")
                else
                  IO.puts("NO_PRE_RELEASE_GENERATION round=#{round} prior_alive=#{Process.alive?(old_pid)} ds=#{inspect(ds_pre_release)} ts=#{now()}")
                end

                Enum.each(tasks, fn task -> send(task.pid, {:release, cid}) end)
                IO.puts("CALLERS_RELEASED round=#{round} ts=#{now()}")

                results = Enum.map(tasks, &Task.await(&1, 10_000))
                result_pids =
                  results
                  |> Enum.map(fn
                    {_idx, _caller, {:ok, pid}} -> pid
                    {_idx, _caller, other} -> flunk("unexpected ensure_started result #{inspect(other)}")
                  end)

                unique_result_pids = Enum.uniq(result_pids)
                IO.puts("ENSURE_RESULTS round=#{round} unique_pids=#{inspect(unique_result_pids)} count=#{length(unique_result_pids)} ts=#{now()}")
                assert length(unique_result_pids) == 1
                [replacement_pid] = unique_result_pids
                send(tracer, {:watch, replacement_pid, "round#{round}_result_generation"})

                {ds_after_release, registry_after_release, children_after_release} =
                  snapshot("after_callers_complete", round, cid, old_pid)

                IO.puts("GENERATION_RESULT round=#{round} replacement=#{inspect(replacement_pid)} pre_release=#{inspect(pre_release_pid)} prior_alive=#{Process.alive?(old_pid)} ds_before=#{inspect(ds_before)} ds_after=#{inspect(ds_after_release)} registry=#{inspect(registry_after_release)} children=#{inspect(children_after_release)} ts=#{now()}")

                receive do
                  {:DOWN, ^ds_ref, :process, ^ds_before, reason} ->
                    IO.puts("SUPERVISOR_DOWN round=#{round} pid=#{inspect(ds_before)} reason=#{inspect(reason)} replacement_ds=#{inspect(Process.whereis(@ds))} ts=#{now()}")
                after
                  0 ->
                    IO.puts("SUPERVISOR_STABLE round=#{round} pid=#{inspect(ds_before)} current=#{inspect(Process.whereis(@ds))} alive=#{Process.alive?(ds_before)} ts=#{now()}")
                end

                replacement_ref = Process.monitor(replacement_pid)
                current_ds = Process.whereis(@ds)
                assert is_pid(current_ds)
                assert :ok = DynamicSupervisor.terminate_child(current_ds, replacement_pid)
                receive do
                  {:DOWN, ^replacement_ref, :process, ^replacement_pid, reason} ->
                    IO.puts("REPLACEMENT_TERMINATED round=#{round} pid=#{inspect(replacement_pid)} reason=#{inspect(reason)} ts=#{now()}")
                after
                  5_000 -> flunk("replacement did not terminate")
                end

                Process.sleep(10)
                snapshot("after_explicit_replacement_termination", round, cid, replacement_pid)
                stop_trace(tracer)
                IO.puts("ROUND_END round=#{round} cid=#{cid} ts=#{now()}")
              end
            end

            defp start_trace(cid) do
              owner = self()
              tracer = spawn_link(fn -> trace_loop(owner, cid, %{}) end)
              flags = [:call, :monotonic_timestamp, {:tracer, tracer}]
              :erlang.trace(:all, true, flags)
              :erlang.trace(:new, true, flags)
              :erlang.trace_pattern({ConversationServer, :ensure_started, 1}, true, [:local])
              :erlang.trace_pattern({ConversationServer, :start_link, 1}, true, [:local])
              :erlang.trace_pattern({DynamicSupervisor, :start_child, 2}, true, [:local])
              tracer
            end

            defp stop_trace(tracer) do
              Process.sleep(10)
              :erlang.trace_pattern({ConversationServer, :ensure_started, 1}, false, [:local])
              :erlang.trace_pattern({ConversationServer, :start_link, 1}, false, [:local])
              :erlang.trace_pattern({DynamicSupervisor, :start_child, 2}, false, [:local])
              :erlang.trace(:all, false, [:call])
              :erlang.trace(:new, false, [:call])
              send(tracer, :stop)
            end

            defp trace_loop(owner, cid, watched) do
              receive do
                {:watch, pid, label} ->
                  trace_loop(owner, cid, Map.put(watched, pid, label))

                {:trace_ts, caller, :call, {ConversationServer, :ensure_started, [^cid]}, ts} ->
                  IO.puts("CALL_TRACE kind=ensure_started caller=#{inspect(caller)} cid=#{cid} ts=#{inspect(ts)}")
                  trace_loop(owner, cid, watched)

                {:trace_ts, caller, :call, {ConversationServer, :start_link, [arg]}, ts} ->
                  if is_map(arg) and Map.get(arg, :conversation_id) == cid do
                    IO.puts("CALL_TRACE kind=conversation_start_link caller=#{inspect(caller)} cid=#{cid} arg=#{inspect(arg)} ts=#{inspect(ts)}")
                  end
                  trace_loop(owner, cid, watched)

                {:trace_ts, caller, :call, {DynamicSupervisor, :start_child, [supervisor, spec]}, ts} ->
                  if relevant_spec?(spec, cid) do
                    IO.puts("CALL_TRACE kind=dynamic_start_child caller=#{inspect(caller)} supervisor=#{inspect(supervisor)} cid=#{cid} spec=#{inspect(spec, limit: :infinity)} ts=#{inspect(ts)}")
                  end
                  trace_loop(owner, cid, watched)

                _other ->
                  trace_loop(owner, cid, watched)
              end
            end

            defp relevant_spec?({ConversationServer, %{conversation_id: cid}}, cid), do: true
            defp relevant_spec?(%{start: {ConversationServer, :start_link, [%{conversation_id: cid}]}}, cid), do: true
            defp relevant_spec?(_, _), do: false

            defp snapshot(label, round, cid, prior_pid) do
              ds = Process.whereis(@ds)
              registry = Registry.lookup(@registry, {:conversation, cid})
              children = safe_children(ds, cid)
              status = Repo.get!(Conversation, cid).status
              ds_state = safe_ds_state(ds)

              IO.puts(
                "SNAPSHOT label=#{label} round=#{round} ts=#{now()} cid=#{cid} durable_status=#{inspect(status)} " <>
                  "prior_pid=#{inspect(prior_pid)} prior_alive=#{if(is_pid(prior_pid), do: Process.alive?(prior_pid), else: nil)} " <>
                  "ds=#{inspect(ds)} ds_alive=#{if(is_pid(ds), do: Process.alive?(ds), else: false)} " <>
                  "registry=#{inspect(registry)} children=#{inspect(children)} ds_state=#{inspect(ds_state, limit: :infinity, printable_limit: :infinity)}"
              )

              {ds, registry, children}
            end

            defp safe_children(nil, _cid), do: :supervisor_unavailable
            defp safe_children(ds, cid) do
              try do
                DynamicSupervisor.which_children(ds)
                |> Enum.flat_map(fn
                  {_id, pid, _type, modules} when is_pid(pid) ->
                    if Registry.lookup(@registry, {:conversation, cid}) |> Enum.any?(fn {reg_pid, _} -> reg_pid == pid end) do
                      [{pid, modules}]
                    else
                      []
                    end
                  _ -> []
                end)
              catch
                :exit, reason -> {:supervisor_unavailable, reason}
              end
            end

            defp safe_ds_state(nil), do: :supervisor_unavailable
            defp safe_ds_state(ds) do
              try do
                :sys.get_state(ds)
              catch
                :exit, reason -> {:supervisor_unavailable, reason}
              end
            end

            defp single_live_pid(registry, children) when is_list(registry) and is_list(children) do
              registry_pids = Enum.map(registry, &elem(&1, 0))
              child_pids = Enum.map(children, &elem(&1, 0))
              case Enum.uniq(registry_pids ++ child_pids) do
                [pid] -> pid
                _ -> nil
              end
            end
            defp single_live_pid(_, _), do: nil

            defp now, do: System.monotonic_time()
          end
          ELIXIR
          git hash-object test/strangertalks_new/t02_generation_causal_trace_probe_test.exs

      - name: Run causal trace probe
        env:
          TRACE_LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set -o pipefail
          mix test test/strangertalks_new/t02_generation_causal_trace_probe_test.exs --seed 0 --trace 2>&1 | tee "trace-${{ matrix.lane }}.log"

      - name: Run exact accepted hostile diagnostic unchanged
        id: hostile
        env:
          TRACE_LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          START=$(date +%s%N)
          mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs --seed 0 --trace 2>&1 | tee "hostile-${{ matrix.lane }}.log"
          RC=${PIPESTATUS[0]}
          END=$(date +%s%N)
          echo "HOSTILE_RESULT lane=${{ matrix.lane }} rc=$RC duration_ns=$((END-START)) seed=0"
          exit $RC

      - name: Final proof-only source delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "FINAL_PRODUCT_SOURCE_DELTA_BEGIN"
          git diff --name-only -- lib config mix.exs mix.lock | sort
          echo "FINAL_PRODUCT_SOURCE_DELTA_END"
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
