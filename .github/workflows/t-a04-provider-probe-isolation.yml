name: T-A04-002 Provider Probe Isolation

on:
  push:
    branches:
      - team-a04/provider-probe-isolation-002
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  provider-probe-isolation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"

    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4

      - name: Record exact identity
        shell: bash
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
          echo "FROZEN_RED_COMMIT=20c8bd929b6ad8bbd96500357ca515700863fbd8"
          echo "PROOF_BASE_MAIN=423442915e37fd6aadd25bd1c6a300eed2b464f0"
          echo "REVERIFIED_MAIN_AT_IMPLEMENTATION=20293425b0556d733f47d43714d236582df7948d"
          echo "RELEVANT_PRODUCT_TREE=f4bb8b3b11a1b6423aaaed07664c2454995dee69"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Compile test environment
        run: mix compile --warnings-as-errors

      - name: Team 4 formatter check
        run: |
          mix format --check-formatted \
            lib/strangertalks_new/application.ex \
            lib/strangertalks_new/agent_systems/provider_probe.ex \
            test/proofs/provider_probe_boot_isolation.exs

      - name: RED/GREEN real application boot-isolation proof
        id: isolation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix run --no-start test/proofs/provider_probe_boot_isolation.exs 2>&1 | tee /tmp/provider-isolation.log
          code=${PIPESTATUS[0]}
          phase=$(grep -Eo 'T_A04_002_BOOT_PHASE=[A-Z_]+' /tmp/provider-isolation.log | tail -1 | cut -d= -f2 || true)
          result=$(grep -Eo 'T_A04_002_PROVIDER_PROBE_ISOLATION_PROOF=[A-Z]+' /tmp/provider-isolation.log | tail -1 | cut -d= -f2 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "phase=${phase:-missing}" >> "$GITHUB_OUTPUT"
          echo "result=${result:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Focused provider regressions
        id: provider
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/agent_systems_provider_probe_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            2>&1 | tee /tmp/provider-tests.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/provider-tests.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Deterministic core smoke regressions
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            2>&1 | tee /tmp/core-tests.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/core-tests.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Full Elixir precommit
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix precommit 2>&1 | tee /tmp/precommit.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/precommit.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Classify inherited precommit lifecycle failure
        id: inherited
        if: always()
        shell: bash
        env:
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          FULL_SUMMARY: ${{ steps.full.outputs.summary }}
        run: |
          inherited=false
          if [ "$FULL_EXIT" = "2" ] \
            && [ "$FULL_SUMMARY" = "862 tests, 1 failure" ] \
            && grep -q 'StrangertalksNewWeb.Team2NormalMediaTerminalTest' /tmp/precommit.log \
            && grep -q 'expected.*terminal_conversation\|terminal_conversation' /tmp/precommit.log; then
            inherited=true
          fi
          echo "accepted=$inherited" >> "$GITHUB_OUTPUT"
          echo "INHERITED_PRECOMMIT_BASELINE=$inherited"

      - name: Classify formatter drift
        id: clean
        if: always()
        shell: bash
        run: |
          set +e
          changed=$(git diff --name-only -- .)
          printf '%s\n' "$changed"

          unexpected=$(printf '%s\n' "$changed" | grep -v '^$' | grep -v -E \
            '^(lib/strangertalks_new/conversation_lifecycle/conversation_server\.ex|lib/strangertalks_new/reflections\.ex)$' || true)

          if [ -n "$unexpected" ]; then
            echo "Unexpected Team 4-owned or new drift after precommit:"
            printf '%s\n' "$unexpected"
            code=1
          else
            code=0
          fi

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "baseline_drift=$(printf '%s\n' "$changed" | tr '\n' ',' | sed 's/,$//')" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish proof summary
        if: always()
        shell: bash
        env:
          ISOLATION_EXIT: ${{ steps.isolation.outputs.exit_code }}
          BOOT_PHASE: ${{ steps.isolation.outputs.phase }}
          ISOLATION_RESULT: ${{ steps.isolation.outputs.result }}
          PROVIDER_EXIT: ${{ steps.provider.outputs.exit_code }}
          PROVIDER_SUMMARY: ${{ steps.provider.outputs.summary }}
          CORE_EXIT: ${{ steps.core.outputs.exit_code }}
          CORE_SUMMARY: ${{ steps.core.outputs.summary }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          FULL_SUMMARY: ${{ steps.full.outputs.summary }}
          INHERITED_PRECOMMIT: ${{ steps.inherited.outputs.accepted }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
          BASELINE_DRIFT: ${{ steps.clean.outputs.baseline_drift }}
        run: |
          echo "ISOLATION_EXIT=$ISOLATION_EXIT"
          echo "BOOT_PHASE=$BOOT_PHASE"
          echo "ISOLATION_RESULT=$ISOLATION_RESULT"
          echo "PROVIDER_TESTS=$PROVIDER_SUMMARY exit=$PROVIDER_EXIT"
          echo "CORE_TESTS=$CORE_SUMMARY exit=$CORE_EXIT"
          echo "PRECOMMIT=$FULL_SUMMARY exit=$FULL_EXIT inherited=$INHERITED_PRECOMMIT"
          echo "TEAM4_FORMAT_CLEAN_EXIT=$CLEAN_EXIT"
          echo "BASELINE_FORMATTER_DRIFT=$BASELINE_DRIFT"
          echo "TESTED_COMMIT=$GITHUB_SHA"

      - name: Fail gate if T-A04-002 proof failed
        if: always()
        shell: bash
        env:
          ISOLATION_EXIT: ${{ steps.isolation.outputs.exit_code }}
          BOOT_PHASE: ${{ steps.isolation.outputs.phase }}
          ISOLATION_RESULT: ${{ steps.isolation.outputs.result }}
          PROVIDER_EXIT: ${{ steps.provider.outputs.exit_code }}
          CORE_EXIT: ${{ steps.core.outputs.exit_code }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          INHERITED_PRECOMMIT: ${{ steps.inherited.outputs.accepted }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          test "$ISOLATION_EXIT" = "0"
          test "$BOOT_PHASE" = "POST_FIX_EXPECTED_GREEN"
          test "$ISOLATION_RESULT" = "PASS"
          test "$PROVIDER_EXIT" = "0"
          test "$CORE_EXIT" = "0"
          if [ "$FULL_EXIT" != "0" ]; then
            test "$INHERITED_PRECOMMIT" = "true"
          fi
          test "$CLEAN_EXIT" = "0"
          echo "T_A04_002_GATE=PASS"
