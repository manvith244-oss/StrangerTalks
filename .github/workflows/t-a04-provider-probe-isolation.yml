name: T-A04-002 Provider Probe Isolation

on:
  push:
    branches:
      - team-a04/provider-probe-isolation-002
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  provider-probe-isolation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"

    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4

      - name: Record exact identity
        shell: bash
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
          echo "BASE_MAIN=423442915e37fd6aadd25bd1c6a300eed2b464f0"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Compile test environment
        run: mix compile --warnings-as-errors

      - name: RED/GREEN real application boot-isolation proof
        id: isolation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix run --no-start test/proofs/provider_probe_boot_isolation.exs 2>&1 | tee /tmp/provider-isolation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if grep -q 'RED_CAUSAL_PROVIDER_PROBE_FAILURE' /tmp/provider-isolation.log; then
            echo "causal_red=true" >> "$GITHUB_OUTPUT"
          else
            echo "causal_red=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Focused provider regressions
        id: provider
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/agent_systems_provider_probe_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            2>&1 | tee /tmp/provider-tests.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/provider-tests.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Deterministic core smoke regressions
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            2>&1 | tee /tmp/core-tests.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/core-tests.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Full Elixir precommit
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix precommit 2>&1 | tee /tmp/precommit.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/precommit.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Prove checkout unchanged
        id: clean
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=$(git status --porcelain)
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            echo "--- diff begin ---"
            git diff --no-ext-diff -- .
            echo "--- diff end ---"
            code=1
          else
            code=0
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish proof summary
        if: always()
        shell: bash
        env:
          ISOLATION_EXIT: ${{ steps.isolation.outputs.exit_code }}
          CAUSAL_RED: ${{ steps.isolation.outputs.causal_red }}
          PROVIDER_EXIT: ${{ steps.provider.outputs.exit_code }}
          PROVIDER_SUMMARY: ${{ steps.provider.outputs.summary }}
          CORE_EXIT: ${{ steps.core.outputs.exit_code }}
          CORE_SUMMARY: ${{ steps.core.outputs.summary }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          FULL_SUMMARY: ${{ steps.full.outputs.summary }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          echo "ISOLATION_EXIT=$ISOLATION_EXIT"
          echo "CAUSAL_RED=$CAUSAL_RED"
          echo "PROVIDER_TESTS=$PROVIDER_SUMMARY exit=$PROVIDER_EXIT"
          echo "CORE_TESTS=$CORE_SUMMARY exit=$CORE_EXIT"
          echo "PRECOMMIT=$FULL_SUMMARY exit=$FULL_EXIT"
          echo "CLEAN_EXIT=$CLEAN_EXIT"
          echo "TESTED_COMMIT=$GITHUB_SHA"

      - name: Fail gate if any required proof failed
        if: always()
        shell: bash
        env:
          ISOLATION_EXIT: ${{ steps.isolation.outputs.exit_code }}
          PROVIDER_EXIT: ${{ steps.provider.outputs.exit_code }}
          CORE_EXIT: ${{ steps.core.outputs.exit_code }}
          FULL_EXIT: ${{ steps.full.outputs.exit_code }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit_code }}
        run: |
          test "$ISOLATION_EXIT" = "0"
          test "$PROVIDER_EXIT" = "0"
          test "$CORE_EXIT" = "0"
          test "$FULL_EXIT" = "0"
          test "$CLEAN_EXIT" = "0"
