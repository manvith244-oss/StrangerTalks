name: F-02 Route Architecture Proof

on:
  push:
    branches:
      - f02/route-architecture-wave-a
  pull_request:
    branches:
      - release/prep-2026-08-22
    paths:
      - "lib/strangertalks_new_web/router.ex"
      - "lib/strangertalks_new_web/controllers/page_controller.ex"
      - "lib/strangertalks_new_web/controllers/google_auth_controller.ex"
      - "priv/static/index.html"
      - "priv/static/assets/route_contract.mjs"
      - "priv/static/assets/route_runtime.mjs"
      - "test/strangertalks_new_web/controllers/route_architecture_test.exs"
      - "test/js/route_contract_test.mjs"
      - ".github/workflows/f02-route-architecture.yml"
  workflow_dispatch:

concurrency:
  group: f02-route-architecture-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relationship-reconnect-isolation:
    name: relationship-reconnect-isolation-${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: frozen-base
            ref: 585637924ff45933c7b35b0bc27719934907c70e
          - label: previous-f02-head
            ref: 3de129eec8b915fade6773dff60cbb5ae7a496e3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
    steps:
      - name: Checkout isolation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Prove isolation checkout identity
        run: |
          echo "ISOLATION_LABEL=${{ matrix.label }}"
          echo "EXPECTED=${{ matrix.ref }}"
          echo "ACTUAL=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Elixir dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare isolation database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Repeat relationship reconnection concurrency proof
        run: |
          set +e
          failures=0
          passes=0
          for attempt in $(seq 1 8); do
            echo "::group::${{ matrix.label }} attempt $attempt"
            mix test test/strangertalks_new/relationship_reconnections_test.exs --seed "$((9100 + attempt))" --max-cases 8
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              passes=$((passes + 1))
            else
              failures=$((failures + 1))
            fi
          done
          echo "F02_RELATIONSHIP_ISOLATION label=${{ matrix.label }} ref=${{ matrix.ref }} passes=$passes failures=$failures attempts=8"
          exit 0

  route-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact F-02 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_F02_COMMIT=$expected"
          echo "ACTUAL_F02_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Frozen Phoenix direct-entry contract
        id: phoenix-route-contract
        continue-on-error: true
        run: mix test test/strangertalks_new_web/controllers/route_architecture_test.exs

      - name: Frozen browser route contract
        id: browser-route-contract
        continue-on-error: true
        run: node --test test/js/route_contract_test.mjs

      - name: Full precommit regression
        id: full-precommit
        continue-on-error: true
        run: |
          mix precommit
          git diff --exit-code

      - name: Require focused contracts and precommit
        if: always()
        run: |
          test "${{ steps.phoenix-route-contract.outcome }}" = "success"
          test "${{ steps.browser-route-contract.outcome }}" = "success"
          test "${{ steps.full-precommit.outcome }}" = "success"
