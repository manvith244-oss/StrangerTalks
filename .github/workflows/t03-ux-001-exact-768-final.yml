name: T03 UX-001 Exact 768 Overflow A-B

on:
  push:
    branches:
      - validation/t03-ux-001-768-final

permissions:
  contents: read

jobs:
  exact-768-ab:
    name: Exact 768 A-B ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canonical
            sha: 423442915e37fd6aadd25bd1c6a300eed2b464f0
          - name: candidate
            sha: cff1d080cfbe050164eaea96bfe7de33641a2fa1

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      T03_AB_TARGET: ${{ matrix.name }}
      T03_EXACT_SHA: ${{ matrix.sha }}

    steps:
      - name: Checkout exact comparison SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Prove exact identity and clean entry tree
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T03_768_AB_TARGET=$T03_AB_TARGET"
          echo "T03_768_AB_EXPECTED_SHA=$T03_EXACT_SHA"
          echo "T03_768_AB_CHECKED_OUT_SHA=$actual"
          echo "T03_768_AB_VIEWPORT=768x1024"
          test "$actual" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare fresh isolated database
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start fresh exact-SHA Phoenix process
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > "/tmp/t03-768-ab-${T03_AB_TARGET}.log" 2>&1 &
          echo $! > "/tmp/t03-768-ab-${T03_AB_TARGET}.pid"
          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t03-768-ab-${T03_AB_TARGET}.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "/tmp/t03-768-ab-${T03_AB_TARGET}.log"
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null; then
              echo "T03_768_AB_SERVER_READY=$T03_AB_TARGET"
              exit 0
            fi
            sleep 1
          done
          cat "/tmp/t03-768-ab-${T03_AB_TARGET}.log"
          exit 1

      - name: Build identical read-only overflow-trace browser harness
        run: |
          set -euo pipefail
          mkdir -p "tmp/t03-768-ab-${T03_AB_TARGET}"
          cat > tmp/t03_768_ab.mjs <<'EOF'
          import assert from "node:assert/strict"
          import fs from "node:fs"
          import path from "node:path"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE_URL = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const TARGET = process.env.T03_AB_TARGET
          const EXACT_SHA = process.env.T03_EXACT_SHA
          const WAIT = 20_000
          const ARTIFACTS = path.resolve(`tmp/t03-768-ab-${TARGET}`)
          fs.mkdirSync(ARTIFACTS, {recursive: true})

          const evidence = {
            target: TARGET,
            exactSha: EXACT_SHA,
            viewport: {width: 768, height: 1024},
            participantIssuance: {},
            states: {},
            controls: {},
            conversationOffenders: [],
            conversationOwnership: null,
            retainedConversation: false,
            retainedMessage: false,
            historicalNonLive: false,
            historicalDelete: false,
            fullJourney: false,
            controlFailures: [],
            browserErrors: {},
            failedRequests: {}
          }

          function safeClassName(element) {
            if (typeof element.className === "string") return element.className
            return element.getAttribute("class") || ""
          }

          function roundedRect(rect) {
            return {
              x: Math.round(rect.x * 1000) / 1000,
              y: Math.round(rect.y * 1000) / 1000,
              left: Math.round(rect.left * 1000) / 1000,
              right: Math.round(rect.right * 1000) / 1000,
              top: Math.round(rect.top * 1000) / 1000,
              bottom: Math.round(rect.bottom * 1000) / 1000,
              width: Math.round(rect.width * 1000) / 1000,
              height: Math.round(rect.height * 1000) / 1000
            }
          }

          async function stateSnapshot(page, label) {
            const snapshot = await page.evaluate(() => {
              const active = document.querySelector('section[data-screen].active')
              const visibleControls = [...(active?.querySelectorAll('button, input, select, textarea, a[href]') || [])]
                .map(element => {
                  const style = getComputedStyle(element)
                  const rect = element.getBoundingClientRect()
                  if (style.display === "none" || style.visibility === "hidden" || rect.width <= 0 || rect.height <= 0) return null
                  return {
                    tag: element.tagName,
                    id: element.id || null,
                    class: typeof element.className === "string" ? element.className : (element.getAttribute("class") || ""),
                    type: element.getAttribute("type"),
                    ariaLabel: element.getAttribute("aria-label"),
                    disabled: "disabled" in element ? element.disabled : null,
                    rect: {
                      x: rect.x, y: rect.y, left: rect.left, right: rect.right,
                      top: rect.top, bottom: rect.bottom, width: rect.width, height: rect.height
                    }
                  }
                })
                .filter(Boolean)
              return {
                innerWidth,
                innerHeight,
                scrollX,
                scrollY,
                htmlWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                activeScreen: active?.dataset.screen || null,
                activeScreenRect: active ? (() => {
                  const rect = active.getBoundingClientRect()
                  return {x: rect.x, y: rect.y, left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom, width: rect.width, height: rect.height}
                })() : null,
                visibleControls
              }
            })
            evidence.states[label] = snapshot
            console.log(`T03_768_AB_${TARGET}_STATE_${label}=${JSON.stringify(snapshot)}`)
            assert.equal(snapshot.innerWidth, 768, `${label}: viewport width is exactly 768`)
            assert.equal(snapshot.innerHeight, 1024, `${label}: viewport height is exactly 1024`)
            return snapshot
          }

          async function controlSnapshot(page, locator, label) {
            const visible = await locator.isVisible()
            const enabled = visible ? await locator.isEnabled() : false
            const rect = visible ? await locator.boundingBox() : null
            const result = {visible, enabled, rect}
            evidence.controls[label] = result
            console.log(`T03_768_AB_${TARGET}_CONTROL_${label}=${JSON.stringify(result)}`)
            if (!visible) evidence.controlFailures.push(`${label}: not visible`)
            if (!enabled) evidence.controlFailures.push(`${label}: not enabled`)
            if (!rect) evidence.controlFailures.push(`${label}: not rendered`)
            if (rect && (rect.x < -1 || rect.x + rect.width > 769)) evidence.controlFailures.push(`${label}: outside 768px horizontal viewport`)
            if (rect && (rect.y < -1 || rect.y >= 1024)) evidence.controlFailures.push(`${label}: begins outside 1024px viewport`)
            return result
          }

          async function traceConversationOverflow(page) {
            const trace = await page.evaluate(() => {
              const offenders = []
              for (const element of document.body.querySelectorAll("*")) {
                const rect = element.getBoundingClientRect()
                if (rect.width <= 0 && rect.height <= 0) continue
                if (!(rect.left < -1 || rect.right > 769)) continue
                const style = getComputedStyle(element)
                const screen = element.closest('section[data-screen]')
                offenders.push({
                  tag: element.tagName,
                  id: element.id || null,
                  class: typeof element.className === "string" ? element.className : (element.getAttribute("class") || ""),
                  screen: screen?.dataset.screen || null,
                  screenActive: Boolean(screen?.classList.contains("active")),
                  rect: {
                    x: rect.x, y: rect.y, left: rect.left, right: rect.right,
                    top: rect.top, bottom: rect.bottom, width: rect.width, height: rect.height
                  },
                  style: {
                    display: style.display,
                    visibility: style.visibility,
                    position: style.position,
                    overflow: style.overflow,
                    overflowX: style.overflowX,
                    overflowY: style.overflowY,
                    width: style.width,
                    minWidth: style.minWidth,
                    maxWidth: style.maxWidth,
                    left: style.left,
                    right: style.right,
                    transform: style.transform,
                    boxSizing: style.boxSizing
                  }
                })
              }
              const ownership = {
                active: offenders.filter(item => item.screenActive).length,
                inactive: offenders.filter(item => item.screen && !item.screenActive).length,
                global: offenders.filter(item => !item.screen).length,
                activeScreens: [...new Set(offenders.filter(item => item.screenActive).map(item => item.screen))],
                inactiveScreens: [...new Set(offenders.filter(item => item.screen && !item.screenActive).map(item => item.screen))]
              }
              return {offenders, ownership}
            })
            evidence.conversationOffenders = trace.offenders
            evidence.conversationOwnership = trace.ownership
            console.log(`T03_768_AB_${TARGET}_CONVERSATION_OWNERSHIP=${JSON.stringify(trace.ownership)}`)
            console.log(`T03_768_AB_${TARGET}_CONVERSATION_OFFENDERS=${JSON.stringify(trace.offenders)}`)
            return trace
          }

          async function boot(browser, label) {
            const context = await browser.newContext({viewport: {width: 768, height: 1024}})
            const page = await context.newPage()
            const errors = []
            const failedRequests = []
            page.on("pageerror", error => errors.push(error.message))
            page.on("console", message => { if (message.type() === "error") errors.push(message.text()) })
            page.on("requestfailed", request => failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText || "failed"}`))

            const participantResponse = page.waitForResponse(response => {
              try { return new URL(response.url()).pathname === "/api/participants" } catch (_error) { return false }
            })
            const root = await page.goto(BASE_URL, {waitUntil: "domcontentloaded"})
            assert.ok(root?.ok(), `${label}: root loads`)
            const issued = await participantResponse
            evidence.participantIssuance[label] = issued.status()
            console.log(`T03_768_AB_${TARGET}_${label}_PARTICIPANT_ISSUANCE=${issued.status()}`)
            assert.equal(issued.status(), 201, `${label}: participant issuance succeeds without bypass`)
            await page.locator('section[data-screen="doors"].active').waitFor({state: "visible", timeout: WAIT})
            await page.locator("button.door").first().waitFor({state: "visible", timeout: WAIT})
            return {context, page, errors, failedRequests}
          }

          async function endConversation(page) {
            const actions = page.locator("details.overflow")
            if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()
            await page.locator("#end-conversation").click()
            await page.locator("#end-confirmation-dialog").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#end-confirm").click()
          }

          async function records(page) {
            return page.evaluate(async () => (await import("/assets/local_data.mjs")).listRecords())
          }

          function persistEvidence() {
            fs.writeFileSync(path.join(ARTIFACTS, "evidence.json"), JSON.stringify(evidence, null, 2))
          }

          test(`T03 UX-001 exact 768 overflow A-B ${TARGET}`, {timeout: 150_000}, async () => {
            const browser = await chromium.launch({headless: true})
            let a
            let b
            try {
              a = await boot(browser, "A")
              b = await boot(browser, "B")

              await stateSnapshot(a.page, "ARRIVAL")
              await controlSnapshot(a.page, a.page.locator("#conversation-language"), "ARRIVAL_LANGUAGE")
              await controlSnapshot(a.page, a.page.locator("button.door").first(), "ARRIVAL_DOOR")
              await a.page.screenshot({path: path.join(ARTIFACTS, "01-arrival.png"), fullPage: true})

              await a.page.locator("#conversation-language").selectOption("en")
              await b.page.locator("#conversation-language").selectOption("en")
              await a.page.locator('button.door:has-text("Advice")').click()
              await a.page.locator('section[data-screen="queue"].active').waitFor({state: "visible", timeout: WAIT})
              await a.page.getByRole("status").filter({hasText: "Queue status: queued"}).waitFor({state: "visible", timeout: WAIT})
              await stateSnapshot(a.page, "QUEUE")
              await controlSnapshot(a.page, a.page.locator("#leave-queue"), "QUEUE_LEAVE")
              await a.page.screenshot({path: path.join(ARTIFACTS, "02-queue.png"), fullPage: true})

              await b.page.locator('button.door:has-text("Advice")').click()
              await Promise.all([
                a.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              console.log(`T03_768_AB_${TARGET}_CONVERSATION_REACHED=true`)
              await stateSnapshot(a.page, "CONVERSATION")
              await traceConversationOverflow(a.page)
              await controlSnapshot(a.page, a.page.locator("#message-input"), "CONVERSATION_COMPOSER")
              const sendButton = a.page.getByRole("button", {name: "Send message", exact: true})
              await controlSnapshot(a.page, sendButton, "CONVERSATION_SEND")
              await a.page.screenshot({path: path.join(ARTIFACTS, "03-conversation.png"), fullPage: true})

              await a.page.locator("#message-input").fill("T03 exact 768 A-B retained message")
              await sendButton.click()
              await b.page.locator("#messages li", {hasText: "T03 exact 768 A-B retained message"}).waitFor({state: "visible", timeout: WAIT})
              console.log(`T03_768_AB_${TARGET}_MESSAGE_SEND=PASS`)

              await endConversation(a.page)
              await Promise.all([
                a.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              assert.equal(new URL(a.page.url()).pathname, "/conversation/ended", "terminal route is canonical")
              await stateSnapshot(a.page, "TERMINAL")
              await controlSnapshot(a.page, a.page.locator("#keep-conversation"), "TERMINAL_KEEP")
              await controlSnapshot(a.page, a.page.locator("#fade-conversation"), "TERMINAL_FADE")
              await a.page.screenshot({path: path.join(ARTIFACTS, "04-terminal.png"), fullPage: true})

              await Promise.all([
                a.page.locator("#keep-conversation").click(),
                b.page.locator("#keep-conversation").click()
              ])
              await Promise.all([
                a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              ])

              const kept = await records(a.page)
              const keptConversation = kept.find(record => record.type === "local_conversation" && record.value?.status === "kept")
              assert.ok(keptConversation, "retention creates a kept local Conversation")
              evidence.retainedConversation = true
              const conversationId = keptConversation.value.conversation_id
              const retainedMessage = kept.some(record => record.type === "local_message" && record.value?.conversation_id === conversationId && record.value?.content === "T03 exact 768 A-B retained message")
              assert.equal(retainedMessage, true, "retained history contains sent message")
              evidence.retainedMessage = true
              console.log(`T03_768_AB_${TARGET}_RETAINED_CONVERSATION=true`)
              console.log(`T03_768_AB_${TARGET}_RETAINED_MESSAGE=true`)
              await stateSnapshot(a.page, "RETENTION_ENTRY")
              const openLocal = a.page.getByRole("button", {name: /Open local copy/})
              await controlSnapshot(a.page, openLocal, "OPEN_LOCAL_COPY")
              await a.page.screenshot({path: path.join(ARTIFACTS, "05-retention-entry.png"), fullPage: true})

              await openLocal.click()
              await a.page.locator('section[data-screen="history"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, `/chats/${conversationId}`, "historical return uses retained route")
              assert.match(await a.page.locator(".local-copy-banner").innerText(), /not an active Conversation/i, "historical copy is marked non-live")
              assert.equal(await a.page.locator('section[data-screen="history"] #message-form').count(), 0, "historical copy has no live composer")
              evidence.historicalNonLive = true
              await stateSnapshot(a.page, "HISTORICAL_RETURN")
              await controlSnapshot(a.page, a.page.locator("#history-delete"), "HISTORY_DELETE")
              await a.page.screenshot({path: path.join(ARTIFACTS, "06-historical-return.png"), fullPage: true})

              a.page.once("dialog", dialog => dialog.accept())
              await a.page.locator("#history-delete").click()
              await a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "delete returns to canonical Chats route")
              assert.equal(await a.page.locator('section[data-screen="history"].active').count(), 0, "deleted history screen is inactive")
              evidence.historicalDelete = true
              await stateSnapshot(a.page, "POST_DELETE_CHATS")
              await a.page.screenshot({path: path.join(ARTIFACTS, "07-post-delete-chats.png"), fullPage: true})
              console.log(`T03_768_AB_${TARGET}_HISTORICAL_DELETE=PASS`)

              evidence.browserErrors.A = a.errors
              evidence.browserErrors.B = b.errors
              evidence.failedRequests.A = a.failedRequests
              evidence.failedRequests.B = b.failedRequests
              assert.deepEqual(a.errors, [], "participant A has no browser/console errors")
              assert.deepEqual(a.failedRequests, [], "participant A has no failed requests")
              assert.deepEqual(b.errors, [], "participant B has no browser/console errors")
              assert.deepEqual(b.failedRequests, [], "participant B has no failed requests")
              assert.deepEqual(evidence.controlFailures, [], `${TARGET}: primary controls remain usable inside exact viewport`)
              evidence.fullJourney = true
              console.log(`T03_768_AB_${TARGET}_FULL_JOURNEY=PASS`)
            } finally {
              if (a) {
                evidence.browserErrors.A = a.errors
                evidence.failedRequests.A = a.failedRequests
              }
              if (b) {
                evidence.browserErrors.B = b.errors
                evidence.failedRequests.B = b.failedRequests
              }
              persistEvidence()
              await a?.context.close().catch(() => {})
              await b?.context.close().catch(() => {})
              await browser.close().catch(() => {})
            }
          })
          EOF
          test "$(git rev-parse HEAD)" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Run identical exact 768x1024 real Chromium journey
        id: journey
        continue-on-error: true
        run: node --test --test-concurrency=1 tmp/t03_768_ab.mjs

      - name: Prove exact tested SHA and clean exit tree
        if: always()
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T03_768_AB_FINAL_TARGET=$T03_AB_TARGET"
          echo "T03_768_AB_FINAL_SHA=$actual"
          echo "T03_768_AB_FINAL_VIEWPORT=768x1024"
          test "$actual" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Upload exact-768 A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-ux-001-768-ab-${{ matrix.name }}-${{ github.run_id }}
          path: tmp/t03-768-ab-${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 14

      - name: Stop browser server
        if: always()
        run: |
          if [ -f "/tmp/t03-768-ab-${T03_AB_TARGET}.pid" ]; then
            pid="$(cat /tmp/t03-768-ab-${T03_AB_TARGET}.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
          fi

      - name: Browser server log on failure
        if: always()
        run: |
          if [ "${{ steps.journey.outcome }}" != "success" ]; then
            cat "/tmp/t03-768-ab-${T03_AB_TARGET}.log" || true
          fi

      - name: Enforce functional journey verdict
        if: always()
        run: |
          set -euo pipefail
          echo "T03_768_AB_FUNCTIONAL_OUTCOME=${{ steps.journey.outcome }}"
          test "${{ steps.journey.outcome }}" = "success"
          echo "T03_768_AB_FUNCTIONAL_RESULT=PASS"
