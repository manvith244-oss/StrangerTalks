name: Team 4 Async Authority Fix

on:
  push:
    branches:
      - newteam/media

permissions:
  contents: write

concurrency:
  group: team4-async-authority-fix
  cancel-in-progress: false

jobs:
  fix-and-regress:
    if: ${{ !contains(github.event.head_commit.message, '[team4-async-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch stale initiate/accept authority and add regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('priv/static/assets/live_call.mjs')
          s = path.read_text()

          old = '''    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:initiate", { call_type: callType })\n        .receive("ok", (res) => {\n          this.callAttemptId = res.call_attempt_id\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          this.teardown("initiate_failed")\n          reject(err)\n        })\n    })\n'''
          new = '''    const initiationToken = { status: this.status, role: this.role, conversationId: this.conversationId }\n    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:initiate", { call_type: callType })\n        .receive("ok", (res) => {\n          const stillCurrent =\n            this.status === CALL_STATUS.PENDING_OUTGOING &&\n            this.role === "caller" &&\n            this.callAttemptId === null &&\n            this.conversationId === initiationToken.conversationId\n          if (!stillCurrent) {\n            resolve({ ...res, stale: true })\n            return\n          }\n          this.callAttemptId = res.call_attempt_id\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          if (\n            this.status === CALL_STATUS.PENDING_OUTGOING &&\n            this.role === "caller" &&\n            this.callAttemptId === null &&\n            this.conversationId === initiationToken.conversationId\n          ) {\n            this.teardown("initiate_failed")\n          }\n          reject(err)\n        })\n    })\n'''
          if s.count(old) != 1:
              raise SystemExit(f'initiate block expected once, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:accept", { call_attempt_id: this.callAttemptId })\n        .receive("ok", (res) => {\n          this.status = CALL_STATUS.CONNECTING\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          this.teardown("accept_failed")\n          reject(err)\n        })\n    })\n'''
          new = '''    const acceptedAttemptId = this.callAttemptId\n    const acceptedConversationId = this.conversationId\n    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:accept", { call_attempt_id: acceptedAttemptId })\n        .receive("ok", (res) => {\n          const stillCurrent =\n            this.status === CALL_STATUS.PENDING_INCOMING &&\n            this.callAttemptId === acceptedAttemptId &&\n            this.conversationId === acceptedConversationId\n          if (!stillCurrent) {\n            resolve({ ...res, stale: true })\n            return\n          }\n          this.status = CALL_STATUS.CONNECTING\n          this.applyOutgoingAudioGate()\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          if (\n            this.status === CALL_STATUS.PENDING_INCOMING &&\n            this.callAttemptId === acceptedAttemptId &&\n            this.conversationId === acceptedConversationId\n          ) {\n            this.teardown("accept_failed")\n          }\n          reject(err)\n        })\n    })\n'''
          if s.count(old) != 1:
              raise SystemExit(f'accept block expected once, got {s.count(old)}')
          s = s.replace(old, new, 1)
          path.write_text(s)

          test_path = Path('test/js/team4_media_authority_test.mjs')
          tests = test_path.read_text()
          marker = 'T4-006: late Accept success after terminal teardown is inert'
          if marker not in tests:
              tests += r'''

function controllablePush() {
  const handlers = new Map()
  return {
    receive(kind, callback) { handlers.set(kind, callback); return this },
    fire(kind, payload) { handlers.get(kind)?.(payload) }
  }
}

test("T4-006: late Accept success after terminal teardown is inert", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({
    participantId: "p1",
    conversationId: "c1",
    channel: { push(event) { assert.equal(event, "call:accept"); return push } }
  })
  coord.callAttemptId = "a1"
  coord.role = "callee"
  coord.status = CALL_STATUS.PENDING_INCOMING
  const pending = coord.accept()
  coord.teardown("blocked")
  push.fire("ok", { call_attempt_id: "a1" })
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
})

test("T4-007: late Initiate success after terminal teardown cannot rebind attempt authority", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({
    participantId: "p1",
    conversationId: "c1",
    channel: { push(event) { assert.equal(event, "call:initiate"); return push } }
  })
  const pending = coord.initiate("voice")
  coord.teardown("ended")
  push.fire("ok", { call_attempt_id: "dead-attempt" })
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
  assert.notEqual(coord.status, CALL_STATUS.ACTIVE)
})
'''
              test_path.write_text(tests)
          PY

          node --test --test-concurrency=1 test/js/team4_media_authority_test.mjs test/js/live_call_test.mjs

          rm -f \
            .github/workflows/team4-bootstrap-media-authority.yml \
            .github/workflows/team4-bootstrap-pr-executor.yml \
            .team4-bootstrap-trigger

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add priv/static/assets/live_call.mjs test/js/team4_media_authority_test.mjs .github/workflows/team4-bootstrap-media-authority.yml .github/workflows/team4-bootstrap-pr-executor.yml .team4-bootstrap-trigger
          if ! git diff --cached --quiet; then
            git commit -m 'Fix stale live-call async authority [team4-async-fixed]'
            git push origin HEAD:newteam/media
          fi
