name: C4 Apply Accepted History Route Fix

on:
  push:
    branches:
      - convergence/c4-history-route-closure-2026-09-10

concurrency:
  group: c4-history-route-apply
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-exact-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: convergence/c4-history-route-closure-2026-09-10
          fetch-depth: 0

      - name: Apply only the accepted deletion-route replacement
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("priv/static/assets/app.js")
          text = path.read_text()
          old = 'releaseAllVoiceUrls(); show("chats") })'
          new = 'releaseAllVoiceUrls(); await navigation.replace("/chats") })'
          count = text.count(old)
          if count == 0:
              print("accepted replacement already present; nothing to patch")
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f"expected exactly one accepted target, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

          if git diff --quiet -- priv/static/assets/app.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(git diff --name-only | tr -d '\r')" = "priv/static/assets/app.js"
          test "$(git diff --numstat -- priv/static/assets/app.js)" = $'1\t1\tpriv/static/assets/app.js'
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit exact production delta
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "StrangerTalks C4"
          git config user.email "actions@users.noreply.github.com"
          git add -- priv/static/assets/app.js
          git commit -m "fix(c4): replace deleted Conversation route with Chats"
          git push origin HEAD:convergence/c4-history-route-closure-2026-09-10
