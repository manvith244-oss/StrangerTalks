name: C3 T05 Fatal Termination Corrective Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "priv/static/assets/live_call.mjs"
      - "test/js/t05_fatal_termination_ack_retry_test.mjs"
      - "test/strangertalks_new/t05_view_epoch_restart_test.exs"
      - ".github/workflows/c3-t05-fatal-termination-corrective.yml"

permissions:
  contents: read

concurrency:
  group: c3-t05-fatal-corrective-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact C3 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact SHA and tree before tests
        run: |
          echo "C3_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "C3_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install BEAM dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: T05 and WebRTC Node regressions
        run: |
          node --test --test-concurrency=1 \
            test/js/t05_fatal_termination_ack_retry_test.mjs \
            test/js/t05_call_end_aba_closure_test.mjs \
            test/js/t05_net_003_credential_timeout_test.mjs \
            test/js/t05_net_003_ice_failure_test.mjs \
            test/js/live_call_test.mjs \
            test/js/team4_call_operation_race_test.mjs \
            test/js/team4_media_authority_test.mjs \
            test/js/team6_media_gate_test.mjs

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: T05 and affected Elixir media regressions
        run: |
          mix test \
            test/strangertalks_new/conversation_live_call_test.exs \
            test/strangertalks_new_web/channels/conversation_call_channel_test.exs \
            test/strangertalks_new/t05_view_epoch_restart_test.exs \
            test/strangertalks_new/t05_view_presentation_atomicity_test.exs \
            test/strangertalks_new/team6_media_authority_test.exs \
            test/strangertalks_new/team6_turn_provider_test.exs \
            test/strangertalks_new/view_once_media_store_test.exs

      - name: Format check
        run: mix format --check-formatted

      - name: Compile warnings as errors
        run: mix compile --warnings-as-errors

      - name: Unused dependency check
        run: mix deps.unlock --check-unused

      - name: Full precommit
        run: mix precommit

      - name: Diff check
        run: git diff --check

      - name: Clean tree and exact final identity
        run: |
          git status --porcelain | tee /tmp/c3-t05-status
          test ! -s /tmp/c3-t05-status
          echo "C3_FINAL_SHA=$(git rev-parse HEAD)"
          echo "C3_FINAL_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
