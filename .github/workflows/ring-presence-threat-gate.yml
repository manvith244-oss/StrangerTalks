name: Ring Presence Threat Gate

on:
  push:
    branches:
      - security/ring-presence-b1-b3-closure-2026-09-11
  pull_request:
    branches:
      - main
    paths:
      - "docs/hangouts-v1-design.md"
      - "docs/superpowers/plans/2026-09-10-hangouts-v1.md"
      - "lib/strangertalks_new_web/hangout_channel.ex"
      - "priv/static/assets/live_call.mjs"
      - "priv/static/assets/app.js"
      - "priv/static/assets/app.css"
      - "test/js/live_call_test.mjs"
      - "test/strangertalks_new/ring_presence_threat_gate_test.exs"
      - ".github/workflows/ring-presence-threat-gate.yml"

permissions:
  contents: read

jobs:
  b1-b3-threat-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prepare database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: B1/B3 threat-model closure tests
        run: mix test test/strangertalks_new/ring_presence_threat_gate_test.exs
