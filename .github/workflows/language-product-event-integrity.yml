name: Language Product Event Integrity

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source SHA to test; defaults to the workflow ref SHA
        required: false
        type: string

concurrency:
  group: language-product-events-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  language-events:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'EXPECTED_SHA=%s\nACTUAL_SHA=%s\n' "$TARGET_SHA" "$actual_sha"
          test "$TARGET_SHA" = "$actual_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run focused product-event integrity suite
        run: node --test test/js/product_events*.mjs

      - name: Final exact-SHA and clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'TESTED_SHA=%s\n' "$actual_sha"
          test "$actual_sha" = "$TARGET_SHA"
          git diff --exit-code -- .
          status="$(git status --porcelain)"
          printf 'WORKTREE=%s\n' "${status:-CLEAN}"
          test -z "$status"
