name: WT-02 Team 6 Runtime Patch

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Apply exact reviewed runtime cuts once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()

          def replace_in_handler(text, start_marker, next_marker, pattern, replacement, label):
              start = text.index(start_marker)
              end = text.index(next_marker, start + len(start_marker))
              block = text[start:end]
              updated, count = re.subn(pattern, replacement, block, count=1, flags=re.MULTILINE)
              assert count == 1, f"{label}: expected one exact cut, found {count}"
              return text[:start] + updated + text[end:]

          text = replace_in_handler(
              text,
              "  def handle_call({:acknowledge_message, participant_id, message_id}, _from, state) do",
              "\n  def handle_call(",
              r"\n\s*terminating\?\(state\) ->\n\s*\{:reply, \{:error, :conversation_terminating\}, state\}\n",
              "\n",
              "text ACK terminating gate",
          )

          text = replace_in_handler(
              text,
              "  def handle_info({:retry_message, message_id, retry_token}, state) do",
              "\n  def handle_info(",
              r"(?ms)        if connected\?\(state, message\.recipient_id\) do\n\s*deliver_to_participant\(state, message\.recipient_id, message\)\n\s*\{:noreply, schedule_retry\(state, message_id\)\}\n\s*else\n\s*\{:noreply, state\}\n\s*end",
              """        cond do
          terminating?(state) ->
            {:noreply, state}

          connected?(state, message.recipient_id) ->
            deliver_to_participant(state, message.recipient_id, message)
            {:noreply, schedule_retry(state, message_id)}

          true ->
            {:noreply, state}
        end""",
              "text/expressive retry authority",
          )

          text = replace_in_handler(
              text,
              "  def handle_info({:retry_voice_note, voice_note_id, retry_token}, state) do",
              "\n  def handle_info(",
              r"(?ms)        if connected\?\(state, note\.recipient_id\) do\n\s*deliver_voice_note_to_participant\(state, note\.recipient_id, note\)\n\s*\{:noreply, schedule_voice_retry\(state, voice_note_id\)\}\n\s*else\n\s*\{:noreply, state\}\n\s*end",
              """        cond do
          terminating?(state) ->
            {:noreply, state}

          connected?(state, note.recipient_id) ->
            deliver_voice_note_to_participant(state, note.recipient_id, note)
            {:noreply, schedule_voice_retry(state, voice_note_id)}

          true ->
            {:noreply, state}
        end""",
              "voice retry authority",
          )

          path.write_text(text)
          PY

          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

          if git diff --quiet -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex; then
            echo "Runtime already repaired."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: freeze conversation transmission while terminating"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair
