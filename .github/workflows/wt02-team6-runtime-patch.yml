name: WT-02 Team 6 Runtime Patch

on:
  push:
    branches:
      - wind-tunnel/wt02-terminal-transport-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Apply exact reviewed runtime cuts once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()

          ack_start = text.index("  def handle_call({:acknowledge_message, participant_id, message_id}, _from, state) do")
          ack_end = text.index("\n  def handle_call(", ack_start + 1)
          ack_block = text[ack_start:ack_end]
          ack_gate = """      terminating?(state) ->
                {:reply, {:error, :conversation_terminating}, state}

          """
          assert ack_block.count(ack_gate) == 1, "text ACK terminating gate drifted"
          ack_block = ack_block.replace(ack_gate, "", 1)
          text = text[:ack_start] + ack_block + text[ack_end:]

          text_retry_old = """        if connected?(state, message.recipient_id) do
                  deliver_to_participant(state, message.recipient_id, message)
                  {:noreply, schedule_retry(state, message_id)}
                else
                  {:noreply, state}
                end
          """
          text_retry_new = """        cond do
                  terminating?(state) ->
                    {:noreply, state}

                  connected?(state, message.recipient_id) ->
                    deliver_to_participant(state, message.recipient_id, message)
                    {:noreply, schedule_retry(state, message_id)}

                  true ->
                    {:noreply, state}
                end
          """
          assert text.count(text_retry_old) == 1, "text/expressive retry authority drifted"
          text = text.replace(text_retry_old, text_retry_new, 1)

          voice_retry_old = """        if connected?(state, note.recipient_id) do
                  deliver_voice_note_to_participant(state, note.recipient_id, note)
                  {:noreply, schedule_voice_retry(state, voice_note_id)}
                else
                  {:noreply, state}
                end
          """
          voice_retry_new = """        cond do
                  terminating?(state) ->
                    {:noreply, state}

                  connected?(state, note.recipient_id) ->
                    deliver_voice_note_to_participant(state, note.recipient_id, note)
                    {:noreply, schedule_voice_retry(state, voice_note_id)}

                  true ->
                    {:noreply, state}
                end
          """
          assert text.count(voice_retry_old) == 1, "voice retry authority drifted"
          text = text.replace(voice_retry_old, voice_retry_new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

          if git diff --quiet -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex; then
            echo "Runtime already repaired."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: freeze conversation transmission while terminating"
          git push origin HEAD:wind-tunnel/wt02-terminal-transport-repair
