name: T09 T03 UX-001 Independent Browser Verification

on:
  push:
    branches:
      - team9/verification-baseline-gate
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  PORT: "4000"
  EXPECTED_SHA: cff1d080cfbe050164eaea96bfe7de33641a2fa1
  EXPECTED_TREE: d16afe6b2b05472d012ac6113203e91c492d06ba
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  verify:
    name: T09-T03-UX-001 historical-delete hostile browser proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact frozen T03 UX-001 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prove requested checkout identity and tree
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          echo "REQUESTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$actual_sha"
          echo "REQUESTED_TREE=$EXPECTED_TREE"
          echo "CHECKED_OUT_TREE=$actual_tree"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_tree" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          git diff --check HEAD^
          grep -F 'await navigation.replace("/chats")' priv/static/assets/app.js
          echo "checked_out_sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare pristine hostile browser database
        run: |
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Inject independent T09 historical-delete hostile proof
        shell: bash
        run: |
          cat > test/t09_t03_ux_001_hostile_browser_test.mjs <<'JAVASCRIPT'
          import assert from "node:assert/strict"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE_URL = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const WAIT = 15_000
          const VIEWPORT = {width: 768, height: 1024}

          async function boot(browser, path = "/") {
            const context = await browser.newContext({viewport: VIEWPORT})
            const page = await context.newPage()
            const errors = []
            page.on("pageerror", error => errors.push(`pageerror:${error.message}`))
            page.on("console", message => {
              if (message.type() === "error") errors.push(`console:${message.text()}`)
            })
            const response = await page.goto(`${BASE_URL}${path}`, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${path} loads`)
            await page.waitForFunction(() => document.querySelectorAll("#doors button.door").length > 0, null, {timeout: WAIT})
            await page.locator("#conversation-language").selectOption("en")
            return {context, page, errors}
          }

          function active(page, name) {
            return page.locator(`section[data-screen="${name}"].active`)
          }

          async function snapshot(page, label) {
            const value = await page.evaluate(() => ({
              path: location.pathname,
              innerWidth,
              innerHeight,
              documentWidth: document.documentElement.scrollWidth,
              bodyWidth: document.body.scrollWidth,
              activeScreen: document.querySelector("section.screen.active")?.dataset?.screen || null
            }))
            console.log(`T09_SNAPSHOT ${label} ${JSON.stringify(value)}`)
            return value
          }

          async function assertStableWidth(page, label) {
            const value = await snapshot(page, label)
            assert.equal(value.innerWidth, 768, `${label}: exact 768 viewport`)
            assert.equal(value.innerHeight, 1024, `${label}: exact 1024 viewport`)
            assert.ok(value.documentWidth <= value.innerWidth, `${label}: document does not overflow viewport`)
            assert.ok(value.bodyWidth <= value.innerWidth, `${label}: body does not overflow viewport`)
          }

          async function assertControlInsideViewport(page, locator, label) {
            await locator.waitFor({state: "visible", timeout: WAIT})
            assert.equal(await locator.isEnabled(), true, `${label}: enabled`)
            const box = await locator.boundingBox()
            assert.ok(box, `${label}: has geometry`)
            assert.ok(box.x >= 0 && box.y >= 0, `${label}: starts inside viewport`)
            assert.ok(box.x + box.width <= VIEWPORT.width + 1, `${label}: horizontally usable`)
            assert.ok(box.y + Math.min(box.height, 48) <= VIEWPORT.height + 1, `${label}: primary area vertically reachable`)
            console.log(`T09_CONTROL ${label} ${JSON.stringify(box)}`)
          }

          async function matchPair(browser) {
            const a = await boot(browser)
            const b = await boot(browser)
            await active(a.page, "doors").waitFor({state: "visible", timeout: WAIT})
            await active(b.page, "doors").waitFor({state: "visible", timeout: WAIT})
            const doorA = a.page.locator('button.door:has-text("Advice")')
            const doorB = b.page.locator('button.door:has-text("Advice")')
            await doorA.click()
            await active(a.page, "queue").waitFor({state: "visible", timeout: WAIT})
            assert.equal(new URL(a.page.url()).pathname, "/matchmaking")
            await doorB.click()
            await Promise.all([
              active(a.page, "conversation").waitFor({state: "visible", timeout: WAIT}),
              active(b.page, "conversation").waitFor({state: "visible", timeout: WAIT})
            ])
            assert.equal(new URL(a.page.url()).pathname, "/conversation")
            return {a, b}
          }

          async function endConversation(page) {
            const actions = page.locator("details.overflow")
            if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()
            await page.locator("#end-conversation").click()
            await page.locator("#end-confirmation-dialog").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#end-confirm").click()
          }

          async function records(page) {
            return page.evaluate(async () => (await import("/assets/local_data.mjs")).listRecords())
          }

          test("T09 exact 768 hostile journey deletes retained history without stale route or live resurrection", {timeout: 180_000}, async () => {
            const browser = await chromium.launch({headless: true})
            let pair
            try {
              pair = await matchPair(browser)
              const {a, b} = pair

              await a.page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))))
              assert.equal(await a.page.evaluate(() => document.activeElement?.id), "message-input", "fresh Conversation focuses TEXTAREA#message-input")
              await assertStableWidth(a.page, "conversation")

              const composer = a.page.locator("#message-input")
              const send = a.page.getByRole("button", {name: "Send message", exact: true})
              assert.equal(await send.count(), 1, "Send has one accessible authority")
              await assertControlInsideViewport(a.page, composer, "composer")
              await assertControlInsideViewport(a.page, send, "send")
              console.log(`T09_COMPOSER ${JSON.stringify(await composer.boundingBox())}`)

              await composer.fill("t09 historical delete authority")
              await send.click()
              await b.page.locator("#messages li", {hasText: "t09 historical delete authority"}).waitFor({state: "visible", timeout: WAIT})

              await endConversation(a.page)
              await Promise.all([
                active(a.page, "ended").waitFor({state: "visible", timeout: WAIT}),
                active(b.page, "ended").waitFor({state: "visible", timeout: WAIT})
              ])
              assert.equal(new URL(a.page.url()).pathname, "/conversation/ended")
              await assertStableWidth(a.page, "terminal")

              const keep = a.page.locator("#keep-conversation")
              await assertControlInsideViewport(a.page, keep, "keep")
              await keep.click()
              await active(a.page, "chats").waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats")
              await assertStableWidth(a.page, "chats-after-keep")

              const kept = await records(a.page)
              const retained = kept.find(record => record.type === "local_conversation" && record.value?.status === "kept")
              assert.ok(retained, "Keep creates participant-owned retained local Conversation")
              const conversationId = retained.value.conversation_id
              assert.ok(kept.some(record => record.type === "local_message" && record.value?.conversation_id === conversationId && record.value?.content === "t09 historical delete authority"), "retained local copy contains sent content")

              const openCopy = a.page.getByRole("button", {name: /Open local copy/})
              assert.equal(await openCopy.count(), 1, "one retained copy exposes one accessible Open local copy control")
              await assertControlInsideViewport(a.page, openCopy, "open-local-copy")
              await openCopy.click()
              await active(a.page, "history").waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, `/chats/${conversationId}`)
              await assertStableWidth(a.page, "historical-copy")

              assert.equal(await active(a.page, "conversation").count(), 0, "historical copy has no active live Conversation screen")
              assert.equal(await a.page.locator("#message-input").isVisible(), false, "historical copy has no live composer")
              assert.equal(await send.isVisible(), false, "historical copy has no live Send action")
              assert.equal(await a.page.locator("#end-conversation").isVisible(), false, "historical copy has no live End mutation control")
              assert.equal(await a.page.locator("#block").isVisible(), false, "historical copy has no live Block mutation control")
              assert.equal(await a.page.locator('button:visible').filter({hasText: /call/i}).count(), 0, "historical copy exposes no visible live call control")

              const deleteButton = a.page.locator("#history-delete")
              assert.equal(await deleteButton.count(), 1, "Delete control authority is unique")
              await assertControlInsideViewport(a.page, deleteButton, "history-delete")
              a.page.once("dialog", dialog => dialog.accept())
              await deleteButton.click()
              await active(a.page, "chats").waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "Delete replaces stale /chats/:id route with /chats")
              await assertStableWidth(a.page, "chats-after-delete")

              const afterDelete = await records(a.page)
              assert.equal(afterDelete.some(record => record.id === `conversation:${conversationId}` && record.type === "local_conversation"), false, "deleted retained Conversation is no longer live local history")
              assert.equal(afterDelete.some(record => record.type === "local_message" && record.value?.conversation_id === conversationId), false, "deleted retained messages are no longer live local history")
              assert.equal(afterDelete.find(record => record.id === `conversation:${conversationId}`)?.type, "sync_tombstone", "deletion leaves only sync deletion authority for Conversation")

              await a.page.goBack({waitUntil: "domcontentloaded"})
              await active(a.page, "chats").waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "Back cannot resurrect deleted historical detail")
              assert.equal(await active(a.page, "history").count(), 0)

              await a.page.goForward({waitUntil: "domcontentloaded"})
              await active(a.page, "chats").waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "Forward cannot resurrect deleted historical detail")
              assert.equal(await active(a.page, "history").count(), 0)

              const staleResponse = await a.page.goto(`${BASE_URL}/chats/${conversationId}`, {waitUntil: "domcontentloaded"})
              assert.ok(staleResponse?.ok(), "direct stale historical URL loads app shell")
              await active(a.page, "chats").waitFor({state: "visible", timeout: WAIT})
              await a.page.waitForFunction(() => location.pathname === "/chats", null, {timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "direct stale URL canonicalizes to Chats")
              assert.equal(await active(a.page, "history").count(), 0, "direct stale URL cannot resurrect deleted local copy")

              assert.deepEqual(a.errors, [], `participant A browser/console failures: ${JSON.stringify(a.errors)}`)
              assert.deepEqual(b.errors, [], `participant B browser/console failures: ${JSON.stringify(b.errors)}`)
            } finally {
              await Promise.all([pair?.a, pair?.b].filter(Boolean).map(({context}) => context.close().catch(() => {})))
              await browser.close().catch(() => {})
            }
          })
          JAVASCRIPT
          node --check test/t09_t03_ux_001_hostile_browser_test.mjs

      - name: Start Phoenix hostile real stack
        run: |
          mix run --no-start -e '
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint_config |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127, 0, 0, 1}, port: 4000]))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t09-t03-phoenix.log 2>&1 &
          echo $! > /tmp/t09-t03-phoenix.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/t09-t03-phoenix.pid)" 2>/dev/null; then cat /tmp/t09-t03-phoenix.log; exit 1; fi
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t09-t03-phoenix.log
          exit 1

      - name: Execute independent hostile browser proof
        id: hostile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo "HOSTILE_EXECUTION_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || exit 97
          node --test --test-concurrency=1 test/t09_t03_ux_001_hostile_browser_test.mjs 2>&1 | tee /tmp/t09-t03-hostile.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Stop hostile Phoenix and remove injected proof
        if: always()
        run: |
          if [ -f /tmp/t09-t03-phoenix.pid ]; then kill "$(cat /tmp/t09-t03-phoenix.pid)" 2>/dev/null || true; fi
          rm -f test/t09_t03_ux_001_hostile_browser_test.mjs
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Reset database for source regression isolation
        run: |
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix source-regression real stack
        run: |
          mix run --no-start -e '
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20))
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, endpoint_config |> Keyword.put(:server, true) |> Keyword.put(:http, [ip: {127, 0, 0, 1}, port: 4000]))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t09-t03-source-phoenix.log 2>&1 &
          echo $! > /tmp/t09-t03-source-phoenix.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/t09-t03-source-phoenix.pid)" 2>/dev/null; then cat /tmp/t09-t03-source-phoenix.log; exit 1; fi
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t09-t03-source-phoenix.log
          exit 1

      - name: Existing F03 navigation browser regression
        id: f03_browser
        continue-on-error: true
        run: node --test --test-concurrency=1 test/js/navigation_history_browser_test.mjs

      - name: Existing retained-delete browser regression
        id: continuity_browser
        continue-on-error: true
        run: node --test --test-concurrency=1 --test-name-pattern="real browser Keep -> encrypted restore -> Delete tombstone -> hostile stale device -> convergence" test/js/team5_continuity_browser_attack_test.mjs

      - name: Stop source-regression Phoenix
        if: always()
        run: |
          if [ -f /tmp/t09-t03-source-phoenix.pid ]; then kill "$(cat /tmp/t09-t03-source-phoenix.pid)" 2>/dev/null || true; fi

      - name: Route and navigation unit regressions
        id: route_units
        continue-on-error: true
        run: |
          node --test test/js/route_contract_test.mjs test/js/navigation_history_test.mjs

      - name: Candidate JavaScript syntax and diff hygiene
        id: hygiene
        continue-on-error: true
        run: |
          node --check priv/static/assets/app.js
          git diff --check HEAD^
          git diff --exit-code

      - name: Reset database before full precommit
        run: |
          mix ecto.drop --force || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit classification surface
        id: precommit
        continue-on-error: true
        run: mix precommit

      - name: Final exact SHA tree and clean-state proof
        id: final
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          status="$(git status --porcelain)"
          echo "FINAL_TESTED_SHA=$final_sha"
          echo "FINAL_TREE=$final_tree"
          printf 'FINAL_STATUS=%q\n' "$status"
          test "$final_sha" = "$EXPECTED_SHA"
          test "$final_tree" = "$EXPECTED_TREE"
          test -z "$status"

      - name: T09 T03 UX-001 evidence summary
        if: always()
        run: |
          echo "REQUESTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=${{ steps.identity.outputs.checked_out_sha }}"
          echo "HOSTILE_EXECUTION_SHA=$EXPECTED_SHA"
          echo "FINAL_TESTED_SHA=$EXPECTED_SHA"
          echo "TREE=$EXPECTED_TREE"
          echo "HOSTILE_OUTCOME=${{ steps.hostile.outcome }}"
          echo "F03_BROWSER_OUTCOME=${{ steps.f03_browser.outcome }}"
          echo "CONTINUITY_BROWSER_OUTCOME=${{ steps.continuity_browser.outcome }}"
          echo "ROUTE_UNITS_OUTCOME=${{ steps.route_units.outcome }}"
          echo "HYGIENE_OUTCOME=${{ steps.hygiene.outcome }}"
          echo "PRECOMMIT_OUTCOME=${{ steps.precommit.outcome }}"
          echo "FINAL_IDENTITY_OUTCOME=${{ steps.final.outcome }}"

      - name: Enforce owned T03 verification gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.hostile.outcome }}" = "success"
          test "${{ steps.f03_browser.outcome }}" = "success"
          test "${{ steps.continuity_browser.outcome }}" = "success"
          test "${{ steps.route_units.outcome }}" = "success"
          test "${{ steps.hygiene.outcome }}" = "success"
          test "${{ steps.final.outcome }}" = "success"
