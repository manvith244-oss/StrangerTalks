name: WT-03 H-01A Post-Merge Canonical Proof

on:
  push:
    branches:
      - diagnostic/wt03-h01a-canonical-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wt03-h01a-canonical-proof-${{ github.sha }}
  cancel-in-progress: true

jobs:
  canonical-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      PGPASSWORD: strangertalks_test
      TARGET_CANONICAL_SHA: "f5137457fe1750af5c470e98ee924f0036588a05"
      TARGET_CANONICAL_TREE: "d273cee108b485b77149f7045bc8f0ffed7f5004"
      EXPECTED_MIGRATIONS_TREE: "662fa9e49daaa8832fb4175c1366fbedbd1ad1a6"
      EXPECTED_REPOSITORY_HEAD: "20260914175320"
      EXPECTED_PRODUCTION_HEAD: "20260821191324"

    steps:
      - name: Assert single attempt
        shell: bash
        run: |
          test "${{ github.run_attempt }}" = "1"

      - name: Checkout exact canonical SHA
        uses: actions/checkout@v4
        with:
          ref: "f5137457fe1750af5c470e98ee924f0036588a05"
          fetch-depth: 0

      - name: Assert Canonical Identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_migrations_tree="$(git rev-parse 'HEAD:priv/repo/migrations')"
          repo_latest=$(find priv/repo/migrations -maxdepth 1 -type f -name '*.exs' -printf '%f\n' | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort | tail -1)

          echo "=== CANONICAL IDENTITY ==="
          echo "HEAD=$actual_sha"
          echo "TREE=$actual_tree"
          echo "MIGRATIONS_TREE=$actual_migrations_tree"
          echo "REPO_HEAD=$repo_latest"

          test "$actual_sha" = "$TARGET_CANONICAL_SHA"
          test "$actual_tree" = "$TARGET_CANONICAL_TREE"
          test "$actual_migrations_tree" = "$EXPECTED_MIGRATIONS_TREE"
          test "$repo_latest" = "$EXPECTED_REPOSITORY_HEAD"
          echo "CANONICAL IDENTITY PASS"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Format Hygiene
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted
          echo "FORMAT PASS"

      - name: Create PostgreSQL Roles & Prepare Database
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U strangertalks_local -d strangertalks_new_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN CREATE ROLE supabase_admin NOLOGIN; END IF;
          END
          $$;
          GRANT CREATE, USAGE ON SCHEMA public TO supabase_admin;
          SQL
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          echo "DATABASE PREPARED"

      - name: Migration Workflow Contract
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/rpr_production_migration_workflow_contract_test.exs
          echo "MIGRATION CONTRACT PASS"

      - name: H-01A Focused Contract
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/h01a_source_safe_reports_test.exs
          echo "H01A FOCUSED PASS"

      - name: Hangout Safety
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/hangouts/safety_test.exs
          echo "HANGOUT SAFETY PASS"

      - name: DB Security Closure
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/team4_db_security_closure_test.exs
          echo "DB SECURITY CLOSURE PASS"

      - name: Standard Linux Precommit
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNING STANDARD UNMODIFIED MIX PRECOMMIT ==="
          mix precommit
          echo "STANDARD PRECOMMIT PASS"

      - name: Prepare Proof Artifact
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="canonical_proof_artifact"
          mkdir -p "$proof_dir"

          cat <<EOF > "$proof_dir/canonical_proof_record.json"
          {
            "canonical_sha": "$TARGET_CANONICAL_SHA",
            "canonical_tree": "$TARGET_CANONICAL_TREE",
            "migration_tree": "$EXPECTED_MIGRATIONS_TREE",
            "repository_migration_head": "$EXPECTED_REPOSITORY_HEAD",
            "production_migration_head": "$EXPECTED_PRODUCTION_HEAD",
            "runner_os": "$RUNNER_OS",
            "runner_arch": "$RUNNER_ARCH",
            "elixir_version": "1.18.4",
            "otp_version": "27.3.4",
            "postgres_image": "postgres:17",
            "status": "CANONICAL_PROVEN"
          }
          EOF

      - name: Upload Proof Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wt03-h01a-canonical-proof
          path: canonical_proof_artifact/
          if-no-files-found: error
