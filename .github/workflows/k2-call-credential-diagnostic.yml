name: K2 Call Credential Diagnostic

on:
  push:
    branches:
      - diagnostics/call-state-2026-08-29
    paths:
      - .github/workflows/k2-call-credential-diagnostic.yml

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
  SOURCE_SHA: 2c53f29dbde5d7848b42bfe3d3c44054d01f153f

jobs:
  trace-credential-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Instrument call frame journal and ICE state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          live = Path("priv/static/assets/live_call.mjs")
          source = live.read_text()
          needle = '    peerConnection = new RTCPC(config)\n    this.peerConnection = peerConnection\n'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '    console.log(`[CALL_PC_TRACE] role=${this.role} created=true`)\n', 1)
          needle = '    peerConnection.oniceconnectionstatechange = () => {\n      const state = peerConnection.iceConnectionState\n'
          assert source.count(needle) == 1
          source = source.replace(needle, needle + '      console.log(`[CALL_ICE_TRACE] role=${this.role} state=${state}`)\n', 1)
          live.write_text(source)

          p = Path("test/js/browser_e2e_test.mjs")
          text = p.read_text()
          console_old = '''  page.on("console", message => {
    if (message.type() === "error") consoleErrors.push(message.text())
  })
'''
          console_new = '''  page.on("console", message => {
    const text = message.text()
    if (text.startsWith("[CALL_PC_TRACE]") || text.startsWith("[CALL_ICE_TRACE]")) console.log(text)
    if (message.type() === "error") consoleErrors.push(text)
  })
'''
          assert text.count(console_old) == 1
          text = text.replace(console_old, console_new, 1)

          old = '''    await pair.b.page.locator("#btn-call-accept").click()
    await pair.a.page.locator("#live-call-active").waitFor({state: "visible"})
    await pair.b.page.locator("#live-call-active").waitFor({state: "visible"})

    // A sends Heart reaction
'''
          new = r'''    await pair.b.page.locator("#btn-call-accept").click()
    await pair.a.page.locator("#live-call-active").waitFor({state: "visible"})
    await pair.b.page.locator("#live-call-active").waitFor({state: "visible"})
    await new Promise(resolve => setTimeout(resolve, 5000))
    for (const [side, observed] of [["A", pair.a], ["B", pair.b]]) {
      const sentCallRefs = new Set(observed.journal.events
        .filter(event => event.type === "frame_sent" && event.event?.startsWith("call:"))
        .map(event => event.ref)
        .filter(Boolean))
      const frames = observed.journal.events.filter(event =>
        (event.type === "frame_sent" && event.event?.startsWith("call:")) ||
        (event.type === "frame_received" && event.event?.startsWith("call:")) ||
        (event.type === "frame_received" && event.event === "phx_reply" && sentCallRefs.has(event.ref))
      ).map(({type, topic, event, ref, body}) => ({type, topic, event, ref, body}))
      console.log(`[CALL_FRAME_TRACE ${side}] ${JSON.stringify(frames)}`)
      console.log(`[CALL_ERROR_TRACE ${side}] pageErrors=${JSON.stringify(observed.pageErrors)} consoleErrors=${JSON.stringify(observed.consoleErrors)} failedRequests=${JSON.stringify(observed.failedRequests)}`)
    }
    console.log(`[CALL_UI_TRACE] A=${await pair.a.page.locator("#live-call-status").textContent()} B=${await pair.b.page.locator("#live-call-status").textContent()}`)

    // A sends Heart reaction
'''
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Prepare database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/call-credential-phoenix.log 2>&1 &
          echo $! > /tmp/call-credential-phoenix.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/call-credential-phoenix.pid)" 2>/dev/null; then cat /tmp/call-credential-phoenix.log; exit 1; fi
            sleep 1
          done
          exit 1
      - name: Run reaction scenario with frame trace
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='Feature 1Q E2E-REACTION' test/js/browser_e2e_test.mjs 2>&1 | tee /tmp/call-credential.tap
      - name: Build report
        if: always()
        shell: bash
        run: |
          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            grep -E 'CALL_(FRAME|ERROR|UI|PC|ICE)_TRACE' /tmp/call-credential.tap || true
            echo "--- TOTALS ---"
            grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' /tmp/call-credential.tap || true
            echo "--- PHOENIX ---"
            cat /tmp/call-credential-phoenix.log || true
          } | tee /tmp/call-credential-report.txt
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-call-credential-diagnostic
          path: |
            /tmp/call-credential.tap
            /tmp/call-credential-report.txt
            /tmp/call-credential-phoenix.log
          retention-days: 7
      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f /tmp/call-credential-phoenix.pid ]; then kill "$(cat /tmp/call-credential-phoenix.pid)" 2>/dev/null || true; fi
