name: Team 6 Agent Registry Gate

on:
  push:
    branches:
      - team6/agent-master-registry-002
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: team6-agent-registry-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact Team 6 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM6_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_TEAM6_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Focused Agent registry regression
        run: mix test test/strangertalks_new/agent_master_registry_test.exs

      - name: Check formatting
        run: mix format --check-formatted

      - name: Full precommit
        run: mix precommit

      - name: Diff check
        run: git diff --check

      - name: Prove validation left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact commit
        run: echo "TEAM6_AGENT_REGISTRY_TESTED_COMMIT=$(git rev-parse HEAD)"
