name: DIAG64 Focus Trace Capture

on:
  push:
    branches:
      - diag/64-focus-trace-2026-08-30

permissions:
  contents: read

env:
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
  TARGET_SHA: 15e4a73ef964beec8b71f32da36c108f6c02276c
  PORT: "4000"
  STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

jobs:
  browser-composed-e2e:
    name: Browser composed-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify immutable target SHA
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/diag64-immutable-target.txt
          : > "$evidence"
          echo "K2_WORKFLOW_SHA=$GITHUB_SHA"
          echo "K2_REQUESTED_TARGET_SHA=$TARGET_SHA" | tee -a "$evidence"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          echo "K2_ACTUAL_CHECKOUT_SHA=$actual" | tee -a "$evidence"
          cat "$evidence" >> "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$TARGET_SHA"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Start composed-E2E TURN relay
        shell: bash
        run: |
          set -euo pipefail
          if ss -lntu | grep -Eq ':3478[[:space:]]'; then
            echo "Unexpected TURN listener before K2 setup"
            sudo ss -lntup | grep ':3478' || true
            exit 1
          fi
          sudo apt-get install -y coturn
          sudo systemctl stop coturn 2>/dev/null || true
          sudo pkill -x turnserver 2>/dev/null || true
          for attempt in $(seq 1 10); do
            if ! ss -lntu | grep -Eq ':3478[[:space:]]'; then break; fi
            sleep 1
          done
          if ss -lntu | grep -Eq ':3478[[:space:]]'; then
            echo "TURN port 3478 did not clear after package-service stop"
            sudo ss -lntup | grep ':3478' || true
            exit 1
          fi
          cat > /tmp/k2-turnserver.conf <<'EOF'
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=3478
          min-port=49160
          max-port=49200
          fingerprint
          use-auth-secret
          static-auth-secret=team6-test-only-coturn-secret
          realm=strangertalks.test
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          EOF
          sudo turnserver -c /tmp/k2-turnserver.conf > /tmp/k2-coturn.log 2>&1 &
          echo $! > /tmp/k2-coturn.pid
          for attempt in $(seq 1 30); do
            if sudo ss -lunp | grep ':3478' | grep -Fq 'turnserver'; then
              echo "K2_TURN_LISTENER=ready"
              sudo ss -lunp | grep ':3478'
              exit 0
            fi
            if [ -f /tmp/k2-coturn.pid ] && ! sudo kill -0 "$(cat /tmp/k2-coturn.pid)" 2>/dev/null; then
              cat /tmp/k2-coturn.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/k2-coturn.log
          exit 1

      - name: Prepare isolated browser database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start isolated Phoenix runtime
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/k2-composed-e2e.log 2>&1 &
          echo $! > /tmp/k2-composed-e2e.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1 || curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/k2-composed-e2e.pid)" 2>/dev/null; then cat /tmp/k2-composed-e2e.log; exit 1; fi
            sleep 1
          done
          cat /tmp/k2-composed-e2e.log
          exit 1

      - name: Run isolated same-SHA browser authority
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/js/browser_e2e_test.mjs 2>&1 | tee /tmp/k2-composed-e2e.tap

      - name: Publish DIAG64 focus trace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tap=/tmp/k2-composed-e2e.tap
          summary=/tmp/k2-composed-e2e-diag64-summary.md
          {
            echo "## DIAG64 composed-E2E evidence"
            echo
            echo "### Immutable target evidence"
            echo '```text'
            cat /tmp/diag64-immutable-target.txt 2>/dev/null || echo "immutable-target evidence unavailable"
            echo '```'
            echo
            echo "### DIAG64_FOCUS_FAILURE"
            echo '```text'
            if [ -s "$tap" ]; then
              grep -aF 'DIAG64_FOCUS_FAILURE' "$tap" || echo "DIAG64_FOCUS_FAILURE marker not present"
            else
              echo "TAP output unavailable: $tap"
            fi
            echo '```'
            echo
            echo "### TAP totals"
            echo '```text'
            if [ -s "$tap" ]; then
              grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms) ' "$tap" || true
            fi
            echo '```'
            echo
            echo "### Test 64 TAP block"
            echo '```text'
            if [ -s "$tap" ]; then
              awk '
                /^not ok 64 / { capture=1; print; next }
                /^ok 64 / { capture=1; print; next }
                capture && (/^# Subtest:/ || /^not ok 65 / || /^ok 65 / || /^1\.\.[0-9]+$/) { exit }
                capture { print }
              ' "$tap"
            fi
            echo '```'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DIAG64 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag64-focus-evidence
          path: /tmp/k2-composed-e2e-diag64-summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Stop browser runtimes
        if: always()
        run: |
          if [ -f /tmp/k2-composed-e2e.pid ]; then kill "$(cat /tmp/k2-composed-e2e.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/k2-coturn.pid ]; then sudo kill "$(cat /tmp/k2-coturn.pid)" 2>/dev/null || true; fi
          sudo pkill -x turnserver 2>/dev/null || true

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/k2-composed-e2e.log || true
