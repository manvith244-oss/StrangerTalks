name: C1 T02 Conversation Start Patch

on:
  push:
    branches:
      - convergence/c1-t02-conversation-start-retirement-2026-09-10
    paths:
      - ".github/workflows/c1-t02-conversation-start-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@v4
        with:
          ref: convergence/c1-t02-conversation-start-retirement-2026-09-10
          fetch-depth: 0

      - name: Apply bounded current-source durability hooks
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          source = path.read_text()

          replacements = [
              (
                  "  alias StrangertalksNew.IcebreakerCatalog\n  alias StrangertalksNew.C11Policy\n",
                  "  alias StrangertalksNew.IcebreakerCatalog\n  alias StrangertalksNew.Matches\n  alias StrangertalksNew.C11Policy\n",
                  "Matches alias",
              ),
              (
                  "           icebreaker: initial_icebreaker(conversation_id),\n",
                  "           icebreaker: initial_icebreaker(conversation_id, conversation.match_id),\n",
                  "startup durable read",
              ),
              (
                  "        with {:ok, reply_author_relation, reply_snippet} <-\n               resolve_reply_context(state, sender_id, reply_to_client_message_id) do\n          recipient_id = other_participant(state, sender_id)\n",
                  "        with {:ok, reply_author_relation, reply_snippet} <-\n               resolve_reply_context(state, sender_id, reply_to_client_message_id) do\n          :ok = Matches.mark_conversation_started!(state.conversation.match_id)\n          recipient_id = other_participant(state, sender_id)\n",
                  "accepted text/expressive durable write",
              ),
              (
                  "          {:ok, _metadata, storage_status} ->\n            accepted_monotonic = System.monotonic_time()\n",
                  "          {:ok, _metadata, storage_status} ->\n            :ok = Matches.mark_conversation_started!(state.conversation.match_id)\n            accepted_monotonic = System.monotonic_time()\n",
                  "accepted voice durable write",
              ),
              (
                  "  defp initial_icebreaker(conversation_id) do\n",
                  "  defp initial_icebreaker(conversation_id, match_id) do\n    if Matches.conversation_started?(match_id) do\n      :retired\n    else\n      initial_icebreaker(conversation_id)\n    end\n  end\n\n  defp initial_icebreaker(conversation_id) do\n",
                  "durable-aware startup helper",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Prove bounded patch
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Commit bounded current-source adaptation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: persist Conversation Start retirement across restart"
          git push origin HEAD:convergence/c1-t02-conversation-start-retirement-2026-09-10
