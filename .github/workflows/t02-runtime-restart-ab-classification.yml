name: T02 Runtime Restart A/B Classification

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation-fix-lab
    paths:
      - .github/workflows/t02-runtime-restart-ab-classification.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test
  PRODUCT_SHA: e3e86c736ca6ef911bd0023c4877ac68642a48b9
  OLD_FIX_LAB_SHA: 06724eb3068df69efdbfd065940f2de011b4a57a
  OLD_DIAGNOSTIC_BLOB: cc717de18b6341d86ff834e86ae790ca910a7dfa
  STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
  STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

jobs:
  proof:
    name: ${{ matrix.lane }} exact-product A/B proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane:
          - control
          - experiment

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact product candidate
        id: checkout_product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact product identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "T02_AB_IDENTITY lane=${{ matrix.lane }} product_sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})"

      - name: Restore inherited proof-only PID diagnostic
        id: restore_diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$OLD_FIX_LAB_SHA"
          git show "$OLD_FIX_LAB_SHA:test/strangertalks_new/t02_recovery_convergence_hostile_test.exs" \
            > test/strangertalks_new/t02_recovery_convergence_hostile_test.exs
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
          echo "T02_AB_DIAGNOSTIC lane=${{ matrix.lane }} blob=$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)"

      - name: Prove requested regression inputs exist
        id: regression_inputs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            test/strangertalks_new/runtime_restart_reconciliation_test.exs
            test/strangertalks_new/runtime_terminal_contract_test.exs
            test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs
            test/strangertalks_new/team3_recovery_coordination_test.exs
            test/strangertalks_new/team4_safety_boundary_test.exs
          )

          for file in "${files[@]}"; do
            test -f "$file"
            echo "T02_AB_INPUT lane=${{ matrix.lane }} file=$file blob=$(git hash-object "$file")"
          done

          test -f test/strangertalks_new/recovery_restart_test.exs

      - name: Apply exact V2 ephemeral restart override
        id: experiment_patch
        if: matrix.lane == 'experiment'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          text = path.read_text()
          old = "{__MODULE__, %{conversation_id: conversation_id}}\n             ) do"
          new = "Supervisor.child_spec(\n                 {__MODULE__, %{conversation_id: conversation_id}},\n                 restart: :temporary\n               )\n             ) do"
          if old not in text:
              raise SystemExit("ensure_started child-spec anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Prove exact lane delta
        id: lane_delta
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="test/strangertalks_new/t02_recovery_convergence_hostile_test.exs"
          target="lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"

          test "$(git hash-object "$diagnostic")" = "$OLD_DIAGNOSTIC_BLOB"
          git diff --check

          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
              awk '{print $2}' |
              grep -vFx "$diagnostic" |
              grep -vFx "$target" || true
          )"
          test -z "$unexpected"

          production_delta="$(git diff --name-only -- lib/)"

          if [ "${{ matrix.lane }}" = "control" ]; then
            test -z "$production_delta"
            test "${{ steps.experiment_patch.outcome }}" = "skipped"
            echo "T02_AB_DELTA lane=control production_source_delta=ZERO"
          else
            test "$production_delta" = "$target"
            test "${{ steps.experiment_patch.outcome }}" = "success"
            grep -Fq "restart: :temporary" "$target"
            echo "T02_AB_DELTA lane=experiment production_source_delta=$target"
          fi

      - name: Record V2 environment and deliberate A/B differences
        shell: bash
        run: |
          cat <<'EOF'
          T02_AB_ENVIRONMENT
          inherited_from_v2:
            runner: ubuntu-latest
            postgres: 16
            postgres_user: strangertalks_local
            postgres_password: strangertalks_test
            postgres_database: strangertalks_new_test
            mix_env: test
            db_user_env: STRANGERTALKS_LOCAL_DB_USER=strangertalks_local
            db_password_env: STRANGERTALKS_LOCAL_DB_PASSWORD=strangertalks_test
            elixir: 1.18.4
            otp: 27.3.4
            experiment_patch: exact V2 ensure_started/1 Supervisor.child_spec restart-temporary override
          deliberate_differences:
            - checkout is frozen product SHA e3e86c736ca6ef911bd0023c4877ac68642a48b9
            - inherited PID diagnostic blob from 06724eb3068df69efdbfd065940f2de011b4a57a is restored identically in both lanes
            - control lane has zero production-source delta
            - experiment lane has only the ephemeral ConversationServer.ensure_started/1 restart override
            - database create and migrate are explicit pre-flight requirements
            - five previously bundled regression files execute separately first with seed 0
            - prior bundle executes only if all five individual files pass in that lane
            - nanosecond wall-clock timing markers are added around proof invocations
          EOF

      - name: Set up BEAM
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Create and migrate exact V2 test database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate
          echo "T02_AB_DATABASE lane=${{ matrix.lane }} database=strangertalks_new_test status=PASS"

      - name: Compile exact lane source
        id: compile
        run: mix compile --warnings-as-errors

      - name: Pre-flight gate
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git hash-object test/strangertalks_new/t02_recovery_convergence_hostile_test.exs)" = "$OLD_DIAGNOSTIC_BLOB"
          test "${{ steps.identity.outcome }}" = "success"
          test "${{ steps.restore_diagnostic.outcome }}" = "success"
          test "${{ steps.regression_inputs.outcome }}" = "success"
          test "${{ steps.lane_delta.outcome }}" = "success"
          test "${{ steps.database.outcome }}" = "success"
          test "${{ steps.compile.outcome }}" = "success"
          echo "T02_AB_PREFLIGHT lane=${{ matrix.lane }} result=PASS"

      - name: Run inherited PID-generation diagnostic
        id: pid_diag
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs \
            --seed 0 --trace
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} proof=pid_generation seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run RecoveryRestart stress
        id: recovery_stress
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status=0
          suite_start_ns="$(date +%s%N)"

          for seed in $(seq 1 20); do
            echo "RECOVERY_RESTART_SEED=$seed"
            start_ns="$(date +%s%N)"
            set +e
            mix test test/strangertalks_new/recovery_restart_test.exs --seed "$seed"
            rc=$?
            set -e
            end_ns="$(date +%s%N)"
            echo "T02_AB_RESULT lane=${{ matrix.lane }} proof=recovery_restart seed=$seed rc=$rc elapsed_ns=$((end_ns-start_ns))"
            if [ "$rc" -ne 0 ]; then
              status=1
            fi
          done

          suite_end_ns="$(date +%s%N)"
          echo "T02_AB_TIMING lane=${{ matrix.lane }} proof=recovery_restart_stress elapsed_ns=$((suite_end_ns-suite_start_ns))"
          exit "$status"

      - name: Run runtime_restart_reconciliation_test.exs
        id: f1
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/runtime_restart_reconciliation_test.exs --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} file=runtime_restart_reconciliation_test.exs seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run runtime_terminal_contract_test.exs
        id: f2
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/runtime_terminal_contract_test.exs --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} file=runtime_terminal_contract_test.exs seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run f_x07_canonical_terminal_truth_test.exs
        id: f3
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} file=f_x07_canonical_terminal_truth_test.exs seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run team3_recovery_coordination_test.exs
        id: f4
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/team3_recovery_coordination_test.exs --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} file=team3_recovery_coordination_test.exs seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run team4_safety_boundary_test.exs
        id: f5
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test test/strangertalks_new/team4_safety_boundary_test.exs --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} file=team4_safety_boundary_test.exs seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Run prior bundled combination for order contamination
        id: combined
        if: >-
          steps.f1.outcome == 'success' &&
          steps.f2.outcome == 'success' &&
          steps.f3.outcome == 'success' &&
          steps.f4.outcome == 'success' &&
          steps.f5.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          start_ns="$(date +%s%N)"
          set +e
          mix test \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            test/strangertalks_new/runtime_terminal_contract_test.exs \
            test/strangertalks_new/f_x07_canonical_terminal_truth_test.exs \
            test/strangertalks_new/team3_recovery_coordination_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            --seed 0
          rc=$?
          set -e
          end_ns="$(date +%s%N)"
          echo "T02_AB_RESULT lane=${{ matrix.lane }} proof=prior_bundle seed=0 rc=$rc elapsed_ns=$((end_ns-start_ns))"
          exit "$rc"

      - name: Prove validation delta remained proof-only
        id: final_delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="test/strangertalks_new/t02_recovery_convergence_hostile_test.exs"
          target="lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"

          test "$(git hash-object "$diagnostic")" = "$OLD_DIAGNOSTIC_BLOB"
          git diff --check

          production_delta="$(git diff --name-only -- lib/)"
          if [ "${{ matrix.lane }}" = "control" ]; then
            test -z "$production_delta"
          else
            test "$production_delta" = "$target"
          fi

      - name: Record lane outcomes
        if: always()
        shell: bash
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PID_DIAG: ${{ steps.pid_diag.outcome }}
          RECOVERY_STRESS: ${{ steps.recovery_stress.outcome }}
          F1: ${{ steps.f1.outcome }}
          F2: ${{ steps.f2.outcome }}
          F3: ${{ steps.f3.outcome }}
          F4: ${{ steps.f4.outcome }}
          F5: ${{ steps.f5.outcome }}
          COMBINED: ${{ steps.combined.outcome }}
          FINAL_DELTA: ${{ steps.final_delta.outcome }}
        run: |
          echo "T02_AB_OUTCOMES lane=${{ matrix.lane }} preflight=$PREFLIGHT pid_diag=$PID_DIAG recovery_stress=$RECOVERY_STRESS f1=$F1 f2=$F2 f3=$F3 f4=$F4 f5=$F5 combined=$COMBINED final_delta=$FINAL_DELTA"

      - name: Enforce harness validity
        if: always()
        shell: bash
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          FINAL_DELTA: ${{ steps.final_delta.outcome }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT" != "success" ] || [ "$FINAL_DELTA" != "success" ]; then
            echo "HARNESS INVALID — NO A/B VERDICT"
            exit 1
          fi
          echo "T02_AB_HARNESS lane=${{ matrix.lane }} result=VALID"

      - name: Preserve red proof status
        if: always()
        shell: bash
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PID_DIAG: ${{ steps.pid_diag.outcome }}
          RECOVERY_STRESS: ${{ steps.recovery_stress.outcome }}
          F1: ${{ steps.f1.outcome }}
          F2: ${{ steps.f2.outcome }}
          F3: ${{ steps.f3.outcome }}
          F4: ${{ steps.f4.outcome }}
          F5: ${{ steps.f5.outcome }}
          COMBINED: ${{ steps.combined.outcome }}
          FINAL_DELTA: ${{ steps.final_delta.outcome }}
        run: |
          set -euo pipefail

          if [ "$PREFLIGHT" != "success" ] || [ "$FINAL_DELTA" != "success" ]; then
            exit 1
          fi

          status=0

          for result in "$PID_DIAG" "$RECOVERY_STRESS" "$F1" "$F2" "$F3" "$F4" "$F5"; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done

          if [ "$COMBINED" = "failure" ]; then
            status=1
          fi

          exit "$status"
