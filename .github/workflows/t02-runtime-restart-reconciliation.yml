name: T02 Runtime Restart Reconciliation Gate

on:
  push:
    branches:
      - team2/runtime-restart-reconciliation
  workflow_dispatch:

concurrency:
  group: t02-runtime-restart-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-restart-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact T02 restart commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_T02_RESTART_COMMIT=${{ github.sha }}"
          echo "ACTUAL_T02_RESTART_COMMIT=$actual"
          test "$actual" = "${{ github.sha }}"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Prove T02-owned formatting and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            lib/strangertalks_new/matchmaking/queue_engine/participant_connection_tracker.ex \
            lib/strangertalks_new_web/participant_channel.ex
          git diff --check

      - name: Focused restart and Terminal Truth proof
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/runtime_restart_reconciliation_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            test/strangertalks_new/security_adversarial_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new_web/channels/conversation_channel_test.exs \
            test/strangertalks_new_web/channels/conversation_terminal_channel_test.exs

      - name: Full repository precommit
        shell: bash
        run: |
          set -euo pipefail
          mix precommit

      - name: Prove inherited formatter drift and restore exact checkout
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          printf '%s\n' "$status"

          paths="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex | sort)"

          test "$paths" = "$expected"

          git diff --check
          git checkout -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex

      - name: Final diff and clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          status="$(git status --porcelain)"
          echo "STATUS_PORCELAIN:"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Record exact tested T02 restart commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T02_RESTART_TESTED_COMMIT=$actual"
          test "$actual" = "${{ github.sha }}"
