name: C1 229 P1 Production Patch

on:
  push:
    branches:
      - convergence/c1-t02-conversation-start-retirement-2026-09-10
    paths:
      - ".github/workflows/c1-229-p1-production-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@v4
        with:
          ref: convergence/c1-t02-conversation-start-retirement-2026-09-10
          fetch-depth: 0

      - name: Apply bounded one-time durable start repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/strangertalks_new/conversation_lifecycle/conversation_server.ex")
          source = path.read_text()

          def replace_one(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, found {count}")
              source = source.replace(old, new, 1)

          replace_one(
              "        epoch_id = Ecto.UUID.generate()\n\n        {:ok,\n",
              "        epoch_id = Ecto.UUID.generate()\n        conversation_started = Matches.conversation_started?(conversation.match_id)\n\n        {:ok,\n",
              "init durable read",
          )

          replace_one(
              "           conversation: conversation,\n           epoch_id: epoch_id,\n           avatar_map: avatar_map,\n           icebreaker: initial_icebreaker(conversation_id, conversation.match_id),\n",
              "           conversation: conversation,\n           conversation_started: conversation_started,\n           epoch_id: epoch_id,\n           avatar_map: avatar_map,\n           icebreaker: initial_icebreaker(conversation_id, conversation_started),\n",
              "cached durable state",
          )

          replace_one(
              "        with {:ok, reply_author_relation, reply_snippet} <-\n               resolve_reply_context(state, sender_id, reply_to_client_message_id) do\n          :ok = Matches.mark_conversation_started!(state.conversation.match_id)\n          recipient_id = other_participant(state, sender_id)\n",
              "        with {:ok, reply_author_relation, reply_snippet} <-\n               resolve_reply_context(state, sender_id, reply_to_client_message_id) do\n          state = establish_conversation_start(state)\n          state = retire_icebreaker(state)\n          recipient_id = other_participant(state, sender_id)\n",
              "accepted text/expressive one-time start",
          )

          replace_one(
              "          state = append_recent_message(state, replay_entry)\n          state = retire_icebreaker(state)\n\n          StrangertalksNew.Telemetry.execute(\n",
              "          state = append_recent_message(state, replay_entry)\n\n          StrangertalksNew.Telemetry.execute(\n",
              "remove late text retirement",
          )

          replace_one(
              "        case VoiceNoteStore.put(stored_note) do\n          {:ok, _metadata, storage_status} ->\n            :ok = Matches.mark_conversation_started!(state.conversation.match_id)\n            accepted_monotonic = System.monotonic_time()\n",
              "        case VoiceNoteStore.put(stored_note) do\n          {:ok, _metadata, storage_status} ->\n            state = establish_conversation_start(state)\n            state = retire_icebreaker(state)\n            accepted_monotonic = System.monotonic_time()\n",
              "accepted voice one-time start",
          )

          replace_one(
              "            state = append_recent_message(state, replay_entry)\n            state = retire_icebreaker(state)\n\n            StrangertalksNew.Telemetry.execute(\n",
              "            state = append_recent_message(state, replay_entry)\n\n            StrangertalksNew.Telemetry.execute(\n",
              "remove late voice retirement",
          )

          replace_one(
              "  defp initial_icebreaker(conversation_id, match_id) do\n    if Matches.conversation_started?(match_id) do\n      :retired\n    else\n      initial_icebreaker(conversation_id)\n    end\n  end\n\n  defp initial_icebreaker(conversation_id) do\n",
              "  defp establish_conversation_start(%{conversation_started: true} = state), do: state\n\n  defp establish_conversation_start(state) do\n    :ok = Matches.mark_conversation_started!(state.conversation.match_id)\n    %{state | conversation_started: true}\n  end\n\n  defp initial_icebreaker(_conversation_id, true), do: :retired\n  defp initial_icebreaker(conversation_id, false), do: initial_icebreaker(conversation_id)\n\n  defp initial_icebreaker(conversation_id) do\n",
              "cached startup/helper authority",
          )

          path.write_text(source)

      - name: Prove bounded patch
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "lib/strangertalks_new/conversation_lifecycle/conversation_server.ex"
          git diff --check
          git diff -- lib/strangertalks_new/conversation_lifecycle/conversation_server.ex

      - name: Commit bounded production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git commit -m "fix: cache durable Conversation Start truth"
          git push origin HEAD:convergence/c1-t02-conversation-start-retirement-2026-09-10
