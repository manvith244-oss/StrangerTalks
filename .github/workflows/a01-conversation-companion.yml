name: Agent Systems Closure Gate

on:
  push:
    branches:
      - feature/a01-conversation-companion
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: agent-systems-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_AGENT_SYSTEMS_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_AGENT_SYSTEMS_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Focused Agent Systems Elixir tests
        run: |
          mix test \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs

      - name: Focused Agent Systems browser logic
        run: node --test test/js/companion_test.mjs test/js/prompt_cards_test.mjs

      - name: Full precommit
        run: mix precommit

      - name: Prove precommit left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact commit
        run: echo "AGENT_SYSTEMS_TESTED_COMMIT=$(git rev-parse HEAD)"
