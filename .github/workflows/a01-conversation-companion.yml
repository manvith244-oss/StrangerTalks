name: Agent Systems Closure Gate

on:
  push:
    branches:
      - main
      - release/prep-2026-08-22
  pull_request:
    branches:
      - main
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: agent-systems-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      AGENT_SYSTEMS_PROVIDER_PROBE: "false"
      COMPANION_ENABLED: "false"
      AGENT_SYSTEMS_ENABLED: "false"

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_AGENT_SYSTEMS_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_AGENT_SYSTEMS_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Reject retired or vulnerable Hex dependencies
        run: mix hex.audit

      - name: Install Python boundary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './services/ai[test]'
          python -m pip check

      - name: Focused Agent Systems Elixir tests
        run: |
          mix test \
            test/strangertalks_new/agent_security_gate_contract_test.exs \
            test/strangertalks_new/companion_test.exs \
            test/strangertalks_new/companion_conversation_start_test.exs \
            test/strangertalks_new/companion_open_ai_provider_test.exs \
            test/strangertalks_new/agent_systems_functional_test.exs \
            test/strangertalks_new/agent_systems_break_test.exs \
            test/strangertalks_new/agent_systems_remediation_test.exs \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/ai_service/boundary_contract_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs

      - name: Python security foundation tests
        run: python -m pytest services/ai/tests -q -ra

      - name: Focused Agent Systems browser logic
        run: node --test test/js/companion_test.mjs test/js/prompt_cards_test.mjs

      - name: Full precommit
        run: mix precommit

      - name: Prove precommit left checkout unchanged
        run: git diff --exit-code -- .

      - name: Record exact commit
        run: echo "AGENT_SYSTEMS_TESTED_COMMIT=$(git rev-parse HEAD)"
