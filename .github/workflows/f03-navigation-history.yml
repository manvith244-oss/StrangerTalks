name: F-03 Navigation / History Proof

on:
  push:
    branches:
      - f03/navigation-history-wave-a-2026-08-27
  pull_request:
    branches:
      - f02/route-architecture-wave-a
  workflow_dispatch:

concurrency:
  group: f03-navigation-history-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  navigation-history:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact F-03 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_F03_COMMIT=$expected"
          echo "ACTUAL_F03_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Frozen F-02 route contract
        run: node --test test/js/route_contract_test.mjs

      - name: F-03 navigation history unit contract
        run: node --test test/js/navigation_history_test.mjs

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Apply J10 harness correction in diagnostic worktree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("test/js/navigation_history_browser_test.mjs")
          text = path.read_text()
          anchor = '''async function bootObserved(browser, path = "/") {
            const context = await browser.newContext({viewport: {width: 1280, height: 800}})
            const page = await context.newPage()
            const observed = await observePage(context, page)
            const response = await page.goto(`${BASE_URL}${path}`, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${path} loads`)
            await page.waitForFunction(() => document.querySelectorAll("#doors button.door").length > 0, null, {timeout: WAIT_MS})
            await waitForParticipantJoin(observed)
            await page.locator("#conversation-language").selectOption("en")
            return {context, ...observed}
          }
          '''
          helper = '''
          async function bootActivityObserved(browser, path, expectedPath) {
            const context = await browser.newContext({viewport: {width: 1280, height: 800}})
            const page = await context.newPage()
            const observed = await observePage(context, page)
            const response = await page.goto(`${BASE_URL}${path}`, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${path} loads`)
            await page.waitForFunction(() => document.querySelectorAll("#doors button.door").length > 0, null, {timeout: WAIT_MS})
            await waitForParticipantJoin(observed)
            await page.waitForFunction(expectedPathname => location.pathname === expectedPathname, expectedPath, {timeout: WAIT_MS})
            return {context, ...observed}
          }
          '''
          if anchor not in text:
            raise SystemExit("bootObserved anchor not found")
          text = text.replace(anchor, anchor + helper, 1)
          old = 'observed = await bootObserved(browser, "/conversation")'
          new = 'observed = await bootActivityObserved(browser, "/conversation", "/conversation/unavailable")'
          if old not in text:
            raise SystemExit("J10 call anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Start Phoenix with browser-test connection pool
        run: |
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-f03-browser.log 2>&1 &
          echo $! > /tmp/strangertalks-f03-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/strangertalks-f03-browser.pid)" 2>/dev/null; then
              cat /tmp/strangertalks-f03-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strangertalks-f03-browser.log
          exit 1

      - name: J10 isolated harness proof
        run: node --test --test-concurrency=1 --test-name-pattern='J10' test/js/navigation_history_browser_test.mjs

      - name: J07 isolated classification
        run: |
          set +e
          node --test --test-concurrency=1 --test-name-pattern='J07/J08/J15' test/js/navigation_history_browser_test.mjs > /tmp/f03-j07.log 2>&1
          status=$?
          set -e
          cat /tmp/f03-j07.log
          echo "J07_ISOLATED_STATUS=$status" >> "$GITHUB_ENV"
          echo "J07_ISOLATED_STATUS=$status"

      - name: J09 isolated classification
        run: |
          set +e
          node --test --test-concurrency=1 --test-name-pattern='J09' test/js/navigation_history_browser_test.mjs > /tmp/f03-j09.log 2>&1
          status=$?
          set -e
          cat /tmp/f03-j09.log
          echo "J09_ISOLATED_STATUS=$status" >> "$GITHUB_ENV"
          echo "J09_ISOLATED_STATUS=$status"

      - name: Classification summary
        run: |
          echo "J07_ISOLATED_STATUS=${J07_ISOLATED_STATUS:-missing}"
          echo "J09_ISOLATED_STATUS=${J09_ISOLATED_STATUS:-missing}"

      - name: Stop Phoenix browser server
        if: always()
        run: |
          if [ -f /tmp/strangertalks-f03-browser.pid ]; then
            pid="$(cat /tmp/strangertalks-f03-browser.pid)"
            kill "$pid" 2>/dev/null || true
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/strangertalks-f03-browser.log || true
