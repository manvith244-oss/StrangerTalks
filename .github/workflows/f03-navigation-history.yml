name: F-03 Navigation / History Proof

on:
  push:
    branches:
      - f03/navigation-history-wave-a-2026-08-27
  pull_request:
    branches:
      - f02/route-architecture-wave-a
  workflow_dispatch:

concurrency:
  group: f03-navigation-history-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  navigation-history:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact F-03 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_F03_COMMIT=$expected"
          echo "ACTUAL_F03_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Frozen F-02 route contract
        run: node --test test/js/route_contract_test.mjs

      - name: F-03 navigation history unit contract
        run: node --test test/js/navigation_history_test.mjs

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for F-03 browser proof
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-f03-browser.log 2>&1 &
          echo $! > /tmp/strangertalks-f03-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/strangertalks-f03-browser.pid)" 2>/dev/null; then
              cat /tmp/strangertalks-f03-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strangertalks-f03-browser.log
          exit 1

      - name: F-03 browser Back Forward contract
        run: node --test --test-concurrency=1 test/js/navigation_history_browser_test.mjs

      - name: Stop Phoenix browser server
        if: always()
        run: |
          if [ -f /tmp/strangertalks-f03-browser.pid ]; then
            pid="$(cat /tmp/strangertalks-f03-browser.pid)"
            kill "$pid" 2>/dev/null || true
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/strangertalks-f03-browser.log || true
