name: Team 6 Apply Server Media Patches

on:
  push:
    branches: [team6/voice-video-expression]
    paths:
      - "team6-server-patches/**"
  pull_request:
    paths:
      - "team6-server-patches/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strangertalks_new_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strangertalks_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team6/voice-video-expression
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          elixir-version: "1.18.4"
      - run: mix deps.get
      - run: mix ecto.create && mix ecto.migrate
      - name: Apply exact server patch
        run: |
          shopt -s nullglob
          patches=(team6-server-patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then exit 0; fi
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: Prove endpoint authority
        run: |
          mix test test/strangertalks_new/team6_media_authority_test.exs test/strangertalks_new/conversation_live_call_test.exs
          git diff --check
      - name: Commit proven application
        if: github.event_name == 'push'
        run: |
          git config user.name "team6-media-bot"
          git config user.email "team6-media-bot@users.noreply.github.com"
          git add lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          git rm team6-server-patches/*.patch
          git commit -m "fix(team6): enforce authoritative media endpoint [skip ci]"
          git push origin HEAD:team6/voice-video-expression
