name: Dispatch K2 exact-SHA matrix

on:
  push:
    branches:
      - diag/fix-42-60-64-apply-2026-08-30

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch full K2 matrix at exact transplant SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 00e096b69b247c5fa05ff15cde722e63990703ce
        shell: bash
        run: |
          set -euo pipefail
          echo "DISPATCH_TARGET_SHA=$TARGET_SHA"
          response_code="$(curl -sS -o /tmp/dispatch-body -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/manvith244-oss/StrangerTalks/actions/workflows/k2-final-integration.yml/dispatches \
            -d "{\"ref\":\"release/integration-2026-08-28\",\"inputs\":{\"target_sha\":\"$TARGET_SHA\",\"browser_group\":\"all\"}}")"
          cat /tmp/dispatch-body || true
          echo "DISPATCH_HTTP_STATUS=$response_code"
          test "$response_code" = "204"
