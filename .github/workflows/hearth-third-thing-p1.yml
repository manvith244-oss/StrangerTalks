name: Hearth Third Thing P1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config/runtime.exs'
      - 'lib/strangertalks_new/experiments/hearth/**'
      - 'lib/strangertalks_new_web/hearth_channel.ex'
      - 'lib/strangertalks_new_web/hearth_socket.ex'
      - 'lib/strangertalks_new_web/hearth_token.ex'
      - 'lib/strangertalks_new_web/hearth_standalone_gate.ex'
      - 'lib/strangertalks_new_web/user_socket.ex'
      - 'lib/strangertalks_new_web/endpoint.ex'
      - 'lib/strangertalks_new_web/controllers/hearth_lab_controller.ex'
      - 'lib/strangertalks_new_web/controllers/hearth_participant_controller.ex'
      - 'lib/strangertalks_new_web/router.ex'
      - 'lib/strangertalks_new/application.ex'
      - 'priv/static/hearth_lab.html'
      - 'priv/static/assets/hearth_lab.*'
      - 'test/strangertalks_new/experiments/hearth/**'
      - 'test/strangertalks_new_web/hearth_channel_test.exs'
      - 'test/strangertalks_new_web/hearth_h01a_single_shot_boundary_test.exs'
      - 'test/strangertalks_new_web/controllers/hearth_lab_controller_test.exs'
      - 'test/strangertalks_new_web/controllers/hearth_standalone_surface_test.exs'
      - '.github/workflows/hearth-third-thing-p1.yml'
  workflow_dispatch:

concurrency:
  group: hearth-third-thing-p1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hearth-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "EXPECTED_HEARTH_COMMIT=$expected"
          echo "ACTUAL_HEARTH_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix ecto.create --quiet
      - run: mix ecto.migrate --quiet

      - name: Hearth authority contracts
        run: mix test test/strangertalks_new/experiments/hearth/

      - name: Hearth channel contracts
        run: |
          mix test \
            test/strangertalks_new_web/hearth_channel_test.exs \
            test/strangertalks_new_web/hearth_h01a_single_shot_boundary_test.exs

      - name: Hearth lab route contract
        run: mix test test/strangertalks_new_web/controllers/hearth_lab_controller_test.exs

      - name: H-01a standalone surface contracts
        run: mix test test/strangertalks_new_web/controllers/hearth_standalone_surface_test.exs

      - name: Compile warnings-as-errors
        run: mix compile --warnings-as-errors

      - name: Dependency-lock proof
        run: |
          mix deps.unlock --unused
          git diff --exit-code mix.lock

      - name: Format proof
        run: mix format --check-formatted

      - name: Standalone release boots without DATABASE_URL
        env:
          MIX_ENV: prod
          EXPERIMENT_HEARTH_STANDALONE: "true"
          EXPERIMENT_HEARTH_ENABLED: "true"
          PHX_SERVER: "true"
          PHX_HOST: "127.0.0.1"
          PORT: "4101"
          SECRET_KEY_BASE: "h01a-ci-only-secret-key-base-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
          GOOGLE_CONTINUITY_ENABLED: "false"
        run: |
          unset DATABASE_URL
          mix release --overwrite
          _build/prod/rel/strangertalks_new/bin/strangertalks_new start > /tmp/hearth-standalone.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          lab_code=""
          for _attempt in $(seq 1 30); do
            lab_code=$(curl -sS -o /tmp/hearth-lab.html -w '%{http_code}' http://127.0.0.1:4101/lab/hearth || true)
            if [ "$lab_code" = "200" ]; then
              break
            fi
            sleep 1
          done

          cat /tmp/hearth-standalone.log
          test "$lab_code" = "200"
          grep -q "StrangerTalks Hearth Lab" /tmp/hearth-lab.html

          curl -fsS \
            -H 'content-type: application/json' \
            -d '{}' \
            http://127.0.0.1:4101/api/hearth/participants \
            | jq -e '.participant_id | type == "string"' >/dev/null

          root_code=$(curl -sS -o /tmp/hearth-root.txt -w '%{http_code}' http://127.0.0.1:4101/ || true)
          test "$root_code" = "404"
          ! grep -q "DATABASE_URL is missing" /tmp/hearth-standalone.log

      - name: Full regression
        env:
          MIX_ENV: test
        run: mix test

      - name: Clean tree
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          git diff --exit-code
