name: RPR V2 Contract Proof

on:
  push:
    branches:
      - convergence/rpr-production-migration-v2-2026-09-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-proof:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prove checkout identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Exact RPR workflow contract
        run: mix test test/strangertalks_new/rpr_production_migration_workflow_contract_test.exs
