name: RPR Format Once

on:
  push:
    branches:
      - release/rpr-public-schema-data-api-boundary-2026-09-11

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/rpr-public-schema-data-api-boundary-2026-09-11
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Format candidate and remove one-shot workflow
        run: |
          mix format test/strangertalks_new/team4_db_security_closure_test.exs priv/repo/migrations/20260910192317_close_public_schema_data_api_boundary_rpr.exs
          rm .github/workflows/rpr-format-once.yml
          git diff --check
          git add test/strangertalks_new/team4_db_security_closure_test.exs priv/repo/migrations/20260910192317_close_public_schema_data_api_boundary_rpr.exs .github/workflows/rpr-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(security): format RPR successor"
          git push origin HEAD:release/rpr-public-schema-data-api-boundary-2026-09-11
