name: T02 Multitab Source Closure Proof

on:
  push:
    branches:
      - team2/multitab-source-closure-proof
  workflow_dispatch:

concurrency:
  group: t02-multitab-source-closure-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002

    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove frozen candidate is unchanged
        shell: bash
        run: |
          set -euo pipefail
          frozen="b972a91e253989376b23abd6d603efca259fe3fc"
          echo "FROZEN_T02_MT_CANDIDATE=$frozen"
          echo "PROOF_HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$frozen" HEAD
          git diff --exit-code "$frozen"..HEAD -- lib/ test/ assets/
          changed="$(git diff --name-only "$frozen"..HEAD)"
          expected=".github/workflows/t02-multitab-source-closure-proof.yml"
          test "$changed" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Frozen candidate formatting and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Focused T02 multitab source regressions
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            test/strangertalks_new/security_adversarial_test.exs \
            --seed 0

      - name: Prepare isolated browser reliability database
        env:
          MIX_TEST_PARTITION: _t02_mt_closure
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for sibling reconnect and terminal proof
        env:
          MIX_TEST_PARTITION: _t02_mt_closure
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint_config, :server, true))
            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            browser_repo_config = repo_config |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 16)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, browser_repo_config)
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t02-mt-closure-server.log 2>&1 &
          echo $! > /tmp/t02-mt-closure-server.pid

          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t02-mt-closure-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/t02-mt-closure-server.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/t02-mt-closure-server.log
          exit 1

      - name: Existing sibling reconnect and terminal browser regression
        shell: bash
        run: |
          set -euo pipefail
          node --test test/js/conversation_reliability_browser_test.mjs

      - name: Stop Phoenix
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/t02-mt-closure-server.pid ]; then
            kill "$(cat /tmp/t02-mt-closure-server.pid)" 2>/dev/null || true
          fi

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/t02-mt-closure-server.log || true

      - name: Drop isolated database
        if: always()
        env:
          MIX_TEST_PARTITION: _t02_mt_closure
        run: mix ecto.drop --quiet || true

      - name: Full repository precommit
        run: mix precommit

      - name: Classify inherited formatter drift and restore proof checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex | sort)"
          echo "FORMATTER_DRIFT_PATHS:"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git checkout -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex

      - name: Final clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"
          echo "FROZEN_T02_MT_CANDIDATE=b972a91e253989376b23abd6d603efca259fe3fc"
