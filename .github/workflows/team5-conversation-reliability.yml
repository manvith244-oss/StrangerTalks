name: Team 5 Conversation Reliability Gate

on:
  push:
    branches:
      - team5/conversation-reliability-2026-08-24
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002

    steps:
      - name: Checkout exact Team 5 HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record entry state
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EVENT_REF=${GITHUB_REF_NAME}"
          echo "EXPECTED_TEAM5_COMMIT=$expected"
          echo "HEAD=$actual"
          echo "BRANCH=$(git branch --show-current)"
          test "$actual" = "$expected"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir and browser dependencies
        run: |
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove committed Elixir formatting
        shell: bash
        run: |
          set -euo pipefail
          mix format
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "Formatter changed committed files:"
            printf '%s\n' "$status"
            echo "--- formatter diff begin ---"
            git diff --no-ext-diff -- .
            echo "--- formatter diff end ---"
            exit 1
          fi

      - name: Team 5 focused Elixir reliability tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            find test/strangertalks_new test/strangertalks_new_web -type f \
              \( -name '*conversation*test.exs' \
                 -o -name '*recovery*test.exs' \
                 -o -name '*presence*test.exs' \
                 -o -name '*participant_channel_test.exs' \
                 -o -name '*session_reconciliation*test.exs' \) \
              -print | sort
          )
          printf 'Focused test files (%s):\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          test "${#tests[@]}" -gt 0
          mix test "${tests[@]}"

      - name: Team 5 maintained JS realtime tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            find test/js -maxdepth 1 -type f \
              \( -name '*delivery*test.mjs' \
                 -o -name '*reconnect*test.mjs' \
                 -o -name '*presence*test.mjs' \
                 -o -name '*message*test.mjs' \
                 -o -name '*atomic_restore*test.mjs' \
                 -o -name '*ephemeral_conversation*test.mjs' \) \
              -print | sort
          )
          printf 'Realtime JS test files (%s):\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

      - name: Prepare isolated browser reliability database
        env:
          MIX_TEST_PARTITION: _team5_browser
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for real browser reliability proof
        env:
          MIX_TEST_PARTITION: _team5_browser
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint_config, :server, true)
            )

            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            browser_repo_config =
              repo_config
              |> Keyword.put(:pool, DBConnection.ConnectionPool)
              |> Keyword.put(:pool_size, 16)

            Application.put_env(
              :strangertalks_new,
              StrangertalksNew.Repo,
              browser_repo_config
            )

            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/team5-browser-server.log 2>&1 &
          echo $! > /tmp/team5-browser-server.pid

          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/team5-browser-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/team5-browser-server.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then
              echo "Phoenix browser reliability endpoint is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Phoenix did not become ready on the configured browser endpoint."
          cat /tmp/team5-browser-server.log
          exit 1

      - name: Real two-browser Conversation reliability journey
        shell: bash
        run: |
          set -euo pipefail
          node --test test/js/conversation_reliability_browser_test.mjs

      - name: Stop Phoenix browser reliability server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/team5-browser-server.pid ]; then
            pid="$(cat /tmp/team5-browser-server.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/team5-browser-server.log || true

      - name: Drop isolated browser reliability database
        if: always()
        env:
          MIX_TEST_PARTITION: _team5_browser
        run: mix ecto.drop --quiet || true

      - name: Full Elixir precommit
        run: mix precommit

      - name: Diff check
        run: git diff --check

      - name: Prove final checkout clean
        shell: bash
        run: |
          set -euo pipefail
          echo "STATUS_SHORT_BRANCH:"
          git status --short --branch
          status=$(git status --porcelain)
          echo "STATUS_PORCELAIN:"
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            echo "--- post-gate diff begin ---"
            git diff --no-ext-diff -- .
            echo "--- post-gate diff end ---"
            exit 1
          fi

      - name: Record exact tested commit
        run: echo "TEAM5_TESTED_COMMIT=$(git rev-parse HEAD)"
