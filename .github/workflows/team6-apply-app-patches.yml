name: Team 6 Apply App Media Patches

on:
  push:
    branches: [team6/voice-video-expression]
    paths:
      - "team6-app-patches/**"
  pull_request:
    paths:
      - "team6-app-patches/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team6/voice-video-expression
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact app patch
        run: |
          shopt -s nullglob
          patches=(team6-app-patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then exit 0; fi
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: Prove voice-note media boundary
        run: |
          node --test test/js/voice_notes_test.mjs test/js/team6_voice_note_permission_test.mjs
          git diff --check
      - name: Commit proven application
        if: github.event_name == 'push'
        run: |
          git config user.name "team6-media-bot"
          git config user.email "team6-media-bot@users.noreply.github.com"
          git add priv/static/assets/app.js
          git rm team6-app-patches/*.patch
          git commit -m "fix(team6): fail closed on late voice permission [skip ci]"
          git push origin HEAD:team6/voice-video-expression
