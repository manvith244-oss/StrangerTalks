name: Team 4 Bootstrap Media Authority

on:
  push:
    branches:
      - newteam/media

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newteam/media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Close stale async authority races
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('priv/static/assets/live_call.mjs')
          s = path.read_text()
          old = '''    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:initiate", { call_type: callType })\n        .receive("ok", (res) => {\n          this.callAttemptId = res.call_attempt_id\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          this.teardown("initiate_failed")\n          reject(err)\n        })\n    })\n'''
          new = '''    const initiationConversationId = this.conversationId\n    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:initiate", { call_type: callType })\n        .receive("ok", (res) => {\n          const stillCurrent =\n            this.status === CALL_STATUS.PENDING_OUTGOING &&\n            this.role === "caller" &&\n            this.callAttemptId === null &&\n            this.conversationId === initiationConversationId\n          if (!stillCurrent) { resolve({ ...res, stale: true }); return }\n          this.callAttemptId = res.call_attempt_id\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          if (this.status === CALL_STATUS.PENDING_OUTGOING && this.role === "caller" && this.callAttemptId === null && this.conversationId === initiationConversationId) {\n            this.teardown("initiate_failed")\n          }\n          reject(err)\n        })\n    })\n'''
          if old not in s: raise SystemExit('initiate async authority block not found exactly once')
          s = s.replace(old, new, 1)
          old = '''    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:accept", { call_attempt_id: this.callAttemptId })\n        .receive("ok", (res) => {\n          this.status = CALL_STATUS.CONNECTING\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          this.teardown("accept_failed")\n          reject(err)\n        })\n    })\n'''
          new = '''    const acceptedAttemptId = this.callAttemptId\n    const acceptedConversationId = this.conversationId\n    return new Promise((resolve, reject) => {\n      if (!this.channel) return reject(new Error("Channel unavailable"))\n      this.channel.push("call:accept", { call_attempt_id: acceptedAttemptId })\n        .receive("ok", (res) => {\n          const stillCurrent = this.status === CALL_STATUS.PENDING_INCOMING && this.callAttemptId === acceptedAttemptId && this.conversationId === acceptedConversationId\n          if (!stillCurrent) { resolve({ ...res, stale: true }); return }\n          this.status = CALL_STATUS.CONNECTING\n          this.applyOutgoingAudioGate()\n          this.notifyStateChange()\n          resolve(res)\n        })\n        .receive("error", (err) => {\n          if (this.status === CALL_STATUS.PENDING_INCOMING && this.callAttemptId === acceptedAttemptId && this.conversationId === acceptedConversationId) {\n            this.teardown("accept_failed")\n          }\n          reject(err)\n        })\n    })\n'''
          if old not in s: raise SystemExit('accept async authority block not found exactly once')
          s = s.replace(old, new, 1)
          path.write_text(s)

          t = Path('test/js/team4_media_authority_test.mjs')
          tests = t.read_text()
          if 'T4-006: late Accept success after terminal teardown is inert' not in tests:
            tests += r'''

function controllablePush() {
  const handlers = new Map()
  return { receive(kind, callback) { handlers.set(kind, callback); return this }, fire(kind, payload) { handlers.get(kind)?.(payload) } }
}

test("T4-006: late Accept success after terminal teardown is inert", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push(event) { assert.equal(event, "call:accept"); return push }}})
  coord.callAttemptId = "a1"; coord.role = "callee"; coord.status = CALL_STATUS.PENDING_INCOMING
  const pending = coord.accept()
  coord.teardown("blocked")
  push.fire("ok", {call_attempt_id: "a1"})
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
})

test("T4-007: late Initiate success after terminal teardown cannot rebind attempt authority", async () => {
  const push = controllablePush()
  const coord = new LiveCallCoordinator({participantId: "p1", conversationId: "c1", channel: {push(event) { assert.equal(event, "call:initiate"); return push }}})
  const pending = coord.initiate("voice")
  coord.teardown("ended")
  push.fire("ok", {call_attempt_id: "dead-attempt"})
  const result = await pending
  assert.equal(result.stale, true)
  assert.equal(coord.callAttemptId, null)
  assert.notEqual(coord.status, CALL_STATUS.CONNECTING)
  assert.notEqual(coord.status, CALL_STATUS.ACTIVE)
})
'''
            t.write_text(tests)
          PY
          node --test --test-concurrency=1 test/js/team4_media_authority_test.mjs test/js/live_call_test.mjs
          rm -f .github/workflows/team4-bootstrap-media-authority.yml .github/workflows/team4-bootstrap-pr-executor.yml .github/workflows/team4-async-authority-fix.yml .team4-bootstrap-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix stale live-call async authority [team4-async-fixed]'
          git push origin HEAD:newteam/media
