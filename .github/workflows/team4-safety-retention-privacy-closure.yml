name: T04 Safety Retention Privacy Closure

on:
  push:
    branches:
      - team4/safety-retention-privacy-closure
  workflow_dispatch:

concurrency:
  group: t04-retention-privacy-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  t04-retention-privacy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact T04 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_T04_COMMIT=$expected"
          echo "ACTUAL_T04_COMMIT=$actual"
          test "$actual" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci

      - name: T04 safety retention cutoff and minimization proofs
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/team4_retention_privacy_closure_test.exs \
            test/strangertalks_new/retention_policy_test.exs \
            test/strangertalks_new/retention_cleanup_test.exs \
            test/strangertalks_new/retention_cleanup_db_test.exs \
            test/strangertalks_new/retention_safety_media_closure_test.exs \
            test/strangertalks_new/retention_closure_db_test.exs

      - name: T04 ordinary-content and authorized-safety-evidence boundary proofs
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/privacy_persistence_guard_test.exs \
            test/strangertalks_new/conversation_unsend_report_safety_test.exs \
            test/strangertalks_new/conversation_message_unsend_test.exs \
            test/strangertalks_new_web/safety_media_access_privacy_test.exs

      - name: T04 telemetry and logging privacy proofs
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/telemetry_privacy_test.exs \
            test/strangertalks_new_web/channel_crash_diagnostic_privacy_test.exs \
            test/strangertalks_new_web/expressive_diagnostic_privacy_test.exs

      - name: Existing browser privacy contract tests
        run: |
          set -euo pipefail
          node --test \
            test/js/message_unsend_test.mjs \
            test/js/ephemeral_conversation_ux_test.mjs \
            test/js/security_adversarial_test.mjs \
            test/js/local_data_test.mjs

      - name: T04-owned format and diff hygiene
        run: |
          set -euo pipefail
          mix format --check-formatted \
            test/strangertalks_new/team4_retention_privacy_closure_test.exs
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Full precommit with inherited format drift isolated
        run: |
          set -euo pipefail
          mix precommit
          git diff --check
          git restore -- \
            lib/strangertalks_new/reflections.ex \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex
          test -z "$(git status --porcelain)"

      - name: Prove final checkout clean
        if: ${{ always() }}
        run: |
          git status --short --branch
          git status --porcelain | tee /tmp/t04-retention-status
          test ! -s /tmp/t04-retention-status

      - name: Record exact tested commit
        if: ${{ always() }}
        run: echo "T04_RETENTION_PRIVACY_TESTED_COMMIT=$(git rev-parse HEAD)"
