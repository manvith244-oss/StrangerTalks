name: C5 TLS Attack 2026-09-10

on:
  push:
    branches:
      - evidence/c5-tls-attack-2026-09-10

permissions:
  contents: read

env:
  TARGET_SHA: 1efffd7c7436483e0188cc06a29fd7a15c7aea45
  TARGET_TREE: 8fec18429d8cca49443021c12daae954c2b6c88b
  MIX_ENV: test
  STRANGERTALKS_LOCAL_DB_USER: c5owner
  STRANGERTALKS_LOCAL_DB_PASSWORD: c5proof

jobs:
  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: c5owner
          POSTGRES_PASSWORD: c5proof
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c5owner -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Exact clean identity before proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: TLS focused proof
        run: mix test test/strangertalks_new/production_database_tls_config_test.exs --trace
      - name: Compile format audit precommit
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix deps.unlock --check-unused
          mix hex.audit
          mix precommit
      - name: Static hostile scan
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'verify: :verify_peer' config/runtime.exs
          grep -F 'server_name_indication:' config/runtime.exs
          grep -Eq 'cacerts:|cacertfile:' config/runtime.exs
          ! grep -nE 'verify[[:space:]]*:[[:space:]]*:verify_none' config/runtime.exs
          ! grep -nE 'ssl[[:space:]]*:[[:space:]]*false' config/runtime.exs
          ! grep -nE 'IO\.(puts|inspect).*DATABASE_URL|Logger\..*DATABASE_URL' config/runtime.exs
      - name: Production release assembly
        shell: bash
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          mix deps.get --only prod
          mix compile --warnings-as-errors
          mix assets.deploy
          mix release --overwrite
          test -x _build/prod/rel/strangertalks_new/bin/migrate
      - name: Docker compatibility
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t strangertalks-c5-tls:${GITHUB_RUN_ID} .
          test "$(docker inspect --format '{{.Config.User}}' strangertalks-c5-tls:${GITHUB_RUN_ID})" = "nobody"
      - name: Prove candidate content was not edited by proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | tee /tmp/c5-tls-tracked-diff
          test ! -s /tmp/c5-tls-tracked-diff
      - name: Restore pristine checkout and prove exact identity
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$TARGET_SHA"
          git clean -fdx
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
