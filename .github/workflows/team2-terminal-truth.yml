name: Team 2 Terminal Truth Gate

on:
  push:
    branches:
      - newteam/terminal-truth
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: team2-terminal-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terminal-truth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002

    steps:
      - name: Checkout exact Team 2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_TEAM2_COMMIT=$expected"
          echo "ACTUAL_TEAM2_COMMIT=$actual"
          test "$actual" = "$expected"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove committed formatting and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mix format
          git diff --check
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Formatter or generated work changed the committed tree:"
            printf '%s\n' "$status"
            git diff --no-ext-diff -- .
            exit 1
          fi

      - name: Focused Team 2 Elixir terminal attacks
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new/terminal_persistence_failure_test.exs \
            test/strangertalks_new/team4_safety_boundary_test.exs \
            test/strangertalks_new/recovery_restart_test.exs \
            test/strangertalks_new/conversation_lifecycle_test.exs \
            test/strangertalks_new/conversation_live_call_test.exs \
            test/strangertalks_new/view_once_conversation_test.exs \
            test/strangertalks_new_web/channels/conversation_*_channel_test.exs \
            test/strangertalks_new_web/controllers/normal_media_controller_test.exs \
            test/strangertalks_new_web/controllers/companion_controller_test.exs

      - name: Focused Team 2 JS terminal attacks
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/js/terminal_truth_client_test.mjs \
            test/js/session_reconciliation_guard_test.mjs \
            test/js/live_call_test.mjs \
            test/js/voice_notes_test.mjs \
            test/js/view_once_test.mjs \
            test/js/reply_quote_test.mjs \
            test/js/reaction_test.mjs \
            test/js/message_edit_test.mjs \
            test/js/message_unsend_test.mjs \
            test/js/pin_test.mjs \
            test/js/expressive_media_test.mjs

      - name: Prepare isolated browser terminal database
        env:
          MIX_TEST_PARTITION: _team2_browser
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for real browser terminal proof
        env:
          MIX_TEST_PARTITION: _team2_browser
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint_config, :server, true)
            )

            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            browser_repo_config =
              repo_config
              |> Keyword.put(:pool, DBConnection.ConnectionPool)
              |> Keyword.put(:pool_size, 16)

            Application.put_env(
              :strangertalks_new,
              StrangertalksNew.Repo,
              browser_repo_config
            )

            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/team2-terminal-server.log 2>&1 &
          echo $! > /tmp/team2-terminal-server.pid

          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/team2-terminal-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/team2-terminal-server.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then
              echo "Phoenix terminal endpoint is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Phoenix did not become ready."
          cat /tmp/team2-terminal-server.log
          exit 1

      - name: Real browser terminal truth re-attack
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/js/terminal_truth_browser_test.mjs \
            test/js/team2_connected_end_browser_test.mjs

      - name: Stop Phoenix terminal server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/team2-terminal-server.pid ]; then
            pid="$(cat /tmp/team2-terminal-server.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/team2-terminal-server.log || true

      - name: Drop isolated browser terminal database
        if: always()
        env:
          MIX_TEST_PARTITION: _team2_browser
        run: mix ecto.drop --quiet || true

      - name: Full repository precommit
        run: mix precommit

      - name: Final diff and clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          status="$(git status --porcelain)"
          echo "STATUS_PORCELAIN:"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Record exact tested Team 2 commit
        run: |
          echo "TEAM2_TESTED_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
