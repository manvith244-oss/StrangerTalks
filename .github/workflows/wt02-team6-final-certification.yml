name: WT-02 Team 6 Final Certification

on:
  push:
    branches:
      - wind-tunnel/wt02-team6-final-certification
  workflow_dispatch:

concurrency:
  group: wt02-team6-final-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to exact Team-6 product candidate commit
        run: |
          git checkout ac867b346426c782b90031b3d770a0d294761065

      - name: Gate 1 — Exact checkout identity and cleanliness
        run: |
          echo "EXPECTED_SHA=ac867b346426c782b90031b3d770a0d294761065"
          echo "ACTUAL_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "ac867b346426c782b90031b3d770a0d294761065"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^{tree})" = "9ffa1efea0c624405ed435a0db2055f17113f784"
          git status --short
          test -z "$(git status --short)"

      - name: Gate 2 — Diff hygiene
        run: |
          git diff --check

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Gate 3 — Team-5 explicit-End contract
        run: mix test test/strangertalks_new/wt02_explicit_end_server_core_test.exs --trace

      - name: Gate 4 — Team-6 transport and ACK contract
        run: mix test test/strangertalks_new/wt02_terminal_transport_ack_test.exs --trace

      - name: Gate 5 — Conversation delivery regression
        run: mix test test/strangertalks_new/conversation_delivery_test.exs --trace

      - name: Gate 6 — Terminal persistence and recovery regressions
        run: >-
          mix test
          test/strangertalks_new/terminal_persistence_failure_test.exs
          test/strangertalks_new/recovery_restart_test.exs
          --trace

      - name: Gate 7 — Safety and Block regression
        run: mix test test/strangertalks_new/team4_safety_boundary_test.exs --trace

      - name: Gate 8 — Postcommit terminal proof
        run: mix test test/strangertalks_new/terminal_observability_test.exs --trace

      - name: Gate 9 — Relationship Reconnections contract
        run: mix test test/strangertalks_new/relationship_reconnections_test.exs:160 --trace

      - name: Gate 10 — Standard full precommit
        run: mix precommit

      - name: Gate 11 — Final format and worktree proof
        run: |
          mix format --check-formatted
          git diff --check
          git status --short
          git diff --exit-code -- .

      - name: Gate 12 — Final candidate authority
        run: |
          test "$(git rev-parse HEAD)" = "ac867b346426c782b90031b3d770a0d294761065"
          echo "WT02_TEAM6_CERTIFIED_COMMIT=$(git rev-parse HEAD)"
