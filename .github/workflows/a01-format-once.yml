name: A01 Format Once

on:
  push:
    branches:
      - feature/a01-conversation-companion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature HEAD
        uses: actions/checkout@v4
        with:
          ref: feature/a01-conversation-companion
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Apply canonical formatter
        run: mix format

      - name: Commit formatter-only changes
        run: |
          if git diff --quiet -- .; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .
          git commit -m "Apply canonical A01 formatting"
          git push origin HEAD:feature/a01-conversation-companion
