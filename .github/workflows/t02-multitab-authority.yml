name: T02 Multi-Tab Authority Gate

on:
  push:
    branches:
      - team2/multitab-authority-closure
  workflow_dispatch:

concurrency:
  group: t02-multitab-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multitab-authority:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002

    steps:
      - name: Checkout exact T02 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_T02_COMMIT=${{ github.sha }}"
          echo "ACTUAL_T02_COMMIT=$actual"
          test "$actual" = "${{ github.sha }}"
          git status --porcelain

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove T02 patch formatting and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted test/strangertalks_new_web/channels/participant_multitab_authority_test.exs
          git diff --check
          status="$(git status --porcelain)"
          echo "STATUS_BEFORE_TESTS:"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Focused T02 multi-tab Elixir proof
        shell: bash
        run: |
          set -euo pipefail
          mix test \
            test/strangertalks_new_web/channels/participant_multitab_authority_test.exs \
            test/strangertalks_new_web/channels/participant_channel_test.exs \
            test/strangertalks_new/matchmaking_engine_test.exs \
            test/strangertalks_new/matchmaking_hostile_concurrency_test.exs \
            test/strangertalks_new/security_adversarial_test.exs

      - name: Prepare isolated browser reliability database
        env:
          MIX_TEST_PARTITION: _t02_multitab_browser
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for sibling-terminal proof
        env:
          MIX_TEST_PARTITION: _t02_multitab_browser
        shell: bash
        run: |
          set -euo pipefail
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint_config, :server, true)
            )

            repo_config = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            browser_repo_config =
              repo_config
              |> Keyword.put(:pool, DBConnection.ConnectionPool)
              |> Keyword.put(:pool_size, 16)

            Application.put_env(
              :strangertalks_new,
              StrangertalksNew.Repo,
              browser_repo_config
            )

            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t02-multitab-server.log 2>&1 &
          echo $! > /tmp/t02-multitab-server.pid

          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t02-multitab-server.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/t02-multitab-server.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null; then
              echo "Phoenix multi-tab endpoint is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Phoenix did not become ready."
          cat /tmp/t02-multitab-server.log
          exit 1

      - name: Existing sibling reconnect and terminal proof
        shell: bash
        run: |
          set -euo pipefail
          node --test test/js/conversation_reliability_browser_test.mjs

      - name: Stop Phoenix multi-tab server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/t02-multitab-server.pid ]; then
            pid="$(cat /tmp/t02-multitab-server.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/t02-multitab-server.log || true

      - name: Drop isolated browser reliability database
        if: always()
        env:
          MIX_TEST_PARTITION: _t02_multitab_browser
        run: mix ecto.drop --quiet || true

      - name: Full repository precommit
        run: mix precommit

      - name: Prove inherited formatter drift and restore exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex | sort)"
          echo "FORMATTER_DRIFT_PATHS:"
          printf '%s\n' "$changed"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected post-precommit tree mutation."
            git diff --no-ext-diff -- .
            exit 1
          fi
          git diff --no-ext-diff -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex
          git checkout -- \
            lib/strangertalks_new/conversation_lifecycle/conversation_server.ex \
            lib/strangertalks_new/reflections.ex

      - name: Final diff and clean-tree proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          status="$(git status --porcelain)"
          echo "STATUS_PORCELAIN:"
          printf '%s\n' "$status"
          test -z "$status"

      - name: Record exact tested T02 commit
        run: |
          echo "T02_TESTED_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
