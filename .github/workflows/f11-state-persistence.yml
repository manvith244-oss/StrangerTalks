name: F11 State Persistence

on:
  push:
    branches:
      - f11/state-persistence-readiness-2026-08-27
  pull_request:
    branches:
      - release/prep-2026-08-22

concurrency:
  group: f11-state-persistence-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  F11_START_SHA: 585637924ff45933c7b35b0bc27719934907c70e
  F11_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.F11_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$F11_CANDIDATE_SHA"
          git merge-base --is-ancestor "$F11_START_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: F11 persistence contracts
        run: node --test test/js/f11_persistence_contract_test.mjs test/js/f11_local_data_integration_test.mjs

  hostile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.F11_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$F11_CANDIDATE_SHA"
          git merge-base --is-ancestor "$F11_START_SHA" HEAD
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f11-browser.log 2>&1 &
          echo $! > /tmp/f11-browser.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f11-browser.pid)" 2>/dev/null; then cat /tmp/f11-browser.log; exit 1; fi
            sleep 1
          done
          cat /tmp/f11-browser.log
          exit 1
      - name: F11 hostile browser proof
        run: node --test --test-concurrency=1 test/js/f11_browser_hostile_test.mjs
      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/f11-browser.pid ]; then kill "$(cat /tmp/f11-browser.pid)" 2>/dev/null || true; fi
      - name: Browser log on failure
        if: failure()
        run: cat /tmp/f11-browser.log || true

  repository-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.F11_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout identity and ancestry
        run: |
          echo "F11_EXPECTED_COMMIT=$F11_CANDIDATE_SHA"
          echo "F11_ACTUAL_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$F11_CANDIDATE_SHA"
          git merge-base --is-ancestor "$F11_START_SHA" HEAD
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - name: Install Hex, Rebar, and dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Reset test database
        run: |
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Full repository precommit
        run: mix precommit
      - name: Diff integrity
        run: |
          git diff --check "$F11_START_SHA"...HEAD
          git diff --check
      - name: Prove clean tree and exact tested SHA
        run: |
          git status --short --branch
          git status --porcelain | tee /tmp/f11-status
          test ! -s /tmp/f11-status
          test "$(git rev-parse HEAD)" = "$F11_CANDIDATE_SHA"
          echo "F11_TESTED_COMMIT=$(git rev-parse HEAD)"
