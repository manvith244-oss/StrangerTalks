name: F11 State Persistence

on:
  push:
    branches:
      - f11/state-persistence-readiness-2026-08-27
  pull_request:
    branches:
      - release/prep-2026-08-22

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: F11 persistence contracts
        run: node --test test/js/f11_persistence_contract_test.mjs test/js/f11_local_data_integration_test.mjs

  hostile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
      - name: Start Phoenix browser server
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f11-browser.log 2>&1 &
          echo $! > /tmp/f11-browser.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:4000/ >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f11-browser.pid)" 2>/dev/null; then cat /tmp/f11-browser.log; exit 1; fi
            sleep 1
          done
          cat /tmp/f11-browser.log
          exit 1
      - name: F11 hostile browser proof
        run: node --test --test-concurrency=1 test/js/f11_browser_hostile_test.mjs
      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/f11-browser.pid ]; then kill "$(cat /tmp/f11-browser.pid)" 2>/dev/null || true; fi
      - name: Browser log on failure
        if: failure()
        run: cat /tmp/f11-browser.log || true
