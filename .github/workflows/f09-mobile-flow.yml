name: F-09 Mobile Flow Proof

on:
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: f09-mobile-flow-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-flow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4002"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4002
      F09_FROZEN_BASE_SHA: 585637924ff45933c7b35b0bc27719934907c70e
      F03_CANDIDATE_SHA: f7de0a65b33a934f877976db8ced4a5238834d19

    steps:
      - name: Checkout exact F-09 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove F-09 SHA and frozen-base lineage
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_F09_COMMIT=$expected"
          echo "ACTUAL_F09_COMMIT=$actual"
          test "$actual" = "$expected"
          test "$(git merge-base HEAD "$F09_FROZEN_BASE_SHA")" = "$F09_FROZEN_BASE_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prove external F-03 Back-history candidate without importing it
        run: |
          git fetch --no-tags origin "$F03_CANDIDATE_SHA" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$F03_CANDIDATE_SHA"
          git worktree add --detach /tmp/f03-candidate "$F03_CANDIDATE_SHA"
          node --test /tmp/f03-candidate/test/js/navigation_history_test.mjs
          git worktree remove --force /tmp/f03-candidate
          test ! -e priv/static/assets/navigation_history.mjs

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Focused F-09 mobile regressions
        run: |
          node --test \
            test/js/f09_mobile_flow_test.mjs \
            test/js/instagram_chat_test.mjs

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for F-09 browser proof
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f09-browser.log 2>&1 &
          echo $! > /tmp/f09-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/f09-browser.pid)" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/f09-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4002/ >/dev/null; then
              echo "Phoenix F-09 browser endpoint is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Phoenix did not become ready."
          cat /tmp/f09-browser.log
          exit 1

      - name: Responsive mobile Chromium proof
        run: node --test test/js/f09_mobile_flow_browser_test.mjs

      - name: Upload F-09 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f09-mobile-flow-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/chat-ui-screenshots/f09-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop F-09 browser server
        if: always()
        run: |
          if [ -f /tmp/f09-browser.pid ]; then
            pid="$(cat /tmp/f09-browser.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Reset browser data before full precommit
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full relevant precommit
        run: mix precommit

      - name: Diff hygiene and clean tree
        run: |
          git diff --check "$F09_FROZEN_BASE_SHA"...HEAD
          git status --porcelain | tee /tmp/f09-status
          test ! -s /tmp/f09-status

      - name: Record exact tested SHA
        run: |
          echo "F09_TESTED_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/f09-browser.log || true
