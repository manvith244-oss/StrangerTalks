name: Conversation Screen Transition Gate

on:
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: conversation-screen-transition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conversation-screen-transition:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4003"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4003

    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/conversation-screen-transition.log 2>&1 &
          echo $! > /tmp/conversation-screen-transition.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/conversation-screen-transition.pid)" 2>/dev/null; then
              cat /tmp/conversation-screen-transition.log
              exit 1
            fi
            if curl -fsS http://localhost:4003/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/conversation-screen-transition.log
          exit 1

      - name: Conversation screen transition browser contract
        run: node --test test/js/conversation_screen_transition_browser_test.mjs

      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f /tmp/conversation-screen-transition.pid ]; then
            kill "$(cat /tmp/conversation-screen-transition.pid)" 2>/dev/null || true
          fi

      - name: Reset browser test data
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        run: mix precommit

      - name: Prove clean checkout
        run: git status --porcelain | tee /tmp/status && test ! -s /tmp/status

      - name: Browser log on failure
        if: failure()
        run: cat /tmp/conversation-screen-transition.log || true
