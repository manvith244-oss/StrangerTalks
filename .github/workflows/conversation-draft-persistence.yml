name: Conversation Draft Persistence Proof

on:
  push:
    branches:
      - fix/conversation-draft-persistence-2026-08-28
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: conversation-draft-persistence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conversation-draft-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: _conversation_draft
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      STRANGERTALKS_PERSISTENT_TEST_SERVER: "1"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_CONVERSATION_DRAFT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_CONVERSATION_DRAFT_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare isolated browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix with persistent browser Repo
        run: |
          mix run --no-start -e '
            endpoint_config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(
              :strangertalks_new,
              StrangertalksNewWeb.Endpoint,
              Keyword.put(endpoint_config, :server, true)
            )
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-conversation-draft.log 2>&1 &
          echo $! > /tmp/strangertalks-conversation-draft.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/strangertalks-conversation-draft.pid)" 2>/dev/null; then
              cat /tmp/strangertalks-conversation-draft.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/strangertalks-conversation-draft.log
          exit 1

      - name: Durable Conversation draft browser regression
        run: node --test test/js/conversation_draft_browser_test.mjs

      - name: Stop Phoenix
        if: always()
        run: |
          if [ -f /tmp/strangertalks-conversation-draft.pid ]; then
            kill "$(cat /tmp/strangertalks-conversation-draft.pid)" 2>/dev/null || true
          fi

      - name: Phoenix log on failure
        if: failure()
        run: cat /tmp/strangertalks-conversation-draft.log || true

      - name: Reset isolated database before precommit
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        run: |
          mix ecto.drop --force
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        env:
          STRANGERTALKS_PERSISTENT_TEST_SERVER: "0"
        run: mix precommit

      - name: Prove pristine exact head
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
