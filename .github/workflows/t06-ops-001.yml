name: T06 Scheduled Ops Closure Gate

on:
  workflow_dispatch:
  push:
    branches:
      - team6/scheduled-ops-lineage-closure
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/postgres-r2-backup.yml"
      - ".github/workflows/retention-maintenance.yml"
      - ".github/workflows/team1-core-authority.yml"
      - ".github/workflows/t06-ops-001.yml"
      - "ops/postgres_backup.sh"
      - "ops/postgres_restore.sh"
      - "ops/run_retention.sh"
      - "ops/check_candidate_diff.sh"
      - "ops/preflight_distinct_relationship_participants.sh"
      - "lib/mix/tasks/strangertalks.retention.ex"
      - "lib/strangertalks_new/retention_cleanup.ex"
      - "test/strangertalks_new/retention_*"
      - "test/strangertalks_new/t06_*"

permissions:
  contents: read
  statuses: write

jobs:
  closure:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact T06 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Prove checkout identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "CHECKED_OUT_SHA=$checked_out_sha"
          test "$checked_out_sha" = "$EXPECTED_SHA"
          echo "checked_out_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Scheduled-ops and T01 CI lineage regressions
        id: lineage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/t06_scheduled_ops_lineage_test.exs \
            test/strangertalks_new/t06_candidate_diff_integrity_test.exs \
            2>&1 | tee /tmp/t06-lineage.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t06-lineage.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Retention behavior regressions
        id: retention
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix test \
            test/strangertalks_new/retention_cleanup_test.exs \
            test/strangertalks_new/retention_cleanup_db_test.exs \
            test/strangertalks_new/retention_closure_db_test.exs \
            test/strangertalks_new/retention_safety_media_closure_test.exs \
            2>&1 | tee /tmp/t06-retention.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t06-retention.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Operations shell syntax
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash -n \
            ops/postgres_backup.sh \
            ops/postgres_restore.sh \
            ops/run_retention.sh \
            ops/check_candidate_diff.sh \
            ops/preflight_distinct_relationship_participants.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Execute retention runner against isolated CI database
        id: retention_runner
        continue-on-error: true
        shell: bash
        env:
          DATABASE_URL: postgresql://strangertalks_local:strangertalks_test@127.0.0.1:5432/strangertalks_new_test
        run: |
          set +e
          set -o pipefail
          bash ops/run_retention.sh 2>&1 | tee /tmp/t06-retention-runner.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Install PostgreSQL client for production preflight
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl ca-certificates

      - name: Read-only self-relationship preflight against authoritative Supabase
        id: self_relationship_preflight
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || vars.SUPABASE_DATABASE_URL }}
          SUPABASE_CA_URL: https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
        run: |
          set +e
          if [ -z "${SUPABASE_DATABASE_URL:-}" ]; then
            echo "PREFLIGHT_RESULT=BLOCKED_MISSING_SUPABASE_DATABASE_URL"
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            echo "count=missing" >> "$GITHUB_OUTPUT"
            echo "result=BLOCKED_MISSING_SUPABASE_DATABASE_URL" >> "$GITHUB_OUTPUT"
            exit 2
          fi

          curl --fail --silent --show-error --location "$SUPABASE_CA_URL" -o /tmp/supabase-prod-ca.crt

          output=$(PGSSLMODE=verify-full \
            PGSSLROOTCERT=/tmp/supabase-prod-ca.crt \
            DATABASE_URL="$SUPABASE_DATABASE_URL" \
            bash ops/preflight_distinct_relationship_participants.sh 2>&1)
          code=$?
          printf '%s\n' "$output"

          count=$(printf '%s\n' "$output" | awk -F= '/^SELF_RELATIONSHIP_COUNT=/{print $2}' | tail -1)
          result=$(printf '%s\n' "$output" | awk -F= '/^PREFLIGHT_RESULT=/{print $2}' | tail -1)

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "count=${count:-missing}" >> "$GITHUB_OUTPUT"
          echo "result=${result:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Full repository precommit
        id: precommit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mix precommit 2>&1 | tee /tmp/t06-precommit.log
          code=${PIPESTATUS[0]}
          summary=$(grep -Eo '[0-9]+ tests?, [0-9]+ failures?' /tmp/t06-precommit.log | tail -1 || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=${summary:-missing}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Git diff check
        id: diffcheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git diff --check
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Prove verification left checkout unchanged
        id: clean
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=$(git status --porcelain)
          printf '%s\n' "$status"
          if [ -n "$status" ]; then
            git diff --no-ext-diff -- .
            code=1
          else
            code=0
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Publish exact-SHA T06 status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
          LINEAGE_SUMMARY: ${{ steps.lineage.outputs.summary }}
          RETENTION_OUTCOME: ${{ steps.retention.outcome }}
          RETENTION_SUMMARY: ${{ steps.retention.outputs.summary }}
          SHELL_OUTCOME: ${{ steps.shellcheck.outcome }}
          RUNNER_OUTCOME: ${{ steps.retention_runner.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.self_relationship_preflight.outcome }}
          PREFLIGHT_COUNT: ${{ steps.self_relationship_preflight.outputs.count }}
          PREFLIGHT_RESULT: ${{ steps.self_relationship_preflight.outputs.result }}
          PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          PRECOMMIT_SUMMARY: ${{ steps.precommit.outputs.summary }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -euo pipefail
          state=success
          for value in "$LINEAGE_OUTCOME" "$RETENTION_OUTCOME" "$SHELL_OUTCOME" "$RUNNER_OUTCOME" "$PREFLIGHT_OUTCOME" "$PRECOMMIT_OUTCOME" "$DIFF_OUTCOME" "$CLEAN_OUTCOME"; do
            if [ "$value" != "success" ]; then state=failure; fi
          done

          description="lineage ${LINEAGE_SUMMARY:-missing}; retention ${RETENTION_SUMMARY:-missing}; selfrel ${PREFLIGHT_COUNT:-missing}/${PREFLIGHT_RESULT:-missing}; full ${PRECOMMIT_SUMMARY:-missing}"
          description=$(printf '%s' "$description" | cut -c1-140)

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
            -f state="$state" \
            -f context="t06-ops-001" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail gate if any required verification failed
        if: always()
        shell: bash
        env:
          CHECKED_OUT_SHA: ${{ steps.identity.outputs.checked_out_sha }}
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
          RETENTION_OUTCOME: ${{ steps.retention.outcome }}
          SHELL_OUTCOME: ${{ steps.shellcheck.outcome }}
          RUNNER_OUTCOME: ${{ steps.retention_runner.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.self_relationship_preflight.outcome }}
          PREFLIGHT_EXIT: ${{ steps.self_relationship_preflight.outputs.exit_code }}
          PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA:-missing}"
          echo "LINEAGE_OUTCOME=$LINEAGE_OUTCOME"
          echo "RETENTION_OUTCOME=$RETENTION_OUTCOME"
          echo "SHELL_OUTCOME=$SHELL_OUTCOME"
          echo "RUNNER_OUTCOME=$RUNNER_OUTCOME"
          echo "PREFLIGHT_OUTCOME=$PREFLIGHT_OUTCOME"
          echo "PREFLIGHT_EXIT=${PREFLIGHT_EXIT:-missing}"
          echo "PRECOMMIT_OUTCOME=$PRECOMMIT_OUTCOME"
          echo "DIFF_OUTCOME=$DIFF_OUTCOME"
          echo "CLEAN_OUTCOME=$CLEAN_OUTCOME"

          test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
          test "$LINEAGE_OUTCOME" = "success"
          test "$RETENTION_OUTCOME" = "success"
          test "$SHELL_OUTCOME" = "success"
          test "$RUNNER_OUTCOME" = "success"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$PREFLIGHT_OUTCOME" = "success"
            test "$PREFLIGHT_EXIT" = "0"
          fi
          test "$PRECOMMIT_OUTCOME" = "success"
          test "$DIFF_OUTCOME" = "success"
          test "$CLEAN_OUTCOME" = "success"
          echo "TESTED_SHA=$CHECKED_OUT_SHA"
