name: Arrival & First 60 Seconds Gate

on:
  push:
    branches:
      - feature/arrival-first-60-seconds
  pull_request:
    branches:
      - release/prep-2026-08-22
  workflow_dispatch:

concurrency:
  group: arrival-first-60-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arrival-first-60:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000

    steps:
      - name: Checkout exact Team 1 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          echo "EXPECTED_TEAM1_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "ACTUAL_TEAM1_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: First-minute and maintained JS regressions
        run: |
          # Browser classification is an explicit runtime boundary, not a filename convention.
          browser_tests=(
            test/js/arrival_accessibility_browser_test.mjs
            test/js/arrival_first_minute_browser_test.mjs
            test/js/browser_e2e_test.mjs
            test/js/conversation_reliability_browser_test.mjs
            test/js/f01_app_shell_browser_test.mjs
            test/js/f04_conversation_runtime_cleanup_browser_test.mjs
            test/js/f04_conversation_runtime_hostile_browser_test.mjs
            test/js/f06_secondary_flow_browser_test.mjs
            test/js/f07_loading_transitions_browser_test.mjs
            test/js/f09_mobile_flow_browser_test.mjs
            test/js/f10_desktop_flow_browser_test.mjs
            test/js/f11_browser_corrupt_identity_test.mjs
            test/js/f11_browser_hostile_test.mjs
            test/js/fx05_expression_continuity_browser_test.mjs
            test/js/instagram_chat_browser_test.mjs
            test/js/instagram_chat_report_browser_test.mjs
            test/js/navigation_history_browser_test.mjs
            test/js/normal_media_browser_test.mjs
            test/js/team10_expression_actions_browser_test.mjs
            test/js/team10_expression_authority_browser_test.mjs
            test/js/team10_expression_browser_test.mjs
            test/js/team10_expression_reliability_browser_test.mjs
            test/js/team3_channel_reliability_browser_test.mjs
            test/js/team3_conversation_experience_gate_test.mjs
            test/js/team3_conversation_hostile_test.mjs
            test/js/team3_replay_overlap_browser_test.mjs
            test/js/team4_media_browser_test.mjs
            test/js/team5_continuity_browser_attack_test.mjs
            test/js/team6_product_ux_browser_test.mjs
            test/js/team6_real_ux_browser_test.mjs
            test/js/team7_continuity_browser_test.mjs
            test/js/terminal_truth_browser_test.mjs
          )

          declare -A browser_test_set=()
          for test_file in "${browser_tests[@]}"; do
            browser_test_set["$test_file"]=1
          done

          maintained_tests=()
          while IFS= read -r -d '' test_file; do
            if [[ -z "${browser_test_set[$test_file]+x}" ]]; then
              maintained_tests+=("$test_file")
            fi
          done < <(find test/js -maxdepth 1 -name '*_test.mjs' -print0 | sort -z)

          node --test --test-concurrency=1 "${maintained_tests[@]}"

      - name: Prepare browser database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start Phoenix for browser proof
        run: |
          mix run --no-start -e '
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/strangertalks-arrival-browser.log 2>&1 &
          echo $! > /tmp/strangertalks-arrival-browser.pid
          for attempt in $(seq 1 45); do
            if ! kill -0 "$(cat /tmp/strangertalks-arrival-browser.pid)" 2>/dev/null; then
              echo "Phoenix exited before becoming ready."
              cat /tmp/strangertalks-arrival-browser.log
              exit 1
            fi
            if curl -fsS http://localhost:4000/ >/dev/null; then
              echo "Phoenix Team 1 browser endpoint is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Phoenix did not become ready."
          cat /tmp/strangertalks-arrival-browser.log
          exit 1

      - name: Full Arrival hostile-user browser proof
        run: |
          node --test --test-concurrency=1 \
            test/js/arrival_first_minute_browser_test.mjs \
            test/js/arrival_accessibility_browser_test.mjs \
            test/js/team3_conversation_experience_gate_test.mjs \
            test/js/team3_conversation_hostile_test.mjs \
            test/js/browser_e2e_test.mjs

      - name: Upload Arrival device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrival-first-60-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/arrival-first-60-screenshots
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Phoenix browser server
        if: always()
        run: |
          if [ -f /tmp/strangertalks-arrival-browser.pid ]; then
            pid="$(cat /tmp/strangertalks-arrival-browser.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
            fi
          fi

      - name: Reset browser test data before full suite
        run: |
          mix ecto.drop --quiet
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Full precommit
        run: mix precommit

      - name: Diff integrity
        run: git diff --check

      - name: Prove final checkout clean
        run: |
          git status --short --branch
          git status --porcelain | tee /tmp/team1-status
          test ! -s /tmp/team1-status

      - name: Record exact tested commit
        run: echo "TEAM1_TESTED_COMMIT=$(git rev-parse HEAD)"

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/strangertalks-arrival-browser.log || true
