name: Diagnose F10 Settings readiness

on:
  push:
    branches:
      - diag/fix-42-60-64-apply-2026-08-30

permissions:
  contents: read

jobs:
  trace-f10-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      TARGET_SHA: 00e096b69b247c5fa05ff15cde722e63990703ce
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare DB and server
        shell: bash
        run: |
          set -euo pipefail
          mix ecto.drop --quiet || true
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 24)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            config = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(config, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/f10-diag-server.log 2>&1 &
          echo $! > /tmp/f10-diag-server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/health/live" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/f10-diag-server.pid)" 2>/dev/null; then cat /tmp/f10-diag-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/f10-diag-server.log
          exit 1

      - name: Instrument only the disposable test copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/js/f10_desktop_flow_browser_test.mjs')
          s = p.read_text()
          old = '''    const settingsNav = user.page.locator('#bottom-nav [data-go="settings"]')
              await settingsNav.focus()
              await user.page.keyboard.press("Enter")
              await user.page.locator('[data-screen="settings"].active').waitFor({state: "visible", timeout: WAIT_MS})'''.replace('              ', '    ')
          new = '''    const traceSnapshot = async label => {
              const state = await user.page.evaluate(label => ({
                label,
                path: location.pathname,
                activeScreens: Array.from(document.querySelectorAll('[data-screen].active')).map(node => node.dataset.screen),
                status: document.querySelector('[role="status"]')?.textContent || document.querySelector('#status')?.textContent || null,
                activeElement: document.activeElement?.id || document.activeElement?.getAttribute?.('data-go') || document.activeElement?.tagName || null,
                bottomNavHidden: document.querySelector('#bottom-nav')?.hidden ?? null,
                settingsVisible: (() => { const n = document.querySelector('#bottom-nav [data-go="settings"]'); if (!n) return null; const r = n.getBoundingClientRect(); const cs = getComputedStyle(n); return {disabled: n.disabled, hidden: n.hidden, display: cs.display, visibility: cs.visibility, width: r.width, height: r.height}; })(),
                diagEvents: globalThis.__f10SettingsDiag || []
              }), label)
              console.log('F10TRACE ' + JSON.stringify(state))
            }

            await user.page.evaluate(() => {
              globalThis.__f10SettingsDiag = []
              const record = (type, event) => {
                const target = event?.target?.closest?.('[data-go]')
                if (target?.dataset?.go === 'settings') {
                  globalThis.__f10SettingsDiag.push({type, key: event.key || null, path: location.pathname, active: document.querySelector('[data-screen].active')?.dataset?.screen || null, activeElement: document.activeElement?.id || document.activeElement?.getAttribute?.('data-go') || document.activeElement?.tagName || null})
                }
              }
              for (const type of ['focusin', 'keydown', 'keyup', 'click']) document.addEventListener(type, event => record(type, event), true)
              const push = history.pushState.bind(history)
              history.pushState = (...args) => { globalThis.__f10SettingsDiag.push({type: 'pushState', to: args[2], from: location.pathname}); return push(...args) }
              const replace = history.replaceState.bind(history)
              history.replaceState = (...args) => { globalThis.__f10SettingsDiag.push({type: 'replaceState', to: args[2], from: location.pathname}); return replace(...args) }
            })

            await traceSnapshot('doors-visible-before-settings-focus')
            const settingsNav = user.page.locator('#bottom-nav [data-go="settings"]')
            await settingsNav.focus()
            await traceSnapshot('after-settings-focus')
            await user.page.keyboard.press("Enter")
            await traceSnapshot('immediately-after-enter')
            await user.page.waitForTimeout(250)
            await traceSnapshot('250ms-after-enter')
            await user.page.waitForTimeout(1000)
            await traceSnapshot('1250ms-after-enter')
            try {
              await user.page.locator('[data-screen="settings"].active').waitFor({state: "visible", timeout: WAIT_MS})
            } catch (error) {
              await traceSnapshot('settings-timeout')
              console.log('F10JOURNAL ' + JSON.stringify(user.journal.events.slice(-30)))
              throw error
            }'''.replace('            ', '    ')
          if s.count(old) != 1:
              raise SystemExit('target Settings sequence did not match exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- test/js/f10_desktop_flow_browser_test.mjs
          test "$(git diff --name-only)" = "test/js/f10_desktop_flow_browser_test.mjs"

      - name: Run targeted test three times
        shell: bash
        run: |
          set +e
          overall=0
          for i in 1 2 3; do
            echo "===== F10 DIAGNOSTIC ITERATION $i ====="
            node --test --test-concurrency=1 --test-name-pattern="F-10 standard keyboard controls operate Matchmaking and Settings" test/js/f10_desktop_flow_browser_test.mjs
            rc=$?
            echo "F10_DIAG_ITERATION_${i}_RC=$rc"
            if [ "$rc" -ne 0 ]; then overall=$rc; fi
          done
          exit "$overall"

      - name: Server log
        if: always()
        run: cat /tmp/f10-diag-server.log || true

      - name: Verify target unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
