name: C1 T-A01 Provenance Proof

on:
  push:
    branches:
      - convergence/c1-ta01-provenance-2026-09-09

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact C1 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prove exact identity
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Provenance boundary regression
        run: mix test test/strangertalks_new/trend_bridge_research_provenance_test.exs
