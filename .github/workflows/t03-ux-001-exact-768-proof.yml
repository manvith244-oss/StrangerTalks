name: T03 UX-001 Exact 768 Browser Proof

on:
  push:
    branches:
      - validation/t03-ux-001-768-cff1d080

permissions:
  contents: read

jobs:
  exact-768:
    name: Exact 768 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: candidate
            sha: cff1d080cfbe050164eaea96bfe7de33641a2fa1
            mode: full
          - name: canonical
            sha: 423442915e37fd6aadd25bd1c6a300eed2b464f0
            mode: layout

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      T03_TEST_SHA: ${{ matrix.sha }}
      T03_TEST_NAME: ${{ matrix.name }}
      T03_TEST_MODE: ${{ matrix.mode }}

    steps:
      - name: Checkout exact comparison SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Prove exact identity and clean entry tree
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T03_768_TARGET=$T03_TEST_NAME"
          echo "T03_768_EXPECTED_SHA=$T03_TEST_SHA"
          echo "T03_768_CHECKED_OUT_SHA=$actual"
          echo "T03_768_VIEWPORT=768x1024"
          test "$actual" = "$T03_TEST_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare fresh isolated database
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start fresh exact-SHA Phoenix process
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > "/tmp/t03-768-${T03_TEST_NAME}.log" 2>&1 &
          echo $! > "/tmp/t03-768-${T03_TEST_NAME}.pid"
          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t03-768-${T03_TEST_NAME}.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "/tmp/t03-768-${T03_TEST_NAME}.log"
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null; then
              echo "T03_768_SERVER_READY=$T03_TEST_NAME"
              exit 0
            fi
            sleep 1
          done
          cat "/tmp/t03-768-${T03_TEST_NAME}.log"
          exit 1

      - name: Build identical exact-768 real-browser probe
        run: |
          set -euo pipefail
          mkdir -p "tmp/t03-768-${T03_TEST_NAME}"
          cat > tmp/t03_768_probe.mjs <<'EOF'
          import assert from "node:assert/strict"
          import fs from "node:fs"
          import path from "node:path"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE_URL = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const TARGET = process.env.T03_TEST_NAME
          const MODE = process.env.T03_TEST_MODE
          const WAIT = 20_000
          const ARTIFACTS = path.resolve(`tmp/t03-768-${TARGET}`)
          fs.mkdirSync(ARTIFACTS, {recursive: true})

          function stage(label, value = "PASS") {
            console.log(`T03_768_${TARGET}_${label}=${value}`)
          }

          async function viewportSnapshot(page) {
            return page.evaluate(() => ({
              innerWidth,
              innerHeight,
              scrollX,
              scrollY,
              htmlWidth: document.documentElement.scrollWidth,
              htmlHeight: document.documentElement.scrollHeight,
              bodyWidth: document.body.scrollWidth,
              bodyHeight: document.body.scrollHeight
            }))
          }

          async function probeViewport(page, label, failures) {
            const view = await viewportSnapshot(page)
            console.log(`T03_768_${TARGET}_VIEWPORT_${label.replaceAll(" ", "_").toUpperCase()}=${JSON.stringify(view)}`)
            if (view.innerWidth !== 768 || view.innerHeight !== 1024) failures.push(`${label}: viewport was ${view.innerWidth}x${view.innerHeight}`)
            if (view.htmlWidth > 769) failures.push(`${label}: document horizontal overflow ${view.htmlWidth}`)
            if (view.bodyWidth > 769) failures.push(`${label}: body horizontal overflow ${view.bodyWidth}`)
            return view
          }

          async function probeControl(page, selector, label, failures) {
            const control = page.locator(selector).first()
            const visible = await control.isVisible()
            const enabled = visible ? await control.isEnabled() : false
            const box = visible ? await control.boundingBox() : null
            const view = await viewportSnapshot(page)
            const result = {
              selector,
              visible,
              enabled,
              box,
              viewport: {width: view.innerWidth, height: view.innerHeight, scrollX: view.scrollX, scrollY: view.scrollY}
            }
            console.log(`T03_768_${TARGET}_CONTROL_${label.replaceAll(" ", "_").toUpperCase()}=${JSON.stringify(result)}`)
            if (!visible) failures.push(`${label}: not visible`)
            if (!enabled) failures.push(`${label}: not enabled`)
            if (!box) failures.push(`${label}: not rendered`)
            if (box && (box.x < -1 || box.x + box.width > 769)) failures.push(`${label}: outside 768px horizontal viewport`)
            if (box && (box.y < -1 || box.y >= 1024)) failures.push(`${label}: begins outside 1024px vertical viewport at y=${box.y}`)
            return result
          }

          async function openFresh(browser, label, failures) {
            const context = await browser.newContext({viewport: {width: 768, height: 1024}, acceptDownloads: true})
            const page = await context.newPage()
            const errors = []
            const failedRequests = []
            page.on("pageerror", error => errors.push(error.message))
            page.on("console", message => { if (message.type() === "error") errors.push(message.text()) })
            page.on("requestfailed", request => failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText || "failed"}`))

            const participantResponse = page.waitForResponse(response => {
              try { return new URL(response.url()).pathname === "/api/participants" } catch (_error) { return false }
            })
            const response = await page.goto(BASE_URL, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${label}: root page loads`)
            const issued = await participantResponse
            console.log(`T03_768_${TARGET}_${label}_PARTICIPANT_ISSUANCE=${issued.status()}`)
            assert.equal(issued.status(), 201, `${label}: participant issuance succeeds without a rate-limit bypass`)

            await page.locator('section[data-screen="doors"].active').waitFor({state: "visible", timeout: WAIT})
            await page.locator("button.door").first().waitFor({state: "visible", timeout: WAIT})
            await probeViewport(page, `${label} Arrival`, failures)
            await probeControl(page, "#conversation-language", `${label} Arrival language`, failures)
            await probeControl(page, "button.door", `${label} Arrival Door`, failures)
            return {context, page, errors, failedRequests}
          }

          async function endConversation(page) {
            const actions = page.locator("details.overflow")
            if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()
            await page.locator("#end-conversation").click()
            await page.locator("#end-confirmation-dialog").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#end-confirm").click()
          }

          async function localRecords(page) {
            return page.evaluate(async () => (await import("/assets/local_data.mjs")).listRecords())
          }

          test(`T03 UX-001 exact 768x1024 ${TARGET} proof`, {timeout: 150_000}, async () => {
            const browser = await chromium.launch({headless: true})
            const uxFailures = []
            let a
            let b
            try {
              a = await openFresh(browser, "A", uxFailures)
              b = await openFresh(browser, "B", uxFailures)
              await a.page.screenshot({path: path.join(ARTIFACTS, "01-arrival-768x1024.png"), fullPage: true})
              stage("ARRIVAL")

              await a.page.locator("#conversation-language").selectOption("en")
              await b.page.locator("#conversation-language").selectOption("en")

              await a.page.locator('button.door:has-text("Advice")').click()
              await a.page.locator('section[data-screen="queue"].active').waitFor({state: "visible", timeout: WAIT})
              await a.page.getByRole("status").filter({hasText: "Queue status: queued"}).waitFor({state: "visible", timeout: WAIT})
              await probeViewport(a.page, "Queue", uxFailures)
              await probeControl(a.page, "#leave-queue", "Queue Leave", uxFailures)
              await a.page.screenshot({path: path.join(ARTIFACTS, "02-queue-768x1024.png"), fullPage: true})
              stage("QUEUE")

              await b.page.locator('button.door:has-text("Advice")').click()
              await Promise.all([
                a.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              console.log(`T03_768_${TARGET}_CONVERSATION_REACHED=true`)
              await a.page.screenshot({path: path.join(ARTIFACTS, "03-conversation-before-layout-check-768x1024.png"), fullPage: true})
              await probeViewport(a.page, "Conversation", uxFailures)
              await probeControl(a.page, "#message-input", "Conversation composer", uxFailures)
              await probeControl(a.page, '#message-form button[aria-label="Send message"]', "Conversation Send", uxFailures)
              stage("CONVERSATION")

              if (MODE === "layout") {
                console.log(`T03_768_${TARGET}_UX_FAILURES=${JSON.stringify(uxFailures)}`)
                assert.deepEqual(uxFailures, [], `${TARGET}: exact 768 layout failures`)
                return
              }

              await a.page.locator("#message-input").fill("T03 exact 768 retained message")
              await a.page.getByRole("button", {name: "Send message", exact: true}).click()
              await b.page.locator("#messages li", {hasText: "T03 exact 768 retained message"}).waitFor({state: "visible", timeout: WAIT})
              await a.page.screenshot({path: path.join(ARTIFACTS, "04-conversation-after-send-768x1024.png"), fullPage: true})

              await endConversation(a.page)
              await Promise.all([
                a.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              assert.equal(new URL(a.page.url()).pathname, "/conversation/ended", "terminal route is canonical")
              await a.page.screenshot({path: path.join(ARTIFACTS, "05-terminal-before-layout-check-768x1024.png"), fullPage: true})
              await probeViewport(a.page, "Terminal", uxFailures)
              await probeControl(a.page, "#keep-conversation", "Terminal Keep", uxFailures)
              await probeControl(a.page, "#fade-conversation", "Terminal Fade", uxFailures)
              stage("TERMINAL")

              await Promise.all([
                a.page.locator("#keep-conversation").click(),
                b.page.locator("#keep-conversation").click()
              ])
              await Promise.all([
                a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              ])

              const kept = await localRecords(a.page)
              const keptConversation = kept.find(record => record.type === "local_conversation" && record.value?.status === "kept")
              assert.ok(keptConversation, "Keep creates retained history entry in participant-owned IndexedDB")
              const conversationId = keptConversation.value.conversation_id
              assert.ok(kept.some(record => record.type === "local_message" && record.value?.conversation_id === conversationId && record.value?.content === "T03 exact 768 retained message"), "retained history contains the live message")
              console.log(`T03_768_${TARGET}_RETAINED_CONVERSATION_ID=${conversationId}`)
              await a.page.screenshot({path: path.join(ARTIFACTS, "06-retention-entry-768x1024.png"), fullPage: true})
              await probeViewport(a.page, "Retention entry", uxFailures)
              await probeControl(a.page, 'button:has-text("Open local copy")', "Open retained history", uxFailures)
              stage("RETENTION_HISTORY_ENTRY")

              await a.page.getByRole("button", {name: /Open local copy/}).click()
              await a.page.locator('section[data-screen="history"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, `/chats/${conversationId}`, "historical return uses canonical retained route")
              assert.match(await a.page.locator(".local-copy-banner").innerText(), /not an active Conversation/i, "historical copy is clearly non-live")
              assert.equal(await a.page.locator('section[data-screen="history"] #message-form').count(), 0, "historical copy exposes no live composer")
              await a.page.screenshot({path: path.join(ARTIFACTS, "07-historical-return-768x1024.png"), fullPage: true})
              await probeViewport(a.page, "Historical return", uxFailures)
              await probeControl(a.page, "#history-delete", "Historical Delete", uxFailures)
              stage("HISTORICAL_RETURN")

              a.page.once("dialog", dialog => dialog.accept())
              await a.page.locator("#history-delete").click()
              await a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "delete replaces invalidated /chats/:id route with /chats")
              assert.equal(await a.page.locator('section[data-screen="history"].active').count(), 0, "deleted historical screen is no longer active")
              await a.page.screenshot({path: path.join(ARTIFACTS, "08-delete-route-768x1024.png"), fullPage: true})
              await probeViewport(a.page, "Post-delete Chats", uxFailures)
              stage("DELETE_ROUTE")

              assert.deepEqual(a.errors, [], "participant A has no browser/console errors")
              assert.deepEqual(a.failedRequests, [], "participant A has no failed requests")
              assert.deepEqual(b.errors, [], "participant B has no browser/console errors")
              assert.deepEqual(b.failedRequests, [], "participant B has no failed requests")
              console.log(`T03_768_${TARGET}_UX_FAILURES=${JSON.stringify(uxFailures)}`)
              assert.deepEqual(uxFailures, [], `${TARGET}: exact 768 UX failures`)
              stage("FULL_PATH")
            } finally {
              await a?.context.close().catch(() => {})
              await b?.context.close().catch(() => {})
              await browser.close().catch(() => {})
            }
          })
          EOF
          test "$(git rev-parse HEAD)" = "$T03_TEST_SHA"
          test -z "$(git status --porcelain)"

      - name: Run exact 768x1024 real Chromium probe
        id: probe
        continue-on-error: true
        run: node --test --test-concurrency=1 tmp/t03_768_probe.mjs

      - name: Re-run accepted historical-delete regression at exact 768x1024
        id: history
        if: matrix.mode == 'full'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("test/js/t03_history_route_browser_test.mjs").read_text()
          old = "{width: 390, height: 844}"
          new = "{width: 768, height: 1024}"
          if old not in source:
              raise SystemExit("expected historical-route viewport anchor not found")
          Path("tmp/t03_768_history_route.mjs").write_text(source.replace(old, new, 1))
          PY
          node --test --test-concurrency=1 tmp/t03_768_history_route.mjs

      - name: Prove tested SHA again and clean exit tree
        if: always()
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T03_768_FINAL_TARGET=$T03_TEST_NAME"
          echo "T03_768_FINAL_SHA=$actual"
          echo "T03_768_FINAL_VIEWPORT=768x1024"
          test "$actual" = "$T03_TEST_SHA"
          test -z "$(git status --porcelain)"

      - name: Upload exact-768 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-ux-001-exact-768-${{ matrix.name }}-${{ github.run_id }}
          path: tmp/t03-768-${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop browser server
        if: always()
        run: |
          if [ -f "/tmp/t03-768-${T03_TEST_NAME}.pid" ]; then
            pid="$(cat /tmp/t03-768-${T03_TEST_NAME}.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
          fi

      - name: Browser server log on failure
        if: always()
        run: |
          if [ "${{ steps.probe.outcome }}" != "success" ] || { [ "$T03_TEST_MODE" = "full" ] && [ "${{ steps.history.outcome }}" != "success" ]; }; then
            cat "/tmp/t03-768-${T03_TEST_NAME}.log" || true
          fi

      - name: Enforce exact-768 verdict
        if: always()
        run: |
          set -euo pipefail
          echo "T03_768_PROBE_OUTCOME=${{ steps.probe.outcome }}"
          echo "T03_768_HISTORY_OUTCOME=${{ steps.history.outcome }}"
          test "${{ steps.probe.outcome }}" = "success"
          if [ "$T03_TEST_MODE" = "full" ]; then
            test "${{ steps.history.outcome }}" = "success"
          fi
          echo "T03_768_RESULT=PASS"
