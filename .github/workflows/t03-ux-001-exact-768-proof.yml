name: T03 UX-001 Exact 768 Browser Proof

on:
  push:
    branches:
      - validation/t03-ux-001-768-cff1d080

concurrency:
  group: t03-ux-001-exact-768-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-768:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PORT: "4000"
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test
      STRANGERTALKS_BROWSER_BASE_URL: http://localhost:4000
      T03_EXACT_SHA: cff1d080cfbe050164eaea96bfe7de33641a2fa1

    steps:
      - name: Checkout exact frozen T03 candidate
        uses: actions/checkout@v4
        with:
          ref: cff1d080cfbe050164eaea96bfe7de33641a2fa1
          fetch-depth: 0

      - name: Prove exact candidate identity and clean entry tree
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "T03_EXACT_SHA=$T03_EXACT_SHA"
          echo "T03_CHECKED_OUT_SHA=$actual"
          test "$actual" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          npm ci
          npx playwright install --with-deps chromium

      - name: Prepare browser database
        run: |
          set -euo pipefail
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Start exact-SHA Phoenix browser server
        run: |
          set -euo pipefail
          mix run --no-start -e '
            repo = Application.fetch_env!(:strangertalks_new, StrangertalksNew.Repo)
            repo = repo |> Keyword.put(:pool, DBConnection.ConnectionPool) |> Keyword.put(:pool_size, 20)
            Application.put_env(:strangertalks_new, StrangertalksNew.Repo, repo)
            endpoint = Application.fetch_env!(:strangertalks_new, StrangertalksNewWeb.Endpoint)
            Application.put_env(:strangertalks_new, StrangertalksNewWeb.Endpoint, Keyword.put(endpoint, :server, true))
            {:ok, _} = Application.ensure_all_started(:strangertalks_new)
            Process.sleep(:infinity)
          ' > /tmp/t03-768-browser.log 2>&1 &
          echo $! > /tmp/t03-768-browser.pid
          for attempt in $(seq 1 45); do
            pid="$(cat /tmp/t03-768-browser.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/t03-768-browser.log
              exit 1
            fi
            if curl -fsS "$STRANGERTALKS_BROWSER_BASE_URL/" >/dev/null; then
              echo "T03_768_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/t03-768-browser.log
          exit 1

      - name: Build validation-only exact-768 browser proof
        run: |
          set -euo pipefail
          mkdir -p tmp/t03-768-artifacts
          cat > tmp/t03_768_full_path.mjs <<'EOF'
          import assert from "node:assert/strict"
          import fs from "node:fs"
          import path from "node:path"
          import test from "node:test"
          import {chromium} from "playwright"

          const BASE_URL = process.env.STRANGERTALKS_BROWSER_BASE_URL || "http://localhost:4000"
          const WAIT = 15_000
          const ARTIFACTS = path.resolve("tmp/t03-768-artifacts")
          fs.mkdirSync(ARTIFACTS, {recursive: true})

          async function assertViewport(page, label) {
            const geometry = await page.evaluate(() => ({
              width: innerWidth,
              height: innerHeight,
              htmlWidth: document.documentElement.scrollWidth,
              bodyWidth: document.body.scrollWidth
            }))
            assert.deepEqual([geometry.width, geometry.height], [768, 1024], `${label}: exact viewport`)
            assert.ok(geometry.htmlWidth <= 769, `${label}: document has no horizontal overflow`)
            assert.ok(geometry.bodyWidth <= 769, `${label}: body has no horizontal overflow`)
          }

          async function assertUsable(page, selector, label) {
            const control = page.locator(selector).first()
            assert.equal(await control.isVisible(), true, `${label}: visible`)
            assert.equal(await control.isEnabled(), true, `${label}: enabled`)
            const box = await control.boundingBox()
            assert.ok(box, `${label}: rendered`)
            assert.ok(box.x >= -1 && box.x + box.width <= 769, `${label}: inside 768px width`)
            assert.ok(box.y >= -1 && box.y < 1024, `${label}: begins inside viewport`)
          }

          async function boot(browser, label) {
            const context = await browser.newContext({viewport: {width: 768, height: 1024}, acceptDownloads: true})
            const page = await context.newPage()
            const errors = []
            page.on("pageerror", error => errors.push(error.message))
            page.on("console", message => { if (message.type() === "error") errors.push(message.text()) })

            const participantResponse = page.waitForResponse(response => {
              try { return new URL(response.url()).pathname === "/api/participants" } catch (_error) { return false }
            })
            const response = await page.goto(BASE_URL, {waitUntil: "domcontentloaded"})
            assert.ok(response?.ok(), `${label}: root page loads`)
            const issued = await participantResponse
            console.log(`T03_768_${label}_PARTICIPANT_ISSUANCE=${issued.status()}`)
            assert.equal(issued.status(), 201, `${label}: participant issuance succeeds without rate-limit bypass`)

            await page.locator('section[data-screen="doors"].active').waitFor({state: "visible", timeout: WAIT})
            await page.locator("button.door").first().waitFor({state: "visible", timeout: WAIT})
            await assertViewport(page, `${label} Arrival`)
            await assertUsable(page, "#conversation-language", `${label} language control`)
            await assertUsable(page, "button.door", `${label} Door control`)
            return {context, page, errors}
          }

          async function endConversation(page) {
            const actions = page.locator("details.overflow")
            if ((await actions.getAttribute("open")) === null) await actions.locator("summary").click()
            await page.locator("#end-conversation").click()
            await page.locator("#end-confirmation-dialog").waitFor({state: "visible", timeout: WAIT})
            await page.locator("#end-confirm").click()
          }

          async function records(page) {
            return page.evaluate(async () => (await import("/assets/local_data.mjs")).listRecords())
          }

          test("T03 UX-001 exact 768x1024 real browser closure path", {timeout: 120_000}, async () => {
            const browser = await chromium.launch({headless: true})
            let a
            let b
            try {
              a = await boot(browser, "A")
              b = await boot(browser, "B")
              await a.page.screenshot({path: path.join(ARTIFACTS, "01-arrival-768x1024.png"), fullPage: true})

              await a.page.locator("#conversation-language").selectOption("en")
              await b.page.locator("#conversation-language").selectOption("en")

              await a.page.locator('button.door:has-text("Advice")').click()
              await a.page.locator('section[data-screen="queue"].active').waitFor({state: "visible", timeout: WAIT})
              await a.page.getByRole("status").filter({hasText: "Queue status: queued"}).waitFor({state: "visible", timeout: WAIT})
              await assertViewport(a.page, "Queue")
              await assertUsable(a.page, "#leave-queue", "Queue Leave control")
              await a.page.screenshot({path: path.join(ARTIFACTS, "02-queue-768x1024.png"), fullPage: true})

              await b.page.locator('button.door:has-text("Advice")').click()
              await Promise.all([
                a.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="conversation"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              console.log("T03_768_CONVERSATION_REACHED=true")
              await assertViewport(a.page, "Conversation")
              await assertUsable(a.page, "#message-input", "Conversation composer")
              await assertUsable(a.page, '#message-form button[aria-label="Send message"]', "Conversation Send control")

              await a.page.locator("#message-input").fill("T03 exact 768 retained message")
              await a.page.getByRole("button", {name: "Send message", exact: true}).click()
              await b.page.locator("#messages li", {hasText: "T03 exact 768 retained message"}).waitFor({state: "visible", timeout: WAIT})
              await a.page.screenshot({path: path.join(ARTIFACTS, "03-conversation-768x1024.png"), fullPage: false})

              await endConversation(a.page)
              await Promise.all([
                a.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="ended"].active').waitFor({state: "visible", timeout: WAIT})
              ])
              assert.equal(new URL(a.page.url()).pathname, "/conversation/ended", "terminal route is canonical")
              await assertViewport(a.page, "Terminal")
              await assertUsable(a.page, "#keep-conversation", "Terminal Keep control")
              await assertUsable(a.page, "#fade-conversation", "Terminal Fade control")
              await a.page.screenshot({path: path.join(ARTIFACTS, "04-terminal-768x1024.png"), fullPage: true})

              await Promise.all([
                a.page.locator("#keep-conversation").click(),
                b.page.locator("#keep-conversation").click()
              ])
              await Promise.all([
                a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT}),
                b.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              ])

              const kept = await records(a.page)
              const keptConversation = kept.find(record => record.type === "local_conversation" && record.value?.status === "kept")
              assert.ok(keptConversation, "Keep creates retained history entry in participant-owned IndexedDB")
              const conversationId = keptConversation.value.conversation_id
              assert.ok(kept.some(record => record.type === "local_message" && record.value?.conversation_id === conversationId && record.value?.content === "T03 exact 768 retained message"), "retained history contains the live message")
              console.log(`T03_768_RETAINED_CONVERSATION_ID=${conversationId}`)
              await assertViewport(a.page, "Chats retention entry")
              await assertUsable(a.page, 'button:has-text("Open local copy")', "Open retained history control")
              await a.page.screenshot({path: path.join(ARTIFACTS, "05-retention-entry-768x1024.png"), fullPage: true})

              await a.page.getByRole("button", {name: /Open local copy/}).click()
              await a.page.locator('section[data-screen="history"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, `/chats/${conversationId}`, "historical return uses canonical retained route")
              assert.match(await a.page.locator(".local-copy-banner").innerText(), /not an active Conversation/i, "historical copy is clearly non-live")
              assert.equal(await a.page.locator('section[data-screen="history"] #message-form').count(), 0, "historical copy exposes no live composer")
              await assertViewport(a.page, "Historical return")
              await assertUsable(a.page, "#history-delete", "Historical Delete control")
              await a.page.screenshot({path: path.join(ARTIFACTS, "06-historical-return-768x1024.png"), fullPage: true})

              a.page.once("dialog", dialog => dialog.accept())
              await a.page.locator("#history-delete").click()
              await a.page.locator('section[data-screen="chats"].active').waitFor({state: "visible", timeout: WAIT})
              assert.equal(new URL(a.page.url()).pathname, "/chats", "delete replaces invalidated /chats/:id route with /chats")
              assert.equal(await a.page.locator('section[data-screen="history"].active').count(), 0, "deleted historical screen is no longer active")
              await assertViewport(a.page, "Post-delete Chats")
              await a.page.screenshot({path: path.join(ARTIFACTS, "07-delete-route-768x1024.png"), fullPage: true})

              assert.deepEqual(a.errors, [], "participant A has no browser/console errors")
              assert.deepEqual(b.errors, [], "participant B has no browser/console errors")
              console.log("T03_768_ASSERTIONS=PASS")
            } finally {
              await a?.context.close().catch(() => {})
              await b?.context.close().catch(() => {})
              await browser.close().catch(() => {})
            }
          })
          EOF
          test "$(git rev-parse HEAD)" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - name: Run exact 768x1024 real Chromium proof
        run: node --test --test-concurrency=1 tmp/t03_768_full_path.mjs

      - name: Re-run accepted historical-delete regression at exact 768x1024
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("test/js/t03_history_route_browser_test.mjs").read_text()
          old = "{width: 390, height: 844}"
          new = "{width: 768, height: 1024}"
          if old not in source:
              raise SystemExit("expected historical-route viewport anchor not found")
          Path("tmp/t03_768_history_route.mjs").write_text(source.replace(old, new, 1))
          PY
          node --test --test-concurrency=1 tmp/t03_768_history_route.mjs

      - name: Prove exact candidate identity and clean exit tree
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "VIEWPORT=768x1024"
          echo "EXACT_SHA=$actual"
          test "$actual" = "$T03_EXACT_SHA"
          test -z "$(git status --porcelain)"
          echo "RESULT=PASS"

      - name: Upload exact-768 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t03-ux-001-exact-768-${{ github.run_id }}
          path: tmp/t03-768-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop browser server
        if: always()
        run: |
          if [ -f /tmp/t03-768-browser.pid ]; then
            pid="$(cat /tmp/t03-768-browser.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.25
            done
            if kill -0 "$pid" 2>/dev/null; then kill -9 "$pid" 2>/dev/null || true; fi
          fi

      - name: Browser server log on failure
        if: failure()
        run: cat /tmp/t03-768-browser.log || true
