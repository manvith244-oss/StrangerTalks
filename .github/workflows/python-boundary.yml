name: Python Boundary Foundation

on:
  push:
    branches:
      - feature/first-safe-python-packet-2026-08-30
  pull_request:
    branches:
      - release/integration-2026-08-28
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checkout identity
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED_PYTHON_BOUNDARY_SHA=$expected"
          echo "ACTUAL_PYTHON_BOUNDARY_SHA=$actual"
          test "$actual" = "$expected"

      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install pinned test dependencies for RED contract proof
        run: python -m pip install pydantic==2.13.5 pytest==9.1.1

      - name: RED — production boundary does not exist yet
        env:
          PYTHONPATH: services/ai/src
        run: python -m pytest services/ai/tests/test_foundation.py -q
