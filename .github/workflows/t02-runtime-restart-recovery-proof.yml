name: T02 Runtime Restart Recovery Proof

on:
  push:
    branches:
      - team2/runtime-restart-recovery-proof
  workflow_dispatch:

concurrency:
  group: t02-runtime-restart-recovery-proof-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery-convergence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strangertalks_local
          POSTGRES_PASSWORD: strangertalks_test
          POSTGRES_DB: strangertalks_new_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strangertalks_local -d strangertalks_new_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      STRANGERTALKS_LOCAL_DB_USER: strangertalks_local
      STRANGERTALKS_LOCAL_DB_PASSWORD: strangertalks_test

    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Prove proof branch leaves candidate production code untouched
        shell: bash
        run: |
          set -euo pipefail
          echo "PROOF_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_CANDIDATE=e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          test "$(git rev-parse HEAD^^)" = "e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          git diff --exit-code e3e86c736ca6ef911bd0023c4877ac68642a48b9..HEAD -- lib/
          changed="$(git diff --name-only e3e86c736ca6ef911bd0023c4877ac68642a48b9..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/t02-runtime-restart-recovery-proof.yml' \
            'test/strangertalks_new/t02_recovery_convergence_hostile_test.exs' | sort)"
          printf 'CHANGED_FILES:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Format proof-only test
        shell: bash
        run: |
          set -euo pipefail
          mix format --check-formatted test/strangertalks_new/t02_recovery_convergence_hostile_test.exs
          git diff --check

      - name: Hostile concurrent recovery proof
        shell: bash
        run: |
          set -euo pipefail
          mix test test/strangertalks_new/t02_recovery_convergence_hostile_test.exs --seed 0 --trace

      - name: Existing RecoveryRestart regression stress
        shell: bash
        run: |
          set -euo pipefail
          for seed in $(seq 1 20); do
            echo "RECOVERY_RESTART_SEED=$seed"
            mix test test/strangertalks_new/recovery_restart_test.exs --seed "$seed"
          done

      - name: Exact source candidate record
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_T02_RESTART_CANDIDATE=e3e86c736ca6ef911bd0023c4877ac68642a48b9"
          echo "PROOF_COMMIT=$(git rev-parse HEAD)"
