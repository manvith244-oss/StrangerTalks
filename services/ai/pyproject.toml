[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "strangertalks-ai"
version = "0.1.0"
description = "StrangerTalks internal AI service boundary foundation"
requires-python = "==3.13.15"
dependencies = [
  "anyio==4.14.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "openai==3.6.0",
  "opentelemetry-sdk==1.44.0",
  "pydantic==2.13.5",
  "structlog==26.1.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "hypothesis==6.165.10",
  "pytest==9.1.1",
  "respx==0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strangertalks_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "anyio: run the test through AnyIO",
]
