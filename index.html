<!DOCTYPE html>
<html>
<head>
<title>StrangerTalks</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* HEADER */
.header {
    padding: 15px;
    text-align: center;
    font-weight: 500;
    background: white;
    border-bottom: 1px solid #eee;
}

/* MAIN CONTENT */
.content {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

/* CHAT MESSAGES */
.msg {
    margin: 8px 0;
    display: flex;
}

.msg.you {
    justify-content: flex-end;
}

.bubble {
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 70%;
}

.you .bubble {
    background: #007aff;
    color: white;
}

.stranger .bubble {
    background: #e5e5ea;
}

/* INPUT BAR */
.inputBar {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #eee;
}

.inputBar input {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    background: #f1f1f1;
    outline: none;
}

.inputBar button {
    margin-left: 10px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    background: #007aff;
    color: white;
}

/* HOME OPTIONS */
.options {
    text-align: center;
    margin-top: 50px;
}

.options button {
    display: block;
    margin: 10px auto;
    padding: 12px 20px;
    border-radius: 20px;
    border: none;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<div class="header">StrangerTalks</div>

<div id="homeScreen" class="content">
    <div class="options">
        <p id="selectedText">Choose your vibe</p>

        <button onclick="selectIntent('Casual')">Casual</button>
        <button onclick="selectIntent('Exploring')">Exploring</button>
        <button onclick="selectIntent('Flirty')">Flirty</button>
        <button onclick="selectIntent('Deep')">Deep</button>

        <button onclick="startChat()" style="background:#007aff; color:white;">Start</button>
    </div>
</div>

<div id="matchingScreen" class="content" style="display:none;">
    <p style="text-align:center; margin-top:50px;">Finding someone like you…</p>
</div>

<div id="chatScreen" class="content" style="display:none;">
    <div id="chatBox"></div>
</div>

<div id="inputArea" class="inputBar" style="display:none;">
    <input id="messageInput" placeholder="Type message..." onkeydown="handleEnter(event)">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
let selected = "";

function selectIntent(value){
    selected = value;
    selectedText.innerText = "Selected: " + value;
}

function startChat(){
    if(!selected) return alert("Select something");

    homeScreen.style.display = "none";
    matchingScreen.style.display = "block";

    setTimeout(()=>{
        matchingScreen.style.display = "none";
        chatScreen.style.display = "block";
        inputArea.style.display = "flex";

        addStranger("Hey 👋");
    },1500);
}

function handleEnter(e){
    if(e.key === "Enter") sendMessage();
}

function sendMessage(){
    let msg = messageInput.value.trim();
    if(!msg) return;

    addMessage(msg, "you");
    messageInput.value = "";

    let typingId = "t" + Date.now();
    addTyping(typingId);

    setTimeout(()=>{
        removeTyping(typingId);
        let replies = ["Tell me more", "Interesting", "I get that", "Go on"];
        let r = replies[Math.floor(Math.random()*replies.length)];
        addStranger(r);
    },1000);
}

function addMessage(text, type){
    chatBox.innerHTML += `
        <div class="msg ${type}">
            <div class="bubble">${text}</div>
        </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addStranger(text){
    addMessage(text, "stranger");
}

function addTyping(id){
    chatBox.innerHTML += `
        <div id="${id}" class="msg stranger">
            <div class="bubble">typing…</div>
        </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping(id){
    let el = document.getElementById(id);
    if(el) el.remove();
}
</script>

</body>
</html>
