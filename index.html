<!DOCTYPE html>
<html>
<head>
    <title>StrangerTalks</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI";
            background: linear-gradient(180deg, #f8fbff, #eef4ff);
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
        }

        .brand {
            text-align: center;
            font-size: 13px;
            color: #7a8ca3;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .title {
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            color: #1c1c1e;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .option {
            background: white;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            cursor: pointer;
        }

        .option.selected {
            background: #e6f0ff;
        }

        .optionTitle {
            font-size: 15px;
            color: #111;
        }

        .optionDesc {
            font-size: 13px;
            color: #6b7280;
        }

        .continue {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            border-radius: 20px;
            border: none;
            background: #007aff;
            color: white;
            font-size: 15px;
            display: none;
        }

        .centerScreen {
            text-align: center;
            margin-top: 120px;
        }

        .dots span {
            animation: blink 1.4s infinite;
            font-size: 22px;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        #chatBox {
            height: 300px;
            overflow-y: auto;
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
        }

        .msg {
            margin: 8px 0;
        }

        .you {
            text-align: right;
        }

        .inputArea {
            display: flex;
            margin-top: 15px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        button.send {
            padding: 12px 16px;
            border-radius: 20px;
            border: none;
            background: #007aff;
            color: white;
        }
    </style>
</head>

<body>

<div class="container" id="app">

    <!-- HOME -->
    <div id="homeScreen">

        <div class="brand">StrangerTalks</div>

        <div class="title">
            Take a moment.<br>
            What kind of conversation do you need?
        </div>

        <div class="option" onclick="selectOption(this,'Casual')">
            <div class="optionTitle">Just want to talk</div>
            <div class="optionDesc">No pressure. Just words.</div>
        </div>

        <div class="option" onclick="selectOption(this,'Exploring')">
            <div class="optionTitle">Not sure, just exploring</div>
            <div class="optionDesc">You don’t need to know yet.</div>
        </div>

        <div class="option" onclick="selectOption(this,'Flirty')">
            <div class="optionTitle">Something light</div>
            <div class="optionDesc">Keep it easy. No depth needed.</div>
        </div>

        <div class="option" onclick="selectOption(this,'Deep')">
            <div class="optionTitle">Real conversation</div>
            <div class="optionDesc">Talk about what actually matters.</div>
        </div>

        <button id="continueBtn" class="continue" onclick="startChat()">Continue</button>

    </div>

</div>

<script>
let selected = "";

function selectOption(el, value) {
    selected = value;

    document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
    el.classList.add("selected");

    document.getElementById("continueBtn").style.display = "block";
}

function startChat() {
    document.getElementById("app").innerHTML = `
        <div class="centerScreen">
            <h2>Finding someone like you</h2>
            <div class="dots">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    `;

    setTimeout(loadChat, 2000);
}

function loadChat() {
    document.getElementById("app").innerHTML = `
        <div class="brand">StrangerTalks</div>

        <div id="chatBox">
            <div class="msg"><b>Stranger:</b> Hey 👋</div>
        </div>

        <div class="inputArea">
            <input id="msgInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    `;
}

function handleEnter(e) {
    if (e.key === "Enter") sendMessage();
}

function sendMessage() {
    let input = document.getElementById("msgInput");
    let msg = input.value;

    if (!msg) return;

    let chatBox = document.getElementById("chatBox");

    chatBox.innerHTML += `<div class="msg you"><b>You:</b> ${msg}</div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
        let replies = [
            "Hmm interesting...",
            "Tell me more",
            "I get that",
            "Why do you think so?",
            "That’s nice",
            "I feel you"
        ];

        let r = replies[Math.floor(Math.random() * replies.length)];
        chatBox.innerHTML += `<div class="msg"><b>Stranger:</b> ${r}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 1000);
}
</script>

</body>
</html>
